<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Correlated Failure Example</title><desc id="desc">Show multiple replicas failing together due to a shared bad deployment, shared network, or common configuration dependency.</desc><defs><marker id="arrow-2F6FED" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FED"/></marker><marker id="arrow-18845B" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#18845B"/></marker><marker id="arrow-B7791F" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="arrow-C2413B" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#C2413B"/></marker><marker id="arrow-64748B" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="arrow-7656B5" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#7656B5"/></marker><marker id="arrow-0F8190" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0F8190"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172B4D" flood-opacity="0.08"/></filter></defs><rect x="0" y="0" width="1440" height="900" rx="18" fill="#F5F8FC" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1440" height="12" rx="0" fill="#2F6FED" stroke="none" stroke-width="1"/><text x="64" y="66" font-family="Inter,Segoe UI,Arial,sans-serif" fon