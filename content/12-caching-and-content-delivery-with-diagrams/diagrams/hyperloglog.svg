<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc"><title id="title">HyperLogLog cardinality estimation</title><desc id="desc">Show a hashed stream selecting registers, leading-zero observations updating register maxima, and register aggregation producing an approximate cardinality.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11Z" fill="#64748B"/></marker><style><![CDATA[.h{font:700 32px Inter,Arial,sans-serif;fill:#0F172A}.t{font:600 18px Inter,Arial,sans-serif;fill:#0F172A}.s{font:500 15px Inter,Arial,sans-serif;fill:#475569}.n{font:700 15px Inter,Arial,sans-serif;fill:#334155}]]></style></defs><rect width="1440" height="860" rx="24" fill="#F8FAFC"/><rect width="1440" height="12" fill="#0F766E"/><text x="72" y="62" class="h">HyperLogLog cardinality estimation</text><text x="72" y="105" class="s">Show a hashed stream selecting registers, leading-zero observations updating register maxima, and register aggregation producing an approximate cardinality.</text><text x="720" y="185" text-anchor="middle" class="t">Register maxima after hashed observations</text><rect x="230" y="494" width="58" height="156" rx="7" fill="#DDF7EF" stroke="#0F8B8D" stroke-width="2"/><text x="259" y="678" text-anchor="middle" class="s">R0</text><text x="259" y="482" text-anchor="middle" class="t">3</text><rect x="313" y="598" width="58" height="52" rx="7" fill="#DDF7EF" stroke="#0F8B8D" stroke-width="2"/><text x="342" y="678" text-anchor="middle" class="s">R1</text><text x="342" y="586" text-anchor="middle" class="t">1</text><rect x="396" y="390" width="58" height="260" rx="7" fill="#DDF7EF" stroke="#0F8B8D" stroke-width="2"/><text x="425" y="678" text-anchor="middle" class="s">R2</text><text x="425" y="378" text-anchor="middle" class="t">5</text><rect x="479" y="546" width="58" height="104" rx="7" fill="#DDF7EF" stroke="#0F8B8D" stroke-width