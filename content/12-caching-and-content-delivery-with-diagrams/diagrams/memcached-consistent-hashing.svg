<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc"><title id="title">Memcached client-side consistent hashing</title><desc id="desc">Show a hash ring with application keys and Memcached nodes; illustrate that adding one node remaps only a subset of keys.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11Z" fill="#64748B"/></marker><style><![CDATA[.h{font:700 32px Inter,Arial,sans-serif;fill:#0F172A}.t{font:600 18px Inter,Arial,sans-serif;fill:#0F172A}.s{font:500 15px Inter,Arial,sans-serif;fill:#475569}.n{font:700 15px Inter,Arial,sans-serif;fill:#334155}]]></style></defs><rect width="1440" height="860" rx="24" fill="#F8FAFC"/><rect width="1440" height="12" fill="#0F766E"/><text x="72" y="62" class="h">Memcached client-side consistent hashing</text><text x="72" y="105" class="s">Show a hash ring with application keys and Memcached nodes; illustrate that adding one node remaps only a subset of keys.</text><circle cx="720" cy="390" r="190" fill="none" stroke="#CBD5E1" stroke-width="18"/><circle cx="555.5" cy="295.0" r="45" fill="#FFFFFF" stroke="#2563EB" stroke-width="5"/><text x="555.5" y="301.0" text-anchor="middle" class="t">Node A</text><circle cx="884.5" cy="295.0" r="45" fill="#FFFFFF" stroke="#0F8B8D" stroke-width="5"/><text x="884.5" y="301.0" text-anchor="middle" class="t">Node B</text><circle cx="720.0" cy="580.0" r="45" fill="#FFFFFF" stroke="#7C3AED" stroke-width="5"/><text x="720.0" y="586.0" text-anchor="middle" class="t">Node C</text><circle cx="903.5" cy="439.2" r="45" fill="#FFFFFF" stroke="#16A34A" stroke-width="5"/><text x="903.5" y="445.2" text-anchor="middle" class="t">Node D added</text><path d="M590,255 Q720,145 855,255" fill="none" stroke="#EA580C" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arr)"/><text x="720" y="170" text-anchor="middle" class="s">Key hashes walk clockwise to the next virtual node</text><rect x="330" y="675" width="780" height="44" rx="12" fill="#EAF8EF" stroke="#16A34A"/><text x="720" y="703" text-anchor="middle" class="t">Adding a node remaps only its neighboring hash-ring range</text><rect x="64" y="770" width="1312" height="60" rx="14" fill="#F1F5F9" stroke="#CBD5E1"/><text x="88" y="806" class="n">Client libraries map keys to a hash ring; adding a node moves a subset of keys rather than remapping everything.</text></svg>