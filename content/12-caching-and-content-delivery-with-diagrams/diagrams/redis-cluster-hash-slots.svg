<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc"><title id="title">Redis Cluster: 16,384 hash slots</title><desc id="desc">Show the 16,384 logical hash slots divided among three primary nodes, each with a replica; annotate key hashing and slot ownership.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11Z" fill="#64748B"/></marker><style><![CDATA[.h{font:700 32px Inter,Arial,sans-serif;fill:#0F172A}.t{font:600 18px Inter,Arial,sans-serif;fill:#0F172A}.s{font:500 15px Inter,Arial,sans-serif;fill:#475569}.n{font:700 15px Inter,Arial,sans-serif;fill:#334155}]]></style></defs><rect width="1440" height="860" rx="24" fill="#F8FAFC"/><rect width="1440" height="12" fill="#0F766E"/><text x="72" y="62" class="h">Redis Cluster: 16,384 hash slots</text><text x="72" y="105" class="s">Show the 16,384 logical hash slots divided among three primary nodes, each with a replica; annotate key hashing and slot ownership.</text><rect x="190" y="290" width="350" height="120" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="365.0" y="338" text-anchor="middle" class="t">Primary A</text><text x="365.0" y="370" text-anchor="middle" class="s">slots 0–5,460</text><path d="M365.0,410 V500" stroke="#2563EB" stroke-width="3" marker-end="url(#arr)"/><rect x="275.0" y="520" width="180" height="65" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="365.0" y="560" text-anchor="middle" class="t">Replica</text><rect x="552" y="290" width="410" height="120" rx="14" fill="#CCFBF1" stroke="#0F8B8D" stroke-width="3"/><text x="757.0" y="338" text-anchor="middle" class="t">Primary B</text><text x="757.0" y="370" text-anchor="middle" class="s">slots 5,461–10,921</text><path d="M757.0,410 V500" stroke="#0F8B8D" stroke-width="3" marker-end="url(#arr)"/><rect x="667.0" y="520" width="180" height="65" rx="12" fill="#FFFFFF" stroke="#0F8B8D" stroke-width="2"/><text x="757.0" y="560" text-anchor="middle" class="t">Replica</text><rect x="974" y="290" width="300" height="120" rx="14" fill="#F3E8FF" stroke="#7C3AED" stroke-width="3"/><text x="1124.0" y="338" text-anchor="middle" class="t">Primary C</text><text x="1124.0" y="370" text-anchor="middle" class="s">slots 10,922–16,383</text><path d="M1124.0,410 V500" stroke="#7C3AED" stroke-width="3" marker-end="url(#arr)"/><rect x="1034.0" y="520" width="180" height="65" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><text x="1124.0" y="560" text-anchor="middle" class="t">Replica</text><text x="720" y="230" text-anchor="middle" class="t">16,384 logical hash slots are assigned to primary owners</text><rect x="64" y="770" width="1312" height="60" rx="14" fill="#F1F5F9" stroke="#CBD5E1"/><text x="88" y="806" class="n">The 16,384 logical slots are divided among primary nodes; each primary can have replica(s) for failover.</text></svg>