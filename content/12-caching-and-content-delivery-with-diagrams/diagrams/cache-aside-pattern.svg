<path d="M273.0,456.0 C304.4,456.0 311.4,456.0 342.8,456.0" class="edge" marker-end="url(#arrow)"/><path d="M547.8,456.0 C579.1,456.0 586.1,366.0 617.5,366.0" class="edge" marker-end="url(#arrow)"/><path d="M547.8,456.0 C579.1,456.0 586.1,556.0 617.5,556.0" class="edge" marker-end="url(#arrow)"/><path d="M822.5,366.0 C853.9,366.0 860.9,366.0 892.2,366.0" class="edge" marker-end="url(#arrow)"/><path d="M822.5,556.0 C853.9,556.0 860.9,556.0 892.2,556.0" class="edge" marker-end="url(#arrow)"/><path d="M1097.2,366.0 C1128.6,366.0 1135.6,456.0 1167.0,456.0" class="edge" marker-end="url(#arrow)"/><path d="M1097.2,556.0 C1128.6,556.0 1135.6,456.0 1167.0,456.0" class="edge" marker-end="url(#arrow)"/>
