<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">Cache hierarchy and locality</title><desc id="desc">Show a layered hierarchy from CPU cache and OS page cache through database buffer pool, application L1, distributed cache, regional cache, and CDN edge. Use arrows to indicate progressively higher latency and larger sharing scope.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11 Z" fill="#64748B"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity=".10"/></filter>
 <style><![CDATA[
  .bg{fill:#F8FAFC} .title{font:700 32px Inter,Arial,sans-serif;fill:#0F172A}
  .subtitle{font:400 17px Inter,Arial,sans-serif;fill:#475569}
  .node-label{font:600 17px Inter,Arial,sans-serif;fill:#0F172A;text-anchor:middle}
  .number{font:700 11px Inter,Arial,sans-serif}
  .edge{fill:none;stroke:#64748B;stroke-width:3;opacity:.85}
  .legend{font:500 13px Inter,Arial,sans-serif;fill:#475569}
  .note{font:600 15px Inter,Arial,sans-serif;fill:#334155}
 ]]></style>
</defs>
<rect class="bg" width="1440" height="860" rx="24"/>
<rect x="0" y="0" width="1440" height="12" fill="#0F766E"/>
<text x="72" y="62" class="title">Cache hierarchy and locality</text>
<text class="subtitle"><tspan x="72" y="105">Show a layered hierarchy from CPU cache and OS page cache through database buffer pool, application L1, distributed</tspan><tspan x="72" y="129">cache, regional cache, and CDN edge. Use arrows to indicate progressively higher latency and larger sharing scope.</tspan></text>
<line x1="72" y1="150" x2="1368" y2="150" stroke="#E2E8F0" stroke-width="2"/>
<path d="M230.0,456.0 C260.0,456.0 228.3,456.0 258.3,456.0" class="edge" marker-end="url(#arrow)"/><path d="M420.3,456.0 C450.3,456.0 418.7,456.0 448.7,456.0" class="edge" marker-end="url(#arrow)"/><path d="M610.7,456.0 C640.7,456.0 609.0,456.0 639.0,456.0" class="edge" marker-end="url(#arrow)"/><path d="M801.0,456.0 C831.0,456.0 799.3,456.0 829.3,456.0" class="edge" marker-end="url(#arrow)"/><path d="M991.3,456.0 C1021.3,456.0 989.7,456.0 1019.7,456.0" class="edge" marker-end="url(#arrow)"/><path d="M1181.7,456.0 C1211.7,456.0 1180.0,456.0 1210.0,456.0" class="edge" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
      <rect x="68.0" y="400" width="162" height="112" rx="18" fill="#E6F8F7" stroke="#0F8B8D" stroke-width="2.2"/>
      <rect x="68.0" y="400" width="8" height="112" rx="4" fill="#0F8B8D"/>
      <circle cx="95.0" cy="425" r="13" fill="#0F8B8D" opacity=".14"/>
      <text x="95.0" y="430" text-anchor="middle" class="number" fill="#0F8B8D">1</text>
      <text class="node-label"><tspan x="149.0" y="456.0">CPU cache</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="258.33333333333337" y="400" width="162" height="112" rx="18" fill="#E6F8F7" stroke="#0F8B8D" stroke-width="2.2"/>
      <rect x="258.33333333333337" y="400" width="8" height="112" rx="4" fill="#0F8B8D"/>
      <circle cx="285.33333333333337" cy="425" r="13" fill="#0F8B8D" opacity=".14"/>
      <text x="285.33333333333337" y="430" text-anchor="middle" class="number" fill="#0F8B8D">2</text>
      <text class="node-label"><tspan x="339.3" y="456.0">OS page cache</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="448.6666666666667" y="400" width="162" height="112" rx="18" fill="#E6F8F7" stroke="#0F8B8D" stroke-width="2.2"/>
      <rect x="448.6666666666667" y="400" width="8" height="112" rx="4" fill="#0F8B8D"/>
      <circle cx="475.6666666666667" cy="425" r="13" fill="#0F8B8D" opacity=".14"/>
      <text x="475.6666666666667" y="430" text-anchor="middle" class="number" fill="#0F8B8D">3</text>
      <text class="node-label"><tspan x="529.7" y="443.0">Database buffer</tspan><tspan x="529.7" y="469.0">pool</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="639.0" y="400" width="162" height="112" rx="18" fill="#E6F8F7" stroke="#0F8B8D" stroke-width="2.2"/>
      <rect x="639.0" y="400" width="8" height="112" rx="4" fill="#0F8B8D"/>
      <circle cx="666.0" cy="425" r="13" fill="#0F8B8D" opacity=".14"/>
      <text x="666.0" y="430" text-anchor="middle" class="number" fill="#0F8B8D">4</text>
      <text class="node-label"><tspan x="720.0" y="456.0">Application L1</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="829.3333333333334" y="400" width="162" height="112" rx="18" fill="#E6F8F7" stroke="#0F8B8D" stroke-width="2.2"/>
      <rect x="829.3333333333334" y="400" width="8" height="112" rx="4" fill="#0F8B8D"/>
      <circle cx="856.3333333333334" cy="425" r="13" fill="#0F8B8D" opacity=".14"/>
      <text x="856.3333333333334" y="430" text-anchor="middle" class="number" fill="#0F8B8D">5</text>
      <text class="node-label"><tspan x="910.3" y="456.0">Distributed cache</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="1019.6666666666667" y="400" width="162" height="112" rx="18" fill="#E6F8F7" stroke="#0F8B8D" stroke-width="2.2"/>
      <rect x="1019.6666666666667" y="400" width="8" height="112" rx="4" fill="#0F8B8D"/>
      <circle cx="1046.6666666666667" cy="425" r="13" fill="#0F8B8D" opacity=".14"/>
      <text x="1046.6666666666667" y="430" text-anchor="middle" class="number" fill="#0F8B8D">6</text>
      <text class="node-label"><tspan x="1100.7" y="456.0">Regional cache</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="1210.0" y="400" width="162" height="112" rx="18" fill="#E6F8F7" stroke="#0F8B8D" stroke-width="2.2"/>
      <rect x="1210.0" y="400" width="8" height="112" rx="4" fill="#0F8B8D"/>
      <circle cx="1237.0" cy="425" r="13" fill="#0F8B8D" opacity=".14"/>
      <text x="1237.0" y="430" text-anchor="middle" class="number" fill="#0F8B8D">7</text>
      <text class="node-label"><tspan x="1291.0" y="456.0">CDN edge</tspan></text>
    </g>
<line x1="72" y1="716" x2="1368" y2="716" stroke="#E2E8F0" stroke-width="2"/>
<rect x="72" y="738" width="14" height="14" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><text x="93" y="750" class="legend">Client / caller</text><rect x="247" y="738" width="14" height="14" rx="4" fill="#EAF2FF" stroke="#2563EB"/><text x="268" y="750" class="legend">Application / control</text><rect x="452" y="738" width="14" height="14" rx="4" fill="#E6F8F7" stroke="#0F8B8D"/><text x="473" y="750" class="legend">Cache</text><rect x="572" y="738" width="14" height="14" rx="4" fill="#FFF3E5" stroke="#D97706"/><text x="593" y="750" class="legend">Database / origin</text><rect x="757" y="738" width="14" height="14" rx="4" fill="#F3E8FF" stroke="#7C3AED"/><text x="778" y="750" class="legend">Event / broker</text><rect x="917" y="738" width="14" height="14" rx="4" fill="#FEECEC" stroke="#DC2626"/><text x="938" y="750" class="legend">Risk / miss</text>
<rect x="64" y="765" width="1312" height="68" rx="14" fill="#F1F5F9" stroke="#CBD5E1"/>
<text class="note"><tspan x="88" y="790">Moving outward increases sharing scope and usually access latency; each level avoids work at deeper levels.</tspan></text>
</svg>