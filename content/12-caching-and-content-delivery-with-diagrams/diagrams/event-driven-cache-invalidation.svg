      <circle cx="1194.0" cy="600" r="13" fill="#0F8B8D" opacity=".14"/>
      <text x="1194.0" y="605" text-anchor="middle" class="number" fill="#0F8B8D">8</text>
      <text class="node-label"><tspan x="1269.5" y="631.0">Local L1 caches</tspan></text>
    </g>
<line x1="72" y1="716" x2="1368" y2="716" stroke="#E2E8F0" stroke-width="2"/>
<rect x="72" y="738" width="14" height="14" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><text x="93" y="750" class="legend">Client / caller</text><rect x="247" y="738" width="14" height="14" rx="4" fill="#EAF2FF" stroke="#2563EB"/><text x="268" y="750" class="legend">Application / control</text><rect x="452" y="738" width="14" height="14" rx="4" fill="#E6F8F7" stroke="#0F8B8D"/><text x="473" y="750" class="legend">Cache</text><rect x="572" y="738" width="14" height="14" rx="4" fill="#FFF3E5" stroke="#D97706"/><text x="593" y="750" class="legend">Database / origin</text><rect x="757" y="738" width="14" height="14" rx="4" fill="#F3E8FF" stroke="#7C3AED"/><text x="778" y="750" class="legend">Event / broker</text><rect x="917" y="738" width="14" height="14" rx="4" fill="#FEECEC" stroke="#DC2626"/><text x="938" y="750" class="legend">Risk / miss</text>
<rect x="64" y="765" width="1312" height="68" rx="14" fill="#F1F5F9" stroke="#CBD5E1"/>
<text class="note"><tspan x="88" y="790">Versioned, idempotent events fan out to independent consumers and cache layers.</tspan></text>
