<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">Event-driven cache invalidation fan-out</title><desc id="desc">Show a product service publishing a versioned ProductUpdated event and multiple application/cache consumers applying idempotent invalidation.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11 Z" fill="#64748B"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity=".10"/></filter>
 <style><![CDATA[
  .bg{fill:#F8FAFC} .title{font:700 32px Inter,Arial,sans-serif;fill:#0F172A}
  .subtitle{font:400 17px Inter,Arial,sans-serif;fill:#475569}
  .node-label{font:600 17px Inter,Arial,sans-serif;fill:#0F172A;text-anchor:middle}
  .number{font:700 11px Inter,Arial,sans-serif}
  .edge{fill:none;stroke:#64748B;stroke-width:3;opacity:.85}
  .legend{font:500 13px Inter,Arial,sans-serif;fill:#475569}
  .note{font:600 15px Inter,Arial,sans-serif;fill:#334155}
 ]]></style>
</defs>
<rect class="bg" width="1440" height="860" rx="24"/>
<rect x="0" y="0" width="1440" height="12" fill="#0F766E"/>
<text x="72" y="62" class="title">Event-driven cache invalidation fan-out</text>
<text class="subtitle"><tspan x="72" y="105">Show a product service publishing a versioned ProductUpdated event and multiple application/cache consumers applying</tspan><tspan x="72" y="129">idempotent invalidation.</tspan></text>
<line x1="72" y1="150" x2="1368" y2="150" stroke="#E2E8F0" stroke-width="2"/>
<path d="M273.0,456.0 C345.6,456.0 361.7,456.0 434.3,456.0" class="edge" marker-end="url(#arrow)"/><path d="M639.3,456.0 C711.9,456.0 728.1,291.0 800.7,291.0" class="edge" marker-end="url(#arrow)"/><path d="M639.3,456.0 C711.9,456.0 728.1,461.0 800.7,461.0" class="edge" marker-end="url(#arrow)"/><path d="M639.3,456.0 C711.9,456.0 728.1,631.0 800.7,631.0" class="edge" marker-end="url(#arrow)"/><path d="M1005.7,291.0 C1078.3,291.0 1094.4,291.0 1167.0,291.0" class="edge" marker-end="url(#arrow)"/><path d="M1005.7,461.0 C1078.3,461.0 1094.4,461.0 1167.0,461.0" class="edge" marker-end="url(#arrow)"/><path d="M1005.7,631.0 C1078.3,631.0 1094.4,631.0 1167.0,631.0" class="edge" marker-end="url(#arrow)"/>
