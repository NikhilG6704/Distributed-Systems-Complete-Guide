<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">LFU eviction and frequency aging</title><desc id="desc">Show a cache with per-key frequency counters and an insertion that evicts the least frequently accessed key; annotate why frequency aging is needed.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11 Z" fill="#64748B"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity=".10"/></filter>
 <style><![CDATA[
  .bg{fill:#F8FAFC} .title{font:700 32px Inter,Arial,sans-serif;fill:#0F172A}
  .subtitle{font:400 17px Inter,Arial,sans-serif;fill:#475569}
  .node-label{font:600 17px Inter,Arial,sans-serif;fill:#0F172A;text-anchor:middle}
  .number{font:700 11px Inter,Arial,sans-serif}
  .edge{fill:none;stroke:#64748B;stroke-width:3;opacity:.85}
  .legend{font:500 13px Inter,Arial,sans-serif;fill:#475569}
  .note{font:600 15px Inter,Arial,sans-serif;fill:#334155}
 ]]></style>
</defs>
<rect class="bg" width="1440" height="860" rx="24"/>
<rect x="0" y="0" width="1440" height="12" fill="#0F766E"/>
<text x="72" y="62" class="title">LFU eviction and frequency aging</text>
<text class="subtitle"><tspan x="72" y="105">Show a cache with per-key frequency counters and an insertion that evicts the least frequently accessed key; annotate</tspan><tspan x="72" y="129">why frequency aging is needed.</tspan></text>
<line x1="72" y1="150" x2="1368" y2="150" stroke="#E2E8F0" stroke-width="2"/>
<path d="M273.0,291.0 C304.4,291.0 311.4,456.0 342.8,456.0" class="edge" marker-end="url(#arrow)"/><path d="M273.0,461.0 C304.4,461.0 311.4,456.0 342.8,456.0" class="edge" marker-end="url(#arrow)"/><path d="M273.0,631.0 C304.4,631.0 311.4,456.0 342.8,456.0" class="edge" marker-end="url(#arrow)"/><path d="M547.8,456.0 C579.1,456.0 586.1,456.0 617.5,456.0" class="edge" marker-end="url(#arrow)"/><path d="M822.5,456.0 C853.9,456.0 860.9,456.0 892.2,456.0" class="edge" marker-end="url(#arrow)"/><path d="M1097.2,456.0 C1128.6,456.0 1135.6,456.0 1167.0,456.0" class="edge" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
      <rect x="68.0" y="235" width="205" height="112" rx="18" fill="#E6F8F7" stroke="#0F8B8D" stroke-width="2.2"/>
      <rect x="68.0" y="235" width="8" height="112" rx="4" fill="#0F8B8D"/>
      <circle cx="95.0" cy="260" r="13" fill="#0F8B8D" opacity=".14"/>
      <text x="95.0" y="265" text-anchor="middle" class="number" fill="#0F8B8D">1</text>
      <text class="node-label"><tspan x="170.5" y="291.0">A: 8 hits</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="68.0" y="405" width="205" height="112" rx="18" fill="#E6F8F7" stroke="#0F8B8D" stroke-width="2.2"/>
      <rect x="68.0" y="405" width="8" height="112" rx="4" fill="#0F8B8D"/>
      <circle cx="95.0" cy="430" r="13" fill="#0F8B8D" opacity=".14"/>
      <text x="95.0" y="435" text-anchor="middle" class="number" fill="#0F8B8D">2</text>
      <text class="node-label"><tspan x="170.5" y="461.0">B: 2 hits</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="68.0" y="575" width="205" height="112" rx="18" fill="#E6F8F7" stroke="#0F8B8D" stroke-width="2.2"/>
      <rect x="68.0" y="575" width="8" height="112" rx="4" fill="#0F8B8D"/>
      <circle cx="95.0" cy="600" r="13" fill="#0F8B8D" opacity=".14"/>
      <text x="95.0" y="605" text-anchor="middle" class="number" fill="#0F8B8D">3</text>
      <text class="node-label"><tspan x="170.5" y="631.0">C: 5 hits</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="342.75" y="400" width="205" height="112" rx="18" fill="#EAF2FF" stroke="#2563EB" stroke-width="2.2"/>
      <rect x="342.75" y="400" width="8" height="112" rx="4" fill="#2563EB"/>
      <circle cx="369.75" cy="425" r="13" fill="#2563EB" opacity=".14"/>
      <text x="369.75" y="430" text-anchor="middle" class="number" fill="#2563EB">4</text>
      <text class="node-label"><tspan x="445.2" y="456.0">Insert D</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="617.5" y="400" width="205" height="112" rx="18" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.2"/>
      <rect x="617.5" y="400" width="8" height="112" rx="4" fill="#EA580C"/>
      <circle cx="644.5" cy="425" r="13" fill="#EA580C" opacity=".14"/>
      <text x="644.5" y="430" text-anchor="middle" class="number" fill="#EA580C">5</text>
      <text class="node-label"><tspan x="720.0" y="456.0">Lowest frequency: B</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="892.25" y="400" width="205" height="112" rx="18" fill="#FEECEC" stroke="#DC2626" stroke-width="2.2"/>
      <rect x="892.25" y="400" width="8" height="112" rx="4" fill="#DC2626"/>
      <circle cx="919.25" cy="425" r="13" fill="#DC2626" opacity=".14"/>
      <text x="919.25" y="430" text-anchor="middle" class="number" fill="#DC2626">6</text>
      <text class="node-label"><tspan x="994.8" y="456.0">Evict B; retain A,C,D</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="1167.0" y="400" width="205" height="112" rx="18" fill="#F1F5F9" stroke="#475569" stroke-width="2.2"/>
      <rect x="1167.0" y="400" width="8" height="112" rx="4" fill="#475569"/>
      <circle cx="1194.0" cy="425" r="13" fill="#475569" opacity=".14"/>
      <text x="1194.0" y="430" text-anchor="middle" class="number" fill="#475569">7</text>
      <text class="node-label"><tspan x="1269.5" y="456.0">Age counters over time</tspan></text>
    </g>
<line x1="72" y1="716" x2="1368" y2="716" stroke="#E2E8F0" stroke-width="2"/>
<rect x="72" y="738" width="14" height="14" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><text x="93" y="750" class="legend">Client / caller</text><rect x="247" y="738" width="14" height="14" rx="4" fill="#EAF2FF" stroke="#2563EB"/><text x="268" y="750" class="legend">Application / control</text><rect x="452" y="738" width="14" height="14" rx="4" fill="#E6F8F7" stroke="#0F8B8D"/><text x="473" y="750" class="legend">Cache</text><rect x="572" y="738" width="14" height="14" rx="4" fill="#FFF3E5" stroke="#D97706"/><text x="593" y="750" class="legend">Database / origin</text><rect x="757" y="738" width="14" height="14" rx="4" fill="#F3E8FF" stroke="#7C3AED"/><text x="778" y="750" class="legend">Event / broker</text><rect x="917" y="738" width="14" height="14" rx="4" fill="#FEECEC" stroke="#DC2626"/><text x="938" y="750" class="legend">Risk / miss</text>
<rect x="64" y="765" width="1312" height="68" rx="14" fill="#F1F5F9" stroke="#CBD5E1"/>
<text class="note"><tspan x="88" y="790">LFU preserves frequently used keys, but aging prevents yesterday’s popularity from dominating forever.</tspan></text>
</svg>