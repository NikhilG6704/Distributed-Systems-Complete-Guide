<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc"><title id="title">Redis memory budget and eviction</title><desc id="desc">Show Redis memory budget divided into data, client/replication buffers, fragmentation and reserved headroom; illustrate eviction when maxmemory is reached.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11Z" fill="#64748B"/></marker><style><![CDATA[.h{font:700 32px Inter,Arial,sans-serif;fill:#0F172A}.t{font:600 18px Inter,Arial,sans-serif;fill:#0F172A}.s{font:500 15px Inter,Arial,sans-serif;fill:#475569}.n{font:700 15px Inter,Arial,sans-serif;fill:#334155}]]></style></defs><rect width="1440" height="860" rx="24" fill="#F8FAFC"/><rect width="1440" height="12" fill="#0F766E"/><text x="72" y="62" class="h">Redis memory budget and eviction</text><text x="72" y="105" class="s">Show Redis memory budget divided into data, client/replication buffers, fragmentation and reserved headroom; illustrate eviction when maxmemory is reached.</text><text x="720" y="220" text-anchor="middle" class="t">Host memory budget (illustrative proportions)</text><rect x="200" y="350" width="457.6" height="130" fill="#0F8B8D" opacity=".9"/><text x="428.8" y="408" text-anchor="middle" class="t" fill="#FFFFFF">44%</text><text x="428.8" y="515" text-anchor="middle" class="s">Dataset + metadata</text><rect x="657.6" y="350" width="187.2" height="130" fill="#2563EB" opacity=".9"/><text x="751.2" y="408" text-anchor="middle" class="t" fill="#FFFFFF">18%</text><text x="751.2" y="515" text-anchor="middle" class="s">Clients / replication buffers</text><rect x="844.8" y="350" width="145.6" height="130" fill="#EA580C" opacity=".9"/><text x="917.5999999999999" y="408" text-anchor="middle" class="t" fill="#FFFFFF">14%</text><text x="917.5999999999999" y="515" text-anchor="middle" class="s">Fragmentation</text><rect x="990.4" y="350" width="249.6" height="130" fill="#94A3B8" opacity=".9"/><text x="1115.2" y="408" text-anchor="middle" class="t" fill="#FFFFFF">24%</text><text x="1115.2" y="515" text-anchor="middle" class="s">Reserved headroom</text><path d="M200,510 V560 H1240 V510" fill="none" stroke="#DC2626" stroke-width="3"/><text x="720" y="610" text-anchor="middle" class="t">At maxmemory: apply eviction policy or reject writes (noeviction)</text><rect x="64" y="770" width="1312" height="60" rx="14" fill="#F1F5F9" stroke="#CBD5E1"/><text x="88" y="806" class="n">The dataset is only part of RSS. Buffers, fragmentation, replication, and safety headroom must be included in sizing.</text></svg>