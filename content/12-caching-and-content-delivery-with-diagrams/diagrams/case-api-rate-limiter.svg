<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">Case study: distributed API rate limiter</title><desc id="desc">Show distributed API gateways executing an atomic Redis token-bucket check keyed by tenant and route, including refill, allow/deny branches, and a defined Redis-outage fallback.</desc>
