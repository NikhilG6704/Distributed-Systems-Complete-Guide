<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">Database load before and after caching</title><desc id="desc">Compare repeated application-to-database reads before caching with the same workload served mostly from cache after introducing L1 and distributed cache layers.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11 Z" fill="#64748B"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity=".10"/></filter>
 <style><![CDATA[
  .bg{fill:#F8FAFC} .title{font:700 32px Inter,Arial,sans-serif;fill:#0F172A}
  .subtitle{font:400 17px Inter,Arial,sans-serif;fill:#475569}
  .node-label{font:600 17px Inter,Arial,sans-serif;fill:#0F172A;text-anchor:middle}
  .number{font:700 11px Inter,Arial,sans-serif}
  .edge{fill:none;stroke:#64748B;stroke-width:3;opacity:.85}
  .legend{font:500 13px Inter,Arial,sans-serif;fill:#475569}
  .note{font:600 15px Inter,Arial,sans-serif;fill:#334155}
 ]]></style>
</defs>
<rect class="bg" width="1440" height="860" rx="24"/>
<rect x="0" y="0" width="1440" height="12" fill="#0F766E"/>
<text x="72" y="62" class="title">Database load before and after caching</text>
<text class="subtitle"><tspan x="72" y="105">Compare repeated application-to-database reads before caching with the same workload served mostly from cache after</tspan><tspan x="72" y="129">introducing L1 and distributed cache layers.</tspan></text>
<line x1="72" y1="150" x2="1368" y2="150" stroke="#E2E8F0" stroke-width="2"/>
<path d="M273.0,456.0 C345.6,456.0 361.7,366.0 434.3,366.0" class="edge" marker-end="url(#arrow)"/><path d="M273.0,456.0 C345.6,456.0 361.7,556.0 434.3,556.0" class="edge" marker-end="url(#arrow)"/><path d="M639.3,366.0 C711.9,366.0 728.1,366.0 800.7,366.0" class="edge" marker-end="url(#arrow)"/><path d="M639.3,556.0 C711.9,556.0 728.1,556.0 800.7,556.0" class="edge" marker-end="url(#arrow)"/><path d="M1005.7,366.0 C1078.3,366.0 1094.4,366.0 1167.0,366.0" class="edge" marker-end="url(#arrow)"/><path d="M1005.7,556.0 C1078.3,556.0 1094.4,556.0 1167.0,556.0" class="edge" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
      <rect x="68.0" y="400" width="205" height="112" rx="18" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.2"/>
      <rect x="68.0" y="400" width="8" height="112" rx="4" fill="#4F46E5"/>
      <circle cx="95.0" cy="425" r="13" fill="#4F46E5" opacity=".14"/>
      <text x="95.0" y="430" text-anchor="middle" class="number" fill="#4F46E5">1</text>
      <text class="node-label"><tspan x="170.5" y="456.0">Repeated reads</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="434.3333333333333" y="310" width="205" height="112" rx="18" fill="#EAF2FF" stroke="#2563EB" stroke-width="2.2"/>
      <rect x="434.3333333333333" y="310" width="8" height="112" rx="4" fill="#2563EB"/>
      <circle cx="461.3333333333333" cy="335" r="13" fill="#2563EB" opacity=".14"/>
      <text x="461.3333333333333" y="340" text-anchor="middle" class="number" fill="#2563EB">2</text>
      <text class="node-label"><tspan x="536.8" y="366.0">Before: app instances</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="434.3333333333333" y="500" width="205" height="112" rx="18" fill="#EAF2FF" stroke="#2563EB" stroke-width="2.2"/>
      <rect x="434.3333333333333" y="500" width="8" height="112" rx="4" fill="#2563EB"/>
      <circle cx="461.3333333333333" cy="525" r="13" fill="#2563EB" opacity=".14"/>
      <text x="461.3333333333333" y="530" text-anchor="middle" class="number" fill="#2563EB">3</text>
      <text class="node-label"><tspan x="536.8" y="556.0">After: app instances</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="800.6666666666666" y="310" width="205" height="112" rx="18" fill="#FEECEC" stroke="#DC2626" stroke-width="2.2"/>
      <rect x="800.6666666666666" y="310" width="8" height="112" rx="4" fill="#DC2626"/>
      <circle cx="827.6666666666666" cy="335" r="13" fill="#DC2626" opacity=".14"/>
      <text x="827.6666666666666" y="340" text-anchor="middle" class="number" fill="#DC2626">4</text>
      <text class="node-label"><tspan x="903.2" y="353.0">Before: every read →</tspan><tspan x="903.2" y="379.0">DB</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="800.6666666666666" y="500" width="205" height="112" rx="18" fill="#E6F8F7" stroke="#0F8B8D" stroke-width="2.2"/>
      <rect x="800.6666666666666" y="500" width="8" height="112" rx="4" fill="#0F8B8D"/>
      <circle cx="827.6666666666666" cy="525" r="13" fill="#0F8B8D" opacity=".14"/>
      <text x="827.6666666666666" y="530" text-anchor="middle" class="number" fill="#0F8B8D">5</text>
      <text class="node-label"><tspan x="903.2" y="556.0">After: L1 / Redis hits</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="1167.0" y="310" width="205" height="112" rx="18" fill="#FFF3E5" stroke="#D97706" stroke-width="2.2"/>
      <rect x="1167.0" y="310" width="8" height="112" rx="4" fill="#D97706"/>
      <circle cx="1194.0" cy="335" r="13" fill="#D97706" opacity=".14"/>
      <text x="1194.0" y="340" text-anchor="middle" class="number" fill="#D97706">6</text>
      <text class="node-label"><tspan x="1269.5" y="353.0">Database on every</tspan><tspan x="1269.5" y="379.0">request</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="1167.0" y="500" width="205" height="112" rx="18" fill="#FFF3E5" stroke="#D97706" stroke-width="2.2"/>
      <rect x="1167.0" y="500" width="8" height="112" rx="4" fill="#D97706"/>
      <circle cx="1194.0" cy="525" r="13" fill="#D97706" opacity=".14"/>
      <text x="1194.0" y="530" text-anchor="middle" class="number" fill="#D97706">7</text>
      <text class="node-label"><tspan x="1269.5" y="543.0">Database on misses</tspan><tspan x="1269.5" y="569.0">only</tspan></text>
    </g>
<line x1="72" y1="716" x2="1368" y2="716" stroke="#E2E8F0" stroke-width="2"/>
<rect x="72" y="738" width="14" height="14" rx="4" fill="#EEF2FF" stroke="#4F46E5"/><text x="93" y="750" class="legend">Client / caller</text><rect x="247" y="738" width="14" height="14" rx="4" fill="#EAF2FF" stroke="#2563EB"/><text x="268" y="750" class="legend">Application / control</text><rect x="452" y="738" width="14" height="14" rx="4" fill="#E6F8F7" stroke="#0F8B8D"/><text x="473" y="750" class="legend">Cache</text><rect x="572" y="738" width="14" height="14" rx="4" fill="#FFF3E5" stroke="#D97706"/><text x="593" y="750" class="legend">Database / origin</text><rect x="757" y="738" width="14" height="14" rx="4" fill="#F3E8FF" stroke="#7C3AED"/><text x="778" y="750" class="legend">Event / broker</text><rect x="917" y="738" width="14" height="14" rx="4" fill="#FEECEC" stroke="#DC2626"/><text x="938" y="750" class="legend">Risk / miss</text>
<rect x="64" y="765" width="1312" height="68" rx="14" fill="#F1F5F9" stroke="#CBD5E1"/>
<text class="note"><tspan x="88" y="790">Caching changes the database from the default read path to the miss path for reusable data.</tspan></text>
</svg>