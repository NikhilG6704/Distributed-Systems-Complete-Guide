<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc"><title id="title">Bloom filter false-positive example</title><desc id="desc">Show an absent key hashing to bits that were already set by different inserted keys, demonstrating why a positive Bloom result means possibly present rather than definitely present.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11Z" fill="#64748B"/></marker><style><![CDATA[.h{font:700 32px Inter,Arial,sans-serif;fill:#0F172A}.t{font:600 18px Inter,Arial,sans-serif;fill:#0F172A}.s{font:500 15px Inter,Arial,sans-serif;fill:#475569}.n{font:700 15px Inter,Arial,sans-serif;fill:#334155}]]></style></defs><rect width="1440" height="860" rx="24" fill="#F8FAFC"/><rect width="1440" height="12" fill="#0F766E"/><text x="72" y="62" class="h">Bloom filter false-positive example</text><text x="72" y="105" class="s">Show an absent key hashing to bits that were already set by different inserted keys, demonstrating why a positive Bloom result means possibly present rather than definitely present.</text><text x="720" y="190" text-anchor="middle" class="t">Bit array (m bits)</text><rect x="210" y="260" width="62" height="70" rx="9" fill="#DDF7EF" stroke="#0F8B8D" stroke-width="2"/><text x="241.0" y="304" text-anchor="middle" class="t">1</text><text x="241.0" y="352" text-anchor="middle" class="s">0</text><rect x="280" y="260" width="62" height="70" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="311.0" y="304" text-anchor="middle" class="t">0</text><text x="311.0" y="352" text-anchor="middle" class="s">1</text><rect x="350" y="260" width="62" height="70" rx="9" fill="#DDF7EF" stroke="#0F8B8D" stroke-width="2"/><text x="381.0" y="304" text-anchor="middle" class="t">1</text><text x="381.0" y="352" text-anchor="middle" class="s">2</text><rect x="420" y="260" width="62" height="70" rx="9" fill="#DDF7EF" stroke="#0F8B8D" stroke-width="2"/><text x="451.0" y="304" text-anchor="middle" class="t">1</text><text x="451.0" y="352" text-anchor="middle" class="s">3</text><rect x="490" y="260" width="62" height="70" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="521.0" y="304" text-anchor="middle" class="t">0</text><text x="521.0" y="352" text-anchor="middle" class="s">4</text><rect x="560" y="260" width="62" height="70" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="591.0" y="304" text-anchor="middle" class="t">0</text><text x="591.0" y="352" text-anchor="middle" class="s">5</text><rect x="630" y="260" width="62" height="70" rx="9" fill="#DDF7EF" stroke="#0F8B8D" stroke-width="2"/><text x="661.0" y="304" text-anchor="middle" class="t">1</text><text x="661.0" y="352" text-anchor="middle" class="s">6</text><rect x="700" y="260" width="62" height="70" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="731.0" y="304" text-anchor="middle" class="t">0</text><text x="731.0" y="352" text-anchor="middle" class="s">7</text><rect x="770" y="260" width="62" height="70" rx="9" fill="#DDF7EF" stroke="#0F8B8D" stroke-width="2"/><text x="801.0" y="304" text-anchor="middle" class="t">1</text><text x="801.0" y="352" text-anchor="middle" class="s">8</text><rect x="840" y="260" width="62" height="70" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="871.0" y="304" text-anchor="middle" class="t">0</text><text x="871.0" y="352" text-anchor="middle" class="s">9</text><rect x="910" y="260" width="62" height="70" rx="9" fill="#DDF7EF" stroke="#0F8B8D" stroke-width="2"/><text x="941.0" y="304" text-anchor="middle" class="t">1</text><text x="941.0" y="352" text-anchor="middle" class="s">10</text><rect x="980" y="260" width="62" height="70" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1011.0" y="304" text-anchor="middle" class="t">0</text><text x="1011.0" y="352" text-anchor="middle" class="s">11</text><rect x="1050" y="260" width="62" height="70" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1081.0" y="304" text-anchor="middle" class="t">0</text><text x="1081.0" y="352" text-anchor="middle" class="s">12</text><rect x="1120" y="260" width="62" height="70" rx="9" fill="#DDF7EF" stroke="#0F8B8D" stroke-width="2"/><text x="1151.0" y="304" text-anchor="middle" class="t">1</text><text x="1151.0" y="352" text-anchor="middle" class="s">13</text><rect x="1190" y="260" width="62" height="70" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1221.0" y="304" text-anchor="middle" class="t">0</text><text x="1221.0" y="352" text-anchor="middle" class="s">14</text><rect x="1260" y="260" width="62" height="70" rx="9" fill="#DDF7EF" stroke="#0F8B8D" stroke-width="2"/><text x="1291.0" y="304" text-anchor="middle" class="t">1</text><text x="1291.0" y="352" text-anchor="middle" class="s">15</text><rect x="300" y="420" width="160" height="48" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="380" y="450" text-anchor="middle" class="t">h1(x)</text><path d="M460,444 C540,444 520,310 650,310" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arr)"/><rect x="300" y="500" width="160" height="48" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><text x="380" y="530" text-anchor="middle" class="t">h2(x)</text><path d="M460,524 C540,524 520,310 800,310" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arr)"/><rect x="300" y="580" width="160" height="48" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/><text x="380" y="610" text-anchor="middle" class="t">h3(x)</text><path d="M460,604 C540,604 520,310 950,310" fill="none" stroke="#D97706" stroke-width="3" marker-end="url(#arr)"/><text x="720" y="690" text-anchor="middle" class="s">All queried positions are already 1 → possibly present (not proof)</text><rect x="64" y="770" width="1312" height="60" rx="14" fill="#F1F5F9" stroke="#CBD5E1"/><text x="88" y="806" class="n">A positive Bloom result means possibly present; collisions can make an absent key appear present.</text></svg>