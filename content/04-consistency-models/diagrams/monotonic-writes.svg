<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Monotonic writes">
<defs>
          <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
          <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8B78"/></marker>
          <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#24845B"/></marker>
          <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7652C8"/></marker>
          <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B96B08"/></marker>
          <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C63D4B"/></marker>
          <marker id="arr-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5F7188"/></marker>
          <style>
            text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#172B4D}
            .muted{fill:#5F7188}.bold{font-weight:700}.semibold{font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
          </style>
        </defs>
<rect x="0" y="0" width="1200" height="680" rx="0" fill="#F7F9FC"/>
<rect x="0" y="0" width="1200" height="82" rx="0" fill="#FFFFFF"/>
<text x="36" y="38" font-size="27" font-weight="bold" fill="#172B4D" text-anchor="start">Monotonic writes</text>
<text x="36" y="64" font-size="14" font-weight="muted" fill="#5F7188" text-anchor="start">Writes from one session are applied in program order, even when routed to different replicas.</text>
<line x1="28" y1="82" x2="1172" y2="82" stroke="#D7E0EC" stroke-width="1" stroke-linecap="round"/>
<rect x="70" y="165" width="200" height="82" rx="13" fill="#EAF1FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="170.0" y="189" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">Client session</text>
<text x="170.0" y="208" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">W1 then W2</text>
<rect x="410" y="145" width="230" height="82" rx="13" fill="#E5F6F1" stroke="#0F8B78" stroke-width="1.4"/>
<text x="525.0" y="169" font-size="16" font-weight="bold" fill="#0F8B78" text-anchor="middle">Replica A</text>
<text x="525.0" y="188" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">receives W1</text>
<rect x="760" y="145" width="230" height="82" rx="13" fill="#FFF3DD" stroke="#B96B08" stroke-width="1.4"/>
<text x="875.0" y="169" font-size="16" font-weight="bold" fill="#B96B08" text-anchor="middle">Replica B</text>
<text x="875.0" y="188" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">receives W2 first</text>
<line x1="270" y1="190" x2="410" y2="185" stroke="#2563EB" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<line x1="270" y1="210" x2="760" y2="185" stroke="#B96B08" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-amber)"/>
<rect x="745" y="270" width="260" height="85" rx="13" fill="#FCEBED" stroke="#C63D4B" stroke-width="1.5"/>
<text x="875" y="302" font-size="18" font-weight="bold" fill="#C63D4B" text-anchor="middle">W2 HELD</text>
<text x="875" y="328" font-size="13" font-weight="semibold" fill="#C63D4B" text-anchor="middle">depends on W1</text>
<line x1="875" y1="227" x2="875" y2="270" stroke="#C63D4B" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-red)"/>
<rect x="390" y="390" width="640" height="88" rx="14" fill="#E7F5ED" stroke="#24845B" stroke-width="1.5"/>
<text x="710" y="425" font-size="18" font-weight="bold" fill="#24845B" text-anchor="middle">W1 APPLIED → RELEASE W2</text>
<text x="710" y="451" font-size="13" font-weight="semibold" fill="#24845B" text-anchor="middle">dependency satisfied; W2 may now be applied</text>
<line x1="525" y1="227" x2="525" y2="390" stroke="#24845B" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-green)"/>
<line x1="875" y1="355" x2="875" y2="390" stroke="#24845B" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-green)"/>
<rect x="70" y="525" width="1060" height="80" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="70" y="525" width="7" height="80" rx="3" fill="#7652C8"/>
<text x="88" y="553" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">NOT ATOMICITY</text>
<text x="88" y="577" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="88" dy="0">Ordering W1 before W2 does not make them an all-or-nothing transaction. W1 may succeed even if W2 later fails.</tspan>
</text>
<line x1="28" y1="645" x2="1172" y2="645" stroke="#D7E0EC" stroke-width="1" stroke-linecap="round"/>
<text x="34" y="666" font-size="11" font-weight="muted" fill="#5F7188" text-anchor="start">Conceptual model — exact guarantees depend on protocol, configuration, and failure assumptions.</text>
</svg>