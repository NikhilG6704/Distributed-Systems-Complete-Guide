<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="CAP theorem: a partition forces a service-level trade-off">
<defs>
          <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
          <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8B78"/></marker>
          <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#24845B"/></marker>
          <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7652C8"/></marker>
          <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B96B08"/></marker>
          <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C63D4B"/></marker>
          <marker id="arr-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5F7188"/></marker>
          <style>
            text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#172B4D}
            .muted{fill:#5F7188}.bold{font-weight:700}.semibold{font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
          </style>
        </defs>
<rect x="0" y="0" width="1200" height="680" rx="0" fill="#F7F9FC"/>
<rect x="0" y="0" width="1200" height="82" rx="0" fill="#FFFFFF"/>
<text x="36" y="38" font-size="27" font-weight="bold" fill="#172B4D" text-anchor="start">CAP theorem: a partition forces a service-level trade-off</text>
<text x="36" y="64" font-size="14" font-weight="muted" fill="#5F7188" text-anchor="start">C means linearizable consistency in the formal CAP model; A means every request to a non-failing node gets a non-error response.</text>
<line x1="28" y1="82" x2="1172" y2="82" stroke="#D7E0EC" stroke-width="1" stroke-linecap="round"/>
<rect x="45" y="115" width="1110" height="145" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="45" y="115" width="7" height="145" rx="3" fill="#0F8B78"/>
<text x="63" y="143" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">BEFORE PARTITION · NODES CAN COORDINATE</text>
<text x="63" y="167" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="63" dy="0">Replicas A, B, and C exchange messages and can use a quorum/leader protocol.</tspan>
<tspan x="63" dy="18">For supported operations, the service can often provide a strong response while the network is healthy.</tspan>
</text>
<rect x="275" y="170" width="115" height="58" rx="13" fill="#EAF1FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="332.5" y="194" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">Replica A</text>
<text x="332.5" y="213" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">connected</text>
<rect x="570" y="170" width="115" height="58" rx="13" fill="#EAF1FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="627.5" y="194" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">Replica B</text>
<text x="627.5" y="213" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">connected</text>
<rect x="865" y="170" width="115" height="58" rx="13" fill="#EAF1FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="922.5" y="194" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">Replica C</text>
<text x="922.5" y="213" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">connected</text>
<line x1="390" y1="198" x2="570" y2="198" stroke="#52657D" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-slate)"/>
<line x1="685" y1="198" x2="865" y2="198" stroke="#52657D" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-slate)"/>
<rect x="45" y="300" width="520" height="260" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="45" y="300" width="7" height="260" rx="3" fill="#2563EB"/>
<text x="63" y="328" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">CP-STYLE RESPONSE</text>
<text x="63" y="352" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="63" dy="0">Preserve the single-copy order.</tspan>
<tspan x="63" dy="18">Majority side (B+C): can commit with quorum.</tspan>
<tspan x="63" dy="18">Minority side (A): reject, wait, or redirect</tspan>
<tspan x="63" dy="18">when it cannot prove an operation is safe.</tspan>
<tspan x="63" dy="18">Not every partition side remains available.</tspan>
</text>
<rect x="110" y="405" width="110" height="60" rx="13" fill="#FCEBED" stroke="#C63D4B" stroke-width="1.4"/>
<text x="165.0" y="429" font-size="16" font-weight="bold" fill="#C63D4B" text-anchor="middle">A</text>
<text x="165.0" y="448" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">minority</text>
<rect x="330" y="405" width="110" height="60" rx="13" fill="#E5F6F1" stroke="#0F8B78" stroke-width="1.4"/>
<text x="385.0" y="429" font-size="16" font-weight="bold" fill="#0F8B78" text-anchor="middle">B + C</text>
<text x="385.0" y="448" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">majority</text>
<line x1="220" y1="435" x2="330" y2="435" stroke="#0F8B78" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-teal)"/>
<rect x="105" y="485" width="145" height="27" rx="13" fill="#FCEBED"/>
<text x="177.5" y="503" font-size="12" font-weight="semibold" fill="#C63D4B" text-anchor="middle">no quorum</text>
<rect x="340" y="485" width="115" height="27" rx="13" fill="#E7F5ED"/>
<text x="397.5" y="503" font-size="12" font-weight="semibold" fill="#24845B" text-anchor="middle">commit</text>
<rect x="635" y="300" width="520" height="260" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="635" y="300" width="7" height="260" rx="3" fill="#B96B08"/>
<text x="653" y="328" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">AP-STYLE RESPONSE</text>
<text x="653" y="352" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="653" dy="0">Keep serving local requests on non-failing nodes.</tspan>
<tspan x="653" dy="18">A and B+C may accept independent writes.</tspan>
<tspan x="653" dy="18">Reads can return different local versions.</tspan>
<tspan x="653" dy="18">After healing, exchange and reconcile updates.</tspan>
<tspan x="653" dy="18">Availability is favored over one global order.</tspan>
</text>
<rect x="700" y="405" width="110" height="60" rx="13" fill="#FFF3DD" stroke="#B96B08" stroke-width="1.4"/>
<text x="755.0" y="429" font-size="16" font-weight="bold" fill="#B96B08" text-anchor="middle">A</text>
<text x="755.0" y="448" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">local view</text>
<rect x="950" y="405" width="110" height="60" rx="13" fill="#FFF3DD" stroke="#B96B08" stroke-width="1.4"/>
<text x="1005.0" y="429" font-size="16" font-weight="bold" fill="#B96B08" text-anchor="middle">B + C</text>
<text x="1005.0" y="448" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">local view</text>
<line x1="810" y1="435" x2="950" y2="435" stroke="#B96B08" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-amber)"/>
<rect x="700" y="485" width="145" height="27" rx="13" fill="#FFF3DD"/>
<text x="772.5" y="503" font-size="12" font-weight="semibold" fill="#B96B08" text-anchor="middle">accept local</text>
<rect x="960" y="485" width="145" height="27" rx="13" fill="#FFF3DD"/>
<text x="1032.5" y="503" font-size="12" font-weight="semibold" fill="#B96B08" text-anchor="middle">accept local</text>
<line x1="28" y1="645" x2="1172" y2="645" stroke="#D7E0EC" stroke-width="1" stroke-linecap="round"/>
<text x="34" y="666" font-size="11" font-weight="muted" fill="#5F7188" text-anchor="start">Conceptual model — exact guarantees depend on protocol, configuration, and failure assumptions.</text>
</svg>