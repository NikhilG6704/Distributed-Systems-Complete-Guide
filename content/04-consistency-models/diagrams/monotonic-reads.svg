<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Monotonic reads">
<defs>
          <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
          <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8B78"/></marker>
          <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#24845B"/></marker>
          <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7652C8"/></marker>
          <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B96B08"/></marker>
          <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C63D4B"/></marker>
          <marker id="arr-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5F7188"/></marker>
          <style>
            text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#172B4D}
            .muted{fill:#5F7188}.bold{font-weight:700}.semibold{font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
          </style>
        </defs>
<rect x="0" y="0" width="1200" height="680" rx="0" fill="#F7F9FC"/>
<rect x="0" y="0" width="1200" height="82" rx="0" fill="#FFFFFF"/>
<text x="36" y="38" font-size="27" font-weight="bold" fill="#172B4D" text-anchor="start">Monotonic reads</text>
<text x="36" y="64" font-size="14" font-weight="muted" fill="#5F7188" text-anchor="start">Once a session has observed version 20, a later read in that session must return version 20 or newer.</text>
<line x1="28" y1="82" x2="1172" y2="82" stroke="#D7E0EC" stroke-width="1" stroke-linecap="round"/>
<text x="70" y="130" font-size="13" font-weight="bold" fill="#5F7188" text-anchor="start">VERSION</text>
<line x1="260" y1="205" x2="1090" y2="205" stroke="#D7E0EC" stroke-width="2" stroke-linecap="round"/>
<circle cx="260" cy="205" r="8" fill="#0F8B78"/>
<text x="225" y="210" font-size="15" font-weight="bold" fill="#0F8B78" text-anchor="end">v22</text>
<line x1="260" y1="285" x2="1090" y2="285" stroke="#D7E0EC" stroke-width="2" stroke-linecap="round"/>
<circle cx="260" cy="285" r="8" fill="#2563EB"/>
<text x="225" y="290" font-size="15" font-weight="bold" fill="#2563EB" text-anchor="end">v20</text>
<line x1="260" y1="365" x2="1090" y2="365" stroke="#D7E0EC" stroke-width="2" stroke-linecap="round"/>
<circle cx="260" cy="365" r="8" fill="#B96B08"/>
<text x="225" y="370" font-size="15" font-weight="bold" fill="#B96B08" text-anchor="end">v17</text>
<rect x="360" y="155" width="190" height="65" rx="13" fill="#EAF1FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="455.0" y="179" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">Read 1</text>
<text x="455.0" y="198" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">returns v20</text>
<line x1="455" y1="220" x2="455" y2="285" stroke="#2563EB" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<rect x="740" y="315" width="190" height="65" rx="13" fill="#FCEBED" stroke="#C63D4B" stroke-width="1.4"/>
<text x="835.0" y="339" font-size="16" font-weight="bold" fill="#C63D4B" text-anchor="middle">Read 2 · bad</text>
<text x="835.0" y="358" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">returns v17</text>
<line x1="835" y1="380" x2="835" y2="365" stroke="#C63D4B" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-red)"/>
<text x="845" y="405" font-size="12" font-weight="bold" fill="#C63D4B" text-anchor="middle">FORBIDDEN REGRESSION</text>
<rect x="740" y="470" width="190" height="65" rx="13" fill="#E7F5ED" stroke="#24845B" stroke-width="1.4"/>
<text x="835.0" y="494" font-size="16" font-weight="bold" fill="#24845B" text-anchor="middle">Read 2 · valid</text>
<text x="835.0" y="513" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">wait / route → v20+</text>
<line x1="835" y1="470" x2="835" y2="285" stroke="#24845B" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-green)"/>
<rect x="65" y="475" width="550" height="100" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="65" y="475" width="7" height="100" rx="3" fill="#7652C8"/>
<text x="83" y="503" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">IMPORTANT SCOPE</text>
<text x="83" y="527" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="83" dy="0">Monotonic reads does not promise the globally newest value.</tspan>
<tspan x="83" dy="18">It only prevents this session from moving backward.</tspan>
</text>
<line x1="28" y1="645" x2="1172" y2="645" stroke="#D7E0EC" stroke-width="1" stroke-linecap="round"/>
<text x="34" y="666" font-size="11" font-weight="muted" fill="#5F7188" text-anchor="start">Conceptual model — exact guarantees depend on protocol, configuration, and failure assumptions.</text>
</svg>