<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Database consistency architecture patterns">
<defs>
          <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
          <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8B78"/></marker>
          <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#24845B"/></marker>
          <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7652C8"/></marker>
          <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B96B08"/></marker>
          <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C63D4B"/></marker>
          <marker id="arr-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5F7188"/></marker>
          <style>
            text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#172B4D}
            .muted{fill:#5F7188}.bold{font-weight:700}.semibold{font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
          </style>
        </defs>
<rect x="0" y="0" width="1200" height="680" rx="0" fill="#F7F9FC"/>
<rect x="0" y="0" width="1200" height="82" rx="0" fill="#FFFFFF"/>
<text x="36" y="38" font-size="27" font-weight="bold" fill="#172B4D" text-anchor="start">Database consistency architecture patterns</text>
<text x="36" y="64" font-size="14" font-weight="muted" fill="#5F7188" text-anchor="start">Product implementations combine these patterns; labels below identify families, not complete guarantees for every setting.</text>
<line x1="28" y1="82" x2="1172" y2="82" stroke="#D7E0EC" stroke-width="1" stroke-linecap="round"/>
<rect x="45" y="135" width="245" height="390" rx="15" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="45" y="135" width="245" height="57" rx="15" fill="#EAF1FF"/>
<text x="59" y="170" font-size="14" font-weight="bold" fill="#2563EB" text-anchor="start">1 · LEADER + CONSENSUS</text>
<text x="59" y="225" font-size="16" font-weight="bold" fill="#172B4D" text-anchor="start">etcd · coordination</text>
<text x="59" y="270" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="59" dy="0">Write → leader → Raft log</tspan>
<tspan x="59" dy="32">Read → linearizable path</tspan>
<tspan x="59" dy="32">ACK after quorum commit</tspan>
<tspan x="59" dy="32">Minority cannot commit writes</tspan>
</text>
<rect x="120" y="400" width="100" height="42" rx="13" fill="#EAF1FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="170.0" y="424" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">Leader</text>
<text x="170.0" y="443" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">log</text>
<line x1="145" y1="442" x2="95" y2="472" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<line x1="195" y1="442" x2="245" y2="472" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<rect x="335" y="135" width="245" height="390" rx="15" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="335" y="135" width="245" height="57" rx="15" fill="#F0EBFB"/>
<text x="349" y="170" font-size="14" font-weight="bold" fill="#7652C8" text-anchor="start">2 · GLOBAL MVCC + TIME</text>
<text x="349" y="225" font-size="16" font-weight="bold" fill="#172B4D" text-anchor="start">Google Spanner</text>
<text x="349" y="270" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="349" dy="0">Write → transaction protocol</tspan>
<tspan x="349" dy="32">Timestamp + commit-wait</tspan>
<tspan x="349" dy="32">Read → MVCC timestamp</tspan>
<tspan x="349" dy="32">External consistency</tspan>
</text>
<rect x="407" y="400" width="105" height="42" rx="13" fill="#F0EBFB" stroke="#7652C8" stroke-width="1.4"/>
<text x="459.5" y="424" font-size="16" font-weight="bold" fill="#7652C8" text-anchor="middle">MVCC</text>
<text x="459.5" y="443" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">time</text>
<line x1="460" y1="442" x2="460" y2="472" stroke="#7652C8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-purple)"/>
<rect x="625" y="135" width="245" height="390" rx="15" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="625" y="135" width="245" height="57" rx="15" fill="#FFF3DD"/>
<text x="639" y="170" font-size="14" font-weight="bold" fill="#B96B08" text-anchor="start">3 · PEER-TO-PEER QUORUM</text>
<text x="639" y="225" font-size="16" font-weight="bold" fill="#172B4D" text-anchor="start">Cassandra · Dynamo style</text>
<text x="639" y="270" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="639" dy="0">Write → replicas / CL</tspan>
<tspan x="639" dy="32">Read → quorum / version</tspan>
<tspan x="639" dy="32">Repair + merge conflicts</tspan>
<tspan x="639" dy="32">Tunable, not one guarantee</tspan>
</text>
<rect x="635" y="420" width="65" height="42" rx="13" fill="#FFF3DD" stroke="#B96B08" stroke-width="1.4"/>
<text x="667.5" y="444" font-size="16" font-weight="bold" fill="#B96B08" text-anchor="middle">A</text>
<text x="667.5" y="463" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">v</text>
<rect x="715" y="420" width="65" height="42" rx="13" fill="#FFF3DD" stroke="#B96B08" stroke-width="1.4"/>
<text x="747.5" y="444" font-size="16" font-weight="bold" fill="#B96B08" text-anchor="middle">B</text>
<text x="747.5" y="463" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">v</text>
<rect x="795" y="420" width="65" height="42" rx="13" fill="#FFF3DD" stroke="#B96B08" stroke-width="1.4"/>
<text x="827.5" y="444" font-size="16" font-weight="bold" fill="#B96B08" text-anchor="middle">C</text>
<text x="827.5" y="463" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">v</text>
<line x1="700" y1="441" x2="715" y2="441" stroke="#B96B08" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr-amber)"/>
<line x1="780" y1="441" x2="795" y2="441" stroke="#B96B08" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr-amber)"/>
<rect x="915" y="135" width="245" height="390" rx="15" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="915" y="135" width="245" height="57" rx="15" fill="#E5F6F1"/>
<text x="929" y="170" font-size="14" font-weight="bold" fill="#0F8B78" text-anchor="start">4 · PRIMARY / SECONDARY</text>
<text x="929" y="225" font-size="16" font-weight="bold" fill="#172B4D" text-anchor="start">MongoDB · Redis patterns</text>
<text x="929" y="270" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="929" dy="0">Write → primary / leader</tspan>
<tspan x="929" dy="32">Replication often async</tspan>
<tspan x="929" dy="32">Read preference matters</tspan>
<tspan x="929" dy="32">Failover may expose lag</tspan>
</text>
<rect x="935" y="400" width="88" height="42" rx="13" fill="#E5F6F1" stroke="#0F8B78" stroke-width="1.4"/>
<text x="979.0" y="424" font-size="16" font-weight="bold" fill="#0F8B78" text-anchor="middle">Primary</text>
<text x="979.0" y="443" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">v</text>
<rect x="1052" y="400" width="88" height="42" rx="13" fill="#FFF3DD" stroke="#B96B08" stroke-width="1.4"/>
<text x="1096.0" y="424" font-size="16" font-weight="bold" fill="#B96B08" text-anchor="middle">Secondary</text>
<text x="1096.0" y="443" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">v-1</text>
<line x1="1023" y1="421" x2="1052" y2="421" stroke="#0F8B78" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-teal)"/>
<rect x="70" y="555" width="1060" height="60" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="70" y="555" width="7" height="60" rx="3" fill="#C63D4B"/>
<text x="88" y="583" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">READ THE CONTRACT, NOT THE PRODUCT LABEL</text>
<text x="88" y="607" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="88" dy="0">Pin version + topology + read mode + write concern + transaction isolation + failure assumptions.</tspan>
</text>
<line x1="28" y1="645" x2="1172" y2="645" stroke="#D7E0EC" stroke-width="1" stroke-linecap="round"/>
<text x="34" y="666" font-size="11" font-weight="muted" fill="#5F7188" text-anchor="start">Conceptual model — exact guarantees depend on protocol, configuration, and failure assumptions.</text>
</svg>