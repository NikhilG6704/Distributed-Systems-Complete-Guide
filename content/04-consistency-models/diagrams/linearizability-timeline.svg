<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Linearizability: operation intervals and real time">
<defs>
          <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
          <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8B78"/></marker>
          <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#24845B"/></marker>
          <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7652C8"/></marker>
          <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B96B08"/></marker>
          <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C63D4B"/></marker>
          <marker id="arr-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5F7188"/></marker>
          <style>
            text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#172B4D}
            .muted{fill:#5F7188}.bold{font-weight:700}.semibold{font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
          </style>
        </defs>
<rect x="0" y="0" width="1200" height="680" rx="0" fill="#F7F9FC"/>
<rect x="0" y="0" width="1200" height="82" rx="0" fill="#FFFFFF"/>
<text x="36" y="38" font-size="27" font-weight="bold" fill="#172B4D" text-anchor="start">Linearizability: operation intervals and real time</text>
<text x="36" y="64" font-size="14" font-weight="muted" fill="#5F7188" text-anchor="start">Every operation takes effect at one point inside its invocation–response interval; completed-before-started order is preserved.</text>
<line x1="28" y1="82" x2="1172" y2="82" stroke="#D7E0EC" stroke-width="1" stroke-linecap="round"/>
<text x="42" y="175" font-size="15" font-weight="semibold" fill="#172B4D" text-anchor="start">Client A · write x=1</text>
<line x1="290" y1="170" x2="1120" y2="170" stroke="#D7E0EC" stroke-width="2" stroke-linecap="round"/>
<text x="42" y="270" font-size="15" font-weight="semibold" fill="#172B4D" text-anchor="start">Client B · overlapping read</text>
<line x1="290" y1="265" x2="1120" y2="265" stroke="#D7E0EC" stroke-width="2" stroke-linecap="round"/>
<text x="42" y="365" font-size="15" font-weight="semibold" fill="#172B4D" text-anchor="start">Client C · later read</text>
<line x1="290" y1="360" x2="1120" y2="360" stroke="#D7E0EC" stroke-width="2" stroke-linecap="round"/>
<line x1="330" y1="170" x2="690" y2="170" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
<circle cx="510" cy="170" r="9" fill="#2563EB"/>
<text x="330" y="145" font-size="12" font-weight="muted" fill="#5F7188" text-anchor="start">invoke</text>
<text x="690" y="145" font-size="12" font-weight="muted" fill="#5F7188" text-anchor="end">response OK</text>
<text x="510" y="199" font-size="13" font-weight="bold" fill="#2563EB" text-anchor="middle">LP: write x=1</text>
<line x1="430" y1="265" x2="600" y2="265" stroke="#7652C8" stroke-width="8" stroke-linecap="round"/>
<circle cx="465" cy="265" r="8" fill="#7652C8"/>
<text x="430" y="240" font-size="12" font-weight="muted" fill="#5F7188" text-anchor="start">invoke</text>
<text x="600" y="240" font-size="12" font-weight="muted" fill="#5F7188" text-anchor="end">response 0</text>
<text x="465" y="294" font-size="13" font-weight="bold" fill="#7652C8" text-anchor="middle">LP: read x=0</text>
<line x1="760" y1="360" x2="970" y2="360" stroke="#0F8B78" stroke-width="8" stroke-linecap="round"/>
<circle cx="830" cy="360" r="8" fill="#0F8B78"/>
<text x="760" y="335" font-size="12" font-weight="muted" fill="#5F7188" text-anchor="start">invoke</text>
<text x="970" y="335" font-size="12" font-weight="muted" fill="#5F7188" text-anchor="end">response 1</text>
<text x="830" y="389" font-size="13" font-weight="bold" fill="#0F8B78" text-anchor="middle">LP: read x=1</text>
<line x1="690" y1="120" x2="760" y2="120" stroke="#C63D4B" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-red)"/>
<text x="725" y="108" font-size="12" font-weight="semibold" fill="#C63D4B" text-anchor="middle">real-time precedence</text>
<rect x="45" y="435" width="520" height="145" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="45" y="435" width="7" height="145" rx="3" fill="#24845B"/>
<text x="63" y="463" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">VALID LINEARIZATION</text>
<text x="63" y="487" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="63" dy="0">read B → write A → read C</tspan>
<tspan x="63" dy="18">B overlaps A, so it may be ordered first.</tspan>
<tspan x="63" dy="18">C starts after A completes, so C must see x=1.</tspan>
</text>
<rect x="600" y="435" width="550" height="145" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="600" y="435" width="7" height="145" rx="3" fill="#C63D4B"/>
<text x="618" y="463" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">INVALID HISTORY</text>
<text x="618" y="487" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="618" dy="0">If Client C returns x=0, the history is illegal.</tspan>
<tspan x="618" dy="18">A completed before C began; no legal sequential</tspan>
<tspan x="618" dy="18">order can place C before the write.</tspan>
</text>
<line x1="28" y1="645" x2="1172" y2="645" stroke="#D7E0EC" stroke-width="1" stroke-linecap="round"/>
<text x="34" y="666" font-size="11" font-weight="muted" fill="#5F7188" text-anchor="start">Conceptual model — exact guarantees depend on protocol, configuration, and failure assumptions.</text>
</svg>