<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Sequential consistency: one global order">
<defs>
          <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
          <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8B78"/></marker>
          <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#24845B"/></marker>
          <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7652C8"/></marker>
          <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B96B08"/></marker>
          <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C63D4B"/></marker>
          <marker id="arr-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5F7188"/></marker>
          <style>
            text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#172B4D}
            .muted{fill:#5F7188}.bold{font-weight:700}.semibold{font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
          </style>
        </defs>
<rect x="0" y="0" width="1200" height="680" rx="0" fill="#F7F9FC"/>
<rect x="0" y="0" width="1200" height="82" rx="0" fill="#FFFFFF"/>
<text x="36" y="38" font-size="27" font-weight="bold" fill="#172B4D" text-anchor="start">Sequential consistency: one global order</text>
<text x="36" y="64" font-size="14" font-weight="muted" fill="#5F7188" text-anchor="start">The serialization preserves each process’s program order, but need not preserve real-time order between different processes.</text>
<line x1="28" y1="82" x2="1172" y2="82" stroke="#D7E0EC" stroke-width="1" stroke-linecap="round"/>
<rect x="40" y="118" width="520" height="250" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="40" y="118" width="7" height="250" rx="3" fill="#2563EB"/>
<text x="58" y="146" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">PROCESS LANES · PROGRAM ORDER</text>
<text x="58" y="170" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="58" dy="0">P1:  W(x=1)  ─────▶  R(y)=0</tspan>
<tspan x="58" dy="18">P2:  W(y=1)  ─────▶  R(x)=1</tspan>
<tspan x="58" dy="18">Each process’s left-to-right order is fixed.</tspan>
<tspan x="58" dy="18">The system chooses one legal interleaving.</tspan>
</text>
<rect x="640" y="118" width="520" height="250" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="640" y="118" width="7" height="250" rx="3" fill="#0F8B78"/>
<text x="658" y="146" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">ONE GLOBAL SERIAL ORDER</text>
<text x="658" y="170" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="658" dy="0">1. P1: W(x=1)</tspan>
<tspan x="658" dy="18">2. P1: R(y)=0</tspan>
<tspan x="658" dy="18">3. P2: W(y=1)</tspan>
<tspan x="658" dy="18">4. P2: R(x)=1</tspan>
</text>
<line x1="560" y1="240" x2="630" y2="240" stroke="#7652C8" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-purple)"/>
<text x="595" y="220" font-size="12" font-weight="semibold" fill="#7652C8" text-anchor="middle">serialize</text>
<rect x="40" y="410" width="520" height="175" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="40" y="410" width="7" height="175" rx="3" fill="#B96B08"/>
<text x="58" y="438" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">SEQUENTIALLY CONSISTENT, NOT LINEARIZABLE</text>
<text x="58" y="462" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="58" dy="0">A: W(x=1) completes at 10:00:01.</tspan>
<tspan x="58" dy="18">B: R(x) starts at 10:00:02 and returns 0.</tspan>
<tspan x="58" dy="18">Global order may place B’s read before A’s write,</tspan>
<tspan x="58" dy="18">because there is no cross-process real-time rule.</tspan>
</text>
<rect x="640" y="410" width="520" height="175" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="640" y="410" width="7" height="175" rx="3" fill="#C63D4B"/>
<text x="658" y="438" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">WHY LINEARIZABILITY REJECTS IT</text>
<text x="658" y="462" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="658" dy="0">The write response precedes the read invocation.</tspan>
<tspan x="658" dy="18">Real-time precedence requires W before R.</tspan>
<tspan x="658" dy="18">Returning 0 contradicts the register specification.</tspan>
<tspan x="658" dy="18">There is one total order, not one per observer.</tspan>
</text>
<line x1="28" y1="645" x2="1172" y2="645" stroke="#D7E0EC" stroke-width="1" stroke-linecap="round"/>
<text x="34" y="666" font-size="11" font-weight="muted" fill="#5F7188" text-anchor="start">Conceptual model — exact guarantees depend on protocol, configuration, and failure assumptions.</text>
</svg>