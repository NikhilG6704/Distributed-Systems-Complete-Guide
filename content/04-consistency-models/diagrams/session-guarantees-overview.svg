<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Session guarantees: local order carried by a token">
<defs>
          <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
          <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8B78"/></marker>
          <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#24845B"/></marker>
          <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7652C8"/></marker>
          <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B96B08"/></marker>
          <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C63D4B"/></marker>
          <marker id="arr-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5F7188"/></marker>
          <style>
            text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#172B4D}
            .muted{fill:#5F7188}.bold{font-weight:700}.semibold{font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
          </style>
        </defs>
<rect x="0" y="0" width="1200" height="680" rx="0" fill="#F7F9FC"/>
<rect x="0" y="0" width="1200" height="82" rx="0" fill="#FFFFFF"/>
<text x="36" y="38" font-size="27" font-weight="bold" fill="#172B4D" text-anchor="start">Session guarantees: local order carried by a token</text>
<text x="36" y="64" font-size="14" font-weight="muted" fill="#5F7188" text-anchor="start">A client token transports the minimum version and causal dependencies across requests and replicas.</text>
<line x1="28" y1="82" x2="1172" y2="82" stroke="#D7E0EC" stroke-width="1" stroke-linecap="round"/>
<rect x="60" y="145" width="210" height="82" rx="13" fill="#EAF1FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="165.0" y="169" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">READ</text>
<text x="165.0" y="188" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">observed v12</text>
<line x1="270" y1="186" x2="315" y2="186" stroke="#52657D" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-slate)"/>
<rect x="325" y="145" width="210" height="82" rx="13" fill="#E5F6F1" stroke="#0F8B78" stroke-width="1.4"/>
<text x="430.0" y="169" font-size="16" font-weight="bold" fill="#0F8B78" text-anchor="middle">WRITE</text>
<text x="430.0" y="188" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">created v18</text>
<line x1="535" y1="186" x2="580" y2="186" stroke="#52657D" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-slate)"/>
<rect x="590" y="145" width="210" height="82" rx="13" fill="#F0EBFB" stroke="#7652C8" stroke-width="1.4"/>
<text x="695.0" y="169" font-size="16" font-weight="bold" fill="#7652C8" text-anchor="middle">READ</text>
<text x="695.0" y="188" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">min version v18</text>
<line x1="800" y1="186" x2="845" y2="186" stroke="#52657D" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-slate)"/>
<rect x="855" y="145" width="210" height="82" rx="13" fill="#FFF3DD" stroke="#B96B08" stroke-width="1.4"/>
<text x="960.0" y="169" font-size="16" font-weight="bold" fill="#B96B08" text-anchor="middle">WRITE</text>
<text x="960.0" y="188" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">depends on read</text>
<rect x="90" y="275" width="970" height="58" rx="12" fill="#20344F"/>
<text x="120" y="310" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="start">SESSION TOKEN</text>
<text x="280" y="310" font-size="15" font-weight="semibold" fill="#FFFFFF" text-anchor="start">max_seen_version = 18   ·   dependency = W1 / R12</text>
<line x1="165" y1="227" x2="165" y2="275" stroke="#2563EB" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<line x1="430" y1="227" x2="430" y2="275" stroke="#0F8B78" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-teal)"/>
<line x1="695" y1="227" x2="695" y2="275" stroke="#7652C8" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-purple)"/>
<line x1="960" y1="227" x2="960" y2="275" stroke="#B96B08" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-amber)"/>
<rect x="45" y="390" width="255" height="160" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="45" y="390" width="7" height="160" rx="3" fill="#2563EB"/>
<text x="63" y="418" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">READ-YOUR-WRITES</text>
<text x="63" y="442" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="63" dy="0">Carry the version of this</tspan>
<tspan x="63" dy="18">session’s last successful write</tspan>
<tspan x="63" dy="18">into the next read.</tspan>
</text>
<rect x="330" y="390" width="255" height="160" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="330" y="390" width="7" height="160" rx="3" fill="#7652C8"/>
<text x="348" y="418" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">MONOTONIC READS</text>
<text x="348" y="442" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="348" dy="0">Carry the highest version</tspan>
<tspan x="348" dy="18">already observed; never step</tspan>
<tspan x="348" dy="18">backward in the session.</tspan>
</text>
<rect x="615" y="390" width="255" height="160" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="615" y="390" width="7" height="160" rx="3" fill="#0F8B78"/>
<text x="633" y="418" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">MONOTONIC WRITES</text>
<text x="633" y="442" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="633" dy="0">Chain writes in program order;</tspan>
<tspan x="633" dy="18">do not apply W2 before W1.</tspan>
</text>
<rect x="900" y="390" width="255" height="160" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="900" y="390" width="7" height="160" rx="3" fill="#B96B08"/>
<text x="918" y="418" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">WRITES-FOLLOW-READS</text>
<text x="918" y="442" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="918" dy="0">Carry the read dependency</tspan>
<tspan x="918" dy="18">into a write based on what</tspan>
<tspan x="918" dy="18">the user observed.</tspan>
</text>
<text x="600" y="590" font-size="14" font-weight="bold" fill="#5F7188" text-anchor="middle">These constrain one session; they do not impose one global order on every user.</text>
<line x1="28" y1="645" x2="1172" y2="645" stroke="#D7E0EC" stroke-width="1" stroke-linecap="round"/>
<text x="34" y="666" font-size="11" font-weight="muted" fill="#5F7188" text-anchor="start">Conceptual model — exact guarantees depend on protocol, configuration, and failure assumptions.</text>
</svg>