<text x="132.5" y="348" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">v10</text>
<rect x="70" y="390" width="125" height="56" rx="13" fill="#EDF1F6" stroke="#52657D" stroke-width="1.4"/>
<text x="132.5" y="414" font-size="16" font-weight="bold" fill="#52657D" text-anchor="middle">Node C</text>
<text x="132.5" y="433" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">v10</text>
