<text x="400" y="282" font-size="11" font-weight="semibold" fill="#2563EB" text-anchor="middle">write</text>
<text x="785" y="282" font-size="11" font-weight="semibold" fill="#0F8B78" text-anchor="middle">repair</text>
<rect x="65" y="510" width="325" height="105" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
