<text x="892.5" y="263" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">v11</text>
<rect x="830" y="305" width="125" height="56" rx="13" fill="#E5F6F1" stroke="#0F8B78" stroke-width="1.4"/>
<text x="892.5" y="329" font-size="16" font-weight="bold" fill="#0F8B78" text-anchor="middle">Node B</text>
<text x="892.5" y="348" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">v11</text>
