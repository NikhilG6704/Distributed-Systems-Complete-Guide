<text x="512.5" y="329" font-size="16" font-weight="bold" fill="#52657D" text-anchor="middle">Node B</text>
<text x="512.5" y="348" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">v10</text>
