<text x="83" y="538" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">WRITE ACKNOWLEDGED</text>
<text x="83" y="562" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="83" dy="0">Node A returns success at v11.</tspan>
</text>
<rect x="440" y="510" width="325" height="105" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="440" y="510" width="7" height="105" rx="3" fill="#B96B08"/>
<text x="458" y="538" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">STALE READ PERMITTED</text>
<text x="458" y="562" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="458" dy="0">B or C may still return v10.</tspan>
</text>
<rect x="815" y="510" width="325" height="105" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="815" y="510" width="7" height="105" rx="3" fill="#24845B"/>
<text x="833" y="538" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">CONVERGENCE CONDITION</text>
<text x="833" y="562" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="833" dy="0">No new writes + delivery/repair succeeds.</tspan>
</text>
<line x1="28" y1="645" x2="1172" y2="645" stroke="#D7E0EC" stroke-width="1" stroke-linecap="round"/>
<text x="34" y="666" font-size="11" font-weight="muted" fill="#5F7188" text-anchor="start">Conceptual model — exact guarantees depend on protocol, configuration, and failure assumptions.</text>
