<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="PACELC: trade-offs during and outside partitions">
<defs>
          <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
          <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8B78"/></marker>
          <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#24845B"/></marker>
          <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7652C8"/></marker>
          <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B96B08"/></marker>
          <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C63D4B"/></marker>
          <marker id="arr-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5F7188"/></marker>
          <style>
            text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#172B4D}
            .muted{fill:#5F7188}.bold{font-weight:700}.semibold{font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
          </style>
        </defs>
<rect x="0" y="0" width="1200" height="680" rx="0" fill="#F7F9FC"/>
<rect x="0" y="0" width="1200" height="82" rx="0" fill="#FFFFFF"/>
<text x="36" y="38" font-size="27" font-weight="bold" fill="#172B4D" text-anchor="start">PACELC: trade-offs during and outside partitions</text>
<text x="36" y="64" font-size="14" font-weight="muted" fill="#5F7188" text-anchor="start">Partition → Availability or Consistency; Else → Latency or Consistency. These are analytical design tendencies, not fixed vendor labels.</text>
<line x1="28" y1="82" x2="1172" y2="82" stroke="#D7E0EC" stroke-width="1" stroke-linecap="round"/>
<rect x="480" y="112" width="240" height="65" rx="13" fill="#EAF1FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="600.0" y="136" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">Network state</text>
<text x="600.0" y="155" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">Partition?</text>
<line x1="540" y1="177" x2="300" y2="245" stroke="#C63D4B" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-red)"/>
<line x1="660" y1="177" x2="900" y2="245" stroke="#0F8B78" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-teal)"/>
<text x="365" y="205" font-size="13" font-weight="bold" fill="#C63D4B" text-anchor="middle">YES · P</text>
<text x="830" y="205" font-size="13" font-weight="bold" fill="#0F8B78" text-anchor="middle">NO · E / ELSE</text>
<rect x="95" y="245" width="300" height="65" rx="13" fill="#FFF3DD" stroke="#B96B08" stroke-width="1.4"/>
<text x="245.0" y="269" font-size="16" font-weight="bold" fill="#B96B08" text-anchor="middle">PA · Availability</text>
<text x="245.0" y="288" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">Serve local requests</text>
<rect x="405" y="245" width="300" height="65" rx="13" fill="#EAF1FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="555.0" y="269" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">PC · Consistency</text>
<text x="555.0" y="288" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">Wait / reject unsafe work</text>
<rect x="715" y="245" width="300" height="65" rx="13" fill="#FFF3DD" stroke="#B96B08" stroke-width="1.4"/>
<text x="865.0" y="269" font-size="16" font-weight="bold" fill="#B96B08" text-anchor="middle">EL · Latency</text>
<text x="865.0" y="288" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">Prefer local fast path</text>
<rect x="1025" y="245" width="140" height="65" rx="13" fill="#EAF1FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="1095.0" y="269" font-size="16" font-weight="bold" fill="#2563EB" text-anchor="middle">EC · Consistency</text>
<text x="1095.0" y="288" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">coordinate</text>
<rect x="55" y="365" width="255" height="170" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="55" y="365" width="7" height="170" rx="3" fill="#B96B08"/>
<text x="73" y="393" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">PA / EL</text>
<text x="73" y="417" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="73" dy="0">Partition: keep local service up.</tspan>
<tspan x="73" dy="18">Healthy: avoid WAN coordination</tspan>
<tspan x="73" dy="18">for lower latency.</tspan>
<tspan x="73" dy="18">Example pattern: async multi-writer</tspan>
<tspan x="73" dy="18">with local reads.</tspan>
</text>
<rect x="335" y="365" width="255" height="170" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="335" y="365" width="7" height="170" rx="3" fill="#2563EB"/>
<text x="353" y="393" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">PC / EC</text>
<text x="353" y="417" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="353" dy="0">Partition: require quorum/leader.</tspan>
<tspan x="353" dy="18">Healthy: coordinate for fresh order.</tspan>
<tspan x="353" dy="18">Example pattern: consensus-backed</tspan>
<tspan x="353" dy="18">replicated state machine.</tspan>
</text>
<rect x="615" y="365" width="255" height="170" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="615" y="365" width="7" height="170" rx="3" fill="#7652C8"/>
<text x="633" y="393" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">PA / EC</text>
<text x="633" y="417" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="633" dy="0">Partition: favor local service.</tspan>
<tspan x="633" dy="18">Healthy: pay coordination for</tspan>
<tspan x="633" dy="18">consistency on selected paths.</tspan>
<tspan x="633" dy="18">Can vary by operation/API.</tspan>
</text>
<rect x="895" y="365" width="255" height="170" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="895" y="365" width="7" height="170" rx="3" fill="#0F8B78"/>
<text x="913" y="393" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">PC / EL</text>
<text x="913" y="417" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="913" dy="0">Partition: refuse unsafe writes.</tspan>
<tspan x="913" dy="18">Healthy: use local/lease/read paths</tspan>
<tspan x="913" dy="18">where correctness permits.</tspan>
<tspan x="913" dy="18">Not a guarantee that all requests</tspan>
<tspan x="913" dy="18">are always low latency.</tspan>
</text>
<text x="600" y="590" font-size="13" font-weight="semibold" fill="#5F7188" text-anchor="middle">Per-operation settings, topology, and failure mode can place different requests on different branches.</text>
<line x1="28" y1="645" x2="1172" y2="645" stroke="#D7E0EC" stroke-width="1" stroke-linecap="round"/>
<text x="34" y="666" font-size="11" font-weight="muted" fill="#5F7188" text-anchor="start">Conceptual model — exact guarantees depend on protocol, configuration, and failure assumptions.</text>
</svg>