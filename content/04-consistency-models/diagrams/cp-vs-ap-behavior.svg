<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="CP vs. AP behavior during a three-node partition">
<defs>
          <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
          <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F8B78"/></marker>
          <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#24845B"/></marker>
          <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7652C8"/></marker>
          <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B96B08"/></marker>
          <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C63D4B"/></marker>
          <marker id="arr-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5F7188"/></marker>
          <style>
            text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;fill:#172B4D}
            .muted{fill:#5F7188}.bold{font-weight:700}.semibold{font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
          </style>
        </defs>
<rect x="0" y="0" width="1200" height="680" rx="0" fill="#F7F9FC"/>
<rect x="0" y="0" width="1200" height="82" rx="0" fill="#FFFFFF"/>
<text x="36" y="38" font-size="27" font-weight="bold" fill="#172B4D" text-anchor="start">CP vs. AP behavior during a three-node partition</text>
<text x="36" y="64" font-size="14" font-weight="muted" fill="#5F7188" text-anchor="start">CP preserves the agreed history by refusing unsafe minority operations; AP may serve both sides and reconcile divergent updates later.</text>
<line x1="28" y1="82" x2="1172" y2="82" stroke="#D7E0EC" stroke-width="1" stroke-linecap="round"/>
<rect x="45" y="125" width="530" height="460" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="45" y="125" width="7" height="460" rx="3" fill="#2563EB"/>
<text x="63" y="153" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">CP · SAFE MAJORITY PROGRESS</text>
<text x="63" y="177" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="63" dy="0">Partition: A | B—C</tspan>
<tspan x="63" dy="18">A (minority): no quorum → reject / wait.</tspan>
<tspan x="63" dy="18">B+C: commit W1 in the replicated log.</tspan>
<tspan x="63" dy="18">After healing: A catches up to committed log.</tspan>
<tspan x="63" dy="18">Consistency preserved; minority availability reduced.</tspan>
</text>
<rect x="100" y="325" width="110" height="55" rx="13" fill="#FCEBED" stroke="#C63D4B" stroke-width="1.4"/>
<text x="155.0" y="349" font-size="16" font-weight="bold" fill="#C63D4B" text-anchor="middle">A</text>
<text x="155.0" y="368" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">minority</text>
<rect x="390" y="325" width="110" height="55" rx="13" fill="#E5F6F1" stroke="#0F8B78" stroke-width="1.4"/>
<text x="445.0" y="349" font-size="16" font-weight="bold" fill="#0F8B78" text-anchor="middle">B + C</text>
<text x="445.0" y="368" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">majority</text>
<line x1="210" y1="352" x2="390" y2="352" stroke="#2563EB" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<rect x="85" y="405" width="140" height="27" rx="13" fill="#FCEBED"/>
<text x="155.0" y="423" font-size="12" font-weight="semibold" fill="#C63D4B" text-anchor="middle">reject / wait</text>
<rect x="375" y="405" width="140" height="27" rx="13" fill="#E7F5ED"/>
<text x="445.0" y="423" font-size="12" font-weight="semibold" fill="#24845B" text-anchor="middle">commit W1</text>
<line x1="150" y1="250" x2="150" y2="325" stroke="#C63D4B" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="445" y1="250" x2="445" y2="325" stroke="#0F8B78" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-teal)"/>
<rect x="625" y="125" width="530" height="460" rx="14" fill="#FFFFFF" stroke="#D7E0EC" stroke-width="1"/>
<rect x="625" y="125" width="7" height="460" rx="3" fill="#B96B08"/>
<text x="643" y="153" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="start">AP · LOCAL SERVICE + RECONCILIATION</text>
<text x="643" y="177" font-size="13" font-weight="normal" fill="#5F7188" text-anchor="start">
<tspan x="643" dy="0">Partition: A | B—C</tspan>
<tspan x="643" dy="18">A accepts W1; B+C accept W2 independently.</tspan>
<tspan x="643" dy="18">Local reads return each side’s current view.</tspan>
<tspan x="643" dy="18">After healing: exchange versions and merge.</tspan>
<tspan x="643" dy="18">Availability favored; conflicts need a policy.</tspan>
</text>
<rect x="680" y="325" width="110" height="55" rx="13" fill="#FFF3DD" stroke="#B96B08" stroke-width="1.4"/>
<text x="735.0" y="349" font-size="16" font-weight="bold" fill="#B96B08" text-anchor="middle">A</text>
<text x="735.0" y="368" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">W1 · blue</text>
<rect x="970" y="325" width="110" height="55" rx="13" fill="#FFF3DD" stroke="#B96B08" stroke-width="1.4"/>
<text x="1025.0" y="349" font-size="16" font-weight="bold" fill="#B96B08" text-anchor="middle">B + C</text>
<text x="1025.0" y="368" font-size="12" font-weight="normal" fill="#5F7188" text-anchor="middle">W2 · green</text>
<line x1="790" y1="352" x2="970" y2="352" stroke="#B96B08" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-amber)"/>
<rect x="665" y="405" width="140" height="27" rx="13" fill="#FFF3DD"/>
<text x="735.0" y="423" font-size="12" font-weight="semibold" fill="#B96B08" text-anchor="middle">accept W1</text>
<rect x="955" y="405" width="140" height="27" rx="13" fill="#FFF3DD"/>
<text x="1025.0" y="423" font-size="12" font-weight="semibold" fill="#B96B08" text-anchor="middle">accept W2</text>
<line x1="730" y1="250" x2="730" y2="325" stroke="#B96B08" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-amber)"/>
<line x1="1020" y1="250" x2="1020" y2="325" stroke="#B96B08" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-amber)"/>
<text x="600" y="610" font-size="12" font-weight="semibold" fill="#5F7188" text-anchor="middle">AP convergence still requires durable propagation, conflict resolution, and repair; CP does not mean every node is unavailable.</text>
<line x1="28" y1="645" x2="1172" y2="645" stroke="#D7E0EC" stroke-width="1" stroke-linecap="round"/>
<text x="34" y="666" font-size="11" font-weight="muted" fill="#5F7188" text-anchor="start">Conceptual model — exact guarantees depend on protocol, configuration, and failure assumptions.</text>
</svg>