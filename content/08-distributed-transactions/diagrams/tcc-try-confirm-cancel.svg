<text x="800" y="585" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" fill="#14263D" font-weight="700" text-anchor="middle" font-style="normal">YES → Confirm all   |   NO / timeout → Cancel all</text>
