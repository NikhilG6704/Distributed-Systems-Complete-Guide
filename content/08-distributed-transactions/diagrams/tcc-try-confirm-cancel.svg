<text x="54" y="875" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#62758A" font-weight="400" text-anchor="start" font-style="normal">Participants must handle idempotency, empty rollback, reservation expiry, and hanging Try/Confirm/Cancel outcomes.</text>
