<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">TCC: Try, Confirm, Cancel</title><desc id="desc">Participants reserve resources during Try. The coordinator then confirms all reservations or cancels them.</desc>
<rect width="1600" height="900" fill="#F7F9FC"/>
<text x="54" y="62" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="34" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">TCC: Try, Confirm, Cancel</text>
<text x="54" y="100" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" fill="#62758A" font-weight="400" text-anchor="start" font-style="normal">Participants reserve resources during Try. The coordinator then confirms all reservations or cancels them.</text>
<line x1="54" y1="126" x2="1546" y2="126" stroke="#C9D4DF" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
