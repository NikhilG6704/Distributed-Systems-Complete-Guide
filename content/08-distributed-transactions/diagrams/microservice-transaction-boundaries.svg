<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830" role="img" aria-labelledby="title desc">
<title id="title">Microservice transaction boundaries</title><desc id="desc">Each service commits only its own database transaction. Messages connect workflows but do not merge local commit logs.</desc>
