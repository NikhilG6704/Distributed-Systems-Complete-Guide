<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
<title id="title">Spanner-style distributed transaction</title><desc id="desc">A transaction spans Paxos-replicated groups; 2PC coordinates participants while TrueTime uncertainty informs commit timestamp and commit wait.</desc>
