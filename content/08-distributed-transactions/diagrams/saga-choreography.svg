<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
<title id="title">Saga choreography</title><desc id="desc">Services react to domain events and publish the next event. Failure is propagated through compensating events.</desc>
