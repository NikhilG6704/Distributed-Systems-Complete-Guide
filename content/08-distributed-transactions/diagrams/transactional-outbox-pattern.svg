<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">Transactional Outbox pattern</title><desc id="desc">Business state and an event record are committed atomically in one local database transaction; a relay publishes later.</desc>
<rect width="1600" height="820" fill="#F7F9FC"/>
<text x="54" y="62" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="34" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Transactional Outbox pattern</text>
<text x="54" y="100" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" fill="#62758A" font-weight="400" text-anchor="start" font-style="normal">Business state and an event record are committed atomically in one local database transaction; a relay publishes later.</text>
<line x1="54" y1="126" x2="1546" y2="126" stroke="#C9D4DF" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<defs>
<marker id="arr-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2867B2"/></marker>
<marker id="arr-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#167B70"/></marker>
<marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#B63C43"/></marker>
<marker id="arr-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#A76512"/></marker>
<marker id="arr-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#62758A"/></marker>
<marker id="arr-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#6D55A5"/></marker>
</defs>
<rect x="70" y="250" width="210" height="90" rx="14" fill="#FFFFFF" stroke="#C9D4DF" stroke-width="2"/>
<text x="88" y="281" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="19" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Application</text>
<text x="88" y="310" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="16" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Create order</text>
<rect x="365" y="185" width="440" height="300" rx="18" fill="none" stroke="#2867B2" stroke-width="2" stroke-dasharray="8 6"/>
<text x="585" y="220" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#2867B2" font-weight="600" text-anchor="middle" font-style="normal">ONE LOCAL DATABASE TRANSACTION</text>
<rect x="405" y="260" width="165" height="90" rx="14" fill="#EAF2FC" stroke="#2867B2" stroke-width="2"/>
<text x="423" y="291" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Orders table</text>
<text x="423" y="320" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">INSERT order</text>
<rect x="600" y="260" width="165" height="90" rx="14" fill="#E7F5F2" stroke="#167B70" stroke-width="2"/>
<text x="618" y="291" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Outbox table</text>
<text x="618" y="320" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">INSERT event</text>
<line x1="280" y1="295" x2="405" y2="295" stroke="#2867B2" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<line x1="570" y1="305" x2="600" y2="305" stroke="#167B70" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-teal)"/>
<text x="585" y="425" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="16" fill="#167B70" font-weight="700" text-anchor="middle" font-style="normal">COMMIT both rows together</text>
<rect x="900" y="250" width="205" height="100" rx="14" fill="#F1EDFA" stroke="#6D55A5" stroke-width="2"/>
<text x="918" y="281" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Relay / CDC</text>
<text x="918" y="310" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Read committed outbox</text>
<line x1="805" y1="305" x2="900" y2="305" stroke="#6D55A5" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-purple)"/>
<rect x="1220" y="250" width="260" height="100" rx="14" fill="#EAF2FC" stroke="#2867B2" stroke-width="2"/>
<text x="1238" y="281" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Message broker</text>
<text x="1238" y="310" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Publish event</text>
<line x1="1105" y1="300" x2="1220" y2="300" stroke="#2867B2" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<rect x="900" y="540" width="250" height="105" rx="14" fill="#E7F5F2" stroke="#167B70" stroke-width="2"/>
<text x="918" y="571" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Consumer</text>
<text x="918" y="600" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Deduplicate by event ID</text>
<text x="918" y="623" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Apply local transaction</text>
<line x1="1350" y1="350" x2="1025" y2="540" stroke="#167B70" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-teal)"/>
<rect x="70" y="600" width="300" height="32" rx="16" fill="#FFF3DF" stroke="#A76512" stroke-width="1"/>
<text x="220.0" y="622.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#A76512" font-weight="700" text-anchor="middle" font-style="normal">Crash after publish → duplicate possible</text>
<rect x="420" y="600" width="300" height="32" rx="16" fill="#EAF2FC" stroke="#2867B2" stroke-width="1"/>
<text x="570.0" y="622.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#2867B2" font-weight="700" text-anchor="middle" font-style="normal">At-least-once relay</text>
<rect x="770" y="700" width="300" height="32" rx="16" fill="#E7F5F2" stroke="#167B70" stroke-width="1"/>
<text x="920.0" y="722.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#167B70" font-weight="700" text-anchor="middle" font-style="normal">Idempotent consumer</text>
<rect x="1120" y="700" width="300" height="32" rx="16" fill="#F1EDFA" stroke="#6D55A5" stroke-width="1"/>
<text x="1270.0" y="722.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#6D55A5" font-weight="700" text-anchor="middle" font-style="normal">Monitor outbox lag</text>
<line x1="54" y1="766" x2="1546" y2="766" stroke="#C9D4DF" stroke-width="1" stroke-linecap="round"/>
<text x="54" y="795" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#62758A" font-weight="400" text-anchor="start" font-style="normal">Outbox closes the database-to-broker dual-write gap; it does not make arbitrary downstream side effects exactly once.</text>
</svg>