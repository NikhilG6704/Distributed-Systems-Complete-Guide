<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">Transaction anomalies: recognize the schedule</title><desc id="desc">Compact schedules use R=read, W=write, C=commit, A=abort. Each panel shows a distinct failure pattern.</desc>
