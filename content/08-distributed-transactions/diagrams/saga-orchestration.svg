<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Saga orchestration</title><desc id="desc">A durable orchestrator executes local transactions and issues compensations in reverse business order when a later step fails.</desc>
