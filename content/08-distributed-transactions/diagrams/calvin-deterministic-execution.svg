<text x="718" y="525" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="16" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">T41: lock B</text>
<text x="718" y="549" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="16" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">T42: no-op</text>
<text x="718" y="573" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="16" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">T43: update C</text>
<line x1="625" y1="320" x2="825" y2="465" stroke="#2867B2" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<rect x="1180" y="465" width="250" height="220" rx="14" fill="#EAF2FC" stroke="#2867B2" stroke-width="2"/>
<text x="1198" y="496" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="19" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Partition 3</text>
<text x="1198" y="525" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="16" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">T41: no-op</text>
<text x="1198" y="549" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="16" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">T42: lock SKU</text>
<text x="1198" y="573" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="16" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">T43: no-op</text>
<line x1="625" y1="320" x2="1305" y2="465" stroke="#2867B2" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<rect x="80" y="740" width="320" height="32" rx="16" fill="#F1EDFA" stroke="#6D55A5" stroke-width="1"/>
<text x="240.0" y="762.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#6D55A5" font-weight="700" text-anchor="middle" font-style="normal">Same input order at all replicas</text>
<rect x="470" y="740" width="320" height="32" rx="16" fill="#EAF2FC" stroke="#2867B2" stroke-width="1"/>
<text x="630.0" y="762.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#2867B2" font-weight="700" text-anchor="middle" font-style="normal">Deterministic lock ordering</text>
<rect x="860" y="740" width="320" height="32" rx="16" fill="#E7F5F2" stroke="#167B70" stroke-width="1"/>
<text x="1020.0" y="762.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#167B70" font-weight="700" text-anchor="middle" font-style="normal">Less runtime commit coordination</text>
<rect x="1250" y="740" width="260" height="32" rx="16" fill="#FFF3DF" stroke="#A76512" stroke-width="1"/>
<text x="1380.0" y="762.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#A76512" font-weight="700" text-anchor="middle" font-style="normal">Requires deterministic logic</text>
<line x1="54" y1="796" x2="1546" y2="796" stroke="#C9D4DF" stroke-width="1" stroke-linecap="round"/>
<text x="54" y="825" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#62758A" font-weight="400" text-anchor="start" font-style="normal">Determinism shifts coordination earlier; nondeterministic reads, external calls, and unpredictable transaction logic require special handling.</text>
</svg>