<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
<title id="title">Isolation levels: visibility and conflict behavior</title><desc id="desc">Same business story, three different concurrency outcomes. T1 reads an account and T2 updates it.</desc>
