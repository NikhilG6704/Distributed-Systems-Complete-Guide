<line x1="1100" y1="500" x2="1330" y2="500" stroke="#6D55A5" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-purple)"/>
<path d="M1100 500 L1100 420" fill="none" stroke="#6D55A5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-purple)"/>
