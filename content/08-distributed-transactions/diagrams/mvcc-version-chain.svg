<text x="1155.0" y="547.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#6D55A5" font-weight="700" text-anchor="middle" font-style="normal">New T sees v3 = 650</text>
<rect x="80" y="625" width="1440" height="120" rx="20" fill="#FFFFFF" stroke="#C9D4DF" stroke-width="2"/>
<text x="102" y="661" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="22" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">VERSION CLEANUP / VACUUM</text>
<text x="102" y="688" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#62758A" font-weight="400" text-anchor="start" font-style="normal">Versions older than every active snapshot may become reclaimable; long-running snapshots can delay cleanup.</text>
<rect x="115" y="680" width="255" height="32" rx="16" fill="#FFF3DF" stroke="#A76512" stroke-width="1"/>
<text x="242.5" y="702.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#A76512" font-weight="700" text-anchor="middle" font-style="normal">Oldest active snapshot</text>
<line x1="370" y1="696" x2="540" y2="696" stroke="#A76512" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-amber)"/>
<rect x="555" y="680" width="245" height="32" rx="16" fill="#E7F5F2" stroke="#167B70" stroke-width="1"/>
<text x="677.5" y="702.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#167B70" font-weight="700" text-anchor="middle" font-style="normal">Safe-to-reclaim horizon</text>
<line x1="800" y1="696" x2="985" y2="696" stroke="#167B70" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-teal)"/>
<rect x="1000" y="680" width="280" height="32" rx="16" fill="#EAF2FC" stroke="#2867B2" stroke-width="1"/>
<text x="1140.0" y="702.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#2867B2" font-weight="700" text-anchor="middle" font-style="normal">Garbage collection</text>
<line x1="54" y1="766" x2="1546" y2="766" stroke="#C9D4DF" stroke-width="1" stroke-linecap="round"/>
<text x="54" y="795" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#62758A" font-weight="400" text-anchor="start" font-style="normal">MVCC is a concurrency-control/storage technique; the isolation guarantee depends on the engine and validation rules.</text>
</svg>