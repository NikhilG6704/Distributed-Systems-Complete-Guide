<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Percolator-style optimistic transaction protocol</title><desc id="desc">A start timestamp defines the snapshot; prewrite installs locks; committing the primary record establishes transaction status.</desc>
<rect width="1600" height="900" fill="#F7F9FC"/>
<text x="54" y="62" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="34" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Percolator-style optimistic transaction protocol</text>
<text x="54" y="100" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" fill="#62758A" font-weight="400" text-anchor="start" font-style="normal">A start timestamp defines the snapshot; prewrite installs locks; committing the primary record establishes transaction status.</text>
<line x1="54" y1="126" x2="1546" y2="126" stroke="#C9D4DF" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<defs>
<marker id="arr-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2867B2"/></marker>
<marker id="arr-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#167B70"/></marker>
<marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#B63C43"/></marker>
<marker id="arr-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#A76512"/></marker>
<marker id="arr-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#62758A"/></marker>
<marker id="arr-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#6D55A5"/></marker>
</defs>
<rect x="70" y="205" width="230" height="100" rx="14" fill="#F1EDFA" stroke="#6D55A5" stroke-width="2"/>
<text x="88" y="236" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Timestamp oracle</text>
<text x="88" y="265" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Allocate start TS</text>
<text x="88" y="288" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Allocate commit TS</text>
<rect x="405" y="205" width="230" height="100" rx="14" fill="#FFFFFF" stroke="#C9D4DF" stroke-width="2"/>
<text x="423" y="236" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Transaction client</text>
<text x="423" y="265" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Read snapshot</text>
<text x="423" y="288" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Compute writes</text>
<line x1="300" y1="255" x2="405" y2="255" stroke="#6D55A5" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-purple)"/>
<line x1="635" y1="255" x2="760" y2="255" stroke="#2867B2" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<rect x="760" y="165" width="760" height="400" rx="18" fill="none" stroke="#2867B2" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1140" y="200" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#2867B2" font-weight="600" text-anchor="middle" font-style="normal">DISTRIBUTED STORAGE LOCATIONS</text>
<rect x="800" y="240" width="270" height="120" rx="14" fill="#E7F5F2" stroke="#167B70" stroke-width="2"/>
<text x="818" y="271" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="19" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Primary key</text>
<text x="818" y="300" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Prewrite + primary lock</text>
<text x="818" y="323" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Commit primary record</text>
<rect x="1160" y="240" width="300" height="120" rx="14" fill="#EAF2FC" stroke="#2867B2" stroke-width="2"/>
<text x="1178" y="271" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="19" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Secondary keys</text>
<text x="1178" y="300" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Prewrite + secondary locks</text>
<text x="1178" y="323" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Resolve after primary commit</text>
<line x1="1070" y1="300" x2="1160" y2="300" stroke="#2867B2" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<rect x="815" y="420" width="230" height="32" rx="16" fill="#E7F5F2" stroke="#167B70" stroke-width="1"/>
<text x="930.0" y="442.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#167B70" font-weight="700" text-anchor="middle" font-style="normal">Primary status = COMMITTED</text>
<rect x="1180" y="420" width="240" height="32" rx="16" fill="#EAF2FC" stroke="#2867B2" stroke-width="1"/>
<text x="1300.0" y="442.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#2867B2" font-weight="700" text-anchor="middle" font-style="normal">Secondary lock cleanup</text>
<line x1="935" y1="360" x2="935" y2="420" stroke="#167B70" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-teal)"/>
<line x1="1310" y1="360" x2="1310" y2="420" stroke="#2867B2" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<rect x="400" y="650" width="300" height="105" rx="14" fill="#FFF3DF" stroke="#A76512" stroke-width="2"/>
<text x="418" y="681" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Reader encounters lock</text>
<text x="418" y="710" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Consult primary status</text>
<text x="418" y="733" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Commit / wait / rollback</text>
<rect x="810" y="650" width="300" height="105" rx="14" fill="#F1EDFA" stroke="#6D55A5" stroke-width="2"/>
<text x="828" y="681" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Coordinator recovery</text>
<text x="828" y="710" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Primary record is authority</text>
<text x="828" y="733" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Resolve remaining locks</text>
<rect x="1210" y="650" width="300" height="105" rx="14" fill="#FCEBED" stroke="#B63C43" stroke-width="2"/>
<text x="1228" y="681" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Conflict detection</text>
<text x="1228" y="710" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Write conflict / older TS</text>
<text x="1228" y="733" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Abort or retry</text>
<line x1="930" y1="565" x2="550" y2="650" stroke="#A76512" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-amber)"/>
<line x1="1070" y1="565" x2="960" y2="650" stroke="#6D55A5" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-purple)"/>
<line x1="1330" y1="565" x2="1360" y2="650" stroke="#B63C43" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-red)"/>
<line x1="54" y1="846" x2="1546" y2="846" stroke="#C9D4DF" stroke-width="1" stroke-linecap="round"/>
<text x="54" y="875" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#62758A" font-weight="400" text-anchor="start" font-style="normal">Conceptual Percolator lineage: modern TiDB transaction behavior is related but should not be assumed identical in every detail.</text>
</svg>