<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Two-Phase Commit (2PC)</title><desc id="desc">Coordinator collects durable YES/NO votes, records one global decision, then distributes that decision to all participants.</desc>
