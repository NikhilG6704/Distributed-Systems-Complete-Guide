<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="810" viewBox="0 0 1600 810" role="img" aria-labelledby="title desc">
<title id="title">Pessimistic locking vs optimistic validation</title><desc id="desc">Two clients update the same seat. One strategy waits before writing; the other detects a version conflict and retries.</desc>
<rect width="1600" height="810" fill="#F7F9FC"/>
<text x="54" y="62" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="34" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Pessimistic locking vs optimistic validation</text>
<text x="54" y="100" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" fill="#62758A" font-weight="400" text-anchor="start" font-style="normal">Two clients update the same seat. One strategy waits before writing; the other detects a version conflict and retries.</text>
<line x1="54" y1="126" x2="1546" y2="126" stroke="#C9D4DF" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<defs>
<marker id="arr-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2867B2"/></marker>
<marker id="arr-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#167B70"/></marker>
<marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#B63C43"/></marker>
<marker id="arr-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#A76512"/></marker>
<marker id="arr-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#62758A"/></marker>
<marker id="arr-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#6D55A5"/></marker>
</defs>
<rect x="60" y="160" width="715" height="560" rx="20" fill="#FFFFFF" stroke="#C9D4DF" stroke-width="2"/>
<text x="82" y="196" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="22" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">PESSIMISTIC CONTROL</text>
<text x="82" y="223" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#62758A" font-weight="400" text-anchor="start" font-style="normal">Acquire a lock before making a conflicting change.</text>
<rect x="825" y="160" width="715" height="560" rx="20" fill="#FFFFFF" stroke="#C9D4DF" stroke-width="2"/>
<text x="847" y="196" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="22" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">OPTIMISTIC CONTROL</text>
<text x="847" y="223" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#62758A" font-weight="400" text-anchor="start" font-style="normal">Read freely; validate versions before commit.</text>
<text x="100" y="260" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Client A</text>
<text x="100" y="350" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Client B</text>
<rect x="230" y="225" width="190" height="75" rx="14" fill="#EAF2FC" stroke="#2867B2" stroke-width="2"/>
<text x="248" y="256" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Lock seat S-17</text>
<text x="248" y="285" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Exclusive lock</text>
<rect x="510" y="225" width="190" height="75" rx="14" fill="#E7F5F2" stroke="#167B70" stroke-width="2"/>
<text x="528" y="256" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Update + commit</text>
<text x="528" y="285" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Version 8 → 9</text>
<line x1="420" y1="263" x2="510" y2="263" stroke="#167B70" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-teal)"/>
<rect x="230" y="325" width="190" height="75" rx="14" fill="#FFF3DF" stroke="#A76512" stroke-width="2"/>
<text x="248" y="356" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Request lock</text>
<text x="248" y="385" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Waits for A</text>
<rect x="510" y="325" width="190" height="75" rx="14" fill="#FCEBED" stroke="#B63C43" stroke-width="2"/>
<text x="528" y="356" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Then re-check</text>
<text x="528" y="385" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Not available</text>
<line x1="420" y1="363" x2="510" y2="363" stroke="#A76512" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-amber)"/>
<text x="400" y="455" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#2867B2" font-weight="600" text-anchor="middle" font-style="normal">Lock is held across the critical section</text>
<rect x="190" y="510" width="450" height="32" rx="16" fill="#FFF3DF" stroke="#A76512" stroke-width="1"/>
<text x="415.0" y="532.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#A76512" font-weight="700" text-anchor="middle" font-style="normal">Contention becomes waiting</text>
<text x="865" y="260" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Client A</text>
<text x="865" y="350" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Client B</text>
<rect x="990" y="225" width="190" height="75" rx="14" fill="#EAF2FC" stroke="#2867B2" stroke-width="2"/>
<text x="1008" y="256" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Read version 8</text>
<text x="1008" y="285" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Seat = available</text>
<rect x="1260" y="225" width="190" height="75" rx="14" fill="#E7F5F2" stroke="#167B70" stroke-width="2"/>
<text x="1278" y="256" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Validate + commit</text>
<text x="1278" y="285" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Version 8 → 9</text>
<line x1="1180" y1="263" x2="1260" y2="263" stroke="#167B70" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-teal)"/>
<rect x="990" y="325" width="190" height="75" rx="14" fill="#EAF2FC" stroke="#2867B2" stroke-width="2"/>
<text x="1008" y="356" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Read version 8</text>
<text x="1008" y="385" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Same initial view</text>
<rect x="1260" y="325" width="190" height="75" rx="14" fill="#FCEBED" stroke="#B63C43" stroke-width="2"/>
<text x="1278" y="356" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" fill="#14263D" font-weight="700" text-anchor="start" font-style="normal">Validation fails</text>
<text x="1278" y="385" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#24364B" font-weight="400" text-anchor="start" font-style="normal">Expected 8, found 9</text>
<line x1="1180" y1="363" x2="1260" y2="363" stroke="#B63C43" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-red)"/>
<rect x="1030" y="510" width="360" height="32" rx="16" fill="#FCEBED" stroke="#B63C43" stroke-width="1"/>
<text x="1210.0" y="532.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#B63C43" font-weight="700" text-anchor="middle" font-style="normal">Abort + retry / report conflict</text>
<text x="420" y="665" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#62758A" font-weight="600" text-anchor="middle" font-style="normal">Useful when conflicts are frequent</text>
<text x="1180" y="665" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" fill="#62758A" font-weight="600" text-anchor="middle" font-style="normal">Useful when conflicts are relatively rare</text>
<line x1="54" y1="756" x2="1546" y2="756" stroke="#C9D4DF" stroke-width="1" stroke-linecap="round"/>
<text x="54" y="785" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#62758A" font-weight="400" text-anchor="start" font-style="normal">Neither strategy wins universally: contention rate, transaction duration, retry cost, and network latency determine the trade-off.</text>
</svg>