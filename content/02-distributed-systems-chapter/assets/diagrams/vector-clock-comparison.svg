<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Comparing vector clocks</title><desc id="desc">Vector dominance indicates causal order; incomparable vectors indicate concurrency; equal vectors encode the same recorded counters.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
  <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker>
</defs>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif} .small{font-size:15px} .muted{fill:#64748b} .heading{font-size:25px;font-weight:750;fill:#14213d}</style>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="44" y="48" class="heading">Comparing vector clocks</text>
<text x="44" y="76" font-size="16" fill="#64748b">Vector dominance indicates causal order; incomparable vectors indicate concurrency; equal vectors encode the same recorded counters.</text>
<rect x="55" y="130" width="330" height="155" rx="14" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2" /><rect x="55" y="130" width="8" height="155" rx="4" fill="#2563eb" stroke="#2563eb" stroke-width="0" /><text x="79" y="164" font-size="20" fill="#14213d" font-weight="700" text-anchor="start" class="">Causally ordered</text><text x="79" y="196" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">V₁ = [1, 0, 0]</text><text x="79" y="221" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">V₂ = [1, 1, 0]</text><text x="79" y="246" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">V₁ ≤ V₂ component-wise</text><text x="220" y="320" font-size="23" fill="#2563eb" font-weight="800" text-anchor="middle" class="">V₁ → V₂</text><rect x="140" y="345" width="160" height="34" rx="17" fill="#eff6ff" stroke="#eff6ff" stroke-width="0" /><text x="220.0" y="368" font-size="16" fill="#2563eb" font-weight="700" text-anchor="middle" class="">V₁ happens before V₂</text><rect x="435" y="130" width="330" height="155" rx="14" fill="#fffbeb" stroke="#cbd5e1" stroke-width="2" /><rect x="435" y="130" width="8" height="155" rx="4" fill="#b45309" stroke="#b45309" stroke-width="0" /><text x="459" y="164" font-size="20" fill="#14213d" font-weight="700" text-anchor="start" class="">Concurrent</text><text x="459" y="196" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">V₃ = [2, 0, 0]</text><text x="459" y="221" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">V₄ = [1, 1, 0]</text><text x="459" y="246" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">One component is larger each way</text><text x="600" y="320" font-size="20" fill="#b45309" font-weight="800" text-anchor="middle" class="">V₃ and V₄: incomparable</text><rect x="525" y="345" width="150" height="34" rx="17" fill="#fffbeb" stroke="#fffbeb" stroke-width="0" /><text x="600.0" y="368" font-size="16" fill="#b45309" font-weight="700" text-anchor="middle" class="">Incomparable vectors</text><rect x="815" y="130" width="330" height="155" rx="14" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="2" /><rect x="815" y="130" width="8" height="155" rx="4" fill="#0f766e" stroke="#0f766e" stroke-width="0" /><text x="839" y="164" font-size="20" fill="#14213d" font-weight="700" text-anchor="start" class="">Equal histories</text><text x="839" y="196" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">V₅ = [2, 1, 0]</text><text x="839" y="221" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">V₆ = [2, 1, 0]</text><text x="839" y="246" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">Same recorded vector value</text><text x="980" y="320" font-size="23" fill="#0f766e" font-weight="800" text-anchor="middle" class="">V₅ = V₆</text><rect x="900" y="345" width="160" height="34" rx="17" fill="#f0fdfa" stroke="#f0fdfa" stroke-width="0" /><text x="980.0" y="368" font-size="16" fill="#0f766e" font-weight="700" text-anchor="middle" class="">Equal vector values</text><rect x="100" y="430" width="1000" height="90" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="130" y="465" font-size="18" fill="#14213d" font-weight="700" text-anchor="start" class="">Dominance rule</text><text x="130" y="495" font-size="18" fill="#475569" font-weight="500" text-anchor="start" class="">V₁ &lt; V₂ iff every V₁[i] ≤ V₂[i] and at least one component is strictly smaller.</text><text x="600" y="555" font-size="16" fill="#64748b" font-weight="500" text-anchor="middle" class="">Incomparable vectors identify concurrent histories under the modeled membership.</text>
</svg>