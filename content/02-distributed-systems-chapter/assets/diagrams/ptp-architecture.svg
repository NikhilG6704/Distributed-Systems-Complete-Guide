<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">PTP timing architecture</title><desc id="desc">Grandmaster distributes time through boundary and transparent clocks to hardware-timestamped endpoints.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
  <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker>
</defs>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif} .small{font-size:15px} .muted{fill:#64748b} .heading{font-size:25px;font-weight:750;fill:#14213d}</style>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="44" y="48" class="heading">PTP timing architecture</text>
<text x="44" y="76" font-size="16" fill="#64748b">Grandmaster distributes time through boundary and transparent clocks to hardware-timestamped endpoints.</text>
<rect x="440" y="105" width="320" height="78" rx="14" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2" /><rect x="440" y="105" width="8" height="78" rx="4" fill="#7c3aed" stroke="#7c3aed" stroke-width="0" /><text x="464" y="139" font-size="20" fill="#14213d" font-weight="700" text-anchor="start" class="">GNSS / atomic reference</text><text x="464" y="171" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">Reference time source</text><line x1="600" y1="183" x2="600" y2="215" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="215" width="400" height="78" rx="14" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2" /><rect x="400" y="215" width="8" height="78" rx="4" fill="#2563eb" stroke="#2563eb" stroke-width="0" /><text x="424" y="249" font-size="20" fill="#14213d" font-weight="700" text-anchor="start" class="">PTP grandmaster clock</text><text x="424" y="281" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">Advertises the selected reference</text><line x1="600" y1="293" x2="600" y2="342" stroke="#2563eb" stroke-width="3"/><line x1="215" y1="342" x2="985" y2="342" stroke="#2563eb" stroke-width="3"/><rect x="475" y="305" width="250" height="34" rx="17" fill="#eff6ff" stroke="#eff6ff" stroke-width="0" /><text x="600.0" y="328" font-size="16" fill="#2563eb" font-weight="700" text-anchor="middle" class="">Sync / Follow_Up downstream</text><line x1="215" y1="342" x2="215" y2="370" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><line x1="600" y1="342" x2="600" y2="370" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><line x1="985" y1="342" x2="985" y2="370" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="370" width="290" height="86" rx="14" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="2" /><rect x="70" y="370" width="8" height="86" rx="4" fill="#0f766e" stroke="#0f766e" stroke-width="0" /><text x="94" y="404" font-size="20" fill="#14213d" font-weight="700" text-anchor="start" class="">Boundary clock A</text><text x="94" y="436" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">Terminates one segment; regenerates timing</text><rect x="455" y="370" width="290" height="86" rx="14" fill="#fffbeb" stroke="#cbd5e1" stroke-width="2" /><rect x="455" y="370" width="8" height="86" rx="4" fill="#b45309" stroke="#b45309" stroke-width="0" /><text x="479" y="404" font-size="20" fill="#14213d" font-weight="700" text-anchor="start" class="">Transparent clock switch</text><text x="479" y="436" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">Measures residence time; corrects timing</text><rect x="840" y="370" width="290" height="86" rx="14" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="2" /><rect x="840" y="370" width="8" height="86" rx="4" fill="#0f766e" stroke="#0f766e" stroke-width="0" /><text x="864" y="404" font-size="20" fill="#14213d" font-weight="700" text-anchor="start" class="">Boundary clock B</text><text x="864" y="436" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">Separates another network segment</text><line x1="215" y1="456" x2="215" y2="480" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><line x1="600" y1="456" x2="600" y2="480" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)"/><line x1="985" y1="456" x2="985" y2="480" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="480" width="290" height="65" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><rect x="70" y="480" width="8" height="65" rx="4" fill="#0f766e" stroke="#0f766e" stroke-width="0" /><text x="94" y="514" font-size="20" fill="#14213d" font-weight="700" text-anchor="start" class="">Slave / endpoint clocks</text><text x="94" y="546" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">Hardware timestamping</text><rect x="455" y="480" width="290" height="65" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><rect x="455" y="480" width="8" height="65" rx="4" fill="#b45309" stroke="#b45309" stroke-width="0" /><text x="479" y="514" font-size="20" fill="#14213d" font-weight="700" text-anchor="start" class="">Path correction</text><text x="479" y="546" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">Residence-time correction</text><rect x="840" y="480" width="290" height="65" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><rect x="840" y="480" width="8" height="65" rx="4" fill="#0f766e" stroke="#0f766e" stroke-width="0" /><text x="864" y="514" font-size="20" fill="#14213d" font-weight="700" text-anchor="start" class="">Slave / endpoint clocks</text><text x="864" y="546" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">Hardware timestamping</text><text x="50" y="580" font-size="15" fill="#64748b" font-weight="400" text-anchor="start" class="">Delay-measurement messages travel in the reverse direction; the drawing simplifies profile-specific exchanges.</text>
</svg>