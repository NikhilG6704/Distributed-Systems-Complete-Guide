<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Message ordering guarantee comparison</title><desc id="desc">A matrix distinguishes per-sender FIFO, causality-preserving delivery, and a common total order across replicas.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
  <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker>
</defs>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif} .small{font-size:15px} .muted{fill:#64748b} .heading{font-size:25px;font-weight:750;fill:#14213d}</style>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="44" y="48" class="heading">Message ordering guarantee comparison</text>
<text x="44" y="76" font-size="16" fill="#64748b">A matrix distinguishes per-sender FIFO, causality-preserving delivery, and a common total order across replicas.</text>
<rect x="55" y="135" width="330" height="58" rx="8" fill="#14213d" stroke="#14213d" stroke-width="0" /><text x="220.0" y="172" font-size="18" fill="#ffffff" font-weight="800" text-anchor="middle" class="">Guarantee</text><rect x="385" y="135" width="235" height="58" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="0" /><text x="502.5" y="172" font-size="18" fill="#ffffff" font-weight="800" text-anchor="middle" class="">FIFO</text><rect x="620" y="135" width="235" height="58" rx="8" fill="#0f766e" stroke="#0f766e" stroke-width="0" /><text x="737.5" y="172" font-size="18" fill="#ffffff" font-weight="800" text-anchor="middle" class="">Causal order</text><rect x="855" y="135" width="290" height="58" rx="8" fill="#7c3aed" stroke="#7c3aed" stroke-width="0" /><text x="1000.0" y="172" font-size="18" fill="#ffffff" font-weight="800" text-anchor="middle" class="">Total order</text><rect x="55" y="193" width="330" height="57" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="69" y="228" font-size="16" fill="#14213d" font-weight="700" text-anchor="start" class="">Preserves each sender’s order</text><rect x="385" y="193" width="235" height="57" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="502.5" y="228" font-size="16" fill="#2563eb" font-weight="500" text-anchor="middle" class="">Yes</text><rect x="620" y="193" width="235" height="57" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="737.5" y="228" font-size="16" fill="#0f766e" font-weight="500" text-anchor="middle" class="">Yes</text><rect x="855" y="193" width="290" height="57" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="1000.0" y="228" font-size="16" fill="#7c3aed" font-weight="500" text-anchor="middle" class="">Yes, if required by sequence</text><rect x="55" y="250" width="330" height="57" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" /><text x="69" y="285" font-size="16" fill="#14213d" font-weight="700" text-anchor="start" class="">Preserves causal dependencies</text><rect x="385" y="250" width="235" height="57" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" /><text x="502.5" y="285" font-size="16" fill="#2563eb" font-weight="500" text-anchor="middle" class="">Not by itself</text><rect x="620" y="250" width="235" height="57" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" /><text x="737.5" y="285" font-size="16" fill="#0f766e" font-weight="500" text-anchor="middle" class="">Yes</text><rect x="855" y="250" width="290" height="57" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" /><text x="1000.0" y="285" font-size="16" fill="#7c3aed" font-weight="500" text-anchor="middle" class="">Yes, if sequencer respects them</text><rect x="55" y="307" width="330" height="57" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="69" y="342" font-size="16" fill="#14213d" font-weight="700" text-anchor="start" class="">Orders concurrent messages</text><rect x="385" y="307" width="235" height="57" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="502.5" y="342" font-size="16" fill="#2563eb" font-weight="500" text-anchor="middle" class="">No global rule</text><rect x="620" y="307" width="235" height="57" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="737.5" y="342" font-size="16" fill="#0f766e" font-weight="500" text-anchor="middle" class="">No global rule</text><rect x="855" y="307" width="290" height="57" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="1000.0" y="342" font-size="16" fill="#7c3aed" font-weight="500" text-anchor="middle" class="">Yes, same order everywhere</text><rect x="55" y="364" width="330" height="57" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" /><text x="69" y="399" font-size="16" fill="#14213d" font-weight="700" text-anchor="start" class="">Same delivery order at all nodes</text><rect x="385" y="364" width="235" height="57" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" /><text x="502.5" y="399" font-size="16" fill="#2563eb" font-weight="500" text-anchor="middle" class="">No</text><rect x="620" y="364" width="235" height="57" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" /><text x="737.5" y="399" font-size="16" fill="#0f766e" font-weight="500" text-anchor="middle" class="">Not for concurrent messages</text><rect x="855" y="364" width="290" height="57" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" /><text x="1000.0" y="399" font-size="16" fill="#7c3aed" font-weight="500" text-anchor="middle" class="">Yes</text><rect x="55" y="421" width="330" height="57" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="69" y="456" font-size="16" fill="#14213d" font-weight="700" text-anchor="start" class="">Typical coordination</text><rect x="385" y="421" width="235" height="57" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="502.5" y="456" font-size="16" fill="#2563eb" font-weight="500" text-anchor="middle" class="">Per-sender sequence</text><rect x="620" y="421" width="235" height="57" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="737.5" y="456" font-size="16" fill="#0f766e" font-weight="500" text-anchor="middle" class="">Causal metadata / buffering</text><rect x="855" y="421" width="290" height="57" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="1000.0" y="456" font-size="16" fill="#7c3aed" font-weight="500" text-anchor="middle" class="">Sequencer or consensus</text><rect x="55" y="478" width="330" height="57" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" /><text x="69" y="513" font-size="16" fill="#14213d" font-weight="700" text-anchor="start" class="">Example scope</text><rect x="385" y="478" width="235" height="57" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" /><text x="502.5" y="513" font-size="16" fill="#2563eb" font-weight="500" text-anchor="middle" class="">One producer channel</text><rect x="620" y="478" width="235" height="57" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" /><text x="737.5" y="513" font-size="16" fill="#0f766e" font-weight="500" text-anchor="middle" class="">Dependent chat updates</text><rect x="855" y="478" width="290" height="57" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" /><text x="1000.0" y="513" font-size="16" fill="#7c3aed" font-weight="500" text-anchor="middle" class="">Replicated command log</text><rect x="65" y="555" width="510" height="65" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="88" y="581" font-size="18" fill="#2563eb" font-weight="800" text-anchor="start" class="">Kafka</text><text x="88" y="606" font-size="15" fill="#475569" font-weight="500" text-anchor="start" class="">Ordering is scoped to a partition; offsets sequence records there.</text><rect x="625" y="555" width="510" height="65" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" /><text x="648" y="581" font-size="18" fill="#7c3aed" font-weight="800" text-anchor="start" class="">Replicated log</text><text x="648" y="606" font-size="15" fill="#475569" font-weight="500" text-anchor="start" class="">Consensus log establishes a shared committed sequence.</text>
</svg>