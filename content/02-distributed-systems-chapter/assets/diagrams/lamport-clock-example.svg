<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Lamport clock example with three processes</title><desc id="desc">Scalar logical timestamps increase on local events and advance beyond a received message timestamp.</desc>
