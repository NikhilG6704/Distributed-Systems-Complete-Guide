nt-weight="700" text-anchor="start" class="">local c</text><rect x="547" y="212" width="82" height="28" rx="17" fill="#ffffff" stroke="#ffffff" stroke-width="0" /><text x="588.0" y="235" font-size="16" fill="#0f766e" font-weight="700" text-anchor="middle" class="">L=1</text><circle cx="600" cy="340" r="10" fill="#0f766e" stroke="#ffffff" stroke-width="2"/><text x="618" y="331" font-size="16" fill="#0f766e" font-weight="700" text-anchor="start" class="">recv m₁</text><rect x="547" y="352" width="82" height="28" rx="17" fill="#ffffff" stroke="#ffffff" stroke-width="0" /><text x="588.0" y="375" font-size="16" fill="#0f766e" font-weight="700" text-anchor="middle" class="">L=3</text><circle cx="600" cy="430" r="10" fill="#0f766e" stroke="#ffffff" stroke-width="2"/><text x="618" y="421" font-size="16" fill="#0f766e" font-weight="700" text-anchor="start" class="">send m₂</text><rect x="547" y="442" width="82" height="28" rx="17" fill="#ffffff" stroke="#ffffff" stroke-width="0" /><text x="588.0" y="465" font-size="16" fill="#0f766e" font-weight="700" text-anchor="middle" class="">L=4</text><circle cx="970" cy="470" r="10" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/><text x="988" y="461" font-size="16" fill="#7c3aed" font-weight="700" text-anchor="start" class="">recv m₂</text><rect x="917" y="482" width="82" height="28" rx="17" fill="#ffffff" stroke="#ffffff" stroke-width="0" /><text x="958.0" y="505" font-size="16" fill="#7c3aed" font-weight="700" text-anchor="middle" class="">L=5</text><circle cx="970" cy="520" r="10" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/><text x="988" y="511" font-size="16" fill="#7c3aed" font-weight="700" text-anchor="start" class="">local d</text><rect x="917" y="532" width="82" height="28" rx="17" fill="#ffffff" stroke="#ffffff" stroke-width="0" /><text x="958.0" y="555" font-size="16" fill="#7c3aed" font-weight="700" text-anchor="middle" class="">L=6</text><path d="M230 270 C350 270 470 340 600 340" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M600 430 C735 430 840 470 970 470" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="410" y="285" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle" class="">m₁ carries timestamp 2</text><text x="795" y="455" font-size="15" fill="#0f766e" font-weight="700" text-anchor="middle" class="">m₂ carries timestamp 4</text><rect x="55" y="575" width="1090" height="48" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1" /><text x="600" y="605" font-size="19" fill="#7c3aed" font-weight="700" text-anchor="middle" class="">On receive: C := max(local C, message timestamp) + 1</text>
