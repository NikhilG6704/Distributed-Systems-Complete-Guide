<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">Physical clock drift and skew</title><desc id="desc">Different oscillator rates accumulate different errors; skew is the reading difference at an instant.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
  <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker>
</defs>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif} .small{font-size:15px} .muted{fill:#64748b} .heading{font-size:25px;font-weight:750;fill:#14213d}</style>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="44" y="48" class="heading">Physical clock drift and skew</text>
<text x="44" y="76" font-size="16" fill="#64748b">Different oscillator rates accumulate different errors; skew is the reading difference at an instant.</text>
<text x="55" y="125" font-size="16" fill="#64748b" font-weight="700" text-anchor="start" class="">Common start</text><line x1="170" y1="132" x2="1125" y2="132" stroke="#cbd5e1" stroke-width="2"/><circle cx="170" cy="132" r="7" fill="#14213d" stroke="#ffffff" stroke-width="2"/><text x="170" y="160" font-size="16" fill="#14213d" font-weight="700" text-anchor="middle" class="">t₀</text><text x="55" y="211" font-size="19" fill="#14213d" font-weight="700" text-anchor="start" class="">Reference clock</text><line x1="170" y1="225" x2="1125" y2="225" stroke="#14213d" stroke-width="5"/><circle cx="170" cy="225" r="7" fill="#14213d" stroke="#ffffff" stroke-width="2"/><circle cx="1125" cy="225" r="11" fill="#14213d" stroke="#ffffff" stroke-width="2"/><text x="1125" y="207" font-size="18" fill="#14213d" font-weight="700" text-anchor="middle" class="">0 ms</text><text x="1125" y="255" font-size="14" fill="#64748b" font-weight="500" text-anchor="middle" class="">t₀ + 1,000 s</text><text x="55" y="316" font-size="19" fill="#2563eb" font-weight="700" text-anchor="start" class="">Machine A  ·  +20 ppm</text><line x1="170" y1="330" x2="1145" y2="330" stroke="#2563eb" stroke-width="5"/><circle cx="170" cy="330" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><circle cx="1145" cy="330" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="1145" y="312" font-size="18" fill="#2563eb" font-weight="700" text-anchor="middle" class="">+20 ms</text><text x="1145" y="360" font-size="14" fill="#64748b" font-weight="500" text-anchor="middle" class="">t₀ + 1,000 s</text><text x="55" y="421" font-size="19" fill="#0f766e" font-weight="700" text-anchor="start" class="">Machine B  ·  −15 ppm</text><line x1="170" y1="435" x2="1110" y2="435" stroke="#0f766e" stroke-width="5"/><circle cx="170" cy="435" r="7" fill="#0f766e" stroke="#ffffff" stroke-width="2"/><circle cx="1110" cy="435" r="11" fill="#0f766e" stroke="#ffffff" stroke-width="2"/><text x="1110" y="417" font-size="18" fill="#0f766e" font-weight="700" text-anchor="middle" class="">−15 ms</text><text x="1110" y="465" font-size="14" fill="#64748b" font-weight="500" text-anchor="middle" class="">t₀ + 1,000 s</text><path d="M1145 330 L1160 330 L1160 435 L1110 435" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><rect x="870" y="495" width="260" height="34" rx="17" fill="#fffbeb" stroke="#fffbeb" stroke-width="0" /><text x="1000.0" y="518" font-size="16" fill="#b45309" font-weight="700" text-anchor="middle" class="">A is 35 ms ahead of B</text><text x="55" y="520" font-size="16" fill="#475569" font-weight="500" text-anchor="start" class="">Drift = rate error accumulated over elapsed time</text><text x="55" y="545" font-size="16" fill="#475569" font-weight="500" text-anchor="start" class="">Skew = difference between clock readings at one observation point</text>
</svg>