<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Spanner commit-wait sequence</title><desc id="desc">A transaction is acknowledged only after TrueTime confirms the commit timestamp is in the past.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
  <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker>
</defs>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif} .small{font-size:15px} .muted{fill:#64748b} .heading{font-size:25px;font-weight:750;fill:#14213d}</style>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="44" y="48" class="heading">Spanner commit-wait sequence</text>
<text x="44" y="76" font-size="16" fill="#64748b">A transaction is acknowledged only after TrueTime confirms the commit timestamp is in the past.</text>
<rect x="70" y="180" width="220" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="180.0" y="220" font-size="16" fill="#2563eb" font-weight="800" text-anchor="middle" class="">Execute transaction</text><rect x="310" y="180" width="190" height="100" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" /><text x="405.0" y="220" font-size="16" fill="#7c3aed" font-weight="800" text-anchor="middle" class="">Choose commit timestamp s</text><rect x="520" y="180" width="250" height="100" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2" /><text x="645.0" y="220" font-size="16" fill="#b45309" font-weight="800" text-anchor="middle" class="">Commit-wait</text><rect x="810" y="180" width="290" height="100" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" /><text x="955.0" y="220" font-size="16" fill="#0f766e" font-weight="800" text-anchor="middle" class="">Acknowledge client</text><line x1="290" y1="230" x2="310" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="500" y1="230" x2="520" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="770" y1="230" x2="810" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="645" y="315" font-size="16" fill="#b45309" font-weight="700" text-anchor="middle" class="">Do not acknowledge yet</text><rect x="100" y="370" width="1000" height="130" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="130" y="405" font-size="18" fill="#14213d" font-weight="800" text-anchor="start" class="">TrueTime observations</text><text x="130" y="440" font-size="17" fill="#475569" font-weight="500" text-anchor="start" class="">At timestamp assignment: TT.now() may overlap s</text><text x="130" y="472" font-size="17" fill="#0f766e" font-weight="700" text-anchor="start" class="">After waiting: TT.now().earliest &gt; s  →  safe to acknowledge commit</text><path d="M645 280 L645 355" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><rect x="390" y="515" width="420" height="34" rx="17" fill="#f0fdfa" stroke="#f0fdfa" stroke-width="0" /><text x="600.0" y="538" font-size="16" fill="#0f766e" font-weight="700" text-anchor="middle" class="">Commit-wait links timestamp order to real-time visibility</text><text x="600" y="570" font-size="16" fill="#64748b" font-weight="500" text-anchor="middle" class="">Replication / transaction protocol establishes commit; TrueTime bounds uncertainty.</text>
</svg>