<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">TrueTime uncertainty interval</title><desc id="desc">TrueTime exposes a bounded interval; TT.after(s) becomes true only when the interval lower bound exceeds s.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
  <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker>
</defs>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif} .small{font-size:15px} .muted{fill:#64748b} .heading{font-size:25px;font-weight:750;fill:#14213d}</style>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="44" y="48" class="heading">TrueTime uncertainty interval</text>
<text x="44" y="76" font-size="16" fill="#64748b">TrueTime exposes a bounded interval; TT.after(s) becomes true only when the interval lower bound exceeds s.</text>
<text x="65" y="130" font-size="19" fill="#14213d" font-weight="700" text-anchor="start" class="">Real-time axis: uncertainty is an interval, not a point estimate</text><line x1="120" y1="225" x2="1080" y2="225" stroke="#475569" stroke-width="3"/><line x1="160" y1="215" x2="160" y2="235" stroke="#475569" stroke-width="2"/><text x="160" y="255" font-size="15" fill="#64748b" font-weight="600" text-anchor="middle" class="">earlier</text><line x1="430" y1="215" x2="430" y2="235" stroke="#475569" stroke-width="2"/><text x="430" y="255" font-size="15" fill="#64748b" font-weight="600" text-anchor="middle" class="">s</text><line x1="700" y1="215" x2="700" y2="235" stroke="#475569" stroke-width="2"/><text x="700" y="255" font-size="15" fill="#64748b" font-weight="600" text-anchor="middle" class="">later</text><line x1="1040" y1="215" x2="1040" y2="235" stroke="#475569" stroke-width="2"/><text x="1040" y="255" font-size="15" fill="#64748b" font-weight="600" text-anchor="middle" class="">future</text><line x1="255" y1="225" x2="540" y2="225" stroke="#b45309" stroke-width="9"/><line x1="255" y1="207" x2="255" y2="243" stroke="#b45309" stroke-width="3"/><line x1="540" y1="207" x2="540" y2="243" stroke="#b45309" stroke-width="3"/><line x1="430" y1="150" x2="430" y2="270" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 5"/><text x="430" y="185" font-size="15" fill="#dc2626" font-weight="700" text-anchor="middle" class="">commit s</text><rect x="205" y="290" width="320" height="100" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2" /><text x="365" y="320" font-size="18" fill="#b45309" font-weight="800" text-anchor="middle" class="">Initial TT.now()</text><text x="365" y="349" font-size="16" fill="#14213d" font-weight="700" text-anchor="middle" class="">[earliest, latest] overlaps s</text><rect x="275" y="355" width="180" height="34" rx="17" fill="#fef2f2" stroke="#fef2f2" stroke-width="0" /><text x="365.0" y="378" font-size="16" fill="#dc2626" font-weight="700" text-anchor="middle" class="">TT.after(s) = false</text><line x1="700" y1="225" x2="980" y2="225" stroke="#0f766e" stroke-width="9"/><line x1="700" y1="207" x2="700" y2="243" stroke="#0f766e" stroke-width="3"/><line x1="980" y1="207" x2="980" y2="243" stroke="#0f766e" stroke-width="3"/><rect x="680" y="290" width="320" height="100" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" /><text x="840" y="320" font-size="18" fill="#0f766e" font-weight="800" text-anchor="middle" class="">After waiting</text><text x="840" y="349" font-size="15" fill="#14213d" font-weight="700" text-anchor="middle" class="">earliest is strictly greater than s</text><rect x="750" y="355" width="180" height="34" rx="17" fill="#f0fdfa" stroke="#f0fdfa" stroke-width="0" /><text x="840.0" y="378" font-size="16" fill="#0f766e" font-weight="700" text-anchor="middle" class="">TT.after(s) = true</text><line x1="530" y1="435" x2="675" y2="435" stroke="#b45309" stroke-width="3"/><text x="600" y="420" font-size="15" fill="#b45309" font-weight="700" text-anchor="middle" class="">wait</text><rect x="120" y="465" width="960" height="75" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><text x="150" y="495" font-size="17" fill="#14213d" font-weight="700" text-anchor="start" class="">Uncertainty ε</text><text x="330" y="495" font-size="19" fill="#14213d" font-weight="700" text-anchor="start" class="">TT.now() = [earliest, latest]</text><text x="150" y="522" font-size="15" fill="#475569" font-weight="500" text-anchor="start" class="">The actual physical time is guaranteed to lie inside the returned interval.</text>
</svg>