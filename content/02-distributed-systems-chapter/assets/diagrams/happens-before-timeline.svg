<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Happens-before across three processes</title><desc id="desc">Program order and message delivery create causal paths; events without a path are concurrent.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
  <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker>
</defs>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif} .small{font-size:15px} .muted{fill:#64748b} .heading{font-size:25px;font-weight:750;fill:#14213d}</style>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="44" y="48" class="heading">Happens-before across three processes</text>
<text x="44" y="76" font-size="16" fill="#64748b">Program order and message delivery create causal paths; events without a path are concurrent.</text>
<text x="220" y="121" font-size="21" fill="#2563eb" font-weight="700" text-anchor="middle" class="">P1</text><line x1="220" y1="145" x2="220" y2="500" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 8"/><text x="600" y="121" font-size="21" fill="#0f766e" font-weight="700" text-anchor="middle" class="">P2</text><line x1="600" y1="145" x2="600" y2="500" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 8"/><text x="980" y="121" font-size="21" fill="#7c3aed" font-weight="700" text-anchor="middle" class="">P3</text><line x1="980" y1="145" x2="980" y2="500" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 8"/><circle cx="220" cy="180" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="238" y="168" font-size="17" fill="#2563eb" font-weight="700" text-anchor="start" class="">a</text><circle cx="220" cy="280" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="238" y="268" font-size="17" fill="#2563eb" font-weight="700" text-anchor="start" class="">send m₁</text><circle cx="600" cy="350" r="11" fill="#0f766e" stroke="#ffffff" stroke-width="2"/><text x="618" y="338" font-size="17" fill="#0f766e" font-weight="700" text-anchor="start" class="">recv m₁</text><circle cx="600" cy="420" r="11" fill="#0f766e" stroke="#ffffff" stroke-width="2"/><text x="618" y="408" font-size="17" fill="#0f766e" font-weight="700" text-anchor="start" class="">send m₂</text><circle cx="980" cy="490" r="11" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/><text x="998" y="478" font-size="17" fill="#7c3aed" font-weight="700" text-anchor="start" class="">recv m₂</text><circle cx="980" cy="235" r="11" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/><text x="998" y="223" font-size="17" fill="#7c3aed" font-weight="700" text-anchor="start" class="">b</text><line x1="220" y1="180" x2="220" y2="280" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 4"/><line x1="600" y1="350" x2="600" y2="420" stroke="#0f766e" stroke-width="2" stroke-dasharray="4 4"/><path d="M220 280 C350 280 460 350 600 350" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M600 420 C740 420 845 490 980 490" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="345" y="300" width="130" height="34" rx="17" fill="#eff6ff" stroke="#eff6ff" stroke-width="0" /><text x="410.0" y="323" font-size="16" fill="#2563eb" font-weight="700" text-anchor="middle" class="">message m₁</text><rect x="715" y="435" width="130" height="34" rx="17" fill="#f0fdfa" stroke="#f0fdfa" stroke-width="0" /><text x="780.0" y="458" font-size="16" fill="#0f766e" font-weight="700" text-anchor="middle" class="">message m₂</text><rect x="760" y="120" width="350" height="70" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2" /><text x="935" y="148" font-size="18" fill="#b45309" font-weight="700" text-anchor="middle" class="">b is independent of a</text><text x="935" y="173" font-size="15" fill="#b45309" font-weight="500" text-anchor="middle" class="">Neither b → a nor a → b</text><text x="60" y="535" font-size="17" fill="#14213d" font-weight="700" text-anchor="start" class="">Causal chain: a → send(m₁) → receive(m₁) → send(m₂) → receive(m₂)</text><text x="60" y="565" font-size="16" fill="#b45309" font-weight="700" text-anchor="start" class="">Concurrent pair: a and b are concurrent (no happens-before path connects them)</text>
</svg>