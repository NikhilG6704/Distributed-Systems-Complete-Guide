<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">NTP four-timestamp exchange</title><desc id="desc">Client/server timestamps estimate clock offset and round-trip delay; asymmetric network paths introduce error.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
  <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker>
</defs>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif} .small{font-size:15px} .muted{fill:#64748b} .heading{font-size:25px;font-weight:750;fill:#14213d}</style>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="44" y="48" class="heading">NTP four-timestamp exchange</text>
<text x="44" y="76" font-size="16" fill="#64748b">Client/server timestamps estimate clock offset and round-trip delay; asymmetric network paths introduce error.</text>
<text x="300" y="121" font-size="21" fill="#2563eb" font-weight="700" text-anchor="middle" class="">NTP client</text><line x1="300" y1="145" x2="300" y2="450" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 8"/><text x="880" y="121" font-size="21" fill="#0f766e" font-weight="700" text-anchor="middle" class="">NTP server</text><line x1="880" y1="145" x2="880" y2="450" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 8"/><line x1="300" y1="188" x2="880" y2="250" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><circle cx="300" cy="188" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><circle cx="880" cy="250" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="300" y="176" font-size="18" fill="#2563eb" font-weight="700" text-anchor="middle" class="">T₁</text><text x="880" y="238" font-size="18" fill="#2563eb" font-weight="700" text-anchor="middle" class="">T₂</text><text x="590" y="195" font-size="17" fill="#2563eb" font-weight="700" text-anchor="middle" class="">Request travels to server</text><line x1="880" y1="340" x2="300" y2="410" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><circle cx="880" cy="340" r="7" fill="#0f766e" stroke="#ffffff" stroke-width="2"/><circle cx="300" cy="410" r="7" fill="#0f766e" stroke="#ffffff" stroke-width="2"/><text x="880" y="328" font-size="18" fill="#0f766e" font-weight="700" text-anchor="middle" class="">T₃</text><text x="300" y="438" font-size="18" fill="#0f766e" font-weight="700" text-anchor="middle" class="">T₄</text><text x="590" y="385" font-size="17" fill="#0f766e" font-weight="700" text-anchor="middle" class="">Response returns to client</text><rect x="410" y="245" width="235" height="34" rx="17" fill="#eff6ff" stroke="#eff6ff" stroke-width="0" /><text x="527.5" y="268" font-size="16" fill="#2563eb" font-weight="700" text-anchor="middle" class="">Forward delay: T₂ − T₁</text><rect x="515" y="430" width="230" height="34" rx="17" fill="#f0fdfa" stroke="#f0fdfa" stroke-width="0" /><text x="630.0" y="453" font-size="16" fill="#0f766e" font-weight="700" text-anchor="middle" class="">Reverse delay: T₄ − T₃</text><rect x="55" y="475" width="1090" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" /><text x="80" y="503" font-size="16" fill="#64748b" font-weight="700" text-anchor="start" class="">Estimated offset</text><text x="260" y="505" font-size="20" fill="#14213d" font-weight="700" text-anchor="start" class="">θ = [(T₂ − T₁) + (T₃ − T₄)] / 2</text><text x="80" y="528" font-size="16" fill="#64748b" font-weight="700" text-anchor="start" class="">Estimated delay</text><text x="260" y="530" font-size="20" fill="#14213d" font-weight="700" text-anchor="start" class="">δ = (T₄ − T₁) − (T₃ − T₂)</text><text x="835" y="528" font-size="15" fill="#b45309" font-weight="700" text-anchor="start" class="">Path asymmetry biases θ</text>
</svg>