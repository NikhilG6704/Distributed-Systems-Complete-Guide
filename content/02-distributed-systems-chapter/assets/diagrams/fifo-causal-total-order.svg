<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">FIFO, causal, and total message order</title><desc id="desc">FIFO preserves one sender sequence, causal order preserves dependencies, and total order gives every replica the same sequence.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
  <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker>
</defs>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif} .small{font-size:15px} .muted{fill:#64748b} .heading{font-size:25px;font-weight:750;fill:#14213d}</style>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="44" y="48" class="heading">FIFO, causal, and total message order</text>
<text x="44" y="76" font-size="16" fill="#64748b">FIFO preserves one sender sequence, causal order preserves dependencies, and total order gives every replica the same sequence.</text>
<rect x="35" y="120" width="340" height="390" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><rect x="35" y="120" width="340" height="54" rx="14" fill="#eff6ff" stroke="#eff6ff" stroke-width="0" /><text x="205" y="155" font-size="20" fill="#2563eb" font-weight="800" text-anchor="middle" class="">FIFO order</text><rect x="430" y="120" width="340" height="390" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><rect x="430" y="120" width="340" height="54" rx="14" fill="#f0fdfa" stroke="#f0fdfa" stroke-width="0" /><text x="600" y="155" font-size="20" fill="#0f766e" font-weight="800" text-anchor="middle" class="">Causal order</text><rect x="825" y="120" width="340" height="390" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><rect x="825" y="120" width="340" height="54" rx="14" fill="#f5f3ff" stroke="#f5f3ff" stroke-width="0" /><text x="995" y="155" font-size="20" fill="#7c3aed" font-weight="800" text-anchor="middle" class="">Total order</text><text x="65" y="210" font-size="15" fill="#64748b" font-weight="600" text-anchor="start" class="">P1 sends</text><rect x="65" y="225" width="85" height="34" rx="17" fill="#eff6ff" stroke="#eff6ff" stroke-width="0" /><text x="107.5" y="248" font-size="16" fill="#2563eb" font-weight="700" text-anchor="middle" class="">m₁</text><rect x="165" y="225" width="85" height="34" rx="17" fill="#eff6ff" stroke="#eff6ff" stroke-width="0" /><text x="207.5" y="248" font-size="16" fill="#2563eb" font-weight="700" text-anchor="middle" class="">m₂</text><text x="65" y="300" font-size="15" fill="#64748b" font-weight="600" text-anchor="start" class="">Receiver delivers</text><line x1="90" y1="330" x2="300" y2="330" stroke="#2563eb" stroke-width="3"/><circle cx="120" cy="330" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><circle cx="260" cy="330" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="120" y="365" font-size="17" fill="#2563eb" font-weight="800" text-anchor="middle" class="">m₁</text><text x="260" y="365" font-size="17" fill="#2563eb" font-weight="800" text-anchor="middle" class="">m₂</text><text x="65" y="425" font-size="15" fill="#475569" font-weight="500" text-anchor="start" class="">P2 message may interleave.</text><text x="65" y="452" font-size="15" fill="#2563eb" font-weight="700" text-anchor="start" class="">Only P1 sender order is fixed.</text><text x="460" y="210" font-size="15" fill="#64748b" font-weight="600" text-anchor="start" class="">Dependency: m₁ → m₂</text><rect x="465" y="230" width="85" height="34" rx="17" fill="#f0fdfa" stroke="#f0fdfa" stroke-width="0" /><text x="507.5" y="253" font-size="16" fill="#0f766e" font-weight="700" text-anchor="middle" class="">m₁</text><rect x="590" y="230" width="85" height="34" rx="17" fill="#f0fdfa" stroke="#f0fdfa" stroke-width="0" /><text x="632.5" y="253" font-size="16" fill="#0f766e" font-weight="700" text-anchor="middle" class="">m₂</text><text x="460" y="300" font-size="15" fill="#64748b" font-weight="600" text-anchor="start" class="">Receiver buffer</text><rect x="465" y="320" width="270" height="60" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1" /><text x="600" y="357" font-size="16" fill="#b45309" font-weight="700" text-anchor="middle" class="">hold m₂ until m₁ arrives</text><line x1="600" y1="380" x2="600" y2="415" stroke="#0f766e" stroke-width="2"/><text x="600" y="445" font-size="17" fill="#0f766e" font-weight="800" text-anchor="middle" class="">Deliver m₁, then m₂</text><text x="460" y="477" font-size="14" fill="#475569" font-weight="500" text-anchor="start" class="">Independent concurrent m₃ may interleave.</text><text x="855" y="210" font-size="15" fill="#64748b" font-weight="600" text-anchor="start" class="">Every replica agrees on sequence</text><text x="855" y="265" font-size="15" fill="#475569" font-weight="600" text-anchor="start" class="">Replica R1</text><rect x="955" y="240" width="54" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1" /><text x="982" y="267" font-size="15" fill="#2563eb" font-weight="800" text-anchor="middle" class="">m₁</text><rect x="1017" y="240" width="54" height="40" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1" /><text x="1044" y="267" font-size="15" fill="#0f766e" font-weight="800" text-anchor="middle" class="">m₃</text><rect x="1079" y="240" width="54" height="40" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" /><text x="1106" y="267" font-size="15" fill="#7c3aed" font-weight="800" text-anchor="middle" class="">m₂</text><text x="855" y="340" font-size="15" fill="#475569" font-weight="600" text-anchor="start" class="">Replica R2</text><rect x="955" y="315" width="54" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1" /><text x="982" y="342" font-size="15" fill="#2563eb" font-weight="800" text-anchor="middle" class="">m₁</text><rect x="1017" y="315" width="54" height="40" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1" /><text x="1044" y="342" font-size="15" fill="#0f766e" font-weight="800" text-anchor="middle" class="">m₃</text><rect x="1079" y="315" width="54" height="40" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" /><text x="1106" y="342" font-size="15" fill="#7c3aed" font-weight="800" text-anchor="middle" class="">m₂</text><text x="855" y="415" font-size="15" fill="#475569" font-weight="600" text-anchor="start" class="">Replica R3</text><rect x="955" y="390" width="54" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1" /><text x="982" y="417" font-size="15" fill="#2563eb" font-weight="800" text-anchor="middle" class="">m₁</text><rect x="1017" y="390" width="54" height="40" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1" /><text x="1044" y="417" font-size="15" fill="#0f766e" font-weight="800" text-anchor="middle" class="">m₃</text><rect x="1079" y="390" width="54" height="40" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" /><text x="1106" y="417" font-size="15" fill="#7c3aed" font-weight="800" text-anchor="middle" class="">m₂</text><text x="855" y="477" font-size="14" fill="#7c3aed" font-weight="700" text-anchor="start" class="">Same total order at all replicas.</text>
</svg>