<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="625" viewBox="0 0 1200 625" role="img" aria-labelledby="title desc">
<title id="title">Vector clock causal propagation</title><desc id="desc">Messages carry causal history; receivers merge component-wise maxima and increment their own component.</desc>
