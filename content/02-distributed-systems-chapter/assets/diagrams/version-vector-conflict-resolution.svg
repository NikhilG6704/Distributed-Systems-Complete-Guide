<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Version-vector conflict detection and resolution</title><desc id="desc">Two replicas update from the same ancestor; incomparable version vectors reveal sibling versions for application-level resolution.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
  <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker>
</defs>
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif} .small{font-size:15px} .muted{fill:#64748b} .heading{font-size:25px;font-weight:750;fill:#14213d}</style>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="44" y="48" class="heading">Version-vector conflict detection and resolution</text>
<text x="44" y="76" font-size="16" fill="#64748b">Two replicas update from the same ancestor; incomparable version vectors reveal sibling versions for application-level resolution.</text>
<rect x="420" y="110" width="360" height="80" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><rect x="420" y="110" width="8" height="80" rx="4" fill="#14213d" stroke="#14213d" stroke-width="0" /><text x="444" y="144" font-size="20" fill="#14213d" font-weight="700" text-anchor="start" class="">Shared ancestor</text><text x="444" y="176" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">Version vector [1,1] · value = 10</text><path d="M600 190 C470 225 330 235 250 280" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M600 190 C730 225 870 235 950 280" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="65" y="280" width="365" height="125" rx="14" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2" /><rect x="65" y="280" width="8" height="125" rx="4" fill="#2563eb" stroke="#2563eb" stroke-width="0" /><text x="89" y="314" font-size="20" fill="#14213d" font-weight="700" text-anchor="start" class="">Replica A update</text><text x="89" y="346" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">value = 11</text><text x="89" y="371" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">version = [2,1]</text><rect x="770" y="280" width="365" height="125" rx="14" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="2" /><rect x="770" y="280" width="8" height="125" rx="4" fill="#0f766e" stroke="#0f766e" stroke-width="0" /><text x="794" y="314" font-size="20" fill="#14213d" font-weight="700" text-anchor="start" class="">Replica B update</text><text x="794" y="346" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">value = 12</text><text x="794" y="371" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">version = [1,2]</text><path d="M250 405 C300 480 420 480 500 500" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M950 405 C900 480 780 480 700 500" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="125" y="425" width="245" height="34" rx="17" fill="#fffbeb" stroke="#fffbeb" stroke-width="0" /><text x="247.5" y="448" font-size="16" fill="#b45309" font-weight="700" text-anchor="middle" class="">A and B are concurrent</text><rect x="825" y="425" width="245" height="34" rx="17" fill="#fffbeb" stroke="#fffbeb" stroke-width="0" /><text x="947.5" y="448" font-size="16" fill="#b45309" font-weight="700" text-anchor="middle" class="">Neither version dominates</text><rect x="390" y="500" width="420" height="72" rx="14" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2" /><rect x="390" y="500" width="8" height="72" rx="4" fill="#7c3aed" stroke="#7c3aed" stroke-width="0" /><text x="414" y="534" font-size="20" fill="#14213d" font-weight="700" text-anchor="start" class="">Application-level resolution</text><text x="414" y="566" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">Merge business values; record merged vector [2,2]</text><text x="600" y="600" font-size="17" fill="#475569" font-weight="600" text-anchor="middle" class="">Vector metadata detects a conflict; it does not decide the business merge policy.</text>
</svg>