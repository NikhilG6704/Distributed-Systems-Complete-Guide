<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Google Spanner conceptual architecture</title><desc id="desc">A universe spans zones; spanservers host tablets replicated by Paxos groups; transactions may coordinate across groups.</desc>
