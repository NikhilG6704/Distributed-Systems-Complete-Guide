middle" class="">tablet host</text><rect x="105" y="335" width="360" height="90" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" /><text x="285" y="365" font-size="17" fill="#2563eb" font-weight="800" text-anchor="middle" class="">Paxos group / tablet X</text><text x="285" y="397" font-size="15" fill="#475569" font-weight="600" text-anchor="middle" class="">Leader A1  ·  replica A2</text><rect x="705" y="335" width="360" height="90" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2" /><text x="885" y="365" font-size="17" fill="#0f766e" font-weight="800" text-anchor="middle" class="">Paxos group / tablet Y</text><text x="885" y="397" font-size="15" fill="#475569" font-weight="600" text-anchor="middle" class="">Leader B1  ·  replica B2</text><line x1="190" y1="297" x2="230" y2="335" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><line x1="400" y1="297" x2="340" y2="335" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><line x1="790" y1="297" x2="830" y2="335" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/><line x1="1000" y1="297" x2="940" y2="335" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/><path d="M465 380 C565 340 635 340 705 380" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/><rect x="505" y="300" width="190" height="34" rx="17" fill="#f5f3ff" stroke="#f5f3ff" stroke-width="0" /><text x="600.0" y="323" font-size="16" fill="#7c3aed" font-weight="700" text-anchor="middle" class="">Cross-group transaction</text><rect x="65" y="465" width="320" height="70" rx="14" fill="#fffbeb" stroke="#cbd5e1" stroke-width="2" /><rect x="65" y="465" width="8" height="70" rx="4" fill="#b45309" stroke="#b45309" stroke-width="0" /><text x="89" y="499" font-size="20" fill="#14213d" font-weight="700" text-anchor="start" class="">TrueTime API</text><text x="89" y="531" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">Bounded time interval</text><rect x="440" y="465" width="320" height="70" rx="14" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2" /><rect x="440" y="465" width="8" height="70" rx="4" fill="#7c3aed" stroke="#7c3aed" stroke-width="0" /><text x="464" y="499" font-size="20" fill="#14213d" font-weight="700" text-anchor="start" class="">Transaction coordination</text><text x="464" y="531" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">Locking / commit protocol</text><rect x="815" y="465" width="320" height="70" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" /><rect x="815" y="465" width="8" height="70" rx="4" fill="#475569" stroke="#475569" stroke-width="0" /><text x="839" y="499" font-size="20" fill="#14213d" font-weight="700" text-anchor="start" class="">Placement driver</text><text x="839" y="531" font-size="16" fill="#475569" font-weight="400" text-anchor="start" class="">Background placement / balancing</text><text x="600" y="580" font-size="15" fill="#64748b" font-weight="500" text-anchor="middle" class="">Simplified conceptual view; actual service topology and protocols are more detailed.</text>
