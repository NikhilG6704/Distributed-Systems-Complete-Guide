<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">Sidecar vs. ambient mesh</title><desc id="desc">Sidecar mode places a proxy per pod; ambient separates node-level secure transport from waypoint L7 policy.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
 <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6d82"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/></filter>
</defs>
<rect width="1280" height="760" fill="#f4f7fb"/>
<rect x="0" y="0" width="1280" height="11" fill="#2563eb"/>
<text x="54" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#2563eb">DISTRIBUTED SYSTEMS  /  TRAFFIC MANAGEMENT</text>
<text x="54" y="94" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#14243a">Sidecar vs. ambient mesh</text>
<text x="54" y="126" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#5d6d82">Sidecar mode places a proxy per pod; ambient separates node-level secure transport from waypoint L7 policy.</text>
<line x1="54" y1="148" x2="1226" y2="148" stroke="#cbd5e1" stroke-width="1.5"/>

<rect x="54" y="205" width="565" height="400" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="54" y="205" width="565" height="58" rx="18" fill="#dbeafe" stroke="#cbd5e1" stroke-width="0.5"/>
<text x="80" y="243" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" fill="#14243a">Sidecar model</text>
<circle cx="88" cy="312" r="5" fill="#2563eb" stroke="none" stroke-width="1"/>
<text x="108" y="317" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#5d6d82">Proxy in every pod</text>
<circle cx="88" cy="370" r="5" fill="#2563eb" stroke="none" stroke-width="1"/>
<text x="108" y="375" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#5d6d82">Per-workload interception</text>
<circle cx="88" cy="428" r="5" fill="#2563eb" stroke="none" stroke-width="1"/>
<text x="108" y="433" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#5d6d82">Fine-grained policy; more resources</text>
<rect x="80" y="559" width="86.8" height="26" rx="13" fill="#2563eb" opacity="0.13"/>
<text x="123.4" y="577" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#2563eb">PATTERN A</text>
<rect x="661" y="205" width="565" height="400" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="661" y="205" width="565" height="58" rx="18" fill="#ede9fe" stroke="#cbd5e1" stroke-width="0.5"/>
<text x="687" y="243" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" fill="#14243a">Ambient model</text>
<circle cx="695" cy="312" r="5" fill="#7556c8" stroke="none" stroke-width="1"/>
<text x="715" y="317" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#5d6d82">Node-level ztunnel + waypoint</text>
<circle cx="695" cy="370" r="5" fill="#7556c8" stroke="none" stroke-width="1"/>
<text x="715" y="375" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#5d6d82">Layered L4/L7 handling</text>
<circle cx="695" cy="428" r="5" fill="#7556c8" stroke="none" stroke-width="1"/>
<text x="715" y="433" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#5d6d82">Less sidecar overhead; different trade-offs</text>
<rect x="687" y="559" width="86.8" height="26" rx="13" fill="#7556c8" opacity="0.13"/>
<text x="730.4" y="577" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#7556c8">PATTERN B</text>
<rect x="54" y="654" width="1172" height="64" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="72" y="669" width="101.2" height="26" rx="13" fill="#2563eb" opacity="0.13"/>
<text x="122.6" y="687" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#2563eb">DESIGN NOTE</text>
<text x="190" y="681" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#5d6d82">Ambient mode does not mean “no proxies”; node-level and waypoint components still implement the data plane.</text>
<text x="1224" y="741" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" fill="#5d6d82">sidecar-vs-ambient-mesh.svg</text>
</svg>