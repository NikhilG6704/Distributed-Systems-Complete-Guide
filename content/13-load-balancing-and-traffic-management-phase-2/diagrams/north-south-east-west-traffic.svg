<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">North-south vs. east-west traffic</title><desc id="desc">Ingress/egress crosses the platform boundary; east-west traffic connects internal services.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
 <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6d82"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/></filter>
</defs>
<rect width="1280" height="760" fill="#f4f7fb"/>
<rect x="0" y="0" width="1280" height="11" fill="#2563eb"/>
<text x="54" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#2563eb">DISTRIBUTED SYSTEMS  /  TRAFFIC MANAGEMENT</text>
<text x="54" y="94" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#14243a">North-south vs. east-west traffic</text>
<text x="54" y="126" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#5d6d82">Ingress/egress crosses the platform boundary; east-west traffic connects internal services.</text>
<line x1="54" y1="148" x2="1226" y2="148" stroke="#cbd5e1" stroke-width="1.5"/>

<rect x="54" y="235" width="1172" height="155" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1" filter="url(#shadow)"/>
<rect x="54" y="235" width="205" height="155" rx="14" fill="#2563eb" stroke="#2563eb" stroke-width="0"/>
<text x="75" y="283" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffffff">NORTH–SOUTH</text>
<text x="75" y="313" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#ffffff">External ingress and egress</text>
<text x="295" y="292" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#14243a">Internet ⇄ edge LB ⇄ API gateway ⇄ services</text>
<text x="295" y="330" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#5d6d82">Separate trust / ownership / telemetry boundary</text>
<rect x="54" y="425" width="1172" height="155" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1" filter="url(#shadow)"/>
<rect x="54" y="425" width="205" height="155" rx="14" fill="#7556c8" stroke="#7556c8" stroke-width="0"/>
<text x="75" y="473" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#ffffff">EAST–WEST</text>
<text x="75" y="503" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#ffffff">Internal service-to-service calls</text>
<text x="295" y="482" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#14243a">Service A ⇄ mesh proxy ⇄ Service B</text>
<text x="295" y="520" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#5d6d82">Separate trust / ownership / telemetry boundary</text>
<rect x="54" y="654" width="1172" height="64" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="72" y="669" width="101.2" height="26" rx="13" fill="#2563eb" opacity="0.13"/>
<text x="122.6" y="687" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#2563eb">DESIGN NOTE</text>
<text x="190" y="681" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#5d6d82">The two traffic classes often need different identity, routing, observability, and network-policy controls.</text>
<text x="1224" y="741" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" fill="#5d6d82">north-south-east-west-traffic.svg</text>
</svg>