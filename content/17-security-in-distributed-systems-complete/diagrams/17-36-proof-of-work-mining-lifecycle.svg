<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Proof of Work mining lifecycle</title><desc id="desc">Miners search nonce values until the block hash satisfies the current target; peers independently validate.</desc>
