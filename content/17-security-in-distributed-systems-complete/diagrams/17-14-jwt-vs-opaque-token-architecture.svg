<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">JWT vs opaque token architecture</title><desc id="desc">Local JWT validation avoids an online lookup; opaque tokens require introspection or trusted cached state.</desc>
