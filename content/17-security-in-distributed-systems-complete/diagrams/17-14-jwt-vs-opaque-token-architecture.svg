<rect x="52" y="770" width="1496" height="46" rx="13" fill="#FFF5D9" stroke="#A16207" stroke-width="1.2"/>
<text x="72" y="796" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#34445B">Trade-off: JWT improves local availability/latency; opaque tokens improve revocation freshness and reduce exposed claims. Cache TTL changes both properties.</text>
