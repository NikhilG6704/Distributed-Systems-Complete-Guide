<rect x="580" y="480" width="440" height="190" rx="22" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="10 8" opacity=".55"/>
<rect x="598" y="468" width="180" height="28" rx="8" fill="#F7F9FC"/>
<text x="608" y="488" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#475569">TRUSTED STATE</text>
<rect x="1105" y="480" width="440" height="190" rx="22" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="10 8" opacity=".55"/>
<rect x="1123" y="468" width="210" height="28" rx="8" fill="#F7F9FC"/>
<text x="1133" y="488" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#475569">SERVICE CONTINUITY</text>
<path d="M 650.0,235.0 L 640.0,240.0 L 640.0,260.0 L 770.0,260.0 L 760.0,262.5" fill="none" stroke="#2563EB" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity=".92" marker-end="url(#arrow-data)"/>
<path d="M 950.0,235.0 L 960.0,240.0 L 960.0,260.0 L 840.0,260.0 L 845.0,262.5" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity=".92" marker-end="url(#arrow-crypto)"/>
<path d="M 800.0,290.0 L 800.0,300.0 L 800.0,360.0 L 1540.0,360.0 L 1540.0,260.0 L 1530.0,262.5" fill="none" stroke="#15803D" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity=".92" marker-end="url(#arrow-good)"/>
<rect x="650" y="180" width="300" height="110" rx="18" fill="#EEF2F7" stroke="#475569" stroke-width="2"/>
<rect x="651" y="181" width="298" height="8" rx="4" fill="#475569" opacity=".9"/>
<circle cx="674" cy="211" r="7" fill="#475569"/>
<text x="692" y="218" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243A">Security objectives</text>
<text x="672" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" fill="#53657D">Protect systems, data, and</text>
<text x="672" y="272" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" fill="#53657D">operations</text>
<rect x="460" y="190" width="300" height="145" rx="18" fill="#EAF1FF" stroke="#2563EB" stroke-width="2"/>
<rect x="461" y="191" width="298" height="8" rx="4" fill="#2563EB" opacity=".9"/>
<circle cx="484" cy="221" r="7" fill="#2563EB"/>
<text x="502" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243A">Confidentiality</text>
<text x="482" y="260" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" fill="#53657D">Encryption • authorization •</text>
<text x="482" y="282" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" fill="#53657D">tenant isolation</text>
<rect x="845" y="190" width="300" height="145" rx="18" fill="#F1EBFF" stroke="#7C3AED" stroke-width="2"/>
<rect x="846" y="191" width="298" height="8" rx="4" fill="#7C3AED" opacity=".9"/>
<circle cx="869" cy="221" r="7" fill="#7C3AED"/>
<text x="887" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243A">Integrity</text>
<text x="867" y="260" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" fill="#53657D">MACs • signatures •</text>
<text x="867" y="282" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" fill="#53657D">validation • audit</text>
<rect x="1230" y="190" width="300" height="145" rx="18" fill="#E8F6EC" stroke="#15803D" stroke-width="2"/>
<rect x="1231" y="191" width="298" height="8" rx="4" fill="#15803D" opacity=".9"/>
<circle cx="1254" cy="221" r="7" fill="#15803D"/>
<text x="1272" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243A">Availability</text>
<text x="1252" y="260" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" fill="#53657D">Redundancy • rate limits •</text>
<text x="1252" y="282" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" fill="#53657D">recovery</text>
<rect x="52" y="770" width="1496" height="46" rx="13" fill="#FFF5D9" stroke="#A16207" stroke-width="1.2"/>
<text x="72" y="796" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#34445B">A control may improve one objective while constraining another: encryption protects confidentiality but key-service failure can affect availability.</text>
<line x1="65" y1="870" x2="93" y2="870" stroke="#2563EB" stroke-width="4"/>
<text x="103" y="875" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#53657D">Identity / request</text>
<line x1="350" y1="870" x2="378" y2="870" stroke="#0F766E" stroke-width="4"/>
<text x="388" y="875" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#53657D">Data flow</text>
<line x1="635" y1="870" x2="663" y2="870" stroke="#7C3AED" stroke-width="4"/>
<text x="673" y="875" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#53657D">Crypto</text>
<line x1="920" y1="870" x2="948" y2="870" stroke="#A16207" stroke-width="4"/>
<text x="958" y="875" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#53657D">Policy / control</text>
<line x1="1220" y1="870" x2="1248" y2="870" stroke="#C2413B" stroke-width="4"/>
<text x="1258" y="875" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#53657D">Threat / deny</text>
<text x="1535" y="893" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#8290A3">CHAPTER 17 · SECURITY IN DISTRIBUTED SYSTEMS</text>
</svg>