<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Symmetric vs asymmetric cryptography</title><desc id="desc">Symmetric keys protect bulk data; asymmetric keys support key agreement, identity, and signatures.</desc>
