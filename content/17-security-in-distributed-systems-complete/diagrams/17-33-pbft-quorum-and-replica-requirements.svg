<path d="M 830.0,365.0 L 830.0,380.0 L 830.0,510.0 L 830.0,520.0" fill="none" stroke="#15803D" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity=".92" marker-end="url(#arrow-good)"/>
<path d="M 1080.0,292.5 L 1070.0,290.0 L 1030.0,290.0 L 1030.0,590.0 L 1020.0,590.0 L 1010.0,592.5" fill="none" stroke="#15803D" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity=".92" marker-end="url(#arrow-good)"/>
<path d="M 1010.0,592.5 L 1020.0,590.0 L 1070.0,590.0 L 1080.0,592.5" fill="none" stroke="#15803D" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity=".92" marker-end="url(#arrow-good)"/>
