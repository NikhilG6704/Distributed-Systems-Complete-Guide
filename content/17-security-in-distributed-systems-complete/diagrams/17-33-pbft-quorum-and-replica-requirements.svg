<text x="673" y="875" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#53657D">Crypto</text>
<line x1="920" y1="870" x2="948" y2="870" stroke="#A16207" stroke-width="4"/>
<text x="958" y="875" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#53657D">Policy / control</text>
