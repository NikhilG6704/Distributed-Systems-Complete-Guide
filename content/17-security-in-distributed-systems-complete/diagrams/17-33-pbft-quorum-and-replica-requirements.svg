<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">PBFT quorum and replica requirements</title><desc id="desc">For f=2: n=3f+1=7 replicas; a 2f+1=5 quorum intersects another quorum in at least 3 replicas.</desc>
<defs>
 <marker id="arrow-data" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker>
 <marker id="arrow-control" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0E7490"/></marker>
 <marker id="arrow-crypto" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7C3AED"/></marker>
 <marker id="arrow-policy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#A16207"/></marker>
 <marker id="arrow-threat" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C2413B"/></marker>
 <marker id="arrow-good" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#15803D"/></marker>
 <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#10233F" flood-opacity=".08"/></filter>
</defs>
<rect x="0" y="0" width="1600" height="900" fill="#F7F9FC"/>
<rect x="0" y="0" width="1600" height="12" fill="#17365D"/>
<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#17243A">17-33 · PBFT quorum and replica requirements</text>
<text x="66" y="108" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#53657D">For f=2: n=3f+1=7 replicas; a 2f+1=5 quorum intersects another quorum in at least 3 replicas.</text>
<line x1="64" y1="132" x2="1536" y2="132" stroke="#D9E1EC" stroke-width="2"/>

