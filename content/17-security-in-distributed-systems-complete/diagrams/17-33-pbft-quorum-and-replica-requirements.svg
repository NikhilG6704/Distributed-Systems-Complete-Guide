<text x="78" y="178" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#475569">n = 3f + 1 = 7 REPLICAS</text>
<rect x="610" y="470" width="930" height="240" rx="22" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="10 8" opacity=".55"/>
<rect x="628" y="458" width="320" height="28" rx="8" fill="#F7F9FC"/>
