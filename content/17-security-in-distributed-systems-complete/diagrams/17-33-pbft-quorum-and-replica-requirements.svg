<circle cx="124" cy="251" r="7" fill="#475569"/>
<text x="142" y="258" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243A">Replica set</text>
<text x="122" y="290" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" fill="#53657D">R1 R2 R3 R4 R5 R6 R7</text>
<rect x="650" y="220" width="360" height="145" rx="18" fill="#EAF1FF" stroke="#2563EB" stroke-width="2"/>
<rect x="651" y="221" width="358" height="8" rx="4" fill="#2563EB" opacity=".9"/>
<circle cx="674" cy="251" r="7" fill="#2563EB"/>
<text x="692" y="258" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243A">Quorum A</text>
<text x="672" y="290" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" fill="#53657D">R1 R2 R3 R4 R5</text>
<rect x="1080" y="220" width="400" height="145" rx="18" fill="#E6F6FA" stroke="#0E7490" stroke-width="2"/>
<rect x="1081" y="221" width="398" height="8" rx="4" fill="#0E7490" opacity=".9"/>
<circle cx="1104" cy="251" r="7" fill="#0E7490"/>
<text x="1122" y="258" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243A">Quorum B</text>
<text x="1102" y="290" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" fill="#53657D">R3 R4 R5 R6 R7</text>
<rect x="650" y="520" width="360" height="145" rx="18" fill="#E8F6EC" stroke="#15803D" stroke-width="2"/>
<rect x="651" y="521" width="358" height="8" rx="4" fill="#15803D" opacity=".9"/>
<circle cx="674" cy="551" r="7" fill="#15803D"/>
<text x="692" y="558" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243A">Intersection</text>
<text x="672" y="590" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" fill="#53657D">R3 R4 R5 = 3 replicas</text>
<rect x="1080" y="520" width="400" height="145" rx="18" fill="#FDECEB" stroke="#C2413B" stroke-width="2"/>
<rect x="1081" y="521" width="398" height="8" rx="4" fill="#C2413B" opacity=".9"/>
<circle cx="1104" cy="551" r="7" fill="#C2413B"/>
<text x="1122" y="558" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243A">Fault bound</text>
<text x="1102" y="590" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" fill="#53657D">At most f=2 Byzantine; ≥1 honest in</text>
<text x="1102" y="612" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" fill="#53657D">intersection</text>
<rect x="52" y="770" width="1496" height="46" rx="13" fill="#FFF5D9" stroke="#A16207" stroke-width="1.2"/>
<text x="72" y="796" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#34445B">This is the classical partially synchronous authenticated PBFT setting; implementation and quorum details vary by protocol.</text>
