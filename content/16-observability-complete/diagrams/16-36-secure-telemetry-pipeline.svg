<rect width="1600" height="900" fill="#F5F8FC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2F6FEB"/>
<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">Secure telemetry pipeline</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">Observability platforms hold operationally sensitive data; security controls must span collection, processing, storage, query, and deletion.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<path d="M 280.0,422.5 L 350.0,422.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 600.0,422.5 L 670.0,422.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 925.0,422.5 L 995.0,422.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1245.0,422.5 L 1305.0,422.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1324.0,495.0 L 1192.2,600.0" fill="none" stroke="#D18A13" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-amber)"/><rect x="1226.1" y="521.5" width="64" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="1258.0851063829787" y="538.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="1258.0851063829787" dy="0">audit</tspan></text><path d="M 553.9,600.0 L 698.0,495.0" fill="none" stroke="#718096" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-slate)"/><rect x="592.0" y="521.5" width="68" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="625.9574468085107" y="538.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="625.9574468085107" dy="0">policy</tspan></text><g><rect x="45" y="350" width="235" height="145" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M63 350 H262 Q280 350 280 368 V362 H45 V368 Q45 350 63 350" fill="#EAF2FF"/><text x="63" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="63" dy="0">Workload telemetry</tspan></text><text x="63" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="63" dy="0">Metrics • logs •</tspan><tspan x="63" dy="20">traces</tspan><tspan x="63" dy="20">PII / secrets</tspan></text></g><g><rect x="350" y="350" width="250" height="145" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M368 350 H582 Q600 350 600 368 V362 H350 V368 Q350 350 368 350" fill="#E5F7F7"/><text x="368" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="368" dy="0">Authenticated collector</tspan></text><text x="368" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="368" dy="0">mTLS / workload</tspan><tspan x="368" dy="20">identity</tspan><tspan x="368" dy="20">TLS in transit</tspan></text></g><g><rect x="670" y="350" width="255" height="145" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="2.2"/><path d="M688 350 H907 Q925 350 925 368 V362 H670 V368 Q670 350 688 350" fill="#FDECEC"/><text x="688" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="688" dy="0">Policy enforcement</tspan></text><text x="688" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="688" dy="0">Redact • allowlist</tspan><tspan x="688" dy="20">normalize • tenant tag</tspan></text></g><g><rect x="995" y="350" width="250" height="145" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M1013 350 H1227 Q1245 350 1245 368 V362 H995 V368 Q995 350 1013 350" fill="#F2EDFF"/><text x="1013" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1013" dy="0">Regional store</tspan></text><text x="1013" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1013" dy="0">Encryption at rest</tspan><tspan x="1013" dy="20">keys • residency</tspan><tspan x="1013" dy="20">boundary</tspan></text></g><g><rect x="1305" y="350" width="220" height="145" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M1323 350 H1507 Q1525 350 1525 368 V362 H1305 V368 Q1305 350 1323 350" fill="#E9F8F0"/><text x="1323" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1323" dy="0">RBAC query access</tspan></text><text x="1323" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1323" dy="0">Tenant isolation</tspan><tspan x="1323" dy="20">least privilege</tspan></text></g><g><rect x="995" y="600" width="250" height="115" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M1013 600 H1227 Q1245 600 1245 618 V612 H995 V618 Q995 600 1013 600" fill="#FFF5DF"/><text x="1013" y="634" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1013" dy="0">Audit trail</tspan></text><text x="1013" y="665" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1013" dy="0">Access / export logs</tspan></text></g><g><rect x="350" y="600" width="250" height="115" rx="18" fill="#FFFFFF" stroke="#718096" stroke-width="2.2"/><path d="M368 600 H582 Q600 600 600 618 V612 H350 V618 Q350 600 368 600" fill="#EEF2F7"/><text x="368" y="634" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="368" dy="0">Governance controls</tspan></text><text x="368" y="665" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="368" dy="0">Key rotation • data</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Treat trace attributes and logs as potentially sensitive. Use least privilege, tenant boundaries, encryption, key management, redaction before</tspan><tspan x="88" dy="20">broad access, retention policy, and auditable access.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>