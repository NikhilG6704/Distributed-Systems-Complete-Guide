th="175" height="135" rx="18" fill="#FFFFFF" stroke="#718096" stroke-width="2.2"/><path d="M53 350 H192 Q210 350 210 368 V362 H35 V368 Q35 350 53 350" fill="#EEF2F7"/><text x="53" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="53" dy="0">Client</tspan></text><text x="53" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="53" dy="0">HTTP request</tspan><tspan x="53" dy="20">trace context</tspan></text></g><g><rect x="245" y="350" width="190" height="135" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M263 350 H417 Q435 350 435 368 V362 H245 V368 Q245 350 263 350" fill="#EAF2FF"/><text x="263" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="263" dy="0">API gateway</tspan></text><text x="263" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="263" dy="0">SERVER span</tspan><tspan x="263" dy="20">route + auth</tspan></text></g><g><rect x="470" y="350" width="190" height="135" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M488 350 H642 Q660 350 660 368 V362 H470 V368 Q470 350 488 350" fill="#EAF2FF"/><text x="488" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="488" dy="0">Auth service</tspan></text><text x="488" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="488" dy="0">SERVER span</tspan><tspan x="488" dy="20">identity decision</tspan></text></g><g><rect x="695" y="350" width="210" height="135" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M713 350 H887 Q905 350 905 368 V362 H695 V368 Q695 350 713 350" fill="#F2EDFF"/><text x="713" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="713" dy="0">Checkout service</tspan></text><text x="713" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="713" dy="0">SERVER span</tspan><tspan x="713" dy="20">parent of child</tspan></text></g><g><rect x="965" y="170" width="215" height="135" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M983 170 H1162 Q1180 170 1180 188 V182 H965 V188 Q965 170 983 170" fill="#E5F7F7"/><text x="983" y="204" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="983" dy="0">Cache / database</tspan></text><text x="983" y="235" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="983" dy="0">CLIENT spans</tspan><tspan x="983" dy="20">read + transaction</tspan></text></g><g><rect x="965" y="535" width="215" height="135" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M983 535 H1162 Q1180 535 1180 553 V547 H965 V553 Q965 535 983 535" fill="#FFF5DF"/><text x="983" y="569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="983" dy="0">Payment service</tspan></text><text x="983" y="600" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="983" dy="0">CLIENT → SERVER</tspan><tspan x="983" dy="20">authorization call</tspan></text></g><g><rect x="1245" y="350" width="190" height="135" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M1263 350 H1417 Q1435 350 1435 368 V362 H1245 V368 Q1245 350 1263 350" fill="#E9F8F0"/><text x="1263" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1263" dy="0">Kafka producer</tspan></text><text x="1263" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1263" dy="0">PRODUCER span</tspan><tspan x="1263" dy="20">trace context in</tspan></text></g><g><rect x="1245" y="585" width="235" height="125" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M1263 585 H1462 Q1480 585 1480 603 V597 H1245 V603 Q1245 585 1263 585" fill="#F2EDFF"/><text x="1263" y="619" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1263" dy="0">Consumer worker</tspan></text><text x="1263" y="650" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1263" dy="0">CONSUMER span</tspan><tspan x="1263" dy="20">continues</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">The trace ID stays stable across the distributed operation. Each span has its own span ID; parent-child relationships represent nested work,</tspan><tspan x="88" dy="20">while async links can represent causality without nesting.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>