<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">Kafka consumer lag investigation</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">Diagnose lag by comparing arrival and processing rates, then localize partition skew, rebalance, retries, and downstream bottlenecks.</text>
