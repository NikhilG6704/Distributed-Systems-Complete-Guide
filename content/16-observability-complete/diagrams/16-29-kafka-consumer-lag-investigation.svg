<path d="M 250.0,417.5 L 320.0,417.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 565.0,417.5 L 640.0,417.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 885.0,417.5 L 960.0,417.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1205.0,417.5 L 1260.0,417.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="1194.5" y="391.5" width="76" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="1232.5" y="408.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="1232.5" dy="0">observe</tspan></text><path d="M 762.5,485.0 L 762.5,585.0" fill="none" stroke="#D64545" stroke-width="3" marker-end="url(#arrow-red)"/><rect x="724.5" y="509.0" width="76" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="762.5" y="526.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="762.5" dy="0">failure</tspan></text><path d="M 846.9,585.0 L 987.6,485.0" fill="none" stroke="#D64545" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-red)"/><rect x="885.2" y="509.0" width="64" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="917.2252747252747" y="526.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="917.2252747252747" dy="0">retry</tspan></text><path d="M 1302.3,485.0 L 1164.9,585.0" fill="none" stroke="#159A62" stroke-width="3" marker-end="url(#arrow-green)"/><rect x="1167.6" y="509.0" width="132" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="1233.598901098901" y="526.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="1233.598901098901" dy="0">capacity check</tspan></text><g><rect x="40" y="350" width="210" height="135" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M58 350 H232 Q250 350 250 368 V362 H40 V368 Q40 350 58 350" fill="#EAF2FF"/><text x="58" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="58" dy="0">Producers</tspan></text><text x="58" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="58" dy="0">Arrival rate λ</tspan><tspan x="58" dy="20">records / second</tspan></text></g><g><rect x="320" y="350" width="245" height="135" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M338 350 H547 Q565 350 565 368 V362 H320 V368 Q320 350 338 350" fill="#E5F7F7"/><text x="338" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="338" dy="0">Kafka partitions</tspan></text><text x="338" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="338" dy="0">Offsets • hot</tspan><tspan x="338" dy="20">partition</tspan></text></g><g><rect x="640" y="350" width="245" height="135" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M658 350 H867 Q885 350 885 368 V362 H640 V368 Q640 350 658 350" fill="#F2EDFF"/><text x="658" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="658" dy="0">Consumer group</tspan></text><text x="658" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="658" dy="0">Workers • assignments</tspan><tspan x="658" dy="20">rebalance /</tspan></text></g><g><rect x="960" y="350" width="245" height="135" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M978 350 H1187 Q1205 350 1205 368 V362 H960 V368 Q960 350 978 350" fill="#FFF5DF"/><text x="978" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="978" dy="0">Downstream store</tspan></text><text x="978" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="978" dy="0">DB writes • rate μ</tspan><tspan x="978" dy="20">pool / lock contention</tspan></text></g><g><rect x="1260" y="350" width="270" height="135" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="2.2"/><path d="M1278 350 H1512 Q1530 350 1530 368 V362 H1260 V368 Q1260 350 1278 350" fill="#FDECEC"/><text x="1278" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1278" dy="0">Lag &amp; age metrics</tspan></text><text x="1278" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1278" dy="0">Offset lag • oldest age</tspan><tspan x="1278" dy="20">arrival vs process rate</tspan></text></g><g><rect x="640" y="585" width="245" height="120" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="2.2"/><path d="M658 585 H867 Q885 585 885 603 V597 H640 V603 Q640 585 658 585" fill="#FDECEC"/><text x="658" y="619" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="658" dy="0">Retry / DLQ</tspan></text><text x="658" y="650" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="658" dy="0">Poison messages</tspan></text></g><g><rect x="960" y="585" width="245" height="120" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M978 585 H1187 Q1205 585 1205 603 V597 H960 V603 Q960 585 978 585" fill="#E9F8F0"/><text x="978" y="619" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="978" dy="0">Drain-time estimate</tspan></text><text x="978" y="650" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="978" dy="0">If μ &gt; λ: lag ÷ (μ −</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">If arrival rate λ exceeds processing rate μ, backlog grows. When μ &gt; λ, approximate drain time is current lag ÷ (μ − λ), assuming rates remain</tspan><tspan x="88" dy="20">stable.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>