<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">The Four Golden Signals</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">Measure the service from the user’s perspective, then use internal resource signals to explain the symptoms.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<path d="M 795.0,285.0 L 795.0,385.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="745.0" y="309.0" width="100" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="795.0" y="326.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="795.0" dy="0">experience</tspan></text><path d="M 380.0,457.5 L 630.0,457.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="471.0" y="431.5" width="68" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="505.0" y="448.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="505.0" dy="0">demand</tspan></text><path d="M 960.0,457.5 L 1220.0,457.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="1052.0" y="431.5" width="76" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="1090.0" y="448.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="1090.0" dy="0">outcome</tspan></text><path d="M 795.0,530.0 L 795.0,620.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="753.0" y="549.0" width="84" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="795.0" y="566.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="795.0" dy="0">capacity</tspan></text><g><rect x="630" y="150" width="330" height="135" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M648 150 H942 Q960 150 960 168 V162 H630 V168 Q630 150 648 150" fill="#EAF2FF"/><text x="648" y="184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="648" dy="0">LATENCY</tspan></text><text x="648" y="215" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="648" dy="0">P50 / P95 / P99</tspan><tspan x="648" dy="20">Successful and failed</tspan></text></g><g><rect x="70" y="385" width="310" height="145" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M88 385 H362 Q380 385 380 403 V397 H70 V403 Q70 385 88 385" fill="#E5F7F7"/><text x="88" y="419" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="88" dy="0">TRAFFIC</tspan></text><text x="88" y="450" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Requests / second</tspan><tspan x="88" dy="20">Transactions / second</tspan><tspan x="88" dy="20">Messages / second</tspan></text></g><g><rect x="630" y="385" width="330" height="145" rx="18" fill="#FFFFFF" stroke="#718096" stroke-width="2.2"/><path d="M648 385 H942 Q960 385 960 403 V397 H630 V403 Q630 385 648 385" fill="#EEF2F7"/><text x="648" y="419" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="648" dy="0">SERVICE</tspan></text><text x="648" y="450" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="648" dy="0">Customer journey</tspan><tspan x="648" dy="20">API / checkout / payment</tspan><tspan x="648" dy="20">Measure outcomes</tspan></text></g><g><rect x="1220" y="385" width="310" height="145" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="2.2"/><path d="M1238 385 H1512 Q1530 385 1530 403 V397 H1220 V403 Q1220 385 1238 385" fill="#FDECEC"/><text x="1238" y="419" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1238" dy="0">ERRORS</tspan></text><text x="1238" y="450" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1238" dy="0">Failure ratio / count</tspan><tspan x="1238" dy="20">Timeouts • wrong results</tspan><tspan x="1238" dy="20">Eligible operations</tspan></text></g><g><rect x="630" y="620" width="330" height="135" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M648 620 H942 Q960 620 960 638 V632 H630 V638 Q630 620 648 620" fill="#FFF5DF"/><text x="648" y="654" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="648" dy="0">SATURATION</tspan></text><text x="648" y="685" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="648" dy="0">Queue / pool wait</tspan><tspan x="648" dy="20">CPU throttle • disk queue</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Latency should separate successful and failed requests. Traffic describes demand; errors describe bad outcomes; saturation indicates a</tspan><tspan x="88" dy="20">constrained resource or loss of headroom.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>