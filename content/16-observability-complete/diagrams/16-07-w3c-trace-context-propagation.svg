<rect width="1600" height="900" fill="#F5F8FC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2F6FEB"/>
<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">W3C Trace Context propagation</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">traceparent carries trace identity and the caller span; tracestate carries vendor-specific state under defined limits.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<path d="M 300.0,417.5 L 390.0,417.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="311.0" y="391.5" width="68" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="345.0" y="408.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="345.0" dy="0">inject</tspan></text><path d="M 660.0,417.5 L 755.0,417.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="653.5" y="391.5" width="108" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="707.5" y="408.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="707.5" dy="0">HTTP / gRPC</tspan></text><path d="M 1015.0,417.5 L 1110.0,417.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="1024.5" y="391.5" width="76" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="1062.5" y="408.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="1062.5" dy="0">extract</tspan></text><g><rect x="55" y="340" width="245" height="155" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M73 340 H282 Q300 340 300 358 V352 H55 V358 Q55 340 73 340" fill="#EAF2FF"/><text x="73" y="374" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="73" dy="0">Service A</tspan></text><text x="73" y="405" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="73" dy="0">Create SERVER span</tspan><tspan x="73" dy="20">trace_id = T</tspan><tspan x="73" dy="20">span_id = A</tspan></text></g><g><rect x="390" y="340" width="270" height="155" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M408 340 H642 Q660 340 660 358 V352 H390 V358 Q390 340 408 340" fill="#F2EDFF"/><text x="408" y="374" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="408" dy="0">Inject headers</tspan></text><text x="408" y="405" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="408" dy="0">traceparent: version /</tspan><tspan x="408" dy="20">flags</tspan><tspan x="408" dy="20">trace-id = T</tspan></text></g><g><rect x="755" y="340" width="260" height="155" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M773 340 H997 Q1015 340 1015 358 V352 H755 V358 Q755 340 773 340" fill="#FFF5DF"/><text x="773" y="374" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="773" dy="0">Proxy / gateway</tspan></text><text x="773" y="405" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="773" dy="0">Forward allowed context</tspan><tspan x="773" dy="20">validate format + trust</tspan><tspan x="773" dy="20">boundary policy</tspan></text></g><g><rect x="1110" y="340" width="265" height="155" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M1128 340 H1357 Q1375 340 1375 358 V352 H1110 V358 Q1110 340 1128 340" fill="#E9F8F0"/><text x="1128" y="374" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1128" dy="0">Service B</tspan></text><text x="1128" y="405" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1128" dy="0">Extract trace context</tspan><tspan x="1128" dy="20">create child span B</tspan><tspan x="1128" dy="20">parent_id = A</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">At each service boundary, trace_id remains stable while the current span_id becomes the parent ID for the next span. Never trust arbitrary</tspan><tspan x="88" dy="20">baggage as authorization data.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>