<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">RED vs USE methodology</title><desc id="desc">RED is request-centric; USE is resource-centric. Golden Signals combine user-visible symptoms with system saturation.</desc>
<defs>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#19324D" flood-opacity=".08"/></filter>
 <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F6FEB"/></marker>
 <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#159A62"/></marker>
 <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D18A13"/></marker>
 <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D64545"/></marker>
 <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#805AD5"/></marker>
 <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#159A9A"/></marker>
 <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#718096"/></marker>
</defs>
<rect width="1600" height="900" fill="#F5F8FC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2F6FEB"/>
<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">RED vs USE methodology</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">RED is request-centric; USE is resource-centric. Golden Signals combine user-visible symptoms with system saturation.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<path d="M 385.0,386.0 L 485.0,426.6" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 385.0,490.2 L 485.0,486.9" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 373.0,600.0 L 485.0,547.3" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1198.6,390.0 L 1280.0,425.6" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1200.0,489.8 L 1280.0,487.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1178.2,600.0 L 1280.0,548.4" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 760.0,482.5 L 1280.0,482.5" fill="none" stroke="#805AD5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-purple)"/><rect x="950.0" y="456.5" width="140" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="1020.0" y="473.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="1020.0" dy="0">symptom ↔ cause</tspan></text><g><rect x="85" y="260" width="300" height="130" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M103 260 H367 Q385 260 385 278 V272 H85 V278 Q85 260 103 260" fill="#EAF2FF"/><text x="103" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="103" dy="0">RED: Rate</tspan></text><text x="103" y="325" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="103" dy="0">Requests / second</tspan><tspan x="103" dy="20">Per route and service</tspan></text></g><g><rect x="85" y="430" width="300" height="130" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="2.2"/><path d="M103 430 H367 Q385 430 385 448 V442 H85 V448 Q85 430 103 430" fill="#FDECEC"/><text x="103" y="464" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="103" dy="0">RED: Errors</tspan></text><text x="103" y="495" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="103" dy="0">Failed operations / total</tspan><tspan x="103" dy="20">Classify by cause</tspan></text></g><g><rect x="85" y="600" width="300" height="130" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M103 600 H367 Q385 600 385 618 V612 H85 V618 Q85 600 103 600" fill="#E5F7F7"/><text x="103" y="634" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="103" dy="0">RED: Duration</tspan></text><text x="103" y="665" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="103" dy="0">Latency distribution</tspan><tspan x="103" dy="20">P50 • P95 • P99</tspan></text></g><g><rect x="485" y="405" width="275" height="155" rx="18" fill="#FFFFFF" stroke="#718096" stroke-width="2.2"/><path d="M503 405 H742 Q760 405 760 423 V417 H485 V423 Q485 405 503 405" fill="#EEF2F7"/><text x="503" y="439" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="503" dy="0">Service / API</tspan></text><text x="503" y="470" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="503" dy="0">Request-centric view</tspan><tspan x="503" dy="20">What users experience</tspan></text></g><g><rect x="900" y="260" width="300" height="130" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M918 260 H1182 Q1200 260 1200 278 V272 H900 V278 Q900 260 918 260" fill="#F2EDFF"/><text x="918" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="918" dy="0">USE: Utilization</tspan></text><text x="918" y="325" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="918" dy="0">Busy / available capacity</tspan><tspan x="918" dy="20">CPU • pool • disk</tspan></text></g><g><rect x="900" y="430" width="300" height="130" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M918 430 H1182 Q1200 430 1200 448 V442 H900 V448 Q900 430 918 430" fill="#FFF5DF"/><text x="918" y="464" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="918" dy="0">USE: Saturation</tspan></text><text x="918" y="495" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="918" dy="0">Queue / wait / backlog</tspan><tspan x="918" dy="20">Demand beyond capacity</tspan></text></g><g><rect x="900" y="600" width="300" height="130" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="2.2"/><path d="M918 600 H1182 Q1200 600 1200 618 V612 H900 V618 Q900 600 918 600" fill="#FDECEC"/><text x="918" y="634" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="918" dy="0">USE: Errors</tspan></text><text x="918" y="665" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="918" dy="0">Resource failures</tspan><tspan x="918" dy="20">I/O errors • drops</tspan></text></g><g><rect x="1280" y="405" width="260" height="155" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M1298 405 H1522 Q1540 405 1540 423 V417 H1280 V423 Q1280 405 1298 405" fill="#E9F8F0"/><text x="1298" y="439" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1298" dy="0">Resource view</tspan></text><text x="1298" y="470" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1298" dy="0">CPU • disk • network</tspan><tspan x="1298" dy="20">DB pool • thread pool</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Use RED for APIs and services. Use USE for CPU, disks, network devices, connection pools, and queues; map observed symptoms to candidate resource</tspan><tspan x="88" dy="20">constraints.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>