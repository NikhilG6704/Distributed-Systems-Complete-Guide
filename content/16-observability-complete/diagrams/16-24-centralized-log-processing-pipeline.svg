x="73" dy="0">Apps • hosts • audit</tspan><tspan x="73" dy="20">containers /</tspan><tspan x="73" dy="20">functions</tspan></text></g><g><rect x="306" y="260" width="235" height="150" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M324 260 H523 Q541 260 541 278 V272 H306 V278 Q306 260 324 260" fill="#EAF2FF"/><text x="324" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="324" dy="0">Collector</tspan></text><text x="324" y="325" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="324" dy="0">Tail files • stdout</tspan><tspan x="324" dy="20">forward / buffer</tspan></text></g><g><rect x="557" y="260" width="235" height="150" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M575 260 H774 Q792 260 792 278 V272 H557 V278 Q557 260 575 260" fill="#E5F7F7"/><text x="575" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="575" dy="0">Parser</tspan></text><text x="575" y="325" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="575" dy="0">JSON • regex • schema</tspan><tspan x="575" dy="20">malformed quarantine</tspan></text></g><g><rect x="808" y="260" width="235" height="150" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M826 260 H1025 Q1043 260 1043 278 V272 H808 V278 Q808 260 826 260" fill="#F2EDFF"/><text x="826" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="826" dy="0">Enrichment</tspan></text><text x="826" y="325" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="826" dy="0">Service • region</tspan><tspan x="826" dy="20">Kubernetes metadata</tspan></text></g><g><rect x="1059" y="260" width="235" height="150" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="2.2"/><path d="M1077 260 H1276 Q1294 260 1294 278 V272 H1059 V278 Q1059 260 1077 260" fill="#FDECEC"/><text x="1077" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1077" dy="0">Redact / filter</tspan></text><text x="1077" y="325" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1077" dy="0">PII • secrets •</tspan><tspan x="1077" dy="20">policy</tspan><tspan x="1077" dy="20">drop / route</tspan></text></g><g><rect x="1310" y="260" width="235" height="150" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M1328 260 H1527 Q1545 260 1545 278 V272 H1310 V278 Q1310 260 1328 260" fill="#FFF5DF"/><text x="1328" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1328" dy="0">Buffer / transport</tspan></text><text x="1328" y="325" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1328" dy="0">Batch • retry • queue</tspan><tspan x="1328" dy="20">backpressure</tspan></text></g><g><rect x="420" y="565" width="300" height="130" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M438 565 H702 Q720 565 720 583 V577 H420 V583 Q420 565 438 565" fill="#F2EDFF"/><text x="438" y="599" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="438" dy="0">Index / storage</tspan></text><text x="438" y="630" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="438" dy="0">Loki • Elastic / OpenSearch</tspan><tspan x="438" dy="20">index only needed fields</tspan></text></g><g><rect x="800" y="565" width="260" height="130" rx="18" fill="#FFFFFF" stroke="#718096" stroke-width="2.2"/><path d="M818 565 H1042 Q1060 565 1060 583 V577 H800 V583 Q800 565 818 565" fill="#EEF2F7"/><text x="818" y="599" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="818" dy="0">Archive</tspan></text><text x="818" y="630" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="818" dy="0">Object storage</tspan><tspan x="818" dy="20">compressed / cold tier</tspan></text></g><g><rect x="1160" y="565" width="300" height="130" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M1178 565 H1442 Q1460 565 1460 583 V577 H1160 V583 Q1160 565 1178 565" fill="#E9F8F0"/><text x="1178" y="599" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1178" dy="0">Search / audit</tspan></text><text x="1178" y="630" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1178" dy="0">Query UI • access audit</tspan><tspan x="1178" dy="20">trace_id correlation</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Do not let malformed records disappear silently: quarantine or count them. Separate hot search indexes from low-cost archives and retain audit</tspan><tspan x="88" dy="20">evidence for access and policy actions.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>