<rect width="1600" height="900" fill="#F5F8FC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2F6FEB"/>
<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">Trace and span hierarchy</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">A trace is a collection of related spans; links connect causally related work that is not a simple parent-child subtree.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<path d="M 625.0,297.0 L 360.0,406.1" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="460.5" y="325.5" width="64" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="492.5" y="342.53761061946904" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="492.5" dy="0">child</tspan></text><path d="M 745.2,300.0 L 679.4,390.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="680.3" y="319.0" width="64" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="712.258064516129" y="336.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="712.258064516129" dy="0">child</tspan></text><path d="M 760.0,457.5 L 895.0,457.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="795.5" y="431.5" width="64" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="827.5" y="448.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="827.5" dy="0">child</tspan></text><path d="M 628.4,525.0 L 626.5,605.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="595.4" y="539.0" width="64" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="627.4404761904761" y="556.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="627.4404761904761" dy="0">child</tspan></text><path d="M 760.0,496.4 L 1190.0,624.9" fill="none" stroke="#805AD5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-purple)"/><rect x="943.0" y="534.6" width="64" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="975.0" y="551.6316725978647" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="975.0" dy="0">link</tspan></text><g><rect x="625" y="150" width="350" height="150" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M643 150 H957 Q975 150 975 168 V162 H625 V168 Q625 150 643 150" fill="#F2EDFF"/><text x="643" y="184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="643" dy="0">Root span: POST /checkout</tspan></text><text x="643" y="215" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="643" dy="0">trace_id: 7f…91</tspan><tspan x="643" dy="20">span_id: a10 • parent: none</tspan><tspan x="643" dy="20">status: OK • 240 ms</tspan></text></g><g><rect x="110" y="390" width="250" height="135" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M128 390 H342 Q360 390 360 408 V402 H110 V408 Q110 390 128 390" fill="#EAF2FF"/><text x="128" y="424" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="128" dy="0">Gateway span</tspan></text><text x="128" y="455" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="128" dy="0">span_id: b20</tspan><tspan x="128" dy="20">parent: a10 • 18 ms</tspan></text></g><g><rect x="500" y="390" width="260" height="135" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M518 390 H742 Q760 390 760 408 V402 H500 V408 Q500 390 518 390" fill="#EAF2FF"/><text x="518" y="424" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="518" dy="0">Checkout span</tspan></text><text x="518" y="455" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="518" dy="0">span_id: c30</tspan><tspan x="518" dy="20">parent: a10 • 190 ms</tspan></text></g><g><rect x="895" y="390" width="245" height="135" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M913 390 H1122 Q1140 390 1140 408 V402 H895 V408 Q895 390 913 390" fill="#FFF5DF"/><text x="913" y="424" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="913" dy="0">Payment span</tspan></text><text x="913" y="455" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="913" dy="0">span_id: d40</tspan><tspan x="913" dy="20">parent: c30 • 80 ms</tspan></text></g><g><rect x="500" y="605" width="250" height="125" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M518 605 H732 Q750 605 750 623 V617 H500 V623 Q500 605 518 605" fill="#E5F7F7"/><text x="518" y="639" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="518" dy="0">DB query span</tspan></text><text x="518" y="670" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="518" dy="0">span_id: e50</tspan><tspan x="518" dy="20">parent: c30 • 35 ms</tspan></text></g><g><rect x="1190" y="605" width="285" height="125" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M1208 605 H1457 Q1475 605 1475 623 V617 H1190 V623 Q1190 605 1208 605" fill="#F2EDFF"/><text x="1208" y="639" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1208" dy="0">Async consumer link</tspan></text><text x="1208" y="670" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1208" dy="0">span_id: f60 • link to c30</tspan><tspan x="1208" dy="20">starts after queue delay</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Each span records start/end time, operation name, kind, attributes, events, status, and context. Events are timestamped annotations inside a</tspan><tspan x="88" dy="20">span; they are not separate spans.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>