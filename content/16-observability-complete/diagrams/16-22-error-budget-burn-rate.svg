<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Error budget and burn-rate visualization</title><desc id="desc">Illustrative 99.9% availability SLO: 0.1% bad-event allowance over the measurement window.</desc>
<defs>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#19324D" flood-opacity=".08"/></filter>
