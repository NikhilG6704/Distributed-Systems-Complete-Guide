<rect width="1600" height="900" fill="#F5F8FC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2F6FEB"/>
<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">Error budget and burn-rate visualization</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">Illustrative 99.9% availability SLO: 0.1% bad-event allowance over the measurement window.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text><rect x="180" y="225" width="1260" height="435" rx="18" fill="#FFFFFF" stroke="#D9E3EF"/><line x1="250" y1="245.0" x2="1410" y2="245.0" stroke="#E6ECF3" stroke-dasharray="5 7"/><text x="232" y="250.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#526581" text-anchor="end"><tspan x="232" dy="0">100%</tspan></text><line x1="250" y1="337.5" x2="1410" y2="337.5" stroke="#E6ECF3" stroke-dasharray="5 7"/><text x="232" y="342.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#526581" text-anchor="end"><tspan x="232" dy="0">75%</tspan></text><line x1="250" y1="430.0" x2="1410" y2="430.0" stroke="#E6ECF3" stroke-dasharray="5 7"/><text x="232" y="435.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#526581" text-anchor="end"><tspan x="232" dy="0">50%</tspan></text><line x1="250" y1="522.5" x2="1410" y2="522.5" stroke="#E6ECF3" stroke-dasharray="5 7"/><text x="232" y="527.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#526581" text-anchor="end"><tspan x="232" dy="0">25%</tspan></text><line x1="250" y1="615.0" x2="1410" y2="615.0" stroke="#E6ECF3" stroke-dasharray="5 7"/><text x="232" y="620.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#526581" text-anchor="end"><tspan x="232" dy="0">0%</tspan></text><polyline points="265.0,245.0 311.5,259.8 357.9,274.6 404.4,289.4 450.8,304.2 497.3,319.0 543.8,333.8 590.2,348.6 636.7,363.4 683.1,378.2 729.6,393.0 776.0,407.8 822.5,422.6 869.0,437.4 915.4,452.2 961.9,467.0 1008.3,481.8 1054.8,496.6 1101.2,511.4 1147.7,526.2 1194.2,541.0 1240.6,555.8 1287.1,570.6 1333.5,585.4 1380.0,600.2" fill="none" stroke="#2F6FEB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1147.7,526.2 1194.2,541.0 1240.6,555.8 1287.1,570.6 1333.5,585.4 1380.0,600.2" fill="none" stroke="#D64545" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="185" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="220" dy="0">Remaining error budget</tspan></text><text x="1430" y="185" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#526581" text-anchor="end"><tspan x="1430" dy="0">Illustrative time window →</tspan></text><rect x="240" y="700" width="350" height="54" rx="12" fill="#E9F8F0" stroke="#159A62"/><text x="260" y="722" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#087443" text-anchor="start"><tspan x="260" dy="0">Normal burn</tspan></text><text x="260" y="742" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#526581" text-anchor="start"><tspan x="260" dy="0">Observed bad ratio near allowed rate</tspan></text><rect x="635" y="700" width="390" height="54" rx="12" fill="#FFF5DF" stroke="#D18A13"/><text x="655" y="722" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#9A5B00" text-anchor="start"><tspan x="655" dy="0">Fast burn</tspan></text><text x="655" y="742" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#526581" text-anchor="start"><tspan x="655" dy="0">Short + long windows confirm sustained impact</tspan></text><rect x="1070" y="700" width="350" height="54" rx="12" fill="#FDECEC" stroke="#D64545"/><text x="1090" y="722" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#A82727" text-anchor="start"><tspan x="1090" dy="0">Page / investigate</tspan></text><text x="1090" y="742" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#526581" text-anchor="start"><tspan x="1090" dy="0">Protect remaining budget</tspan></text><text x="180" y="810" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#526581" text-anchor="start"><tspan x="180" dy="0">Burn rate = observed bad-event ratio ÷ allowed bad-event ratio. Example: 1% bad events ÷ 0.1% budget = 10× burn.</tspan></text></svg>