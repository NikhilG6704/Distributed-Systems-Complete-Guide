ly="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="638" dy="0">Pull /metrics on</tspan><tspan x="638" dy="20">interval</tspan><tspan x="638" dy="20">Target health •</tspan></text></g><g><rect x="620" y="535" width="245" height="145" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M638 535 H847 Q865 535 865 553 V547 H620 V553 Q620 535 638 535" fill="#E5F7F7"/><text x="638" y="569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="638" dy="0">OTLP receiver</tspan></text><text x="638" y="600" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="638" dy="0">Push metrics from SDKs</tspan><tspan x="638" dy="20">Batch • resource</tspan><tspan x="638" dy="20">attributes</tspan></text></g><g><rect x="940" y="350" width="235" height="155" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M958 350 H1157 Q1175 350 1175 368 V362 H940 V368 Q940 350 958 350" fill="#F2EDFF"/><text x="958" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="958" dy="0">TSDB</tspan></text><text x="958" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="958" dy="0">Time-series storage</tspan><tspan x="958" dy="20">Labels • retention •</tspan><tspan x="958" dy="20">downsample</tspan></text></g><g><rect x="1245" y="150" width="245" height="145" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M1263 150 H1472 Q1490 150 1490 168 V162 H1245 V168 Q1245 150 1263 150" fill="#FFF5DF"/><text x="1263" y="184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1263" dy="0">Query &amp; rules</tspan></text><text x="1263" y="215" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1263" dy="0">PromQL • recording</tspan><tspan x="1263" dy="20">rules</tspan><tspan x="1263" dy="20">Remote write /</tspan></text></g><g><rect x="1245" y="535" width="245" height="145" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M1263 535 H1472 Q1490 535 1490 553 V547 H1245 V553 Q1245 535 1263 535" fill="#E9F8F0"/><text x="1263" y="569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1263" dy="0">Grafana / alerts</tspan></text><text x="1263" y="600" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1263" dy="0">Dashboards • SLO views</tspan><tspan x="1263" dy="20">Alert routing</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Metric types: counter = cumulative events; gauge = current value; histogram = bucketed distribution. Keep user IDs, raw URLs, and request IDs out</tspan><tspan x="88" dy="20">of metric labels.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" 