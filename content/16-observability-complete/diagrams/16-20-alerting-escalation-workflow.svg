t-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="348" dy="0">Rule evaluation</tspan></text><text x="348" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="348" dy="0">Window • threshold</tspan><tspan x="348" dy="20">anomaly /</tspan></text></g><g><rect x="630" y="355" width="250" height="140" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M648 355 H862 Q880 355 880 373 V367 H630 V373 Q630 355 648 355" fill="#F2EDFF"/><text x="648" y="389" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="648" dy="0">Group &amp; deduplicate</tspan></text><text x="648" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="648" dy="0">Labels • inhibition</tspan><tspan x="648" dy="20">silence • correlation</tspan></text></g><g><rect x="950" y="355" width="235" height="140" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M968 355 H1167 Q1185 355 1185 373 V367 H950 V373 Q950 355 968 355" fill="#E5F7F7"/><text x="968" y="389" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="968" dy="0">Route by ownership</tspan></text><text x="968" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="968" dy="0">Service team •</tspan><tspan x="968" dy="20">severity</tspan></text></g><g><rect x="1250" y="355" width="270" height="140" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="2.2"/><path d="M1268 355 H1502 Q1520 355 1520 373 V367 H1250 V373 Q1250 355 1268 355" fill="#FDECEC"/><text x="1268" y="389" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1268" dy="0">On-call acknowledge</tspan></text><text x="1268" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1268" dy="0">Escalation timer</tspan><tspan x="1268" dy="20">runbook + context</tspan></text></g><g><rect x="1250" y="590" width="270" height="115" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M1268 590 H1502 Q1520 590 1520 608 V602 H1250 V608 Q1250 590 1268 590" fill="#E9F8F0"/><text x="1268" y="624" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1268" dy="0">Mitigate &amp; verify</tspan></text><text x="1268" y="655" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1268" dy="0">Rollback • failover</tspan></text></g><g><rect x="950" y="590" width="235" height="115" rx="18" fill="#FFFFFF" stroke="#718096" stroke-width="2.2"/><path d="M968 590 H1167 Q1185 590 1185 608 V602 H950 V608 Q950 590 968 590" fill="#EEF2F7"/><text x="968" y="624" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="968" dy="0">Resolve / learn</tspan></text><text x="968" y="655" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="968" dy="0">Close incident</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Page for urgent action; ticket lower-priority work. Include runbooks, grouping, deduplication, ownership, escalation, and recovery validation.</tspan><tspan x="88" dy="20">Avoid paging on every raw resource threshold.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" 