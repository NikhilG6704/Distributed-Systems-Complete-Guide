#2F6FEB" stroke-width="2.2"/><path d="M353 355 H567 Q585 355 585 373 V367 H335 V373 Q335 355 353 355" fill="#EAF2FF"/><text x="353" y="389" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="353" dy="0">Instrumentation library</tspan></text><text x="353" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="353" dy="0">HTTP • DB • RPC •</tspan><tspan x="353" dy="20">runtime</tspan><tspan x="353" dy="20">creates spans /</tspan></text></g><g><rect x="650" y="355" width="210" height="145" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M668 355 H842 Q860 355 860 373 V367 H650 V373 Q650 355 668 355" fill="#E5F7F7"/><text x="668" y="389" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="668" dy="0">OTel API</tspan></text><text x="668" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="668" dy="0">Stable interfaces</tspan><tspan x="668" dy="20">no-op API possible</tspan></text></g><g><rect x="925" y="355" width="250" height="145" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M943 355 H1157 Q1175 355 1175 373 V367 H925 V373 Q925 355 943 355" fill="#F2EDFF"/><text x="943" y="389" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="943" dy="0">OTel SDK</tspan></text><text x="943" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="943" dy="0">Resource + scope</tspan><tspan x="943" dy="20">context manager •</tspan><tspan x="943" dy="20">sampler</tspan></text></g><g><rect x="1240" y="355" width="260" height="145" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M1258 355 H1482 Q1500 355 1500 373 V367 H1240 V373 Q1240 355 1258 355" fill="#FFF5DF"/><text x="1258" y="389" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1258" dy="0">Processors / exporter</tspan></text><text x="1258" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1258" dy="0">Batch processor</tspan><tspan x="1258" dy="20">OTLP exporter</tspan></text></g><g><rect x="925" y="570" width="250" height="110" rx="18" fill="#FFFFFF" stroke="#718096" stroke-width="2.2"/><path d="M943 570 H1157 Q1175 570 1175 588 V582 H925 V588 Q925 570 943 570" fill="#EEF2F7"/><text x="943" y="604" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="943" dy="0">Resource attributes</tspan></text><text x="943" y="635" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="943" dy="0">service.name • version</tspan></text></g><g><rect x="1240" y="570" width="260" height="110" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M1258 570 H1482 Q1500 570 1500 588 V582 H1240 V588 Q1240 570 1258 570" fill="#E9F8F0"/><text x="1258" y="604" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1258" dy="0">Sampling policy</tspan></text><text x="1258" y="635" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1258" dy="0">Parent-based / ratio</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Resource describes the emitting entity; instrumentation scope describes the library. A BatchSpanProcessor reduces export overhead but introduces</tspan><tspan x="88" dy="20">bounded buffering and shutdown-flush requirements.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>