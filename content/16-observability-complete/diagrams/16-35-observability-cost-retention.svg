<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">Observability cost and retention architecture</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">Control volume before ingest, then assign different performance and retention characteristics to hot, warm, and cold data.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<path d="M 290.0,422.5 L 370.0,422.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 625.0,422.5 L 720.0,422.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="622.5" y="396.5" width="100" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="672.5" y="413.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="672.5" dy="0">age / tier</tspan></text><path d="M 995.0,422.5 L 1090.0,422.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="1004.5" y="396.5" width="76" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="1042.5" y="413.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="1042.5" dy="0">archive</tspan></text><path d="M 1217.5,495.0 L 1217.5,600.0" fill="none" stroke="#159A62" stroke-width="3" marker-end="url(#arrow-green)"/><rect x="1179.5" y="521.5" width="76" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="1217.5" y="538.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="1217.5" dy="0">restore</tspan></text><path d="M 497.5,600.0 L 497.5,495.0" fill="none" stroke="#805AD5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-purple)"/><rect x="447.5" y="521.5" width="100" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="497.5" y="538.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="497.5" dy="0">governance</tspan></text><g><rect x="45" y="350" width="245" height="145" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M63 350 H272 Q290 350 290 368 V362 H45 V368 Q45 350 63 350" fill="#EAF2FF"/><text x="63" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="63" dy="0">Ingestion controls</tspan></text><text x="63" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="63" dy="0">Metric cardinality</tspan><tspan x="63" dy="20">log filters • trace</tspan><tspan x="63" dy="20">sample</tspan></text></g><g><rect x="370" y="350" width="255" height="145" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="2.2"/><path d="M388 350 H607 Q625 350 625 368 V362 H370 V368 Q370 350 388 350" fill="#FDECEC"/><text x="388" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="388" dy="0">Hot tier</tspan></text><text x="388" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="388" dy="0">Fast search • short</tspan><tspan x="388" dy="20">retention</tspan><tspan x="388" dy="20">replicas + index</tspan></text></g><g><rect x="720" y="350" width="275" height="145" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M738 350 H977 Q995 350 995 368 V362 H720 V368 Q720 350 738 350" fill="#FFF5DF"/><text x="738" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="738" dy="0">Warm tier</tspan></text><text x="738" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="738" dy="0">Compressed / downsampled</tspan><tspan x="738" dy="20">slower query • medium</tspan><tspan x="738" dy="20">retention</tspan></text></g><g><rect x="1090" y="350" width="255" height="145" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M1108 350 H1327 Q1345 350 1345 368 V362 H1090 V368 Q1090 350 1108 350" fill="#E5F7F7"/><text x="1108" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1108" dy="0">Cold archive</tspan></text><text x="1108" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1108" dy="0">Object storage</tspan><tspan x="1108" dy="20">low-cost • restore</tspan><tspan x="1108" dy="20">delay</tspan></text></g><g><rect x="1090" y="600" width="255" height="120" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M1108 600 H1327 Q1345 600 1345 618 V612 H1090 V618 Q1090 600 1108 600" fill="#E9F8F0"/><text x="1108" y="634" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1108" dy="0">Query / restore</tspan></text><text x="1108" y="665" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1108" dy="0">Query cost • scan</tspan></text></g><g><rect x="370" y="600" width="255" height="120" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M388 600 H607 Q625 600 625 618 V612 H370 V618 Q370 600 388 600" fill="#F2EDFF"/><text x="388" y="634" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="388" dy="0">Retention policy</tspan></text><text x="388" y="665" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="388" dy="0">By signal + use case</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Cost drivers include samples × labels × retention, log bytes × indexing/replicas, spans × sampling, query scans, and export/egress. Retention</tspan><tspan x="88" dy="20">should reflect incident and compliance needs.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>