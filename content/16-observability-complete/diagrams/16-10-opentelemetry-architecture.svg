<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">OpenTelemetry architecture</title><desc id="desc">OpenTelemetry standardizes instrumentation and telemetry transport; it is not itself a storage backend or observability UI.</desc>
