<rect width="1600" height="900" fill="#F5F8FC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2F6FEB"/>
<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">OpenTelemetry architecture</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">OpenTelemetry standardizes instrumentation and telemetry transport; it is not itself a storage backend or observability UI.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<path d="M 286.0,432.5 L 306.0,432.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 537.0,432.5 L 557.0,432.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 788.0,432.5 L 808.0,432.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1039.0,432.5 L 1059.0,432.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1290.0,432.5 L 1310.0,432.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><g><rect x="55" y="350" width="231" height="165" rx="18" fill="#FFFFFF" stroke="#718096" stroke-width="2.2"/><path d="M73 350 H268 Q286 350 286 368 V362 H55 V368 Q55 350 73 350" fill="#EEF2F7"/><text x="73" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="73" dy="0">Application</tspan></text><text x="73" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="73" dy="0">Business code +</tspan><tspan x="73" dy="20">frameworks</tspan></text></g><g><rect x="306" y="350" width="231" height="165" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M324 350 H519 Q537 350 537 368 V362 H306 V368 Q306 350 324 350" fill="#EAF2FF"/><text x="324" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="324" dy="0">Instrumentation</tspan></text><text x="324" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="324" dy="0">Auto / manual</tspan><tspan x="324" dy="20">libraries</tspan><tspan x="324" dy="20">API calls</tspan></text></g><g><rect x="557" y="350" width="231" height="165" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M575 350 H770 Q788 350 788 368 V362 H557 V368 Q557 350 575 350" fill="#F2EDFF"/><text x="575" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="575" dy="0">OTel API + SDK</tspan></text><text x="575" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="575" dy="0">Signals • resources</tspan><tspan x="575" dy="20">processors •</tspan><tspan x="575" dy="20">samplers</tspan></text></g><g><rect x="808" y="350" width="231" height="165" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M826 350 H1021 Q1039 350 1039 368 V362 H808 V368 Q808 350 826 350" fill="#E5F7F7"/><text x="826" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="826" dy="0">OTLP</tspan></text><text x="826" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="826" dy="0">Vendor-neutral wire</tspan><tspan x="826" dy="20">protocol</tspan></text></g><g><rect x="1059" y="350" width="231" height="165" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M1077 350 H1272 Q1290 350 1290 368 V362 H1059 V368 Q1059 350 1077 350" fill="#FFF5DF"/><text x="1077" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1077" dy="0">Collector</tspan></text><text x="1077" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1077" dy="0">Receive • process</tspan><tspan x="1077" dy="20">route • export</tspan></text></g><g><rect x="1310" y="350" width="231" height="165" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M1328 350 H1523 Q1541 350 1541 368 V362 H1310 V368 Q1310 350 1328 350" fill="#E9F8F0"/><text x="1328" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1328" dy="0">Backends</tspan></text><text x="1328" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1328" dy="0">Metrics • logs •</tspan><tspan x="1328" dy="20">traces</tspan><tspan x="1328" dy="20">visualization /</tspan><tspan x="1328" dy="20">alerting</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Separate API, SDK, instrumentation libraries, semantic conventions, context propagation, OTLP, Collector, and backend responsibilities.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>