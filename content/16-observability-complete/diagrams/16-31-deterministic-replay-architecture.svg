<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">Deterministic replay architecture</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">Replay needs more than application logs: it must capture inputs and nondeterministic decisions that influence execution.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<path d="M 300.0,425.0 L 365.0,425.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 625.0,425.0 L 710.0,425.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 970.0,425.0 L 1050.0,425.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1300.0,425.0 L 1330.0,425.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 495.0,595.0 L 495.0,500.0" fill="none" stroke="#718096" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-slate)"/><rect x="461.0" y="521.5" width="68" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="495.0" y="538.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="495.0" dy="0">govern</tspan></text><path d="M 840.0,595.0 L 840.0,500.0" fill="none" stroke="#718096" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-slate)"/><rect x="786.0" y="521.5" width="108" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="840.0" y="538.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="840.0" dy="0">reconstruct</tspan></text><g><rect x="45" y="350" width="255" height="150" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M63 350 H282 Q300 350 300 368 V362 H45 V368 Q45 350 63 350" fill="#EAF2FF"/><text x="63" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="63" dy="0">Capture layer</tspan></text><text x="63" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="63" dy="0">Inputs • events •</tspan><tspan x="63" dy="20">schedules</tspan><tspan x="63" dy="20">clock • random •</tspan></text></g><g><rect x="365" y="350" width="260" height="150" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M383 350 H607 Q625 350 625 368 V362 H365 V368 Q365 350 383 350" fill="#F2EDFF"/><text x="383" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="383" dy="0">Encrypted event store</tspan></text><text x="383" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="383" dy="0">Ordered event log</tspan><tspan x="383" dy="20">state snapshots +</tspan><tspan x="383" dy="20">metadata</tspan></text></g><g><rect x="710" y="350" width="260" height="150" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M728 350 H952 Q970 350 970 368 V362 H710 V368 Q710 350 728 350" fill="#E5F7F7"/><text x="728" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="728" dy="0">Replay environment</tspan></text><text x="728" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="728" dy="0">Pinned build / config</tspan><tspan x="728" dy="20">isolated resources</tspan></text></g><g><rect x="1050" y="350" width="250" height="150" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M1068 350 H1282 Q1300 350 1300 368 V362 H1050 V368 Q1050 350 1068 350" fill="#FFF5DF"/><text x="1068" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1068" dy="0">Replay engine</tspan></text><text x="1068" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1068" dy="0">Reapply inputs +</tspan><tspan x="1068" dy="20">choices</tspan><tspan x="1068" dy="20">stub external systems</tspan></text></g><g><rect x="1330" y="350" width="230" height="150" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="2.2"/><path d="M1348 350 H1542 Q1560 350 1560 368 V362 H1330 V368 Q1330 350 1348 350" fill="#FDECEC"/><text x="1348" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1348" dy="0">Divergence comparator</tspan></text><text x="1348" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1348" dy="0">State / output diff</tspan><tspan x="1348" dy="20">first mismatch</tspan><tspan x="1348" dy="20">location</tspan></text></g><g><rect x="365" y="595" width="260" height="120" rx="18" fill="#FFFFFF" stroke="#718096" stroke-width="2.2"/><path d="M383 595 H607 Q625 595 625 613 V607 H365 V613 Q365 595 383 595" fill="#EEF2F7"/><text x="383" y="629" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="383" dy="0">Privacy + completeness</tspan></text><text x="383" y="660" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="383" dy="0">Redaction • key access</tspan></text></g><g><rect x="710" y="595" width="260" height="120" rx="18" fill="#FFFFFF" stroke="#718096" stroke-width="2.2"/><path d="M728 595 H952 Q970 595 970 613 V607 H710 V613 Q710 595 728 595" fill="#EEF2F7"/><text x="728" y="629" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="728" dy="0">Compatibility manifest</tspan></text><text x="728" y="660" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="728" dy="0">OS • runtime • schema</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Capture completeness, compatible runtime state, deterministic external stubs, privacy boundaries, and isolation determine replay fidelity.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>