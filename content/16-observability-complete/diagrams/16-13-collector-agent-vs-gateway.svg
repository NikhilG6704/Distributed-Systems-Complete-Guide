<rect width="1600" height="900" fill="#F5F8FC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2F6FEB"/>
<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">Collector agent vs gateway deployment</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">Agents collect close to workloads; gateways centralize policy and export. Production deployments often combine both.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<path d="M 290.0,230.0 L 355.0,230.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 615.0,230.0 L 700.0,230.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 970.0,230.0 L 1055.0,230.0" fill="none" stroke="#D18A13" stroke-width="3" marker-end="url(#arrow-amber)"/><rect x="942.5" y="204.0" width="140" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="1012.5" y="221.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="1012.5" dy="0">load / affinity</tspan></text><path d="M 1123.1,295.0 L 901.9,510.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 835.0,295.0 L 835.0,510.0" fill="none" stroke="#159A62" stroke-width="3" marker-end="url(#arrow-green)"/><rect x="801.0" y="376.5" width="68" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="835.0" y="393.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="835.0" dy="0">export</tspan></text><path d="M 169.9,295.0 L 177.6,510.0" fill="none" stroke="#805AD5" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-purple)"/><rect x="131.8" y="376.5" width="84" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="173.75" y="393.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="173.75" dy="0">optional</tspan></text><path d="M 485.0,510.0 L 485.0,295.0" fill="none" stroke="#718096" stroke-width="3" marker-end="url(#arrow-slate)"/><rect x="447.0" y="376.5" width="76" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="485.0" y="393.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="485.0" dy="0">collect</tspan></text><g><rect x="45" y="165" width="245" height="130" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M63 165 H272 Q290 165 290 183 V177 H45 V183 Q45 165 63 165" fill="#EAF2FF"/><text x="63" y="199" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="63" dy="0">Workload pods</tspan></text><text x="63" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="63" dy="0">App SDKs emit OTLP</tspan><tspan x="63" dy="20">stdout / platform</tspan></text></g><g><rect x="355" y="165" width="260" height="130" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M373 165 H597 Q615 165 615 183 V177 H355 V183 Q355 165 373 165" fill="#E5F7F7"/><text x="373" y="199" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="373" dy="0">Node agent</tspan></text><text x="373" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="373" dy="0">DaemonSet / sidecar</tspan><tspan x="373" dy="20">local metadata + buffer</tspan></text></g><g><rect x="700" y="165" width="270" height="130" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M718 165 H952 Q970 165 970 183 V177 H700 V183 Q700 165 718 165" fill="#FFF5DF"/><text x="718" y="199" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="718" dy="0">Regional gateway A</tspan></text><text x="718" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="718" dy="0">Replica set • routing</tspan><tspan x="718" dy="20">tail sampling / policy</tspan></text></g><g><rect x="1055" y="165" width="270" height="130" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M1073 165 H1307 Q1325 165 1325 183 V177 H1055 V183 Q1055 165 1073 165" fill="#FFF5DF"/><text x="1073" y="199" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1073" dy="0">Regional gateway B</tspan></text><text x="1073" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1073" dy="0">HA replica • failover</tspan><tspan x="1073" dy="20">trace affinity</tspan></text></g><g><rect x="700" y="510" width="270" height="130" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M718 510 H952 Q970 510 970 528 V522 H700 V528 Q700 510 718 510" fill="#E9F8F0"/><text x="718" y="544" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="718" dy="0">Backends</tspan></text><text x="718" y="575" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="718" dy="0">Metrics • logs • traces</tspan><tspan x="718" dy="20">regional stores</tspan></text></g><g><rect x="45" y="510" width="270" height="130" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M63 510 H297 Q315 510 315 528 V522 H45 V528 Q45 510 63 510" fill="#F2EDFF"/><text x="63" y="544" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="63" dy="0">Sidecar alternative</tspan></text><text x="63" y="575" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="63" dy="0">Per-pod collector</tspan><tspan x="63" dy="20">strong isolation; more</tspan></text></g><g><rect x="355" y="510" width="260" height="130" rx="18" fill="#FFFFFF" stroke="#718096" stroke-width="2.2"/><path d="M373 510 H597 Q615 510 615 528 V522 H355 V528 Q355 510 373 510" fill="#EEF2F7"/><text x="373" y="544" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="373" dy="0">Node / cluster signals</tspan></text><text x="373" y="575" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="373" dy="0">Kubelet • node exporter</tspan><tspan x="373" dy="20">control plane</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Use trace-ID-aware routing for tail sampling. Size gateway replicas, queues, and persistent buffers for bursts and backend outages; sidecars</tspan><tspan x="88" dy="20">improve isolation but multiply resource overhead.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>