<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Collector agent vs gateway deployment</title><desc id="desc">Agents collect close to workloads; gateways centralize policy and export. Production deployments often combine both.</desc>
<defs>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#19324D" flood-opacity=".08"/></filter>
