<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Head-based vs tail-based trace sampling</title><desc id="desc">Head sampling decides at trace start; tail sampling waits until enough spans are available to apply a whole-trace policy.</desc>
<defs>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#19324D" flood-opacity=".08"/></filter>
 <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F6FEB"/></marker>
 <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#159A62"/></marker>
 <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D18A13"/></marker>
 <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D64545"/></marker>
 <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#805AD5"/></marker>
 <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#159A9A"/></marker>
 <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#718096"/></marker>
</defs>
<rect width="1600" height="900" fill="#F5F8FC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2F6FEB"/>
<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">Head-based vs tail-based trace sampling</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">Head sampling decides at trace start; tail sampling waits until enough spans are available to apply a whole-trace policy.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<path d="M 275.0,297.5 L 355.0,297.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 585.0,297.5 L 675.0,297.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="584.0" y="271.5" width="92" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="630.0" y="288.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="630.0" dy="0">keep only</tspan></text><path d="M 905.0,297.5 L 1000.0,297.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 295.0,622.5 L 390.0,622.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 645.0,622.5 L 740.0,622.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1005.0,622.5 L 1100.0,622.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="982.5" y="596.5" width="140" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="1052.5" y="613.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="1052.5" dy="0">selected traces</tspan></text><g><rect x="55" y="235" width="220" height="125" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M73 235 H257 Q275 235 275 253 V247 H55 V253 Q55 235 73 235" fill="#EAF2FF"/><text x="73" y="269" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="73" dy="0">Request starts</tspan></text><text x="73" y="300" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="73" dy="0">Incoming trace</tspan><tspan x="73" dy="20">root span created</tspan></text></g><g><rect x="355" y="235" width="230" height="125" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M373 235 H567 Q585 235 585 253 V247 H355 V253 Q355 235 373 235" fill="#FFF5DF"/><text x="373" y="269" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="373" dy="0">Head decision</tspan></text><text x="373" y="300" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="373" dy="0">Sampler decides now</tspan><tspan x="373" dy="20">keep / drop</tspan></text></g><g><rect x="675" y="235" width="230" height="125" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M693 235 H887 Q905 235 905 253 V247 H675 V253 Q675 235 693 235" fill="#E9F8F0"/><text x="693" y="269" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="693" dy="0">Downstream spans</tspan></text><text x="693" y="300" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="693" dy="0">Only sampled traces</tspan><tspan x="693" dy="20">are fully recorded</tspan></text></g><g><rect x="1000" y="235" width="250" height="125" rx="18" fill="#FFFFFF" stroke="#718096" stroke-width="2.2"/><path d="M1018 235 H1232 Q1250 235 1250 253 V247 H1000 V253 Q1000 235 1018 235" fill="#EEF2F7"/><text x="1018" y="269" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1018" dy="0">Export backend</tspan></text><text x="1018" y="300" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1018" dy="0">Lower cost + overhead</tspan><tspan x="1018" dy="20">future errors unknown</tspan></text></g><g><rect x="55" y="555" width="240" height="135" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M73 555 H277 Q295 555 295 573 V567 H55 V573 Q55 555 73 555" fill="#EAF2FF"/><text x="73" y="589" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="73" dy="0">Collect spans</tspan></text><text x="73" y="620" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="73" dy="0">Buffer by trace ID</tspan><tspan x="73" dy="20">wait for trace</tspan></text></g><g><rect x="390" y="555" width="255" height="135" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M408 555 H627 Q645 555 645 573 V567 H390 V573 Q390 555 408 555" fill="#FFF5DF"/><text x="408" y="589" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="408" dy="0">Tail policy</tspan></text><text x="408" y="620" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="408" dy="0">Inspect full trace</tspan><tspan x="408" dy="20">slow / error / rare</tspan></text></g><g><rect x="740" y="555" width="265" height="135" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M758 555 H987 Q1005 555 1005 573 V567 H740 V573 Q740 555 758 555" fill="#E9F8F0"/><text x="758" y="589" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="758" dy="0">Keep or drop</tspan></text><text x="758" y="620" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="758" dy="0">Decision after evidence</tspan><tspan x="758" dy="20">trace-affine routing</tspan></text></g><g><rect x="1100" y="555" width="270" height="135" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M1118 555 H1352 Q1370 555 1370 573 V567 H1100 V573 Q1100 555 1118 555" fill="#F2EDFF"/><text x="1118" y="589" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1118" dy="0">Export backend</tspan></text><text x="1118" y="620" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1118" dy="0">Higher diagnostic value</tspan><tspan x="1118" dy="20">more memory + complexity</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Head sampling is inexpensive and simple but cannot know whether a future span will fail. Tail sampling can retain errors and slow traces but</tspan><tspan x="88" dy="20">requires buffering, bounded memory, and trace-ID affinity.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>