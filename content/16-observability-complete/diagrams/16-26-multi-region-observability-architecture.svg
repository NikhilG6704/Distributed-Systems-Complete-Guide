text x="68" y="290" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="68" dy="0">Apps • node agents</tspan><tspan x="68" dy="20">local buffer</tspan></text></g><g><rect x="390" y="225" width="270" height="135" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M408 225 H642 Q660 225 660 243 V237 H390 V243 Q390 225 408 225" fill="#E5F7F7"/><text x="408" y="259" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="408" dy="0">Region A gateway + store</tspan></text><text x="408" y="290" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="408" dy="0">Regional policy</tspan><tspan x="408" dy="20">local alerting /</tspan></text></g><g><rect x="50" y="545" width="250" height="135" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M68 545 H282 Q300 545 300 563 V557 H50 V563 Q50 545 68 545" fill="#EAF2FF"/><text x="68" y="579" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="68" dy="0">Region B workloads</tspan></text><text x="68" y="610" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="68" dy="0">Apps • node agents</tspan><tspan x="68" dy="20">local buffer</tspan></text></g><g><rect x="390" y="545" width="270" height="135" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M408 545 H642 Q660 545 660 563 V557 H390 V563 Q390 545 408 545" fill="#E5F7F7"/><text x="408" y="579" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="408" dy="0">Region B gateway + store</tspan></text><text x="408" y="610" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="408" dy="0">Regional policy</tspan><tspan x="408" dy="20">local alerting /</tspan></text></g><g><rect x="850" y="365" width="280" height="150" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M868 365 H1112 Q1130 365 1130 383 V377 H850 V383 Q850 365 868 365" fill="#F2EDFF"/><text x="868" y="399" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="868" dy="0">Approved global view</tspan></text><text x="868" y="430" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="868" dy="0">Redacted SLI aggregates</tspan><tspan x="868" dy="20">region labels • topology</tspan></text></g><g><rect x="1240" y="365" width="260" height="150" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M1258 365 H1482 Q1500 365 1500 383 V377 H1240 V383 Q1240 365 1258 365" fill="#E9F8F0"/><text x="1258" y="399" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1258" dy="0">Global responders</tspan></text><text x="1258" y="430" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1258" dy="0">Cross-region overview</tspan><tspan x="1258" dy="20">policy-limited access</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">During a WAN partition, regional buffers and local alerting continue within capacity. Show freshness and replication lag; do not assume global</tspan><tspan x="88" dy="20">data is complete or immediate.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>