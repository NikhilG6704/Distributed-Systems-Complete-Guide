<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">Systematic distributed incident investigation</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">A repeatable workflow moves from user symptom to verified cause, reversible mitigation, recovery validation, and learning.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<path d="M 240.0,267.5 L 261.0,267.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 456.0,267.5 L 477.0,267.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 672.0,267.5 L 693.0,267.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 888.0,267.5 L 909.0,267.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1104.0,267.5 L 1125.0,267.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1320.0,267.5 L 1341.0,267.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1393.5,330.0 L 1267.5,505.0" fill="none" stroke="#805AD5" stroke-width="3" marker-end="url(#arrow-purple)"/><rect x="1288.5" y="391.5" width="84" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="1330.5" y="408.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="1330.5" dy="0">continue</tspan></text><path d="M 1125.0,567.5 L 1104.0,567.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 909.0,567.5 L 888.0,567.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 693.0,567.5 L 672.0,567.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 477.0,567.5 L 456.0,567.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 261.0,567.5 L 240.0,567.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><g><rect x="45" y="205" width="195" height="125" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="2.2"/><path d="M63 205 H222 Q240 205 240 223 V217 H45 V223 Q45 205 63 205" fill="#FDECEC"/><text x="63" y="239" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="63" dy="0">1. Symptom</tspan></text><text x="63" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="63" dy="0">User impact /</tspan><tspan x="63" dy="20">journey</tspan></text></g><g><rect x="261" y="205" width="195" height="125" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M279 205 H438 Q456 205 456 223 V217 H261 V223 Q261 205 279 205" fill="#EAF2FF"/><text x="279" y="239" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="279" dy="0">2. Scope</tspan></text><text x="279" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="279" dy="0">Region • route •</tspan><tspan x="279" dy="20">cohort</tspan></text></g><g><rect x="477" y="205" width="195" height="125" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M495 205 H654 Q672 205 672 223 V217 H477 V223 Q477 205 495 205" fill="#EAF2FF"/><text x="495" y="239" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="495" dy="0">3. Timeline</tspan></text><text x="495" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="495" dy="0">UTC • deploy •</tspan><tspan x="495" dy="20">change</tspan></text></g><g><rect x="693" y="205" width="195" height="125" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M711 205 H870 Q888 205 888 223 V217 H693 V223 Q693 205 711 205" fill="#EAF2FF"/><text x="711" y="239" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="711" dy="0">4. Golden signals</tspan></text><text x="711" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="711" dy="0">Latency • traffic</tspan><tspan x="711" dy="20">• errors •</tspan></text></g><g><rect x="909" y="205" width="195" height="125" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M927 205 H1086 Q1104 205 1104 223 V217 H909 V223 Q909 205 927 205" fill="#EAF2FF"/><text x="927" y="239" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="927" dy="0">5. Services</tspan></text><text x="927" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="927" dy="0">Find affected</tspan><tspan x="927" dy="20">dependency</tspan></text></g><g><rect x="1125" y="205" width="195" height="125" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M1143 205 H1302 Q1320 205 1320 223 V217 H1125 V223 Q1125 205 1143 205" fill="#EAF2FF"/><text x="1143" y="239" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1143" dy="0">6. Logs + traces</tspan></text><text x="1143" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1143" dy="0">Correlate request</tspan><tspan x="1143" dy="20">evidence</tspan></text></g><g><rect x="1341" y="205" width="195" height="125" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M1359 205 H1518 Q1536 205 1536 223 V217 H1341 V223 Q1341 205 1359 205" fill="#EAF2FF"/><text x="1359" y="239" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1359" dy="0">7. Resources</tspan></text><text x="1359" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1359" dy="0">Pool • queue • CPU</tspan><tspan x="1359" dy="20">• DB</tspan></text></g><g><rect x="1125" y="505" width="195" height="125" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M1143 505 H1302 Q1320 505 1320 523 V517 H1125 V523 Q1125 505 1143 505" fill="#FFF5DF"/><text x="1143" y="539" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1143" dy="0">8. Hypothesis</tspan></text><text x="1143" y="570" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1143" dy="0">State a</tspan><tspan x="1143" dy="20">falsifiable cause</tspan></text></g><g><rect x="909" y="505" width="195" height="125" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M927 505 H1086 Q1104 505 1104 523 V517 H909 V523 Q909 505 927 505" fill="#EAF2FF"/><text x="927" y="539" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="927" dy="0">9. Test</tspan></text><text x="927" y="570" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="927" dy="0">Compare cohorts /</tspan><tspan x="927" dy="20">traces</tspan></text></g><g><rect x="693" y="505" width="195" height="125" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="2.2"/><path d="M711 505 H870 Q888 505 888 523 V517 H693 V523 Q693 505 711 505" fill="#FDECEC"/><text x="711" y="539" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="711" dy="0">10. Root cause</tspan></text><text x="711" y="570" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="711" dy="0">Verify earliest</tspan><tspan x="711" dy="20">abnormal event</tspan></text></g><g><rect x="477" y="505" width="195" height="125" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M495 505 H654 Q672 505 672 523 V517 H477 V523 Q477 505 495 505" fill="#FFF5DF"/><text x="495" y="539" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="495" dy="0">11. Mitigate</tspan></text><text x="495" y="570" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="495" dy="0">Reversible action</tspan></text></g><g><rect x="261" y="505" width="195" height="125" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M279 505 H438 Q456 505 456 523 V517 H261 V523 Q261 505 279 505" fill="#E9F8F0"/><text x="279" y="539" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="279" dy="0">12. Validate</tspan></text><text x="279" y="570" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="279" dy="0">SLI and journey</tspan><tspan x="279" dy="20">recover</tspan></text></g><g><rect x="45" y="505" width="195" height="125" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M63 505 H222 Q240 505 240 523 V517 H45 V523 Q45 505 63 505" fill="#E9F8F0"/><text x="63" y="539" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="63" dy="0">13. Learn</tspan></text><text x="63" y="570" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="63" dy="0">Postmortem +</tspan><tspan x="63" dy="20">prevention</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">If evidence does not support the hypothesis, return to the evidence and test a new explanation. Do not stop at the first correlated metric or</tspan><tspan x="88" dy="20">downstream error.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>