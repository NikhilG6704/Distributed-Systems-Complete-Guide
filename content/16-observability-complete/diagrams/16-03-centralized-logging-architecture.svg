<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">Centralized logging architecture</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">Separate collection, processing, transport, storage/indexing, and query so each stage can scale and fail safely.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<path d="M 260.0,430.0 L 315.0,430.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 535.0,430.0 L 590.0,430.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 835.0,430.0 L 890.0,430.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1110.0,382.9 L 1165.0,359.3" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1280.0,385.0 L 1280.0,500.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="1246.0" y="416.5" width="68" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="1280.0" y="433.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="1280.0" dy="0">search</tspan></text><g><rect x="45" y="355" width="215" height="150" rx="18" fill="#FFFFFF" stroke="#718096" stroke-width="2.2"/><path d="M63 355 H242 Q260 355 260 373 V367 H45 V373 Q45 355 63 355" fill="#EEF2F7"/><text x="63" y="389" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="63" dy="0">Log sources</tspan></text><text x="63" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="63" dy="0">Application</tspan><tspan x="63" dy="20">stdout/files</tspan><tspan x="63" dy="20">Host • system •</tspan></text></g><g><rect x="315" y="355" width="220" height="150" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M333 355 H517 Q535 355 535 373 V367 H315 V373 Q315 355 333 355" fill="#EAF2FF"/><text x="333" y="389" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="333" dy="0">Collectors</tspan></text><text x="333" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="333" dy="0">Fluent Bit •</tspan><tspan x="333" dy="20">Fluentd</tspan><tspan x="333" dy="20">Logstash / node</tspan></text></g><g><rect x="590" y="355" width="245" height="150" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M608 355 H817 Q835 355 835 373 V367 H590 V373 Q590 355 608 355" fill="#FFF5DF"/><text x="608" y="389" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="608" dy="0">Processing &amp; policy</tspan></text><text x="608" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="608" dy="0">Parse • enrich •</tspan><tspan x="608" dy="20">normalize</tspan><tspan x="608" dy="20">PII / secrets</tspan></text></g><g><rect x="890" y="355" width="220" height="150" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M908 355 H1092 Q1110 355 1110 373 V367 H890 V373 Q890 355 908 355" fill="#E5F7F7"/><text x="908" y="389" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="908" dy="0">Buffer / transport</tspan></text><text x="908" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="908" dy="0">Queue • retry •</tspan><tspan x="908" dy="20">backpressure</tspan><tspan x="908" dy="20">Malformed →</tspan></text></g><g><rect x="1165" y="235" width="230" height="150" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M1183 235 H1377 Q1395 235 1395 253 V247 H1165 V253 Q1165 235 1183 235" fill="#F2EDFF"/><text x="1183" y="269" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1183" dy="0">Storage &amp; index</tspan></text><text x="1183" y="300" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1183" dy="0">Loki • Elasticsearch</tspan><tspan x="1183" dy="20">OpenSearch • Splunk</tspan></text></g><g><rect x="1165" y="500" width="230" height="150" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M1183 500 H1377 Q1395 500 1395 518 V512 H1165 V518 Q1165 500 1183 500" fill="#E9F8F0"/><text x="1183" y="534" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1183" dy="0">Search / dashboards</tspan></text><text x="1183" y="565" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1183" dy="0">Query • retention •</tspan><tspan x="1183" dy="20">archive</tspan><tspan x="1183" dy="20">Trace ID correlation</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Redaction is a policy gate before broad storage and indexing. Preserve trace_id, span_id, service.name, environment, timestamp, severity, and</tspan><tspan x="88" dy="20">event schema where appropriate.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>