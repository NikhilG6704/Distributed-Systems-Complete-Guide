<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Deterministic replay vs simulation testing</title><desc id="desc">Replay reconstructs a supported captured execution; simulation generates controlled executions to explore a modeled system.</desc>
<defs>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#19324D" flood-opacity=".08"/></filter>
 <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F6FEB"/></marker>
 <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#159A62"/></marker>
 <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D18A13"/></marker>
 <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D64545"/></marker>
 <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#805AD5"/></marker>
 <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#159A9A"/></marker>
 <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#718096"/></marker>
</defs>
<rect width="1600" height="900" fill="#F5F8FC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2F6FEB"/>
<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">Deterministic replay vs simulation testing</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">Replay reconstructs a supported captured execution; simulation generates controlled executions to explore a modeled system.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<path d="M 340.0,422.5 L 420.0,422.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 700.0,422.5 L 780.0,422.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 340.0,662.5 L 420.0,662.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 700.0,662.5 L 780.0,662.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1040.0,452.7 L 1160.0,480.6" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="1026.0" y="440.7" width="148" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="1100.0" y="457.68604651162786" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="1100.0" dy="0">single execution</tspan></text><path d="M 1040.0,620.2 L 1160.0,581.1" fill="none" stroke="#159A62" stroke-width="3" marker-end="url(#arrow-green)"/><rect x="1022.0" y="574.6" width="156" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="1100.0" y="591.6395348837209" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="1100.0" dy="0">scenario coverage</tspan></text><g><rect x="60" y="350" width="280" height="145" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M78 350 H322 Q340 350 340 368 V362 H60 V368 Q60 350 78 350" fill="#EAF2FF"/><text x="78" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="78" dy="0">Captured production run</tspan></text><text x="78" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="78" dy="0">Observed inputs +</tspan><tspan x="78" dy="20">recorded</tspan><tspan x="78" dy="20">nondeterministic choices</tspan></text></g><g><rect x="420" y="350" width="280" height="145" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M438 350 H682 Q700 350 700 368 V362 H420 V368 Q420 350 438 350" fill="#F2EDFF"/><text x="438" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="438" dy="0">Replay engine</tspan></text><text x="438" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="438" dy="0">Reconstruct one captured</tspan><tspan x="438" dy="20">execution path</tspan></text></g><g><rect x="780" y="350" width="260" height="145" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M798 350 H1022 Q1040 350 1040 368 V362 H780 V368 Q780 350 798 350" fill="#FFF5DF"/><text x="798" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="798" dy="0">Same failure sequence?</tspan></text><text x="798" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="798" dy="0">Compare state / output</tspan><tspan x="798" dy="20">locate divergence</tspan></text></g><g><rect x="60" y="600" width="280" height="125" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M78 600 H322 Q340 600 340 618 V612 H60 V618 Q60 600 78 600" fill="#E5F7F7"/><text x="78" y="634" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="78" dy="0">Deterministic simulator</tspan></text><text x="78" y="665" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="78" dy="0">Model state + environment</tspan><tspan x="78" dy="20">choose schedules / faults</tspan></text></g><g><rect x="420" y="600" width="280" height="125" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M438 600 H682 Q700 600 700 618 V612 H420 V618 Q420 600 438 600" fill="#EAF2FF"/><text x="438" y="634" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="438" dy="0">Generated test matrix</tspan></text><text x="438" y="665" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="438" dy="0">Many seeds • schedules</tspan><tspan x="438" dy="20">network and node faults</tspan></text></g><g><rect x="780" y="600" width="260" height="125" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M798 600 H1022 Q1040 600 1040 618 V612 H780 V618 Q780 600 798 600" fill="#E9F8F0"/><text x="798" y="634" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="798" dy="0">Explore scenarios</tspan></text><text x="798" y="665" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="798" dy="0">Repeatable experiments</tspan><tspan x="798" dy="20">find counterexamples</tspan></text></g><g><rect x="1160" y="440" width="360" height="165" rx="18" fill="#FFFFFF" stroke="#718096" stroke-width="2.2"/><path d="M1178 440 H1502 Q1520 440 1520 458 V452 H1160 V458 Q1160 440 1178 440" fill="#EEF2F7"/><text x="1178" y="474" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1178" dy="0">Different guarantees</tspan></text><text x="1178" y="505" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1178" dy="0">Replay: reproduce captured run</tspan><tspan x="1178" dy="20">Simulation: explore modeled space</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Neither approach automatically proves all possible executions correct. Jepsen-style history testing, fault injection, and tracing provide</tspan><tspan x="88" dy="20">complementary evidence rather than interchangeable guarantees.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>