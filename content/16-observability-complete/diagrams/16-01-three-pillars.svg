FFFFF" stroke="#718096" stroke-width="2.2"/><path d="M73 350 H247 Q265 350 265 368 V362 H55 V368 Q55 350 73 350" fill="#EEF2F7"/><text x="73" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="73" dy="0">Application / system</tspan></text><text x="73" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="73" dy="0">Requests • state</tspan><tspan x="73" dy="20">changes</tspan><tspan x="73" dy="20">Runtime and</tspan></text></g><g><rect x="355" y="160" width="245" height="145" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M373 160 H582 Q600 160 600 178 V172 H355 V178 Q355 160 373 160" fill="#EAF2FF"/><text x="373" y="194" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="373" dy="0">Metrics</tspan></text><text x="373" y="225" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="373" dy="0">Aggregate trends</tspan><tspan x="373" dy="20">Rates • latency •</tspan><tspan x="373" dy="20">saturation</tspan></text></g><g><rect x="355" y="350" width="245" height="145" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M373 350 H582 Q600 350 600 368 V362 H355 V368 Q355 350 373 350" fill="#FFF5DF"/><text x="373" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="373" dy="0">Logs</tspan></text><text x="373" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="373" dy="0">Discrete events</tspan><tspan x="373" dy="20">Structured records •</tspan><tspan x="373" dy="20">errors</tspan></text></g><g><rect x="355" y="540" width="245" height="145" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M373 540 H582 Q600 540 600 558 V552 H355 V558 Q355 540 373 540" fill="#F2EDFF"/><text x="373" y="574" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="373" dy="0">Traces</tspan></text><text x="373" y="605" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="373" dy="0">Causal request paths</tspan><tspan x="373" dy="20">Spans • parent/child •</tspan><tspan x="373" dy="20">links</tspan></text></g><g><rect x="760" y="350" width="260" height="155" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M778 350 H1002 Q1020 350 1020 368 V362 H760 V368 Q760 350 778 350" fill="#E5F7F7"/><text x="778" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="778" dy="0">Telemetry platform</tspan></text><text x="778" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="778" dy="0">Ingest • enrich •</tspan><tspan x="778" dy="20">correlate</tspan><tspan x="778" dy="20">Store • query • govern</tspan></text></g><g><rect x="1180" y="155" width="270" height="145" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M1198 155 H1432 Q1450 155 1450 173 V167 H1180 V173 Q1180 155 1198 155" fill="#E9F8F0"/><text x="1198" y="189" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1198" dy="0">Dashboards &amp; alerts</tspan></text><text x="1198" y="220" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1198" dy="0">Trends • SLOs</tspan><tspan x="1198" dy="20">Operational signals</tspan></text></g><g><rect x="1180" y="350" width="270" height="145" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M1198 350 H1432 Q1450 350 1450 368 V362 H1180 V368 Q1180 350 1198 350" fill="#FFF5DF"/><text x="1198" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1198" dy="0">Log search</tspan></text><text x="1198" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1198" dy="0">Events • fields</tspan><tspan x="1198" dy="20">Trace / request ID</tspan></text></g><g><rect x="1180" y="545" width="270" height="145" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M1198 545 H1432 Q1450 545 1450 563 V557 H1180 V563 Q1180 545 1198 545" fill="#F2EDFF"/><text x="1198" y="579" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1198" dy="0">Trace explorer</tspan></text><text x="1198" y="610" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1198" dy="0">Waterfalls •</tspan><tspan x="1198" dy="20">dependencies</tspan><tspan x="1198" dy="20">Critical path</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Correlate with service, environment, resource, deployment, request, and trace context—not by assuming the signals are interchangeable.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>