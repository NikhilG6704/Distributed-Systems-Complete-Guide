<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">End-to-end checkout trace timeline</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">Illustrative waterfall: parallel child spans overlap; asynchronous consumer work begins after the producer completes.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text><line x1="260" y1="252" x2="1460" y2="252" stroke="#E1E8F0"/><text x="72" y="234" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="72" dy="0">API gateway</tspan></text><line x1="260" y1="328" x2="1460" y2="328" stroke="#E1E8F0"/><text x="72" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="72" dy="0">Identity service</tspan></text><line x1="260" y1="404" x2="1460" y2="404" stroke="#E1E8F0"/><text x="72" y="386" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="72" dy="0">Checkout service</tspan></text><line x1="260" y1="480" x2="1460" y2="480" stroke="#E1E8F0"/><text x="72" y="462" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="72" dy="0">Pricing / promotion</tspan></text><line x1="260" y1="556" x2="1460" y2="556" stroke="#E1E8F0"/><text x="72" y="538" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="72" dy="0">Payment provider</tspan></text><line x1="260" y1="632" x2="1460" y2="632" stroke="#E1E8F0"/><text x="72" y="614" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="72" dy="0">Kafka consumer</tspan></text><line x1="260.0" y1="193" x2="260.0" y2="643" stroke="#E6ECF3" stroke-dasharray="4 6"/><text x="260.0" y="181" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#526581" text-anchor="middle"><tspan x="260.0" dy="0">0 ms</tspan></text><line x1="500.0" y1="193" x2="500.0" y2="643" stroke="#E6ECF3" stroke-dasharray="4 6"/><text x="500.0" y="181" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#526581" text-anchor="middle"><tspan x="500.0" dy="0">50 ms</tspan></text><line x1="740.0" y1="193" x2="740.0" y2="643" stroke="#E6ECF3" stroke-dasharray="4 6"/><text x="740.0" y="181" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#526581" text-anchor="middle"><tspan x="740.0" dy="0">100 ms</tspan></text><line x1="980.0" y1="193" x2="980.0" y2="643" stroke="#E6ECF3" stroke-dasharray="4 6"/><text x="980.0" y="181" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#526581" text-anchor="middle"><tspan x="980.0" dy="0">150 ms</tspan></text><line x1="1220.0" y1="193" x2="1220.0" y2="643" stroke="#E6ECF3" stroke-dasharray="4 6"/><text x="1220.0" y="181" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#526581" text-anchor="middle"><tspan x="1220.0" dy="0">200 ms</tspan></text><line x1="1460.0" y1="193" x2="1460.0" y2="643" stroke="#E6ECF3" stroke-dasharray="4 6"/><text x="1460.0" y="181" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#526581" text-anchor="middle"><tspan x="1460.0" dy="0">250 ms</tspan></text><rect x="260.0" y="210" width="1094.4" height="30" rx="8" fill="#EAF2FF" stroke="#2F6FEB" stroke-width="1.7"/><text x="268.0" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#1D4ED8" text-anchor="start"><tspan x="268.0" dy="0">request + route</tspan></text><rect x="317.6" y="286" width="144.0" height="30" rx="8" fill="#E5F7F7" stroke="#159A9A" stroke-width="1.7"/><text x="325.6" y="306" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#0B7070" text-anchor="start"><tspan x="325.6" dy="0">token check</tspan></text><rect x="461.6" y="362" width="840.0" height="30" rx="8" fill="#F2EDFF" stroke="#805AD5" stroke-width="1.7"/><text x="469.6" y="382" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#5B36A8" text-anchor="start"><tspan x="469.6" dy="0">checkout orchestration</tspan></text><rect x="596.0" y="438" width="182.4" height="30" rx="8" fill="#EAF2FF" stroke="#2F6FEB" stroke-width="1.7"/><text x="604.0" y="458" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#1D4ED8" text-anchor="start"><tspan x="604.0" dy="0">pricing</tspan></text><rect x="615.2" y="438" width="264.0" height="30" rx="8" fill="#FFF5DF" stroke="#D18A13" stroke-width="1.7"/><text x="623.2" y="458" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#9A5B00" text-anchor="start"><tspan x="623.2" dy="0">promotion lookup</tspan></text><rect x="860.0" y="514" width="345.6" height="30" rx="8" fill="#FFF5DF" stroke="#D18A13" stroke-width="1.7"/><text x="868.0" y="534" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#9A5B00" text-anchor="start"><tspan x="868.0" dy="0">authorize</tspan></text><rect x="1148.0" y="590" width="264.0" height="30" rx="8" fill="#F2EDFF" stroke="#805AD5" stroke-width="1.7"/><text x="1156.0" y="610" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#5B36A8" text-anchor="start"><tspan x="1156.0" dy="0">consumer processes later</tspan></text><rect x="64" y="679" width="1472" height="29" rx="8" fill="#EAF2FF"/><text x="82" y="699" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#1D4ED8" text-anchor="start"><tspan x="82" dy="0">Critical path is determined by dependencies and overlap—not by adding every span duration.</tspan></text><rect x="64" y="718" width="1472" height="29" rx="8" fill="#FFF5DF"/><text x="82" y="738" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#9A5B00" text-anchor="start"><tspan x="82" dy="0">The queue delay is outside the synchronous response path but still affects end-to-end business completion.</tspan></text><rect x="64" y="757" width="1472" height="29" rx="8" fill="#E9F8F0"/><text x="82" y="777" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#087443" text-anchor="start"><tspan x="82" dy="0">Example timings are illustrative and do not represent a measured production system.</tspan></text><text x="1460" y="649" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#526581" text-anchor="end"><tspan x="1460" dy="0">time →</tspan></text></svg>