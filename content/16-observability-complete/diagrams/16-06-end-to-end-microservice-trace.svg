<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">End-to-end checkout trace timeline</title><desc id="desc">Illustrative waterfall: parallel child spans overlap; asynchronous consumer work begins after the producer completes.</desc>
