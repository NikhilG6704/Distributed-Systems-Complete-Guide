<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">Full-stack observability reference architecture</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">A production platform connects application and infrastructure sources to governed, region-aware signal pipelines and operator workflows.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<path d="M 265.0,417.5 L 320.0,417.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 555.0,417.5 L 610.0,417.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 855.0,352.8 L 920.0,318.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 855.0,482.2 L 920.0,516.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1170.0,252.5 L 1230.0,252.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1170.0,582.5 L 1230.0,582.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1370.0,335.0 L 1370.0,500.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 732.5,505.0 L 732.5,630.0" fill="none" stroke="#718096" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-slate)"/><rect x="698.5" y="541.5" width="68" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="732.5" y="558.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="732.5" dy="0">policy</tspan></text><path d="M 773.8,630.0 L 985.7,335.0" fill="none" stroke="#718096" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-slate)"/><rect x="845.8" y="456.5" width="68" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="879.7701149425287" y="473.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="879.7701149425287" dy="0">govern</tspan></text><g><rect x="35" y="330" width="230" height="175" rx="18" fill="#FFFFFF" stroke="#718096" stroke-width="2.2"/><path d="M53 330 H247 Q265 330 265 348 V342 H35 V348 Q35 330 53 330" fill="#EEF2F7"/><text x="53" y="364" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="53" dy="0">Sources</tspan></text><text x="53" y="395" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="53" dy="0">Kubernetes • VMs •</tspan><tspan x="53" dy="20">serverless</tspan><tspan x="53" dy="20">DB • cache • broker</tspan><tspan x="53" dy="20">• cloud</tspan></text></g><g><rect x="320" y="330" width="235" height="175" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M338 330 H537 Q555 330 555 348 V342 H320 V348 Q320 330 338 330" fill="#EAF2FF"/><text x="338" y="364" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="338" dy="0">Instrumentation</tspan></text><text x="338" y="395" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="338" dy="0">OTel SDKs / agents</tspan><tspan x="338" dy="20">metrics • logs •</tspan><tspan x="338" dy="20">traces</tspan><tspan x="338" dy="20">context propagation</tspan></text></g><g><rect x="610" y="330" width="245" height="175" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M628 330 H837 Q855 330 855 348 V342 H610 V348 Q610 330 628 330" fill="#E5F7F7"/><text x="628" y="364" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="628" dy="0">Regional collectors</tspan></text><text x="628" y="395" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="628" dy="0">DaemonSet / gateway</tspan><tspan x="628" dy="20">enrich • filter •</tspan><tspan x="628" dy="20">sample</tspan><tspan x="628" dy="20">HA queues + policy</tspan></text></g><g><rect x="920" y="170" width="250" height="165" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M938 170 H1152 Q1170 170 1170 188 V182 H920 V188 Q920 170 938 170" fill="#F2EDFF"/><text x="938" y="204" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="938" dy="0">Signal backends</tspan></text><text x="938" y="235" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="938" dy="0">Metrics TSDB • log</tspan><tspan x="938" dy="20">store</tspan><tspan x="938" dy="20">trace store • profiles</tspan></text></g><g><rect x="920" y="500" width="250" height="165" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M938 500 H1152 Q1170 500 1170 518 V512 H920 V518 Q920 500 938 500" fill="#FFF5DF"/><text x="938" y="534" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="938" dy="0">Correlation layer</tspan></text><text x="938" y="565" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="938" dy="0">Service map •</tspan><tspan x="938" dy="20">trace/log links</tspan><tspan x="938" dy="20">resource + deployment</tspan><tspan x="938" dy="20">context</tspan></text></g><g><rect x="1230" y="170" width="280" height="165" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="2.2"/><path d="M1248 170 H1492 Q1510 170 1510 188 V182 H1230 V188 Q1230 170 1248 170" fill="#FDECEC"/><text x="1248" y="204" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1248" dy="0">SLO + alert engine</tspan></text><text x="1248" y="235" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1248" dy="0">SLIs • burn rates</tspan><tspan x="1248" dy="20">alert routing • ownership</tspan></text></g><g><rect x="1230" y="500" width="280" height="165" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M1248 500 H1492 Q1510 500 1510 518 V512 H1230 V518 Q1230 500 1248 500" fill="#E9F8F0"/><text x="1248" y="534" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1248" dy="0">Engineering workflows</tspan></text><text x="1248" y="565" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1248" dy="0">Dashboards • incident UI</tspan><tspan x="1248" dy="20">runbooks • on-call</tspan></text></g><g><rect x="610" y="630" width="245" height="115" rx="18" fill="#FFFFFF" stroke="#718096" stroke-width="2.2"/><path d="M628 630 H837 Q855 630 855 648 V642 H610 V648 Q610 630 628 630" fill="#EEF2F7"/><text x="628" y="664" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="628" dy="0">Governance plane</tspan></text><text x="628" y="695" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="628" dy="0">RBAC • redaction •</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Feedback loop: incidents improve instrumentation, service objectives, dashboards, runbooks, and architecture. Monitor the observability platform</tspan><tspan x="88" dy="20">itself: ingestion health, freshness, drops, query latency, and cost.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>