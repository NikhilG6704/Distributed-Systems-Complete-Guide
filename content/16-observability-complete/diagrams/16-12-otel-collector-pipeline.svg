text><text x="73" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="73" dy="0">OTLP • Prometheus</tspan><tspan x="73" dy="20">Fluent Forward • host</tspan><tspan x="73" dy="20">metrics</tspan></text></g><g><rect x="390" y="350" width="280" height="145" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M408 350 H652 Q670 350 670 368 V362 H390 V368 Q390 350 408 350" fill="#FFF5DF"/><text x="408" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="408" dy="0">Processors</tspan></text><text x="408" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="408" dy="0">Memory limiter • filter</tspan><tspan x="408" dy="20">transform • batch • tail</tspan><tspan x="408" dy="20">sample</tspan></text></g><g><rect x="765" y="350" width="265" height="145" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M783 350 H1012 Q1030 350 1030 368 V362 H765 V368 Q765 350 783 350" fill="#E9F8F0"/><text x="783" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="783" dy="0">Exporters</tspan></text><text x="783" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="783" dy="0">OTLP • Prometheus remote</tspan><tspan x="783" dy="20">write</tspan><tspan x="783" dy="20">Loki • Jaeger / Tempo</tspan></text></g><g><rect x="1150" y="350" width="260" height="145" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M1168 350 H1392 Q1410 350 1410 368 V362 H1150 V368 Q1150 350 1168 350" fill="#F2EDFF"/><text x="1168" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1168" dy="0">Backends</tspan></text><text x="1168" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1168" dy="0">Metrics / logs / traces</tspan><tspan x="1168" dy="20">multiple destinations</tspan></text></g><g><rect x="390" y="590" width="280" height="110" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M408 590 H652 Q670 590 670 608 V602 H390 V608 Q390 590 408 590" fill="#E5F7F7"/><text x="408" y="624" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="408" dy="0">Connectors</tspan></text><text x="408" y="655" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="408" dy="0">Bridge pipelines</tspan></text></g><g><rect x="55" y="590" width="245" height="110" rx="18" fill="#FFFFFF" stroke="#718096" stroke-width="2.2"/><path d="M73 590 H282 Q300 590 300 608 V602 H55 V608 Q55 590 73 590" fill="#EEF2F7"/><text x="73" y="624" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="73" dy="0">Extensions</tspan></text><text x="73" y="655" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="73" dy="0">Health • pprof • auth</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Production processors should enforce bounded memory, batching, filtering, redaction, sampling policy, retries, and queue limits. Monitor dropped</tspan><tspan x="88" dy="20">data and exporter failures.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>