 <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D18A13"/></marker>
 <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D64545"/></marker>
 <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#805AD5"/></marker>
 <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#159A9A"/></marker>
 <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#718096"/></marker>
</defs>
<rect width="1600" height="900" fill="#F5F8FC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2F6FEB"/>
<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">SLI, SLO, and SLA relationship</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">An SLI measures an outcome; an SLO sets the engineering target; an SLA is an external agreement with defined terms.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<path d="M 300.0,425.0 L 395.0,425.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 655.0,425.0 L 760.0,425.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1020.0,425.0 L 1125.0,425.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="1022.5" y="399.0" width="100" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="1072.5" y="416.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="1072.5" dy="0">commitment</tspan></text><path d="M 890.0,500.0 L 890.0,590.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="852.0" y="519.0" width="76" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="890.0" y="536.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="890.0" dy="0">derives</tspan></text><g><rect x="55" y="350" width="245" height="150" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M73 350 H282 Q300 350 300 368 V362 H55 V368 Q55 350 73 350" fill="#E9F8F0"/><text x="73" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="73" dy="0">User outcome</tspan></text><text x="73" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="73" dy="0">Successful, timely,</tspan><tspan x="73" dy="20">correct operation</tspan></text></g><g><rect x="395" y="350" width="260" height="150" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M413 350 H637 Q655 350 655 368 V362 H395 V368 Q395 350 413 350" fill="#EAF2FF"/><text x="413" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="413" dy="0">SLI measurement</tspan></text><text x="413" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="413" dy="0">Good eligible events ÷</tspan><tspan x="413" dy="20">all eligible events</tspan></text></g><g><rect x="760" y="350" width="260" height="150" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M778 350 H1002 Q1020 350 1020 368 V362 H760 V368 Q760 350 778 350" fill="#F2EDFF"/><text x="778" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="778" dy="0">Internal SLO</tspan></text><text x="778" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="778" dy="0">Target over a window</tspan><tspan x="778" dy="20">e.g. 99.9% monthly</tspan></text></g><g><rect x="1125" y="350" width="330" height="150" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M1143 350 H1437 Q1455 350 1455 368 V362 H1125 V368 Q1125 350 1143 350" fill="#FFF5DF"/><text x="1143" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1143" dy="0">External SLA</tspan></text><text x="1143" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1143" dy="0">Contract / commitment</tspan><tspan x="1143" dy="20">may define credits or remedy</tspan></text></g><g><rect x="760" y="590" width="260" height="110" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="2.2"/><path d="M778 590 H1002 Q1020 590 1020 608 V602 H760 V608 Q760 590 778 590" fill="#FDECEC"/><text x="778" y="624" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="778" dy="0">Error budget</tspan></text><text x="778" y="655" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="778" dy="0">1 − SLO</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Illustrative availability SLI = successful eligible requests ÷ all eligible requests. A 99.9% SLO implies a 0.1% error budget; an SLA may include</tspan><tspan x="88" dy="20">exclusions, measurement rules, and remedies.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>