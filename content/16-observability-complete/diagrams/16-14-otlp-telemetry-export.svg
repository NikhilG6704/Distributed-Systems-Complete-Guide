68 Q1030 350 1048 350" fill="#EEF2F7"/><text x="1048" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1048" dy="0">Collector queue</tspan></text><text x="1048" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1048" dy="0">Bounded queue • retry</tspan><tspan x="1048" dy="20">backoff • compression</tspan></text></g><g><rect x="1330" y="350" width="235" height="145" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M1348 350 H1547 Q1565 350 1565 368 V362 H1330 V368 Q1330 350 1348 350" fill="#E9F8F0"/><text x="1348" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1348" dy="0">Exporter / backend</tspan></text><text x="1348" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1348" dy="0">OTLP / vendor</tspan><tspan x="1348" dy="20">exporter</tspan><tspan x="1348" dy="20">acknowledgement</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Use TLS and authenticated endpoints, batching, compression where beneficial, bounded retry with backoff, request deadlines, and explicit</tspan><tspan x="88" dy="20">queue/drop telemetry.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" 