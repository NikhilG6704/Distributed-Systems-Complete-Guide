<rect width="1600" height="900" fill="#F5F8FC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2F6FEB"/>
<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">Jaeger tracing architecture</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">Modern deployments commonly ingest OpenTelemetry data; query and storage capacity must be planned separately from ingestion.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<path d="M 290.0,422.5 L 350.0,422.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 595.0,422.5 L 660.0,422.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 905.0,422.5 L 970.0,422.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1215.0,422.5 L 1270.0,422.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1400.0,495.0 L 1400.0,590.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="1362.0" y="516.5" width="76" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="1400.0" y="533.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="1400.0" dy="0">inspect</tspan></text><g><rect x="45" y="350" width="245" height="145" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M63 350 H272 Q290 350 290 368 V362 H45 V368 Q45 350 63 350" fill="#EAF2FF"/><text x="63" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="63" dy="0">Instrumented services</tspan></text><text x="63" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="63" dy="0">OTel SDKs /</tspan><tspan x="63" dy="20">auto-instrumentation</tspan><tspan x="63" dy="20">trace context</tspan></text></g><g><rect x="350" y="350" width="245" height="145" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M368 350 H577 Q595 350 595 368 V362 H350 V368 Q350 350 368 350" fill="#E5F7F7"/><text x="368" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="368" dy="0">OTel Collector</tspan></text><text x="368" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="368" dy="0">OTLP receiver</tspan><tspan x="368" dy="20">filter • batch • route</tspan></text></g><g><rect x="660" y="350" width="245" height="145" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M678 350 H887 Q905 350 905 368 V362 H660 V368 Q660 350 678 350" fill="#FFF5DF"/><text x="678" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="678" dy="0">Jaeger ingestion</tspan></text><text x="678" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="678" dy="0">Receive spans</tspan><tspan x="678" dy="20">validate / process</tspan></text></g><g><rect x="970" y="350" width="245" height="145" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M988 350 H1197 Q1215 350 1215 368 V362 H970 V368 Q970 350 988 350" fill="#F2EDFF"/><text x="988" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="988" dy="0">Trace storage + index</tspan></text><text x="988" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="988" dy="0">Persist spans</tspan><tspan x="988" dy="20">search attributes</tspan></text></g><g><rect x="1270" y="350" width="260" height="145" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M1288 350 H1512 Q1530 350 1530 368 V362 H1270 V368 Q1270 350 1288 350" fill="#E9F8F0"/><text x="1288" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1288" dy="0">Query service</tspan></text><text x="1288" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1288" dy="0">Search by service,</tspan><tspan x="1288" dy="20">tags,</tspan><tspan x="1288" dy="20">latency, trace ID</tspan></text></g><g><rect x="1270" y="590" width="260" height="115" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M1288 590 H1512 Q1530 590 1530 608 V602 H1270 V608 Q1270 590 1288 590" fill="#EAF2FF"/><text x="1288" y="624" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1288" dy="0">Jaeger UI</tspan></text><text x="1288" y="655" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1288" dy="0">Trace waterfall</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Jaeger helps locate slow spans, dependency edges, retries, and database waits. Historical Jaeger Agent topology is legacy context; use the</tspan><tspan x="88" dy="20">deployment architecture appropriate to the selected Jaeger release.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>