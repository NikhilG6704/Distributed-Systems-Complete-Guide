<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Jaeger tracing architecture</title><desc id="desc">Modern deployments commonly ingest OpenTelemetry data; query and storage capacity must be planned separately from ingestion.</desc>
