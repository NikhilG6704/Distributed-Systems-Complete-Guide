</defs>
<rect width="1600" height="900" fill="#F5F8FC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2F6FEB"/>
<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">Cascading failure from retry amplification</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">A local dependency slowdown can multiply attempts, consume concurrency, fill queues, and convert partial degradation into broad outage.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<path d="M 265.0,415.0 L 330.0,415.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 575.0,415.0 L 650.0,415.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 905.0,415.0 L 975.0,415.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1220.0,415.0 L 1280.0,415.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 777.5,485.0 L 777.5,590.0" fill="none" stroke="#159A62" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-green)"/><rect x="739.5" y="511.5" width="76" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="777.5" y="528.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="777.5" dy="0">contain</tspan></text><path d="M 905.0,650.0 L 975.0,650.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 1175.4,590.0 L 1311.6,485.0" fill="none" stroke="#159A62" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-green)"/><rect x="1205.5" y="511.5" width="76" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="1243.5106382978724" y="528.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="1243.5106382978724" dy="0">protect</tspan></text><g><rect x="45" y="345" width="220" height="140" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="2.2"/><path d="M63 345 H247 Q265 345 265 363 V357 H45 V363 Q45 345 63 345" fill="#FDECEC"/><text x="63" y="379" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="63" dy="0">Dependency slows</tspan></text><text x="63" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="63" dy="0">Latency / errors</tspan><tspan x="63" dy="20">rise</tspan></text></g><g><rect x="330" y="345" width="245" height="140" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M348 345 H557 Q575 345 575 363 V357 H330 V363 Q330 345 348 345" fill="#FFF5DF"/><text x="348" y="379" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="348" dy="0">Caller timeouts</tspan></text><text x="348" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="348" dy="0">In-flight requests</tspan><tspan x="348" dy="20">held</tspan></text></g><g><rect x="650" y="345" width="255" height="140" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="2.2"/><path d="M668 345 H887 Q905 345 905 363 V357 H650 V363 Q650 345 668 345" fill="#FDECEC"/><text x="668" y="379" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="668" dy="0">Retry layers</tspan></text><text x="668" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="668" dy="0">Gateway × app × client</tspan><tspan x="668" dy="20">attempt multiplication</tspan></text></g><g><rect x="975" y="345" width="245" height="140" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M993 345 H1202 Q1220 345 1220 363 V357 H975 V363 Q975 345 993 345" fill="#FFF5DF"/><text x="993" y="379" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="993" dy="0">Queues saturate</tspan></text><text x="993" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="993" dy="0">Backlog • pool</tspan><tspan x="993" dy="20">exhaustion</tspan></text></g><g><rect x="1280" y="345" width="245" height="140" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="2.2"/><path d="M1298 345 H1507 Q1525 345 1525 363 V357 H1280 V363 Q1280 345 1298 345" fill="#FDECEC"/><text x="1298" y="379" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1298" dy="0">System-wide failure</tspan></text><text x="1298" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1298" dy="0">More timeouts • 5xx</tspan><tspan x="1298" dy="20">cascading degradation</tspan></text></g><g><rect x="650" y="590" width="255" height="120" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M668 590 H887 Q905 590 905 608 V602 H650 V608 Q650 590 668 590" fill="#E9F8F0"/><text x="668" y="624" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="668" dy="0">Bulkhead / limits</tspan></text><text x="668" y="655" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="668" dy="0">Bound concurrency</tspan></text></g><g><rect x="975" y="590" width="245" height="120" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M993 590 H1202 Q1220 590 1220 608 V602 H975 V608 Q975 590 993 590" fill="#E5F7F7"/><text x="993" y="624" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="993" dy="0">Circuit breaker</tspan></text><text x="993" y="655" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="993" dy="0">Fail fast • bounded</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Retry budgets, exponential backoff with jitter, idempotency, deadlines, circuit breakers, bulkheads, and load shedding limit amplification.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>