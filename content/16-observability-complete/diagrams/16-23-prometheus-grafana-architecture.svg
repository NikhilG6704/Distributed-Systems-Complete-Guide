<path d="M 265.0,422.5 L 325.0,422.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 555.0,422.5 L 620.0,422.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 865.0,353.1 L 945.0,307.7" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="873.0" y="304.4" width="64" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="905.0" y="321.3740157480315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="905.0" dy="0">query</tspan></text><path d="M 865.0,493.9 L 945.0,540.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="873.0" y="491.2" width="64" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="905.0" y="508.1850393700788" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="905.0" dy="0">rules</tspan></text><path d="M 865.0,422.5 L 1245.0,422.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="997.0" y="396.5" width="116" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="1055.0" y="413.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="1055.0" dy="0">remote write</tspan></text><g><rect x="45" y="350" width="220" height="145" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M63 350 H247 Q265 350 265 368 V362 H45 V368 Q45 350 63 350" fill="#EAF2FF"/><text x="63" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="63" dy="0">Targets / exporters</tspan></text><text x="63" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="63" dy="0">/metrics endpoints</tspan><tspan x="63" dy="20">service discovery</tspan></text></g><g><rect x="325" y="350" width="230" height="145" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M343 350 H537 Q555 350 555 368 V362 H325 V368 Q325 350 343 350" fill="#E5F7F7"/><text x="343" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="343" dy="0">Prometheus scraper</tspan></text><text x="343" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="343" dy="0">Pull + scrape</tspan><tspan x="343" dy="20">interval</tspan><tspan x="343" dy="20">labels / relabeling</tspan></text></g><g><rect x="620" y="350" width="245" height="145" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M638 350 H847 Q865 350 865 368 V362 H620 V368 Q620 350 638 350" fill="#F2EDFF"/><text x="638" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="638" dy="0">TSDB + PromQL</tspan></text><text x="638" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="638" dy="0">Local time series</tspan><tspan x="638" dy="20">query / recording</tspan><tspan x="638" dy="20">rules</tspan></text></g><g><rect x="945" y="170" width="230" height="145" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M963 170 H1157 Q1175 170 1175 188 V182 H945 V188 Q945 170 963 170" fill="#E9F8F0"/><text x="963" y="204" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="963" dy="0">Grafana</tspan></text><text x="963" y="235" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="963" dy="0">Dashboards • explore</tspan><tspan x="963" dy="20">alert views</tspan></text></g><g><rect x="945" y="535" width="230" height="145" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="2.2"/><path d="M963 535 H1157 Q1175 535 1175 553 V547 H945 V553 Q945 535 963 535" fill="#FDECEC"/><text x="963" y="569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="963" dy="0">Alertmanager</tspan></text><text x="963" y="600" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="963" dy="0">Group • route •</tspan><tspan x="963" dy="20">silence</tspan><tspan x="963" dy="20">notification</tspan></text></g><g><rect x="1245" y="350" width="285" height="145" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M1263 350 H1512 Q1530 350 1530 368 V362 H1245 V368 Q1245 350 1263 350" fill="#FFF5DF"/><text x="1263" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1263" dy="0">Remote write / federation</tspan></text><text x="1263" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1263" dy="0">Long-term / global metrics</tspan><tspan x="1263" dy="20">Thanos / Mimir / remote</tspan><tspan x="1263" dy="20">store</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Scrape health (up), labels, interval, retention, and cardinality determine reliability and cost. Remote write, federation, or a compatible</tspan><tspan x="88" dy="20">long-term system extends beyond one Prometheus instance.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>