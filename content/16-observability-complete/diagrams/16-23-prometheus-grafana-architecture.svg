<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">Prometheus and Grafana architecture</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">Prometheus discovers and scrapes targets into its TSDB; Grafana queries metrics, while alert rules route through Alertmanager.</text>
