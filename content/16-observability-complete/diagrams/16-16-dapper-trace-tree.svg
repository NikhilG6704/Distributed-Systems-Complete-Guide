<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Dapper-style trace tree</title><desc id="desc">A trace tree represents nested RPC work; timestamps and annotations reveal where time is spent across a distributed request.</desc>
