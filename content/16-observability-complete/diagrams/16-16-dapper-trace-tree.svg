<rect width="1600" height="900" fill="#F5F8FC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2F6FEB"/>
<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">Dapper-style trace tree</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">A trace tree represents nested RPC work; timestamps and annotations reveal where time is spent across a distributed request.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<path d="M 662.9,285.0 L 445.0,392.3" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 795.1,285.0 L 787.4,390.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 312.5,525.0 L 312.5,610.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 782.5,525.0 L 782.5,610.0" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 932.2,285.0 L 1138.0,390.0" fill="none" stroke="#159A62" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-green)"/><rect x="965.1" y="311.5" width="140" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="1035.1020408163265" y="328.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="1035.1020408163265" dy="0">sample decision</tspan></text><g><rect x="625" y="150" width="350" height="135" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M643 150 H957 Q975 150 975 168 V162 H625 V168 Q625 150 643 150" fill="#F2EDFF"/><text x="643" y="184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="643" dy="0">Root RPC</tspan></text><text x="643" y="215" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="643" dy="0">Trace T • span 1</tspan><tspan x="643" dy="20">frontend request</tspan></text></g><g><rect x="180" y="390" width="265" height="135" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M198 390 H427 Q445 390 445 408 V402 H180 V408 Q180 390 198 390" fill="#EAF2FF"/><text x="198" y="424" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="198" dy="0">Service RPC A</tspan></text><text x="198" y="455" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="198" dy="0">span 2 • parent 1</tspan><tspan x="198" dy="20">server work</tspan></text></g><g><rect x="650" y="390" width="265" height="135" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M668 390 H897 Q915 390 915 408 V402 H650 V408 Q650 390 668 390" fill="#EAF2FF"/><text x="668" y="424" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="668" dy="0">Service RPC B</tspan></text><text x="668" y="455" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="668" dy="0">span 3 • parent 1</tspan><tspan x="668" dy="20">parallel call</tspan></text></g><g><rect x="180" y="610" width="265" height="120" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M198 610 H427 Q445 610 445 628 V622 H180 V628 Q180 610 198 610" fill="#E5F7F7"/><text x="198" y="644" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="198" dy="0">Database child</tspan></text><text x="198" y="675" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="198" dy="0">span 4 • parent 2</tspan></text></g><g><rect x="650" y="610" width="265" height="120" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M668 610 H897 Q915 610 915 628 V622 H650 V628 Q650 610 668 610" fill="#FFF5DF"/><text x="668" y="644" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="668" dy="0">Remote RPC child</tspan></text><text x="668" y="675" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="668" dy="0">span 5 • parent 3</tspan></text></g><g><rect x="1130" y="390" width="300" height="145" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M1148 390 H1412 Q1430 390 1430 408 V402 H1130 V408 Q1130 390 1148 390" fill="#E9F8F0"/><text x="1148" y="424" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1148" dy="0">Sampled trace</tspan></text><text x="1148" y="455" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1148" dy="0">Low-overhead common</tspan><tspan x="1148" dy="20">library instrumentation</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Dapper emphasized common-library instrumentation, sampling, and low overhead so tracing could operate at production scale. This conceptual tree</tspan><tspan x="88" dy="20">is not a claim about a current Google deployment.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>