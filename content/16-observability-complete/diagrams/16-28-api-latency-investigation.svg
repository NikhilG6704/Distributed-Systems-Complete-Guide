<text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text><line x1="260" y1="252" x2="1460" y2="252" stroke="#E1E8F0"/><text x="72" y="234" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="72" dy="0">Gateway total</tspan></text><line x1="260" y1="328" x2="1460" y2="328" stroke="#E1E8F0"/><text x="72" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="72" dy="0">Application handler</tspan></text><line x1="260" y1="404" x2="1460" y2="404" stroke="#E1E8F0"/><text x="72" y="386" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="72" dy="0">Connection pool wait</tspan></text><line x1="260" y1="480" x2="1460" y2="480" stroke="#E1E8F0"/><text x="72" y="462" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="72" dy="0">Database query</tspan></text><line x1="260" y1="556" x2="1460" y2="556" stroke="#E1E8F0"/><text x="72" y="538" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="72" dy="0">Downstream dependency</tspan></text><line x1="260" y1="632" x2="1460" y2="632" stroke="#E1E8F0"/><text x="72" y="614" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#172B4D" text-anchor="start"><tspan x="72" dy="0">CPU utilization (context)</tspan></text><line x1="260.0" y1="193" x2="260.0" y2="643" stroke="#E6ECF3" stroke-dasharray="4 6"/><text x="260.0" y="181" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#526581" text-anchor="middle"><tspan x="260.0" dy="0">0 ms</tspan></text><line x1="500.0" y1="193" x2="500.0" y2="643" stroke="#E6ECF3" stroke-dasharray="4 6"/><text x="500.0" y="181" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#526581" text-anchor="middle"><tspan x="500.0" dy="0">50 ms</tspan></text><line x1="740.0" y1="193" x2="740.0" y2="643" stroke="#E6ECF3" stroke-dasharray="4 6"/><text x="740.0" y="181" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#526581" text-anchor="middle"><tspan x="740.0" dy="0">100 ms</tspan></text><line x1="980.0" y1="193" x2="980.0" y2="643" stroke="#E6ECF3" stroke-dasharray="4 6"/><text x="980.0" y="181" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#526581" text-anchor="middle"><tspan x="980.0" dy="0">150 ms</tspan></text><line x1="1220.0" y1="193" x2="1220.0" y2="643" stroke="#E6ECF3" stroke-dasharray="4 6"/><text x="1220.0" y="181" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#526581" text-anchor="middle"><tspan x="1220.0" dy="0">200 ms</tspan></text><line x1="1460.0" y1="193" x2="1460.0" y2="643" stroke="#E6ECF3" stroke-dasharray="4 6"/><text x="1460.0" y="181" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#526581" text-anchor="middle"><tspan x="1460.0" dy="0">250 ms</tspan></text><rect x="260.0" y="210" width="1176.0" height="30" rx="8" fill="#FDECEC" stroke="#D64545" stroke-width="1.7"/><text x="268.0" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#A82727" text-anchor="start"><tspan x="268.0" dy="0">P99 request path</tspan></text><rect x="317.6" y="286" width="1032.0" height="30" rx="8" fill="#EAF2FF" stroke="#2F6FEB" stroke-width="1.7"/><text x="325.6" y="306" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#1D4ED8" text-anchor="start"><tspan x="325.6" dy="0">handler</tspan></text><rect x="380.0" y="362" width="566.4" height="30" rx="8" fill="#FDECEC" stroke="#D64545" stroke-width="1.7"/><text x="388.0" y="382" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#A82727" text-anchor="start"><tspan x="388.0" dy="0">pool wait ↑</tspan></text><rect x="956.0" y="438" width="336.0" height="30" rx="8" fill="#FFF5DF" stroke="#D18A13" stroke-width="1.7"/><text x="964.0" y="458" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#9A5B00" text-anchor="start"><tspan x="964.0" dy="0">DB query</tspan></text><rect x="572.0" y="514" width="360.0" height="30" rx="8" fill="#E5F7F7" stroke="#159A9A" stroke-width="1.7"/><text x="580.0" y="534" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#0B7070" text-anchor="start"><tspan x="580.0" dy="0">dependency</tspan></text><rect x="260.0" y="590" width="1176.0" height="30" rx="8" fill="#E9F8F0" stroke="#159A62" stroke-width="1.7"/><text x="268.0" y="610" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#087443" text-anchor="start"><tspan x="268.0" dy="0">CPU remains flat</tspan></text><rect x="64" y="679" width="1472" height="29" rx="8" fill="#EAF2FF"/><text x="82" y="699" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#1D4ED8" text-anchor="start"><tspan x="82" dy="0">Compare fast and slow traces, and align spans with pool wait, DB latency, downstream calls, and deployment annotations.</tspan></text><rect x="64" y="718" width="1472" height="29" rx="8" fill="#FFF5DF"/><text x="82" y="738" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#9A5B00" text-anchor="start"><tspan x="82" dy="0">The earliest abnormal span or queue is a stronger candidate than the last error observed at the gateway.</tspan></text><rect x="64" y="757" width="1472" height="29" rx="8" fill="#E9F8F0"/><text x="82" y="777" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#087443" text-anchor="start"><tspan x="82" dy="0">Example timings illustrate a diagnostic pattern, not an actual incident measurement.</tspan></text><text x="1460" y="649" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#526581" text-anchor="end"><tspan x="1460" dy="0">time →</tspan></text></svg>