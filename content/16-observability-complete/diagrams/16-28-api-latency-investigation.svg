<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">API P99 latency investigation</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">Illustrative trace and metric alignment: pool wait becomes abnormal before the slow database span; CPU alone would miss the bottleneck.</text>
