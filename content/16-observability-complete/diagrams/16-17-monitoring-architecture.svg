layer</tspan></text><text x="363" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="363" dy="0">Scrape / agents / OTel</tspan><tspan x="363" dy="20">service discovery</tspan></text></g><g><rect x="660" y="350" width="255" height="145" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M678 350 H897 Q915 350 915 368 V362 H660 V368 Q660 350 678 350" fill="#F2EDFF"/><text x="678" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="678" dy="0">Telemetry stores</tspan></text><text x="678" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="678" dy="0">Metrics • logs • traces</tspan><tspan x="678" dy="20">retention + query</tspan></text></g><g><rect x="985" y="350" width="225" height="145" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M1003 350 H1192 Q1210 350 1210 368 V362 H985 V368 Q985 350 1003 350" fill="#FFF5DF"/><text x="1003" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1003" dy="0">Rule evaluator</tspan></text><text x="1003" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1003" dy="0">Threshold / anomaly</tspan><tspan x="1003" dy="20">SLO burn-rate rules</tspan></text></g><g><rect x="1280" y="350" width="235" height="145" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="2.2"/><path d="M1298 350 H1497 Q1515 350 1515 368 V362 H1280 V368 Q1280 350 1298 350" fill="#FDECEC"/><text x="1298" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1298" dy="0">Alert router</tspan></text><text x="1298" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1298" dy="0">Group • deduplicate</tspan><tspan x="1298" dy="20">inhibit • route</tspan></text></g><g><rect x="1280" y="590" width="235" height="115" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M1298 590 H1497 Q1515 590 1515 608 V602 H1280 V608 Q1280 590 1298 590" fill="#E9F8F0"/><text x="1298" y="624" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1298" dy="0">On-call response</tspan></text><text x="1298" y="655" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1298" dy="0">Page / ticket •</tspan></text></g><g><rect x="660" y="590" width="255" height="115" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M678 590 H897 Q915 590 915 608 V602 H660 V608 Q660 590 678 590" fill="#EAF2FF"/><text x="678" y="624" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="678" dy="0">Dashboards</tspan></text><text x="678" y="655" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="678" dy="0">Human exploration</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Monitor telemetry freshness and pipeline health as well as application health; stale or missing signals must not silently appear healthy.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>