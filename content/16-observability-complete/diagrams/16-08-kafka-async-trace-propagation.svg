<rect width="1600" height="900" fill="#F5F8FC"/>
<rect x="0" y="0" width="1600" height="10" fill="#2F6FEB"/>
<text x="64" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">Asynchronous trace propagation through Kafka</text>
<text x="66" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#526581">Trace context is carried in message headers; the consumer span may start much later than the producer span.</text>
<line x1="64" y1="126" x2="1536" y2="126" stroke="#DCE5EF" stroke-width="2"/>
<path d="M 270.0,422.5 L 335.0,422.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M 580.0,422.5 L 650.0,422.5" fill="none" stroke="#2F6FEB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="577.0" y="396.5" width="76" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="615.0" y="413.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="615.0" dy="0">headers</tspan></text><path d="M 895.0,422.5 L 965.0,422.5" fill="none" stroke="#805AD5" stroke-width="3" marker-end="url(#arrow-purple)"/><rect x="868.0" y="396.5" width="124" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="930.0" y="413.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="930.0" dy="0">consume later</tspan></text><path d="M 1210.0,422.5 L 1270.0,422.5" fill="none" stroke="#D64545" stroke-width="3" marker-end="url(#arrow-red)"/><rect x="1174.0" y="396.5" width="132" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="1240.0" y="413.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="1240.0" dy="0">failed attempt</tspan></text><path d="M 778.8,495.0 L 787.1,590.0" fill="none" stroke="#159A9A" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-teal)"/><rect x="716.9" y="516.5" width="132" height="25" rx="12" fill="#FFFFFF" stroke="#D8E1EC"/><text x="782.9347826086957" y="533.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#172B4D" text-anchor="middle"><tspan x="782.9347826086957" dy="0">batch / fan-in</tspan></text><g><rect x="50" y="350" width="220" height="145" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M68 350 H252 Q270 350 270 368 V362 H50 V368 Q50 350 68 350" fill="#EAF2FF"/><text x="68" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="68" dy="0">Producer service</tspan></text><text x="68" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="68" dy="0">Create PRODUCER</tspan><tspan x="68" dy="20">span</tspan><tspan x="68" dy="20">serialize message</tspan></text></g><g><rect x="335" y="350" width="245" height="145" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M353 350 H562 Q580 350 580 368 V362 H335 V368 Q335 350 353 350" fill="#F2EDFF"/><text x="353" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="353" dy="0">Inject message headers</tspan></text><text x="353" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="353" dy="0">traceparent •</tspan><tspan x="353" dy="20">tracestate</tspan><tspan x="353" dy="20">message_id kept</tspan></text></g><g><rect x="650" y="350" width="245" height="145" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M668 350 H877 Q895 350 895 368 V362 H650 V368 Q650 350 668 350" fill="#FFF5DF"/><text x="668" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="668" dy="0">Kafka topic / partition</tspan></text><text x="668" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="668" dy="0">Durable append</tspan><tspan x="668" dy="20">partition + offset</tspan><tspan x="668" dy="20">queue residence time</tspan></text></g><g><rect x="965" y="350" width="245" height="145" rx="18" fill="#FFFFFF" stroke="#159A62" stroke-width="2.2"/><path d="M983 350 H1192 Q1210 350 1210 368 V362 H965 V368 Q965 350 983 350" fill="#E9F8F0"/><text x="983" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="983" dy="0">Consumer worker</tspan></text><text x="983" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="983" dy="0">Extract context</tspan><tspan x="983" dy="20">create CONSUMER span</tspan><tspan x="983" dy="20">process + commit</tspan></text></g><g><rect x="1270" y="350" width="260" height="145" rx="18" fill="#FFFFFF" stroke="#D64545" stroke-width="2.2"/><path d="M1288 350 H1512 Q1530 350 1530 368 V362 H1270 V368 Q1270 350 1288 350" fill="#FDECEC"/><text x="1288" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1288" dy="0">Retry / dead-letter</tspan></text><text x="1288" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1288" dy="0">Retry uses propagated</tspan><tspan x="1288" dy="20">context or link; DLQ</tspan><tspan x="1288" dy="20">records failure context</tspan></text></g><g><rect x="650" y="590" width="285" height="125" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M668 590 H917 Q935 590 935 608 V602 H650 V608 Q650 590 668 590" fill="#E5F7F7"/><text x="668" y="624" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="668" dy="0">Batch fan-in</tspan></text><text x="668" y="655" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="668" dy="0">Link multiple producer</tspan><tspan x="668" dy="20">contexts; avoid inventing</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">A message ID identifies the message; a trace ID identifies a logical trace. Reprocessing, retries, and fan-in may require span links rather than</tspan><tspan x="88" dy="20">a strict parent-child tree.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>