55 205 73 205" fill="#EAF2FF"/><text x="73" y="239" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="73" dy="0">1. Instrument</tspan></text><text x="73" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="73" dy="0">API / SDK / agents</tspan></text></g><g><rect x="440" y="205" width="330" height="125" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M458 205 H752 Q770 205 770 223 V217 H440 V223 Q440 205 458 205" fill="#E5F7F7"/><text x="458" y="239" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="458" dy="0">2. Collect</tspan></text><text x="458" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="458" dy="0">Receivers / scrapers</tspan></text></g><g><rect x="825" y="205" width="330" height="125" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M843 205 H1137 Q1155 205 1155 223 V217 H825 V223 Q825 205 843 205" fill="#F2EDFF"/><text x="843" y="239" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="843" dy="0">3. Enrich</tspan></text><text x="843" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="843" dy="0">Resource / context</tspan></text></g><g><rect x="1210" y="205" width="330" height="125" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M1228 205 H1522 Q1540 205 1540 223 V217 H1210 V223 Q1210 205 1228 205" fill="#FFF5DF"/><text x="1228" y="239" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1228" dy="0">4. Process</tspan></text><text x="1228" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1228" dy="0">Parse / normalize</tspan></text></g><g><rect x="55" y="390" width="330" height="125" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M73 390 H367 Q385 390 385 408 V402 H55 V408 Q55 390 73 390" fill="#EAF2FF"/><text x="73" y="424" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="73" dy="0">5. Sample / filter</tspan></text><text x="73" y="455" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="73" dy="0">Policy / cardinality</tspan></text></g><g><rect x="440" y="390" width="330" height="125" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M458 390 H752 Q770 390 770 408 V402 H440 V408 Q440 390 458 390" fill="#E5F7F7"/><text x="458" y="424" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="458" dy="0">6. Transport</tspan></text><text x="458" y="455" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="458" dy="0">OTLP / queues</tspan></text></g><g><rect x="825" y="390" width="330" height="125" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M843 390 H1137 Q1155 390 1155 408 V402 H825 V408 Q825 390 843 390" fill="#F2EDFF"/><text x="843" y="424" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="843" dy="0">7. Store</tspan></text><text x="843" y="455" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="843" dy="0">Hot / warm / cold</tspan></text></g><g><rect x="1210" y="390" width="330" height="125" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M1228 390 H1522 Q1540 390 1540 408 V402 H1210 V408 Q1210 390 1228 390" fill="#FFF5DF"/><text x="1228" y="424" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1228" dy="0">8. Index</tspan></text><text x="1228" y="455" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1228" dy="0">Search structures</tspan></text></g><g><rect x="55" y="575" width="330" height="125" rx="18" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="2.2"/><path d="M73 575 H367 Q385 575 385 593 V587 H55 V593 Q55 575 73 575" fill="#EAF2FF"/><text x="73" y="609" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="73" dy="0">9. Query</tspan></text><text x="73" y="640" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="73" dy="0">PromQL / trace / log</tspan></text></g><g><rect x="440" y="575" width="330" height="125" rx="18" fill="#FFFFFF" stroke="#159A9A" stroke-width="2.2"/><path d="M458 575 H752 Q770 575 770 593 V587 H440 V593 Q440 575 458 575" fill="#E5F7F7"/><text x="458" y="609" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="458" dy="0">10. Visualize</tspan></text><text x="458" y="640" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="458" dy="0">Dashboards / maps</tspan></text></g><g><rect x="825" y="575" width="330" height="125" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="2.2"/><path d="M843 575 H1137 Q1155 575 1155 593 V587 H825 V593 Q825 575 843 575" fill="#F2EDFF"/><text x="843" y="609" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="843" dy="0">11. Alert</tspan></text><text x="843" y="640" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="843" dy="0">Rules / SLO / routing</tspan></text></g><g><rect x="1210" y="575" width="330" height="125" rx="18" fill="#FFFFFF" stroke="#D18A13" stroke-width="2.2"/><path d="M1228 575 H1522 Q1540 575 1540 593 V587 H1210 V593 Q1210 575 1228 575" fill="#FFF5DF"/><text x="1228" y="609" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172B4D" text-anchor="start"><tspan x="1228" dy="0">12. Retain / delete</tspan></text><text x="1228" y="640" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="450" fill="#526581" text-anchor="start"><tspan x="1228" dy="0">TTL / archive / erasure</tspan></text></g><rect x="64" y="765" width="1472" height="72" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/><text x="88" y="794" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#526581" text-anchor="start"><tspan x="88" dy="0">Instrument → collect → enrich → process → sample/filter → transport → store → index → query → visualize → alert → retain/delete. Track drops and</tspan><tspan x="88" dy="20">backpressure at every boundary.</tspan></text><circle cx="70" cy="862" r="6" fill="#2F6FEB"/><text x="84" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="84" dy="0">Telemetry/data flow</tspan></text><circle cx="340" cy="862" r="6" fill="#159A62"/><text x="354" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="354" dy="0">Healthy / accepted</tspan></text><circle cx="610" cy="862" r="6" fill="#D18A13"/><text x="624" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="624" dy="0">Queue / decision</tspan></text><circle cx="880" cy="862" r="6" fill="#D64545"/><text x="894" y="867" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="550" fill="#526581" text-anchor="start"><tspan x="894" dy="0">Error / degradation</tspan></text><text x="1536" y="867" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8191A8">OBSERVABILITY ENGINEERING • CHAPTER 16</text></svg>