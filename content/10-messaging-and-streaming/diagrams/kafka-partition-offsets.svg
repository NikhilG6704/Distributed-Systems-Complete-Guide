<text x="398" y="280" text-anchor="middle" style="fill:#17263C;font-weight:700;font-size:15px">offset 2</text>
<text x="398" y="315" text-anchor="middle" style="fill:#5F7087;font-size:13px">event 3</text>
<rect x="468" y="245" width="112" height="112" rx="12" fill="#FFFFFF" stroke="#0B8A67" stroke-width="2"/>
<text x="524" y="280" text-anchor="middle" style="fill:#17263C;font-weight:700;font-size:15px">offset 3</text>
<text x="524" y="315" text-anchor="middle" style="fill:#5F7087;font-size:13px">event 4</text>
<rect x="594" y="245" width="112" height="112" rx="12" fill="#FFFFFF" stroke="#0B8A67" stroke-width="2"/>
<text x="650" y="280" text-anchor="middle" style="fill:#17263C;font-weight:700;font-size:15px">offset 4</text>
<text x="650" y="315" text-anchor="middle" style="fill:#5F7087;font-size:13px">event 5</text>
<rect x="720" y="245" width="112" height="112" rx="12" fill="#FFFFFF" stroke="#0B8A67" stroke-width="2"/>
<text x="776" y="280" text-anchor="middle" style="fill:#17263C;font-weight:700;font-size:15px">offset 5</text>
<text x="776" y="315" text-anchor="middle" style="fill:#5F7087;font-size:13px">event 6</text>
