<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Kafka partition offsets and consumer progress</title><desc id="desc">Offsets identify positions within one partition; committed progress may trail fetched or processed records.</desc>
<defs>
