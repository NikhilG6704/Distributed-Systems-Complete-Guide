  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
 </style>
</defs>
<rect width="100%" height="100%" fill="#F5F8FC"/>
<text class="title" x="64" y="58">Kafka partition offsets and consumer progress</text>
<text class="subtitle" x="66" y="88">Offsets identify positions within one partition; committed progress may trail fetched or processed records.</text>

<text x="85" y="170" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:20px">orders-7 · partition 2</text>
<rect x="90" y="245" width="112" height="112" rx="12" fill="#FFFFFF" stroke="#0B8A67" stroke-width="2"/>
<text x="146" y="280" text-anchor="middle" style="fill:#17263C;font-weight:700;font-size:15px">offset 0</text>
