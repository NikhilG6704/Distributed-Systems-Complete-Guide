<text x="902" y="280" text-anchor="middle" style="fill:#17263C;font-weight:700;font-size:15px">offset 6</text>
<text x="902" y="315" text-anchor="middle" style="fill:#5F7087;font-size:13px">event 7</text>
<rect x="972" y="245" width="112" height="112" rx="12" fill="#FFFFFF" stroke="#53657C" stroke-width="2"/>
<text x="1028" y="280" text-anchor="middle" style="fill:#17263C;font-weight:700;font-size:15px">offset 7</text>
<text x="1028" y="315" text-anchor="middle" style="fill:#5F7087;font-size:13px">event 8</text>
<rect x="1098" y="245" width="112" height="112" rx="12" fill="#FFFFFF" stroke="#53657C" stroke-width="2"/>
<text x="1154" y="280" text-anchor="middle" style="fill:#17263C;font-weight:700;font-size:15px">offset 8</text>
<text x="1154" y="315" text-anchor="middle" style="fill:#5F7087;font-size:13px">event 9</text>
<rect x="1224" y="245" width="112" height="112" rx="12" fill="#FFFFFF" stroke="#53657C" stroke-width="2"/>
<text x="1280" y="280" text-anchor="middle" style="fill:#17263C;font-weight:700;font-size:15px">offset 9</text>
<text x="1280" y="315" text-anchor="middle" style="fill:#5F7087;font-size:13px">event 10</text>
<path d="M90,390 L1336,390" fill="none" stroke="#CAD5E2" stroke-width="2" stroke-linecap="round"/>
<text x="90" y="425" text-anchor="start" style="fill:#5F7087;font-size:13px">Earlier records</text>
<text x="1360" y="425" text-anchor="end" style="fill:#5F7087;font-size:13px">Newer records</text>
<path d="M776,220 L776,238" fill="none" stroke="#0B8A67" stroke-width="2" stroke-linecap="round"/>
<rect x="725" y="175" width="175" height="30" rx="15" fill="#E8F7F1" stroke="#0B8A67" stroke-width="1.1"/>
<text x="812.5" y="195" text-anchor="middle" style="fill:#0B8A67;font-weight:700;font-size:13px">Last processed = 5</text>
<path d="M1028,365 L1028,390" fill="none" stroke="#C17A0B" stroke-width="2" stroke-linecap="round"/>
<rect x="967" y="402" width="180" height="30" rx="15" fill="#FFF5DF" stroke="#C17A0B" stroke-width="1.1"/>
<text x="1057.0" y="422" text-anchor="middle" style="fill:#C17A0B;font-weight:700;font-size:13px">Fetched position = 7</text>
<rect x="120" y="535" width="330" height="125" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="120" y="535" width="330" height="9" rx="5" fill="#C17A0B" stroke="#C17A0B" stroke-width="0"/>
<text x="138" y="574" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Restart at committed position</text>
<text x="138" y="602" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="138" dy="0">Committed position = 6 (next to read)</tspan>
<tspan x="138" dy="22">Consumer resumes from offset 6.</tspan>
</text>
<rect x="555" y="535" width="330" height="125" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="555" y="535" width="330" height="9" rx="5" fill="#C43D4B" stroke="#C43D4B" stroke-width="0"/>
<text x="573" y="574" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Commit too early</text>
<text x="573" y="602" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="573" dy="0">If offset 5 is committed before</tspan>
<tspan x="573" dy="22">the DB effect, a crash can lose it.</tspan>
</text>
<rect x="990" y="535" width="330" height="125" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="990" y="535" width="330" height="9" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="1008" y="574" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Replay intentionally</text>
<text x="1008" y="602" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="1008" dy="0">Reset progress to an earlier</tspan>
<tspan x="1008" dy="22">offset to rebuild a projection.</tspan>
</text>
<text x="720" y="735" text-anchor="middle" style="fill:#17263C;font-weight:700;font-size:16px">Consumer position, committed offset, log end offset, and high watermark are distinct positions.</text>
<path d="M64 842 H1376" stroke="#CAD5E2" stroke-width="1"/>
<text x="66" y="868" text-anchor="start" style="fill:#5F7087;font-size:12px">Conceptual architecture; exact behavior depends on product and configuration.</text>
</svg>