<path d="M252,469 L252,499" fill="none" stroke="#C43D4B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-red)"/>
<rect x="150" y="499" width="205" height="58" rx="12" fill="#FFFFFF" stroke="#C43D4B" stroke-width="1.8"/>
<text x="252" y="535" text-anchor="middle" style="fill:#17263C;font-weight:700;font-size:16px">event 4</text>
<path d="M252,557 L252,587" fill="none" stroke="#C43D4B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-red)"/>
<rect x="150" y="587" width="205" height="58" rx="12" fill="#FFFFFF" stroke="#C43D4B" stroke-width="1.8"/>
