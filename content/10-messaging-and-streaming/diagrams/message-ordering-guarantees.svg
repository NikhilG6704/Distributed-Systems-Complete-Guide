<path d="M1060,576 L1100,576" fill="none" stroke="#7052C7" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-purple)"/>
<rect x="1100" y="545" width="125" height="62" rx="12" fill="#FFFFFF" stroke="#7052C7" stroke-width="1.8"/>
<text x="1162" y="583" text-anchor="middle" style="fill:#17263C;font-weight:700;font-size:17px">C3</text>
<text x="950" y="745" text-anchor="middle" style="fill:#17263C;font-weight:650;font-size:15px">Each key keeps local sequence; independent keys execute concurrently.</text>
<path d="M64 842 H1376" stroke="#CAD5E2" stroke-width="1"/>
<text x="66" y="868" text-anchor="start" style="fill:#5F7087;font-size:12px">Conceptual architecture; exact behavior depends on product and configuration.</text>
