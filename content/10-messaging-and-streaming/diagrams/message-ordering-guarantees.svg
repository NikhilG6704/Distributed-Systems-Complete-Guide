<rect x="1100" y="390" width="125" height="62" rx="12" fill="#FFFFFF" stroke="#0B8A67" stroke-width="1.8"/>
<text x="1162" y="428" text-anchor="middle" style="fill:#17263C;font-weight:700;font-size:17px">B3</text>
<text x="570" y="576" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:16px">Account C</text>
<rect x="770" y="545" width="125" height="62" rx="12" fill="#FFFFFF" stroke="#7052C7" stroke-width="1.8"/>
