<text x="408" y="699" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Checkpoint storage</text>
<text x="408" y="727" text-anchor="start" style="fill:#5F7087;font-size:14px">
<tspan x="408" dy="0">Operator state + source offsets persisted as one consistent checkpoint.</tspan>
</text>
<path d="M477 555 V625 H510 V660" fill="none" stroke="#7052C7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow-purple)"/>
