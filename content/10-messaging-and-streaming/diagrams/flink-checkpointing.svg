<tspan x="378" dy="0">state snapshot</tspan>
<tspan x="378" dy="22">barrier 12</tspan>
</text>
<rect x="720" y="285" width="235" height="270" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
