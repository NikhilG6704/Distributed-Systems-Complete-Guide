<text x="527.5" y="700" text-anchor="middle" style="fill:#0B8A67;font-weight:700;font-size:13px">Compatible additive change</text>
<rect x="790" y="680" width="275" height="30" rx="15" fill="#FDECEF" stroke="#C43D4B" stroke-width="1.1"/>
<text x="927.5" y="700" text-anchor="middle" style="fill:#C43D4B;font-weight:700;font-size:13px">Breaking semantic/type change</text>
<text x="720" y="765" text-anchor="middle" style="fill:#17263C;font-weight:650;font-size:15px">Compatibility is directional and format-specific; deployment order and historical event readability matter.</text>
