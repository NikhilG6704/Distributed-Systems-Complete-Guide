<text class="title" x="64" y="58">Event schema evolution and compatibility</text>
<text class="subtitle" x="66" y="88">Schema governance lets independently deployed producers and consumers evolve without silently breaking contracts.</text>

<rect x="70" y="205" width="235" height="130" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="70" y="205" width="235" height="9" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="88" y="244" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Producer v1</text>
<text x="88" y="272" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="88" dy="0">order_id</tspan>
<tspan x="88" dy="22">customer_id</tspan>
<tspan x="88" dy="22">total</tspan>
</text>
<rect x="70" y="485" width="235" height="130" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="70" y="485" width="235" height="9" rx="5" fill="#0B8A67" stroke="#0B8A67" stroke-width="0"/>
<text x="88" y="524" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Producer v2</text>
<text x="88" y="552" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="88" dy="0">+ currency</tspan>
<tspan x="88" dy="22">+ discount_amount</tspan>
</text>
<rect x="570" y="300" width="300" height="210" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="570" y="300" width="300" height="9" rx="5" fill="#7052C7" stroke="#7052C7" stroke-width="0"/>
<text x="588" y="339" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Schema registry</text>
<text x="588" y="367" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="588" dy="0">schema IDs</tspan>
<tspan x="588" dy="22">compatibility checks</tspan>
<tspan x="588" dy="22">version history</tspan>
</text>
<rect x="1080" y="165" width="270" height="130" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
