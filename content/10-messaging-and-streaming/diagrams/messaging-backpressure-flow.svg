<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Messaging backpressure and flow control</title><desc id="desc">When ingress exceeds service rate, backlog grows; flow control and admission decisions prevent unbounded overload.</desc>
<defs>
 <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker>
 <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0B8A67"/></marker>
 <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C17A0B"/></marker>
 <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C43D4B"/></marker>
 <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7052C7"/></marker>
 <style>
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#17263C}
  .title{font-size:30px;font-weight:750;letter-spacing:-.4px}
  .subtitle{font-size:15px;fill:#5F7087}
  .panel-title{font-size:20px;font-weight:700}
  .card-title{font-size:18px;font-weight:700}
  .body{font-size:15px;fill:#5F7087}
  .small{font-size:13px;fill:#5F7087}
  .tiny{font-size:11px;fill:#5F7087}
  .label{font-size:14px;font-weight:650}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
 </style>
</defs>
<rect width="100%" height="100%" fill="#F5F8FC"/>
<text class="title" x="64" y="58">Messaging backpressure and flow control</text>
<text class="subtitle" x="66" y="88">When ingress exceeds service rate, backlog grows; flow control and admission decisions prevent unbounded overload.</text>

<rect x="70" y="250" width="215" height="145" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="70" y="250" width="215" height="9" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="88" y="289" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Producers</text>
<text x="88" y="317" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="88" dy="0">50k messages/s</tspan>
</text>
<rect x="420" y="250" width="250" height="145" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="420" y="250" width="250" height="9" rx="5" fill="#C17A0B" stroke="#C17A0B" stroke-width="0"/>
<text x="438" y="289" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Broker buffer</text>
<text x="438" y="317" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="438" dy="0">queue / partitions</tspan>
<tspan x="438" dy="22">backlog grows</tspan>
</text>
<rect x="820" y="250" width="220" height="145" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="820" y="250" width="220" height="9" rx="5" fill="#0B8A67" stroke="#0B8A67" stroke-width="0"/>
<text x="838" y="289" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Consumers</text>
<text x="838" y="317" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="838" dy="0">35k messages/s</tspan>
</text>
<rect x="1170" y="250" width="190" height="145" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="1170" y="250" width="190" height="9" rx="5" fill="#C43D4B" stroke="#C43D4B" stroke-width="0"/>
<text x="1188" y="289" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Dependency</text>
<text x="1188" y="317" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="1188" dy="0">database / API</tspan>
</text>
<path d="M285,322 L420,322" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="352.5" y="298" text-anchor="middle" style="fill:#2563EB;font-weight:650;font-size:13px">ingress</text>
<path d="M670,322 L820,322" fill="none" stroke="#C17A0B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
<text x="745.0" y="298" text-anchor="middle" style="fill:#C17A0B;font-weight:650;font-size:13px">drain slower</text>
<path d="M1040,322 L1170,322" fill="none" stroke="#0B8A67" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<rect x="110" y="530" width="260" height="130" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="110" y="530" width="260" height="9" rx="5" fill="#7052C7" stroke="#7052C7" stroke-width="0"/>
<text x="128" y="569" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Admission control</text>
<text x="128" y="597" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="128" dy="0">rate limit / reject load</tspan>
</text>
<rect x="465" y="530" width="260" height="130" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="465" y="530" width="260" height="9" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="483" y="569" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Flow control</text>
<text x="483" y="597" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="483" dy="0">pause / prefetch / pull</tspan>
</text>
<rect x="820" y="530" width="260" height="130" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="820" y="530" width="260" height="9" rx="5" fill="#0B8A67" stroke="#0B8A67" stroke-width="0"/>
<text x="838" y="569" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Capacity response</text>
<text x="838" y="597" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="838" dy="0">scale consumers if useful</tspan>
</text>
<path d="M545 395 V465 H240 V530" fill="none" stroke="#7052C7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow-purple)"/>
<path d="M545 465 H595 V530" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow-blue)"/>
<path d="M930 395 V530" fill="none" stroke="#0B8A67" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow-green)"/>
<text x="720" y="735" text-anchor="middle" style="fill:#17263C;font-weight:650;font-size:15px">Adding consumers only helps when partitions, CPU, downstream capacity, and contention allow more parallel work.</text>
<path d="M64 842 H1376" stroke="#CAD5E2" stroke-width="1"/>
<text x="66" y="868" text-anchor="start" style="fill:#5F7087;font-size:12px">Conceptual architecture; exact behavior depends on product and configuration.</text>
</svg>