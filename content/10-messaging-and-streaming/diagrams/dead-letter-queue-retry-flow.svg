<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Retry and dead-letter queue lifecycle</title><desc id="desc">Classify failures, retry transient faults with bounded backoff, and isolate poison messages for investigation.</desc>
<defs>
 <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker>
 <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0B8A67"/></marker>
 <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C17A0B"/></marker>
 <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C43D4B"/></marker>
 <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7052C7"/></marker>
 <style>
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#17263C}
  .title{font-size:30px;font-weight:750;letter-spacing:-.4px}
  .subtitle{font-size:15px;fill:#5F7087}
  .panel-title{font-size:20px;font-weight:700}
  .card-title{font-size:18px;font-weight:700}
  .body{font-size:15px;fill:#5F7087}
  .small{font-size:13px;fill:#5F7087}
  .tiny{font-size:11px;fill:#5F7087}
  .label{font-size:14px;font-weight:650}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
 </style>
</defs>
<rect width="100%" height="100%" fill="#F5F8FC"/>
<text class="title" x="64" y="58">Retry and dead-letter queue lifecycle</text>
<text class="subtitle" x="66" y="88">Classify failures, retry transient faults with bounded backoff, and isolate poison messages for investigation.</text>

<rect x="70" y="320" width="190" height="130" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="70" y="320" width="190" height="9" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="88" y="359" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Main queue</text>
<text x="88" y="387" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="88" dy="0">new message</tspan>
</text>
<rect x="365" y="320" width="210" height="130" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="365" y="320" width="210" height="9" rx="5" fill="#0B8A67" stroke="#0B8A67" stroke-width="0"/>
<text x="383" y="359" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Consumer</text>
<text x="383" y="387" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="383" dy="0">attempt processing</tspan>
</text>
<rect x="690" y="160" width="220" height="125" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="690" y="160" width="220" height="9" rx="5" fill="#C17A0B" stroke="#C17A0B" stroke-width="0"/>
<text x="708" y="199" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Backoff retry</text>
<text x="708" y="227" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="708" dy="0">delay + jitter</tspan>
</text>
<rect x="690" y="495" width="220" height="125" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="690" y="495" width="220" height="9" rx="5" fill="#C43D4B" stroke="#C43D4B" stroke-width="0"/>
<text x="708" y="534" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Dead-letter queue</text>
<text x="708" y="562" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="708" dy="0">attempt limit reached</tspan>
</text>
<rect x="1030" y="495" width="300" height="125" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="1030" y="495" width="300" height="9" rx="5" fill="#7052C7" stroke="#7052C7" stroke-width="0"/>
<text x="1048" y="534" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Operator / owner</text>
<text x="1048" y="562" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="1048" dy="0">inspect payload + cause</tspan>
<tspan x="1048" dy="22">correct then authorize replay</tspan>
</text>
<path d="M260,385 L365,385" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<path d="M575 355 H625 V222 H690" fill="none" stroke="#C17A0B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<path d="M910 222 H970 V385 H470" fill="none" stroke="#C17A0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow-amber)"/>
<path d="M575 420 H625 V557 H690" fill="none" stroke="#C43D4B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
<path d="M910,557 L1030,557" fill="none" stroke="#7052C7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow-purple)"/>
<text x="470" y="485" text-anchor="middle" style="fill:#C17A0B;font-weight:700;font-size:13px">transient failure</text>
<text x="620" y="670" text-anchor="middle" style="fill:#C43D4B;font-weight:700;font-size:13px">permanent / exhausted</text>
<rect x="390" y="705" width="355" height="30" rx="15" fill="#E8F7F1" stroke="#0B8A67" stroke-width="1.1"/>
<text x="567.5" y="725" text-anchor="middle" style="fill:#0B8A67;font-weight:700;font-size:13px">Bound attempts + preserve failure metadata</text>
<path d="M64 842 H1376" stroke="#CAD5E2" stroke-width="1"/>
<text x="66" y="868" text-anchor="start" style="fill:#5F7087;font-size:12px">Conceptual architecture; exact behavior depends on product and configuration.</text>
</svg>