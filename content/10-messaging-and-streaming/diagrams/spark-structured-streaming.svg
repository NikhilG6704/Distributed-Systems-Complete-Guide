<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Spark Structured Streaming micro-batch execution</title><desc id="desc">A trigger selects new offsets, runs a batch over the incremental table, and commits progress through checkpoints.</desc>
<defs>
 <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker>
 <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0B8A67"/></marker>
 <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C17A0B"/></marker>
 <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C43D4B"/></marker>
 <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7052C7"/></marker>
 <style>
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#17263C}
  .title{font-size:30px;font-weight:750;letter-spacing:-.4px}
  .subtitle{font-size:15px;fill:#5F7087}
  .panel-title{font-size:20px;font-weight:700}
  .card-title{font-size:18px;font-weight:700}
  .body{font-size:15px;fill:#5F7087}
  .small{font-size:13px;fill:#5F7087}
  .tiny{font-size:11px;fill:#5F7087}
  .label{font-size:14px;font-weight:650}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
 </style>
</defs>
<rect width="100%" height="100%" fill="#F5F8FC"/>
<text class="title" x="64" y="58">Spark Structured Streaming micro-batch execution</text>
<text class="subtitle" x="66" y="88">A trigger selects new offsets, runs a batch over the incremental table, and commits progress through checkpoints.</text>

<rect x="65" y="320" width="200" height="145" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="65" y="320" width="200" height="9" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="83" y="359" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Input source</text>
<text x="83" y="387" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="83" dy="0">Kafka / files</tspan>
<tspan x="83" dy="22">new offsets</tspan>
</text>
<rect x="365" y="320" width="205" height="145" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="365" y="320" width="205" height="9" rx="5" fill="#7052C7" stroke="#7052C7" stroke-width="0"/>
<text x="383" y="359" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Trigger scheduler</text>
<text x="383" y="387" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="383" dy="0">batch interval</tspan>
<tspan x="383" dy="22">offset range</tspan>
</text>
<rect x="665" y="255" width="260" height="275" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="665" y="255" width="260" height="9" rx="5" fill="#0B8A67" stroke="#0B8A67" stroke-width="0"/>
<text x="683" y="294" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Micro-batch engine</text>
<text x="683" y="322" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="683" dy="0">incremental query plan</tspan>
<tspan x="683" dy="22">stateful aggregation</tspan>
<tspan x="683" dy="22">batch execution</tspan>
</text>
<rect x="1030" y="165" width="300" height="135" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="1030" y="165" width="300" height="9" rx="5" fill="#C17A0B" stroke="#C17A0B" stroke-width="0"/>
<text x="1048" y="204" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Checkpoint location</text>
<text x="1048" y="232" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="1048" dy="0">source offsets</tspan>
<tspan x="1048" dy="22">batch commit log</tspan>
</text>
<rect x="1030" y="450" width="300" height="135" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="1030" y="450" width="300" height="9" rx="5" fill="#0E8AA8" stroke="#0E8AA8" stroke-width="0"/>
<text x="1048" y="489" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Output sink</text>
<text x="1048" y="517" text-anchor="start" style="fill:#5F7087;font-size:14px">
<tspan x="1048" dy="0">append / update / complete</tspan>
<tspan x="1048" dy="21">idempotent commit as needed</tspan>
</text>
<path d="M265,392 L365,392" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<path d="M570,392 L665,392" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<path d="M925 320 H975 V232 H1030" fill="none" stroke="#7052C7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<path d="M925 465 H1030" fill="none" stroke="#0E8AA8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1180 450 V380 H470 V465" fill="none" stroke="#C17A0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow-amber)"/>
<text x="720" y="690" text-anchor="middle" style="fill:#17263C;font-weight:650;font-size:14px">If a batch exceeds the trigger interval, latency and queued input can grow; trigger cadence is not a throughput guarantee.</text>
<path d="M64 842 H1376" stroke="#CAD5E2" stroke-width="1"/>
<text x="66" y="868" text-anchor="start" style="fill:#5F7087;font-size:12px">Conceptual architecture; exact behavior depends on product and configuration.</text>
</svg>