<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Message queue vs distributed log</title><desc id="desc">Queues commonly distribute work; logs retain an ordered history that independent consumer groups can replay.</desc>
<defs>
 <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker>
 <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0B8A67"/></marker>
 <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C17A0B"/></marker>
 <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C43D4B"/></marker>
 <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7052C7"/></marker>
 <style>
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#17263C}
  .title{font-size:30px;font-weight:750;letter-spacing:-.4px}
  .subtitle{font-size:15px;fill:#5F7087}
  .panel-title{font-size:20px;font-weight:700}
  .card-title{font-size:18px;font-weight:700}
  .body{font-size:15px;fill:#5F7087}
  .small{font-size:13px;fill:#5F7087}
  .tiny{font-size:11px;fill:#5F7087}
  .label{font-size:14px;font-weight:650}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
 </style>
</defs>
<rect width="100%" height="100%" fill="#F5F8FC"/>
<text class="title" x="64" y="58">Message queue vs distributed log</text>
<text class="subtitle" x="66" y="88">Queues commonly distribute work; logs retain an ordered history that independent consumer groups can replay.</text>

<rect x="55" y="135" width="625" height="660" rx="22" fill="#F9FBFE" stroke="#CAD5E2" stroke-width="1.3"/>
<text x="77" y="172" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:20px">Queue: competing consumers</text>
<rect x="77" y="185" width="56" height="4" rx="2" fill="#C17A0B" stroke="#C17A0B" stroke-width="0"/>
<rect x="95" y="245" width="125" height="95" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="95" y="245" width="125" height="9" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="113" y="284" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Producer</text>
<text x="113" y="312" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="113" dy="0">job 1…N</tspan>
</text>
<rect x="280" y="245" width="150" height="95" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="280" y="245" width="150" height="9" rx="5" fill="#C17A0B" stroke="#C17A0B" stroke-width="0"/>
<text x="298" y="284" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Queue</text>
<text x="298" y="312" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="298" dy="0">pending work</tspan>
</text>
<path d="M220,292 L280,292" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="95" y="465" width="150" height="100" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="95" y="465" width="150" height="9" rx="5" fill="#0B8A67" stroke="#0B8A67" stroke-width="0"/>
<text x="113" y="504" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Worker A</text>
<text x="113" y="532" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="113" dy="0">one delivery</tspan>
<tspan x="113" dy="22">per message</tspan>
</text>
<rect x="290" y="465" width="150" height="100" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="290" y="465" width="150" height="9" rx="5" fill="#0B8A67" stroke="#0B8A67" stroke-width="0"/>
<text x="308" y="504" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Worker B</text>
<text x="308" y="532" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="308" dy="0">one delivery</tspan>
<tspan x="308" dy="22">per message</tspan>
</text>
<rect x="485" y="465" width="150" height="100" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="485" y="465" width="150" height="9" rx="5" fill="#0B8A67" stroke="#0B8A67" stroke-width="0"/>
<text x="503" y="504" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Worker C</text>
<text x="503" y="532" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="503" dy="0">one delivery</tspan>
<tspan x="503" dy="22">per message</tspan>
</text>
<path d="M355 340 V395 H170 V465" fill="none" stroke="#C17A0B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<path d="M355 395 H365 V465" fill="none" stroke="#C17A0B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<path d="M355 395 H560 V465" fill="none" stroke="#C17A0B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<text x="365" y="615" text-anchor="middle" style="fill:#C17A0B;font-weight:700;font-size:16px">ACK → remove / complete</text>
<text x="365" y="650" text-anchor="middle" style="fill:#5F7087;font-size:14px">Unacked delivery may be redelivered.</text>
<rect x="750" y="135" width="635" height="660" rx="22" fill="#F9FBFE" stroke="#CAD5E2" stroke-width="1.3"/>
<text x="772" y="172" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:20px">Log: independent readers</text>
<rect x="772" y="185" width="56" height="4" rx="2" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<rect x="790" y="245" width="130" height="95" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="790" y="245" width="130" height="9" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="808" y="284" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Producer</text>
<text x="808" y="312" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="808" dy="0">append events</tspan>
</text>
<rect x="1000" y="225" width="330" height="140" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="1000" y="225" width="330" height="9" rx="5" fill="#7052C7" stroke="#7052C7" stroke-width="0"/>
<text x="1018" y="264" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Retained log</text>
<text x="1018" y="292" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="1018" dy="0">offset 0 | 1 | 2 | 3 | 4 | 5</tspan>
<tspan x="1018" dy="22">ordered inside this partition</tspan>
</text>
<path d="M920,292 L1000,292" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="800" y="500" width="230" height="105" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="800" y="500" width="230" height="9" rx="5" fill="#0B8A67" stroke="#0B8A67" stroke-width="0"/>
<text x="818" y="539" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Consumer group A</text>
<text x="818" y="567" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="818" dy="0">progress at offset 4</tspan>
</text>
<rect x="1085" y="500" width="230" height="105" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="1085" y="500" width="230" height="9" rx="5" fill="#0E8AA8" stroke="#0E8AA8" stroke-width="0"/>
<text x="1103" y="539" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Consumer group B</text>
<text x="1103" y="567" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="1103" dy="0">progress at offset 2</tspan>
</text>
<path d="M1165 365 V430 H915 V500" fill="none" stroke="#0B8A67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M1165 430 H1200 V500" fill="none" stroke="#0E8AA8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1090" y="655" text-anchor="middle" style="fill:#17263C;font-weight:650;font-size:15px">Each group owns its progress;</text>
<text x="1090" y="680" text-anchor="middle" style="fill:#5F7087;font-size:14px">retained records can be replayed.</text>
<path d="M64 842 H1376" stroke="#CAD5E2" stroke-width="1"/>
<text x="66" y="868" text-anchor="start" style="fill:#5F7087;font-size:12px">Conceptual architecture; exact behavior depends on product and configuration.</text>
</svg>