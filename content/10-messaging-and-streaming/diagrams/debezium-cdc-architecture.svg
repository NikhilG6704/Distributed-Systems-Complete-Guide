<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Debezium CDC architecture</title><desc id="desc">A connector reads database change logs and publishes change-event records through Kafka Connect to Kafka topics.</desc>
<defs>
 <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker>
 <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0B8A67"/></marker>
 <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C17A0B"/></marker>
 <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C43D4B"/></marker>
 <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7052C7"/></marker>
 <style>
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#17263C}
  .title{font-size:30px;font-weight:750;letter-spacing:-.4px}
  .subtitle{font-size:15px;fill:#5F7087}
  .panel-title{font-size:20px;font-weight:700}
  .card-title{font-size:18px;font-weight:700}
  .body{font-size:15px;fill:#5F7087}
  .small{font-size:13px;fill:#5F7087}
  .tiny{font-size:11px;fill:#5F7087}
  .label{font-size:14px;font-weight:650}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
 </style>
</defs>
<rect width="100%" height="100%" fill="#F5F8FC"/>
<text class="title" x="64" y="58">Debezium CDC architecture</text>
<text class="subtitle" x="66" y="88">A connector reads database change logs and publishes change-event records through Kafka Connect to Kafka topics.</text>

<rect x="60" y="350" width="220" height="160" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="60" y="350" width="220" height="9" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="78" y="389" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Source database</text>
<text x="78" y="417" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="78" dy="0">PostgreSQL WAL</tspan>
<tspan x="78" dy="22">MySQL binlog</tspan>
<tspan x="78" dy="22">transaction commits</tspan>
</text>
<rect x="390" y="350" width="230" height="160" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="390" y="350" width="230" height="9" rx="5" fill="#7052C7" stroke="#7052C7" stroke-width="0"/>
<text x="408" y="389" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Debezium connector</text>
<text x="408" y="417" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="408" dy="0">snapshot + stream</tspan>
<tspan x="408" dy="22">decode changes</tspan>
<tspan x="408" dy="22">track source offset</tspan>
</text>
<rect x="730" y="350" width="210" height="160" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="730" y="350" width="210" height="9" rx="5" fill="#C17A0B" stroke="#C17A0B" stroke-width="0"/>
<text x="748" y="389" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Kafka Connect</text>
<text x="748" y="417" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="748" dy="0">connector task</tspan>
<tspan x="748" dy="22">offset storage</tspan>
</text>
<rect x="1050" y="350" width="220" height="160" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="1050" y="350" width="220" height="9" rx="5" fill="#0B8A67" stroke="#0B8A67" stroke-width="0"/>
<text x="1068" y="389" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Kafka topics</text>
<text x="1068" y="417" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="1068" dy="0">table change events</tspan>
<tspan x="1068" dy="22">partitioned records</tspan>
</text>
<path d="M280,430 L390,430" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<path d="M620,430 L730,430" fill="none" stroke="#7052C7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-purple)"/>
<path d="M940,430 L1050,430" fill="none" stroke="#0B8A67" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<rect x="1010" y="590" width="180" height="90" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="1010" y="590" width="180" height="9" rx="5" fill="#0E8AA8" stroke="#0E8AA8" stroke-width="0"/>
<text x="1028" y="629" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:16px">Search index</text>
<text x="1028" y="657" text-anchor="start" style="fill:#5F7087;font-size:13px">
<tspan x="1028" dy="0">sync documents</tspan>
</text>
<path d="M1160 510 V555 H1100 V590" fill="none" stroke="#0E8AA8" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1220" y="590" width="180" height="90" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="1220" y="590" width="180" height="9" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="1238" y="629" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:16px">Data lake</text>
<text x="1238" y="657" text-anchor="start" style="fill:#5F7087;font-size:13px">
<tspan x="1238" dy="0">append raw changes</tspan>
</text>
<path d="M1160 510 V555 H1310 V590" fill="none" stroke="#2563EB" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="1010" y="710" width="180" height="90" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="1010" y="710" width="180" height="9" rx="5" fill="#C17A0B" stroke="#C17A0B" stroke-width="0"/>
<text x="1028" y="749" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:16px">Analytics</text>
<text x="1028" y="777" text-anchor="start" style="fill:#5F7087;font-size:13px">
<tspan x="1028" dy="0">build aggregates</tspan>
</text>
<path d="M1160 510 V555 H1100 V710" fill="none" stroke="#C17A0B" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<text x="500" y="680" text-anchor="middle" style="fill:#7052C7;font-weight:700;font-size:14px">Source position + connector offset</text>
<text x="500" y="710" text-anchor="middle" style="fill:#5F7087;font-size:13px">resume after restart; duplicates/gaps depend on snapshot handoff and delivery boundary</text>
<path d="M64 842 H1376" stroke="#CAD5E2" stroke-width="1"/>
<text x="66" y="868" text-anchor="start" style="fill:#5F7087;font-size:12px">Conceptual architecture; exact behavior depends on product and configuration.</text>
</svg>