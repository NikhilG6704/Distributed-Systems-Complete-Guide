<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Kafka KRaft controller architecture</title><desc id="desc">KRaft stores cluster metadata in a replicated metadata log; brokers still host partition data and replicas.</desc>
<defs>
 <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker>
 <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0B8A67"/></marker>
 <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C17A0B"/></marker>
 <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C43D4B"/></marker>
 <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7052C7"/></marker>
 <style>
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#17263C}
  .title{font-size:30px;font-weight:750;letter-spacing:-.4px}
  .subtitle{font-size:15px;fill:#5F7087}
  .panel-title{font-size:20px;font-weight:700}
  .card-title{font-size:18px;font-weight:700}
  .body{font-size:15px;fill:#5F7087}
  .small{font-size:13px;fill:#5F7087}
  .tiny{font-size:11px;fill:#5F7087}
  .label{font-size:14px;font-weight:650}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
 </style>
</defs>
<rect width="100%" height="100%" fill="#F5F8FC"/>
<text class="title" x="64" y="58">Kafka KRaft controller architecture</text>
<text class="subtitle" x="66" y="88">KRaft stores cluster metadata in a replicated metadata log; brokers still host partition data and replicas.</text>

<rect x="70" y="145" width="525" height="620" rx="22" fill="#F9FBFE" stroke="#CAD5E2" stroke-width="1.3"/>
<text x="92" y="182" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:20px">Control plane · metadata quorum</text>
<rect x="92" y="195" width="56" height="4" rx="2" fill="#7052C7" stroke="#7052C7" stroke-width="0"/>
<rect x="115" y="250" width="125" height="115" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="115" y="250" width="125" height="9" rx="5" fill="#7052C7" stroke="#7052C7" stroke-width="0"/>
<text x="133" y="289" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:16px">Controller 1</text>
<text x="133" y="317" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="133" dy="0">voter</tspan>
</text>
<rect x="265" y="250" width="125" height="115" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="265" y="250" width="125" height="9" rx="5" fill="#7052C7" stroke="#7052C7" stroke-width="0"/>
<text x="283" y="289" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:16px">Controller 2</text>
<text x="283" y="317" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="283" dy="0">voter</tspan>
</text>
<rect x="415" y="250" width="125" height="115" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="415" y="250" width="125" height="9" rx="5" fill="#7052C7" stroke="#7052C7" stroke-width="0"/>
<text x="433" y="289" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:16px">Controller 3</text>
<text x="433" y="317" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="433" dy="0">voter</tspan>
</text>
<path d="M240,308 L265,308" fill="none" stroke="#7052C7" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow-purple)"/>
<path d="M390,308 L415,308" fill="none" stroke="#7052C7" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow-purple)"/>
<rect x="200" y="470" width="250" height="130" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="200" y="470" width="250" height="9" rx="5" fill="#7052C7" stroke="#7052C7" stroke-width="0"/>
<text x="218" y="509" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Metadata log</text>
<text x="218" y="537" text-anchor="start" style="fill:#5F7087;font-size:14px">
<tspan x="218" dy="0">cluster membership</tspan>
<tspan x="218" dy="21">topic / partition metadata</tspan>
<tspan x="218" dy="21">leader assignments</tspan>
</text>
<rect x="650" y="145" width="720" height="620" rx="22" fill="#F9FBFE" stroke="#CAD5E2" stroke-width="1.3"/>
<text x="672" y="182" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:20px">Data plane · brokers and partition logs</text>
<rect x="672" y="195" width="56" height="4" rx="2" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<rect x="700" y="270" width="185" height="170" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="700" y="270" width="185" height="9" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="718" y="309" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Broker 1</text>
<text x="718" y="337" text-anchor="start" style="fill:#5F7087;font-size:14px">
<tspan x="718" dy="0">client produce / fetch</tspan>
<tspan x="718" dy="21">partition replicas</tspan>
<tspan x="718" dy="21">disk log segments</tspan>
</text>
<rect x="925" y="270" width="185" height="170" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="925" y="270" width="185" height="9" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="943" y="309" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Broker 2</text>
<text x="943" y="337" text-anchor="start" style="fill:#5F7087;font-size:14px">
<tspan x="943" dy="0">client produce / fetch</tspan>
<tspan x="943" dy="21">partition replicas</tspan>
<tspan x="943" dy="21">disk log segments</tspan>
</text>
<rect x="1150" y="270" width="185" height="170" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="1150" y="270" width="185" height="9" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="1168" y="309" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Broker 3</text>
<text x="1168" y="337" text-anchor="start" style="fill:#5F7087;font-size:14px">
<tspan x="1168" dy="0">client produce / fetch</tspan>
<tspan x="1168" dy="21">partition replicas</tspan>
<tspan x="1168" dy="21">disk log segments</tspan>
</text>
<path d="M595 310 H650" fill="none" stroke="#7052C7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow-purple)"/>
<path d="M595 530 H650" fill="none" stroke="#7052C7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow-purple)"/>
<text x="1010" y="555" text-anchor="middle" style="fill:#7052C7;font-weight:700;font-size:15px">Controller metadata operations</text>
<text x="1010" y="590" text-anchor="middle" style="fill:#5F7087;font-size:14px">elect leaders · register brokers · update metadata</text>
<rect x="835" y="660" width="290" height="30" rx="15" fill="#FFF5DF" stroke="#C17A0B" stroke-width="1.1"/>
<text x="980.0" y="680" text-anchor="middle" style="fill:#C17A0B;font-weight:700;font-size:13px">Control plane ≠ record replication</text>
<path d="M64 842 H1376" stroke="#CAD5E2" stroke-width="1"/>
<text x="66" y="868" text-anchor="start" style="fill:#5F7087;font-size:12px">Conceptual architecture; exact behavior depends on product and configuration.</text>
</svg>