<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Event-sourcing architecture</title><desc id="desc">Commands are validated by an aggregate; resulting domain events are appended and drive derived projections.</desc>
<defs>
 <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker>
 <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0B8A67"/></marker>
 <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C17A0B"/></marker>
 <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C43D4B"/></marker>
 <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7052C7"/></marker>
 <style>
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#17263C}
  .title{font-size:30px;font-weight:750;letter-spacing:-.4px}
  .subtitle{font-size:15px;fill:#5F7087}
  .panel-title{font-size:20px;font-weight:700}
  .card-title{font-size:18px;font-weight:700}
  .body{font-size:15px;fill:#5F7087}
  .small{font-size:13px;fill:#5F7087}
  .tiny{font-size:11px;fill:#5F7087}
  .label{font-size:14px;font-weight:650}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
 </style>
</defs>
<rect width="100%" height="100%" fill="#F5F8FC"/>
<text class="title" x="64" y="58">Event-sourcing architecture</text>
<text class="subtitle" x="66" y="88">Commands are validated by an aggregate; resulting domain events are appended and drive derived projections.</text>

<rect x="65" y="340" width="185" height="140" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="65" y="340" width="185" height="9" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="83" y="379" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Command API</text>
<text x="83" y="407" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="83" dy="0">PlaceOrder</tspan>
</text>
<rect x="340" y="315" width="230" height="190" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="340" y="315" width="230" height="9" rx="5" fill="#7052C7" stroke="#7052C7" stroke-width="0"/>
<text x="358" y="354" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Order aggregate</text>
<text x="358" y="382" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="358" dy="0">load state</tspan>
<tspan x="358" dy="22">validate invariant</tspan>
<tspan x="358" dy="22">emit events</tspan>
</text>
<rect x="675" y="300" width="260" height="220" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="675" y="300" width="260" height="9" rx="5" fill="#0B8A67" stroke="#0B8A67" stroke-width="0"/>
<text x="693" y="339" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Event store</text>
<text x="693" y="367" text-anchor="start" style="fill:#5F7087;font-size:14px">
<tspan x="693" dy="0">OrderPlaced</tspan>
<tspan x="693" dy="21">ItemReserved</tspan>
<tspan x="693" dy="21">PaymentAccepted</tspan>
<tspan x="693" dy="21">append-only history</tspan>
</text>
<rect x="1050" y="185" width="300" height="130" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="1050" y="185" width="300" height="9" rx="5" fill="#0E8AA8" stroke="#0E8AA8" stroke-width="0"/>
<text x="1068" y="224" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Order-history projection</text>
<text x="1068" y="252" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="1068" dy="0">customer read model</tspan>
</text>
<rect x="1050" y="505" width="300" height="130" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="1050" y="505" width="300" height="9" rx="5" fill="#C17A0B" stroke="#C17A0B" stroke-width="0"/>
<text x="1068" y="544" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Analytics projection</text>
<text x="1068" y="572" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="1068" dy="0">seller metrics / BI</tspan>
</text>
<path d="M250,410 L340,410" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<path d="M570,410 L675,410" fill="none" stroke="#7052C7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-purple)"/>
<text x="622.5" y="385" text-anchor="middle" style="fill:#7052C7;font-weight:650;font-size:13px">append events</text>
<path d="M935 360 H990 V250 H1050" fill="none" stroke="#0B8A67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M935 460 H990 V570 H1050" fill="none" stroke="#0B8A67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="800" y="650" text-anchor="middle" style="fill:#17263C;font-weight:650;font-size:15px">Current state is derived by folding events; projections can be rebuilt from history.</text>
<path d="M64 842 H1376" stroke="#CAD5E2" stroke-width="1"/>
<text x="66" y="868" text-anchor="start" style="fill:#5F7087;font-size:12px">Conceptual architecture; exact behavior depends on product and configuration.</text>
</svg>