<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Kafka log compaction</title><desc id="desc">Compaction retains the latest keyed state according to cleaner progress; tombstones mark deletions temporarily.</desc>
