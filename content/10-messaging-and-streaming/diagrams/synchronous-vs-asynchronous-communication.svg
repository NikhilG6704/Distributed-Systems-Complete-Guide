<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Synchronous calls vs asynchronous events</title><desc id="desc">Asynchrony removes a request-time dependency; it does not remove downstream work or business-state transitions.</desc>
<defs>
 <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker>
 <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0B8A67"/></marker>
 <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C17A0B"/></marker>
 <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C43D4B"/></marker>
 <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7052C7"/></marker>
 <style>
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#17263C}
  .title{font-size:30px;font-weight:750;letter-spacing:-.4px}
  .subtitle{font-size:15px;fill:#5F7087}
  .panel-title{font-size:20px;font-weight:700}
  .card-title{font-size:18px;font-weight:700}
  .body{font-size:15px;fill:#5F7087}
  .small{font-size:13px;fill:#5F7087}
  .tiny{font-size:11px;fill:#5F7087}
  .label{font-size:14px;font-weight:650}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
 </style>
</defs>
<rect width="100%" height="100%" fill="#F5F8FC"/>
<text class="title" x="64" y="58">Synchronous calls vs asynchronous events</text>
<text class="subtitle" x="66" y="88">Asynchrony removes a request-time dependency; it does not remove downstream work or business-state transitions.</text>

<rect x="55" y="125" width="635" height="680" rx="22" fill="#F9FBFE" stroke="#CAD5E2" stroke-width="1.3"/>
<text x="77" y="162" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:20px">Synchronous request chain</text>
<rect x="77" y="175" width="56" height="4" rx="2" fill="#C43D4B" stroke="#C43D4B" stroke-width="0"/>
<rect x="750" y="125" width="635" height="680" rx="22" fill="#F9FBFE" stroke="#CAD5E2" stroke-width="1.3"/>
<text x="772" y="162" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:20px">Asynchronous event flow</text>
<rect x="772" y="175" width="56" height="4" rx="2" fill="#0B8A67" stroke="#0B8A67" stroke-width="0"/>
<rect x="90" y="220" width="150" height="105" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="90" y="220" width="150" height="9" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="108" y="259" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Client</text>
<text x="108" y="287" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="108" dy="0">Place order</tspan>
</text>
<rect x="285" y="220" width="150" height="105" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="285" y="220" width="150" height="9" rx="5" fill="#C43D4B" stroke="#C43D4B" stroke-width="0"/>
<text x="303" y="259" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Order API</text>
<text x="303" y="287" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="303" dy="0">waits for reply</tspan>
</text>
<rect x="480" y="220" width="160" height="105" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="480" y="220" width="160" height="9" rx="5" fill="#C17A0B" stroke="#C17A0B" stroke-width="0"/>
<text x="498" y="259" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Dependencies</text>
<text x="498" y="287" text-anchor="start" style="fill:#5F7087;font-size:13px">
<tspan x="498" dy="0">Inventory → Payment</tspan>
<tspan x="498" dy="19">→ Shipping</tspan>
</text>
<path d="M240,273 L285,273" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<path d="M435,273 L480,273" fill="none" stroke="#C43D4B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)"/>
<text x="457.5" y="250" text-anchor="middle" style="fill:#C43D4B;font-weight:650;font-size:13px">blocking calls</text>
<rect x="285" y="410" width="150" height="110" rx="18" fill="#FDECEF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="285" y="410" width="150" height="9" rx="5" fill="#C43D4B" stroke="#C43D4B" stroke-width="0"/>
<text x="303" y="449" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Slow service</text>
<text x="303" y="477" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="303" dy="0">timeout / error</tspan>
</text>
<path d="M560 325 V370 H360 V410" fill="none" stroke="#C43D4B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/>
<text x="360" y="565" text-anchor="middle" style="fill:#17263C;font-weight:650;font-size:15px">One slow dependency can hold</text>
<text x="360" y="590" text-anchor="middle" style="fill:#5F7087;font-size:15px">the client request open.</text>
<rect x="145" y="650" width="230" height="30" rx="15" fill="#FDECEF" stroke="#C43D4B" stroke-width="1.1"/>
<text x="260.0" y="670" text-anchor="middle" style="fill:#C43D4B;font-weight:700;font-size:13px">Tight temporal coupling</text>
<rect x="790" y="220" width="150" height="105" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="790" y="220" width="150" height="9" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="808" y="259" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Order API</text>
<text x="808" y="287" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="808" dy="0">commit order</tspan>
</text>
<rect x="1010" y="220" width="150" height="105" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="1010" y="220" width="150" height="9" rx="5" fill="#7052C7" stroke="#7052C7" stroke-width="0"/>
<text x="1028" y="259" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Broker</text>
<text x="1028" y="287" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="1028" dy="0">durable event log</tspan>
</text>
<path d="M940,273 L1010,273" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="975.0" y="250" text-anchor="middle" style="fill:#2563EB;font-weight:650;font-size:13px">publish</text>
<rect x="790" y="430" width="165" height="112" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="790" y="430" width="165" height="9" rx="5" fill="#0B8A67" stroke="#0B8A67" stroke-width="0"/>
<text x="808" y="469" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Inventory</text>
<text x="808" y="497" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="808" dy="0">reserve stock</tspan>
</text>
<rect x="985" y="430" width="165" height="112" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="985" y="430" width="165" height="9" rx="5" fill="#0B8A67" stroke="#0B8A67" stroke-width="0"/>
<text x="1003" y="469" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Payment</text>
<text x="1003" y="497" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="1003" dy="0">authorize / charge</tspan>
</text>
<rect x="1180" y="430" width="165" height="112" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="1180" y="430" width="165" height="9" rx="5" fill="#0E8AA8" stroke="#0E8AA8" stroke-width="0"/>
<text x="1198" y="469" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Analytics</text>
<text x="1198" y="497" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="1198" dy="0">record event</tspan>
</text>
<path d="M1085 325 V370 H872 V430" fill="none" stroke="#0B8A67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M1085 370 H1067 V430" fill="none" stroke="#0B8A67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M1085 370 H1262 V430" fill="none" stroke="#0B8A67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="1080" y="595" text-anchor="middle" style="fill:#17263C;font-weight:650;font-size:15px">Consumers progress independently;</text>
<text x="1080" y="620" text-anchor="middle" style="fill:#5F7087;font-size:15px">the order can expose a pending state.</text>
<rect x="915" y="680" width="250" height="30" rx="15" fill="#E8F7F1" stroke="#0B8A67" stroke-width="1.1"/>
<text x="1040.0" y="700" text-anchor="middle" style="fill:#0B8A67;font-weight:700;font-size:13px">Loose temporal coupling</text>
<path d="M64 842 H1376" stroke="#CAD5E2" stroke-width="1"/>
<text x="66" y="868" text-anchor="start" style="fill:#5F7087;font-size:12px">Conceptual architecture; exact behavior depends on product and configuration.</text>
</svg>