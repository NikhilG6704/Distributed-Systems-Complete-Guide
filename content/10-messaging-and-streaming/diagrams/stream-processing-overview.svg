  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
 </style>
</defs>
<rect width="100%" height="100%" fill="#F5F8FC"/>
<text class="title" x="64" y="58">Stream-processing pipeline</text>
<text class="subtitle" x="66" y="88">A broker feeds continuous operators; state, windows, checkpoints, and sinks define the processing lifecycle.</text>

<rect x="60" y="340" width="190" height="145" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="60" y="340" width="190" height="9" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="78" y="379" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Event sources</text>
<text x="78" y="407" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="78" dy="0">payments</tspan>
<tspan x="78" dy="22">clicks / telemetry</tspan>
</text>
<rect x="330" y="340" width="205" height="145" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="330" y="340" width="205" height="9" rx="5" fill="#7052C7" stroke="#7052C7" stroke-width="0"/>
<text x="348" y="379" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Message broker</text>
<text x="348" y="407" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="348" dy="0">topics / partitions</tspan>
<tspan x="348" dy="22">retained input</tspan>
</text>
<rect x="625" y="245" width="260" height="330" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="625" y="245" width="260" height="9" rx="5" fill="#0B8A67" stroke="#0B8A67" stroke-width="0"/>
<text x="643" y="284" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Stream processor</text>
<text x="643" y="312" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="643" dy="0">filter · map · join</tspan>
<tspan x="643" dy="22">keyed state</tspan>
<tspan x="643" dy="22">time windows</tspan>
<tspan x="643" dy="22">checkpoint / recovery</tspan>
</text>
<rect x="980" y="170" width="185" height="135" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="980" y="170" width="185" height="9" rx="5" fill="#C17A0B" stroke="#C17A0B" stroke-width="0"/>
