<text x="760.0" y="655" text-anchor="middle" style="fill:#7052C7;font-weight:700;font-size:13px">event time + watermarks</text>
<rect x="895" y="635" width="200" height="30" rx="15" fill="#E8F7F1" stroke="#0B8A67" stroke-width="1.1"/>
<text x="995.0" y="655" text-anchor="middle" style="fill:#0B8A67;font-weight:700;font-size:13px">state + checkpoints</text>
<text x="720" y="735" text-anchor="middle" style="fill:#17263C;font-weight:650;font-size:15px">Broker durability, processor recovery, and sink idempotency are separate correctness boundaries.</text>
<path d="M64 842 H1376" stroke="#CAD5E2" stroke-width="1"/>
<text x="66" y="868" text-anchor="start" style="fill:#5F7087;font-size:12px">Conceptual architecture; exact behavior depends on product and configuration.</text>
