<text x="998" y="237" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="998" dy="0">fraud / rules</tspan>
</text>
<rect x="980" y="385" width="185" height="135" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="980" y="385" width="185" height="9" rx="5" fill="#0E8AA8" stroke="#0E8AA8" stroke-width="0"/>
<text x="998" y="424" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Serving DB</text>
<text x="998" y="452" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="998" dy="0">materialized views</tspan>
</text>
<rect x="1210" y="285" width="170" height="145" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="1210" y="285" width="170" height="9" rx="5" fill="#2563EB" stroke="#2563EB" stroke-width="0"/>
<text x="1228" y="324" text-anchor="start" style="fill:#17263C;font-weight:700;font-size:18px">Data lake</text>
<text x="1228" y="352" text-anchor="start" style="fill:#5F7087;font-size:15px">
<tspan x="1228" dy="0">raw / curated</tspan>
</text>
