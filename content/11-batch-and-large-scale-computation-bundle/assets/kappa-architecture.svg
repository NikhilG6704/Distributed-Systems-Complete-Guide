<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Kappa architecture</title><desc id="desc">One stream-processing path handles live events and historical replays from a retained append-only log.</desc>
<rect width="1600" height="900" fill="#FBFCFE"/>
<rect x="0" y="0" width="1600" height="112" fill="#F1F5FA"/>
<text x="64" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">Kappa architecture</text>
<text x="66" y="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#526581">One stream-processing path handles live events and historical replays from a retained append-only log.</text>
<text x="1535" y="49" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#8293AA" text-anchor="end">DISTRIBUTED COMPUTATION · CHAPTER 11</text><defs>
          <marker id="arrow-data" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#3973A8"/></marker>
          <marker id="arrow-control" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#7955A6"/></marker>
          <marker id="arrow-network" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#B87918"/></marker>
          <marker id="arrow-warning" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#BA4B4B"/></marker>
          <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#172B4D" flood-opacity=".10"/></filter>
        </defs>
<rect x="55" y="330" width="225" height="150" rx="18" fill="#DCEBFA" stroke="#3973A8" stroke-width="2.5" filter="url(#shadow)"/>
<text x="73" y="361" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#172B4D" text-anchor="start">Event producers</text>
<text x="73" y="390" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#526581" text-anchor="start">applications / CDC</text>
<text x="73" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#526581" text-anchor="start">ordered append</text>
<text x="73" y="440" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#526581" text-anchor="start">events</text>
<rect x="360" y="310" width="280" height="190" rx="18" fill="#DCEBFA" stroke="#3973A8" stroke-width="2.5" filter="url(#shadow)"/>
<text x="378" y="341" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#172B4D" text-anchor="start">Durable event log</text>
<text x="378" y="370" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#526581" text-anchor="start">partitioned topics</text>
<text x="378" y="395" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#526581" text-anchor="start">retention / replay</text>
<text x="378" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#526581" text-anchor="start">offsets</text>
<text x="378" y="445" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#526581" text-anchor="start">append-only history</text>
<rect x="730" y="180" width="300" height="145" rx="18" fill="#E3F4EF" stroke="#24836D" stroke-width="2.5" filter="url(#shadow)"/>
<text x="748" y="211" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#172B4D" text-anchor="start">Stream processor</text>
<text x="748" y="240" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#526581" text-anchor="start">stateful operators</text>
<text x="748" y="265" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#526581" text-anchor="start">event time / windows</text>
<rect x="730" y="470" width="300" height="145" rx="18" fill="#FFF1D9" stroke="#B87918" stroke-width="2.5" filter="url(#shadow)"/>
<text x="748" y="501" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#172B4D" text-anchor="start">Replay execution</text>
<text x="748" y="530" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#526581" text-anchor="start">reset offsets / replay</text>
<text x="748" y="555" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#526581" text-anchor="start">range</text>
<text x="748" y="580" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#526581" text-anchor="start">rebuild derived state</text>
<rect x="1140" y="310" width="350" height="190" rx="18" fill="#E6F4E7" stroke="#3F8750" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1158" y="341" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#172B4D" text-anchor="start">Serving state</text>
<text x="1158" y="370" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#526581" text-anchor="start">materialized views</text>
<text x="1158" y="395" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#526581" text-anchor="start">query API / downstream sink</text>
<path d="M 280,405 L 360,405" fill="none" stroke="#3973A8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-data)"/>
<rect x="262.0" y="381.0" width="116" height="28" rx="10" fill="#FFFFFF" stroke="#D6DFEA"/>
<text x="320.0" y="400.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#3973A8" text-anchor="middle">append</text>
<path d="M 640,360 L 685,360 L 685,250 L 730,250" fill="none" stroke="#3973A8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-data)"/>
<rect x="627" y="226" width="116" height="28" rx="10" fill="#FFFFFF" stroke="#D6DFEA"/>
<text x="685" y="245" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#3973A8" text-anchor="middle">live consumption</text>
<path d="M 640,455 L 685,455 L 685,540 L 730,540" fill="none" stroke="#B87918" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-network)"/>
<rect x="627" y="516" width="116" height="28" rx="10" fill="#FFFFFF" stroke="#D6DFEA"/>
<text x="685" y="535" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#B87918" text-anchor="middle">historical replay</text>
<path d="M 1030,250 L 1080,250 L 1080,365 L 1140,365" fill="none" stroke="#3973A8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-data)"/>
<rect x="1022" y="341" width="116" height="28" rx="10" fill="#FFFFFF" stroke="#D6DFEA"/>
<text x="1080" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#3973A8" text-anchor="middle">updates</text>
<path d="M 1030,540 L 1080,540 L 1080,445 L 1140,445" fill="none" stroke="#B87918" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-network)"/>
<rect x="1022" y="421" width="116" height="28" rx="10" fill="#FFFFFF" stroke="#D6DFEA"/>
<text x="1080" y="440" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#B87918" text-anchor="middle">rebuild state</text>
<rect x="400" y="640" width="600" height="90" rx="18" fill="#EEE8FB" stroke="#7955A6" stroke-width="2.5" filter="url(#shadow)"/>
<text x="418" y="671" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#172B4D" text-anchor="start">Replay control</text>
<text x="418" y="700" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#526581" text-anchor="start">versioned logic + bounded offset range; idempotent sink writes</text>
<path d="M 700,640 L 700,600 L 700,600 L 700,500" fill="none" stroke="#7955A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-control)"/>
<rect x="642" y="576" width="116" height="28" rx="10" fill="#FFFFFF" stroke="#D6DFEA"/>
<text x="700" y="595" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#7955A6" text-anchor="middle">replay request</text>
<text x="800" y="765" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#526581" text-anchor="middle">Kappa is suitable when retained logs and replay throughput support correction and rebuild requirements.</text>
</svg>