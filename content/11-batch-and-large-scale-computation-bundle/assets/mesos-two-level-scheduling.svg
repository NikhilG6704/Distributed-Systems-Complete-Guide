<path d="M 295,430 L 355,430 L 355,620 L 650,620 L 650,495 L 690,495" fill="none" stroke="#7955A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-control)"/>
<path d="M 650,275 L 1000,275 L 1000,290 L 1090,290" fill="none" stroke="#3973A8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-data)"/>
<rect x="942" y="266" width="116" height="28" rx="10" fill="#FFFFFF" stroke="#D6DFEA"/>
<text x="1000" y="285" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#3973A8" text-anchor="middle">accept → launch</text>
