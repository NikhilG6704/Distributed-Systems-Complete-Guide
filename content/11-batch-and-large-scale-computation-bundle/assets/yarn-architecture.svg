<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">YARN architecture and application lifecycle</title><desc id="desc">ResourceManager allocates cluster resources; each ApplicationMaster negotiates containers for its application.</desc>
