<text x="800" y="745" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#526581" text-anchor="middle">Speculation is not a fix for skew or intrinsically expensive work; external side effects must be idempotent.</text>
