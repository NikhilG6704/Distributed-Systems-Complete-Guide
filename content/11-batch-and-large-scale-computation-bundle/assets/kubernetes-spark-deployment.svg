<text x="575" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#7955A6" text-anchor="middle">place driver</text>
<path d="M 485,460 L 585,460 L 585,175 L 1065,175 L 1065,280" fill="none" stroke="#7955A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-control)"/>
<rect x="527" y="151" width="116" height="28" rx="10" fill="#FFFFFF" stroke="#D6DFEA"/>
<text x="585" y="170" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#7955A6" text-anchor="middle">place executor Pods</text>
<path d="M 1015,310 L 1060,310 L 1060,270 L 1110,270" fill="none" stroke="#7955A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-control)"/>
<rect x="1002" y="246" width="116" height="28" rx="10" fill="#FFFFFF" stroke="#D6DFEA"/>
<text x="1060" y="265" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#7955A6" text-anchor="middle">Spark task assignment</text>
<path d="M 1015,355 L 1065,355 L 1065,495 L 1110,495" fill="none" stroke="#7955A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-control)"/>
<path d="M 1015,390 L 1080,390 L 1080,530 L 1110,530" fill="none" stroke="#B87918" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-network)"/>
<rect x="1022" y="506" width="116" height="28" rx="10" fill="#FFFFFF" stroke="#D6DFEA"/>
<text x="1080" y="525" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#B87918" text-anchor="middle">shuffle / results</text>
<text x="800" y="750" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#526581" text-anchor="middle">Kubernetes schedules Pods; Spark schedules tasks. Resource requests, limits, storage, and shuffle lifecycle affect performance.</text>
</svg>