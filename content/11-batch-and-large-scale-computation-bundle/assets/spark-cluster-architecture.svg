<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Apache Spark cluster architecture</title><desc id="desc">The driver builds jobs and schedules tasks; executors run tasks and manage cached and shuffle data.</desc>
<rect width="1600" height="900" fill="#FBFCFE"/>
<rect x="0" y="0" width="1600" height="112" fill="#F1F5FA"/>
<text x="64" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" fill="#172B4D">Apache Spark cluster architecture</text>
<text x="66" y="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#526581">The driver builds jobs and schedules tasks; executors run tasks and manage cached and shuffle data.</text>
<text x="1535" y="49" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#8293AA" text-anchor="end">DISTRIBUTED COMPUTATION · CHAPTER 11</text><defs>
