<text x="800" y="755" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#526581" text-anchor="middle">Shuffle cost includes serialization, network transfer, disk I/O, sorting/merging, and metadata.</text>
