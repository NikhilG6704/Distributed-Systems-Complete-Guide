<text x="800" y="780" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#526581" text-anchor="middle">Broadcast is constrained by serialized size, executor memory, network fan-out, and timeout; join choice is plan- and statistics-dependent.</text>
