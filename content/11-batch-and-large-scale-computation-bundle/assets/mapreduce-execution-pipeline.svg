<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">MapReduce execution pipeline</title><desc id="desc">Map tasks emit intermediate key-value pairs; shuffle and sort group each key before reducers aggregate.</desc>
<rect width="1600" height="900" fill="#FBFCFE"/>
