<text x="70" y="785" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#5E7086" text-anchor="start"><tspan x="70" dy="0">The delete marker is retained until it is safe</tspan><tspan x="70" dy="20">to prove no older value can reappear.</tspan></text>
