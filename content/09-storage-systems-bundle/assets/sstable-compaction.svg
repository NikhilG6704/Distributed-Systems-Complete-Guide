<text x="445" y="785" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#5E7086" text-anchor="start"><tspan x="445" dy="0">Extra disk reads/writes and temporary space;</tspan><tspan x="445" dy="20">background throughput must keep up with ingest.</tspan></text>
