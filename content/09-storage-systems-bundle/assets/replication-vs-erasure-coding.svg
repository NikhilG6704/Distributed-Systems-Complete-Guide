<text x="800" y="595" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="800" fill="#14263D" text-anchor="start" style="">Physical capacity = 600 × (9 / 6) = 900 GB</text>
<text x="800" y="630" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#119A8A" text-anchor="start" style="">Overhead relative to logical data = 50%</text>
<rect x="800" y="670" width="240" height="28" rx="14" fill="#E6F6F3" stroke="#E6F6F3" stroke-width="1"/>
<text x="920.0" y="689" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#119A8A" text-anchor="middle" style="">Any 3 fragments lost*</text>
<text x="800" y="720" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#5E7086" text-anchor="start"><tspan x="800" dy="0">*Under a suitable 6+3 MDS code and independent placement.</tspan><tspan x="800" dy="18">Repair requires reading surviving fragments and reconstructing data.</tspan></text>
<text x="720" y="850" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#5E7086" text-anchor="middle" style="">Erasure coding saves capacity; replication often offers simpler reads and repairs. Placement and correlated failures still matter.</text>
