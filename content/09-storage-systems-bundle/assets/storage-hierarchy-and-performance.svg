<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Storage hierarchy and performance</title><desc id="desc">Illustrative hierarchy: faster and more expensive per byte near the top; larger and slower toward the bottom.</desc>
<defs>
          <marker id="arr-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FED"/></marker>
          <marker id="arr-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#119A8A"/></marker>
          <marker id="arr-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D58A19"/></marker>
          <marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D94B4B"/></marker>
          <marker id="arr-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5E7086"/></marker>
          <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#23364D" flood-opacity=".09"/></filter>
        </defs>
<rect width="1440" height="900" fill="#F4F7FB"/>
<text x="54" y="58" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#14263D" text-anchor="start" style="">Storage hierarchy and performance</text>
<text x="54" y="91" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5E7086" text-anchor="start" style="">Illustrative hierarchy: faster and more expensive per byte near the top; larger and slower toward the bottom.</text>
<path d="M54,112 L1386,112" fill="none" stroke="#CAD5E2" stroke-width="1" stroke-linecap="round" marker-end="url(#arr-gray)"/>
<rect x="120" y="145" width="760" height="70" rx="12" fill="#F0ECFB" stroke="#7656C8" stroke-width="1.5"/>
<text x="140" y="174" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#23364D" text-anchor="start" style="">CPU registers + cache</text>
<text x="140" y="197" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5E7086" text-anchor="start" style="">Volatile • tiny capacity</text>
<text x="1030" y="172" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#7656C8" text-anchor="start" style="">sub-ns to ~10s ns</text>
<path d="M500,217 L500,228" fill="none" stroke="#5E7086" stroke-width="1.5" stroke-linecap="round"/>
<rect x="140" y="229" width="720" height="70" rx="12" fill="#EAF1FF" stroke="#2F6FED" stroke-width="1.5"/>
<text x="160" y="258" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#23364D" text-anchor="start" style="">DRAM / buffer pool</text>
<text x="160" y="281" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5E7086" text-anchor="start" style="">Volatile • working set</text>
<text x="1030" y="256" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#2F6FED" text-anchor="start" style="">~10s–100s ns</text>
<path d="M500,301 L500,312" fill="none" stroke="#5E7086" stroke-width="1.5" stroke-linecap="round"/>
<rect x="160" y="313" width="680" height="70" rx="12" fill="#E6F6F3" stroke="#119A8A" stroke-width="1.5"/>
<text x="180" y="342" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#23364D" text-anchor="start" style="">Persistent memory concept</text>
<text x="180" y="365" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5E7086" text-anchor="start" style="">Persistent • specialized</text>
<text x="1030" y="340" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#119A8A" text-anchor="start" style="">Platform-dependent</text>
<path d="M500,385 L500,396" fill="none" stroke="#5E7086" stroke-width="1.5" stroke-linecap="round"/>
<rect x="180" y="397" width="640" height="70" rx="12" fill="#E6F6F3" stroke="#119A8A" stroke-width="1.5"/>
<text x="200" y="426" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#23364D" text-anchor="start" style="">NVMe SSD</text>
<text x="200" y="449" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5E7086" text-anchor="start" style="">Persistent • parallel random I/O</text>
<text x="1030" y="424" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#119A8A" text-anchor="start" style="">~10s–100s µs</text>
<path d="M500,469 L500,480" fill="none" stroke="#5E7086" stroke-width="1.5" stroke-linecap="round"/>
<rect x="200" y="481" width="600" height="70" rx="12" fill="#FFF4DF" stroke="#D58A19" stroke-width="1.5"/>
<text x="220" y="510" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#23364D" text-anchor="start" style="">SATA SSD</text>
<text x="220" y="533" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5E7086" text-anchor="start" style="">Persistent • lower interface bandwidth</text>
<text x="1030" y="508" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#D58A19" text-anchor="start" style="">~100s µs (illustrative)</text>
<path d="M500,553 L500,564" fill="none" stroke="#5E7086" stroke-width="1.5" stroke-linecap="round"/>
<rect x="220" y="565" width="560" height="70" rx="12" fill="#FFF4DF" stroke="#D58A19" stroke-width="1.5"/>
<text x="240" y="594" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#23364D" text-anchor="start" style="">HDD</text>
<text x="240" y="617" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5E7086" text-anchor="start" style="">Persistent • strong sequential economics</text>
<text x="1030" y="592" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#D58A19" text-anchor="start" style="">~milliseconds random seek</text>
<path d="M500,637 L500,648" fill="none" stroke="#5E7086" stroke-width="1.5" stroke-linecap="round"/>
<rect x="240" y="649" width="520" height="70" rx="12" fill="#FFFFFF" stroke="#5E7086" stroke-width="1.5"/>
<text x="260" y="678" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#23364D" text-anchor="start" style="">Network file / block storage</text>
<text x="260" y="701" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5E7086" text-anchor="start" style="">Persistent • shared service</text>
<text x="1030" y="676" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#5E7086" text-anchor="start" style="">Network + service dependent</text>
<path d="M500,721 L500,732" fill="none" stroke="#5E7086" stroke-width="1.5" stroke-linecap="round"/>
<rect x="260" y="733" width="480" height="70" rx="12" fill="#FFFFFF" stroke="#5E7086" stroke-width="1.5"/>
<text x="280" y="762" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#23364D" text-anchor="start" style="">Object storage</text>
<text x="280" y="785" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5E7086" text-anchor="start" style="">Persistent • very large scale / cold data</text>
<text x="1030" y="760" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#5E7086" text-anchor="start" style="">Usually ms-scale API request</text>
<rect x="1130" y="145" width="245" height="245" rx="14" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="1130" y="145" width="7" height="245" rx="4" fill="#2F6FED"/>
<text x="1148" y="174" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#23364D" text-anchor="start" style="">Near the top</text>
<text x="1148" y="198" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5E7086" text-anchor="start"><tspan x="1148" dy="0">Lower access latency</tspan><tspan x="1148" dy="19.88">Higher cost per GB</tspan><tspan x="1148" dy="19.88">Smaller capacity</tspan><tspan x="1148" dy="19.88">Best for hot working sets</tspan></text>
<rect x="1130" y="420" width="245" height="245" rx="14" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="1130" y="420" width="7" height="245" rx="4" fill="#D58A19"/>
<text x="1148" y="449" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#23364D" text-anchor="start" style="">Near the bottom</text>
<text x="1148" y="473" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5E7086" text-anchor="start"><tspan x="1148" dy="0">Higher capacity</tspan><tspan x="1148" dy="19.88">Lower cost per GB</tspan><tspan x="1148" dy="19.88">More request overhead</tspan><tspan x="1148" dy="19.88">Best for bulk / cold data</tspan></text>
<rect x="1140" y="700" width="220" height="28" rx="14" fill="#FDECEC" stroke="#FDECEC" stroke-width="1"/>
<text x="1250.0" y="719" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#D94B4B" text-anchor="middle" style="">Persistence is separate</text>
<text x="1150" y="746" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5E7086" text-anchor="start"><tspan x="1150" dy="0">CPU cache and DRAM are volatile.</tspan><tspan x="1150" dy="19">Durability depends on the full</tspan><tspan x="1150" dy="19">software + hardware path.</tspan></text>
<text x="120" y="850" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#5E7086" text-anchor="start" style="">Latency ranges are order-of-magnitude examples; device, queue depth, workload, and cloud service tier change results.</text>
<path d="M54,852 L1386,852" fill="none" stroke="#CAD5E2" stroke-width="1" stroke-linecap="round"/>
<text x="54" y="877" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5E7086" text-anchor="start" style="">Conceptual architecture • labels and scale are illustrative</text>
<text x="1386" y="877" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#5E7086" text-anchor="end" style="">storage-hierarchy-and-performance.svg</text>
</svg>