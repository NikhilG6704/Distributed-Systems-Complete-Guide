<text x="678" y="708" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5E7086" text-anchor="start"><tspan x="678" dy="0">Read key/value entries</tspan></text>
<rect x="1040" y="390" width="330" height="140" rx="14" fill="#E6F6F3" stroke="#119A8A" stroke-width="1.5" filter="url(#shadow)"/>
