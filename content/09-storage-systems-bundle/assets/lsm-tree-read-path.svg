<text x="720" y="840" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#5E7086" text-anchor="middle" style="">Bloom filters avoid many unnecessary file reads; indexes locate blocks but correctness still requires version/tombstone resolution.</text>
