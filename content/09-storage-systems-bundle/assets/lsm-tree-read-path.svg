<text x="1058" y="419" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#23364D" text-anchor="start" style="">Version merge</text>
<text x="1058" y="443" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5E7086" text-anchor="start"><tspan x="1058" dy="0">Compare sequence numbers</tspan><tspan x="1058" dy="21.299999999999997">Newest visible value wins</tspan><tspan x="1058" dy="21.299999999999997">Tombstone can hide older data</tspan></text>
