<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Redis Cluster architecture</title><desc id="desc">Key hashing maps to one of 16,384 slots; primaries own slot ranges and replicas provide failover copies.</desc>
