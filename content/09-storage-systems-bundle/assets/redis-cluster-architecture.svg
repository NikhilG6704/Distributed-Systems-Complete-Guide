<text x="720" y="860" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#5E7086" text-anchor="middle" style="">Redis Cluster distributes keys; Sentinel is a separate monitoring/failover mechanism for non-Cluster deployments.</text>
