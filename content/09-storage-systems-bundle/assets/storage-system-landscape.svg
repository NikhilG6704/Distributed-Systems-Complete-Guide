<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Storage system landscape</title><desc id="desc">One application uses different storage models for different data shapes and access patterns.</desc>
