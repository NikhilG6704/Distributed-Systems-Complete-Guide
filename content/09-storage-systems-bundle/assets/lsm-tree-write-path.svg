<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">LSM tree write path</title><desc id="desc">A durable log plus in-memory buffering turns foreground writes into sequential flushes and background merges.</desc>
