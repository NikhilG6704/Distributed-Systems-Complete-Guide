<text x="720" y="850" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#5E7086" text-anchor="middle" style="">Partitioning spreads distinct data; replication creates redundant copies. Metadata and request routing are separate concerns.</text>
