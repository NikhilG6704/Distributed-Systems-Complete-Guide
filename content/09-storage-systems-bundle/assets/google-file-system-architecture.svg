<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Google File System architecture (historical design)</title><desc id="desc">The master serves metadata; clients transfer bulk data directly with chunkservers. Original-paper chunk size: 64 MiB.</desc>
<defs>
          <marker id="arr-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FED"/></marker>
          <marker id="arr-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#119A8A"/></marker>
          <marker id="arr-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D58A19"/></marker>
          <marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D94B4B"/></marker>
          <marker id="arr-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5E7086"/></marker>
          <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#23364D" flood-opacity=".09"/></filter>
        </defs>
<rect width="1440" height="900" fill="#F4F7FB"/>
<text x="54" y="58" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#14263D" text-anchor="start" style="">Google File System architecture (historical design)</text>
<text x="54" y="91" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5E7086" text-anchor="start" style="">The master serves metadata; clients transfer bulk data directly with chunkservers. Original-paper chunk size: 64 MiB.</text>
<path d="M54,112 L1386,112" fill="none" stroke="#CAD5E2" stroke-width="1" stroke-linecap="round" marker-end="url(#arr-gray)"/>
<rect x="530" y="145" width="380" height="110" rx="14" fill="#F0ECFB" stroke="#7656C8" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="530" y="145" width="7" height="110" rx="4" fill="#7656C8"/>
<text x="548" y="174" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" fill="#23364D" text-anchor="start" style="">GFS Master</text>
<text x="548" y="198" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5E7086" text-anchor="start"><tspan x="548" dy="0">Namespace • file-to-chunk map</tspan><tspan x="548" dy="21.299999999999997">chunk handles • leases • locations</tspan></text>
<rect x="80" y="360" width="260" height="120" rx="14" fill="#EAF1FF" stroke="#2F6FED" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="80" y="360" width="7" height="120" rx="4" fill="#2F6FED"/>
<text x="98" y="389" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#23364D" text-anchor="start" style="">GFS Client</text>
<text x="98" y="413" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5E7086" text-anchor="start"><tspan x="98" dy="0">1. Ask master for metadata</tspan><tspan x="98" dy="19.88">2. Cache chunk handle + locations</tspan><tspan x="98" dy="19.88">3. Transfer bytes directly</tspan></text>
<rect x="460" y="530" width="220" height="140" rx="14" fill="#EAF1FF" stroke="#2F6FED" stroke-width="1.5"/>
<rect x="460" y="530" width="7" height="140" rx="4" fill="#2F6FED"/>
<text x="478" y="559" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#23364D" text-anchor="start" style="">Chunkserver A</text>
<text x="478" y="583" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5E7086" text-anchor="start"><tspan x="478" dy="0">Replica • lease primary</tspan></text>
<rect x="820" y="530" width="220" height="140" rx="14" fill="#E6F6F3" stroke="#119A8A" stroke-width="1.5"/>
<rect x="820" y="530" width="7" height="140" rx="4" fill="#119A8A"/>
<text x="838" y="559" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#23364D" text-anchor="start" style="">Chunkserver B</text>
<text x="838" y="583" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5E7086" text-anchor="start"><tspan x="838" dy="0">Replica • secondary</tspan></text>
<rect x="1180" y="530" width="220" height="140" rx="14" fill="#F0ECFB" stroke="#7656C8" stroke-width="1.5"/>
<rect x="1180" y="530" width="7" height="140" rx="4" fill="#7656C8"/>
<text x="1198" y="559" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#23364D" text-anchor="start" style="">Chunkserver C</text>
<text x="1198" y="583" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5E7086" text-anchor="start"><tspan x="1198" dy="0">Replica • secondary</tspan></text>
<path d="M530,210 H210 V360" fill="none" stroke="#5E7086" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arr-gray)"/>
<path d="M340,410 H430 V240 H530" fill="none" stroke="#5E7086" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arr-gray)"/>
<rect x="355" y="275" width="165" height="28" rx="14" fill="#F0ECFB" stroke="#F0ECFB" stroke-width="1"/>
<text x="437.5" y="294" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#7656C8" text-anchor="middle" style="">Metadata lookup</text>
<path d="M340,430 H420 V600 H460" fill="none" stroke="#2F6FED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<path d="M340,455 H780 V600 H820" fill="none" stroke="#2F6FED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<path d="M340,475 H1140 V600 H1180" fill="none" stroke="#2F6FED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<rect x="525" y="690" width="240" height="28" rx="14" fill="#EAF1FF" stroke="#EAF1FF" stroke-width="1"/>
<text x="645.0" y="709" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#2F6FED" text-anchor="middle" style="">Direct client ↔ chunkserver data</text>
<path d="M680,595 L820,595" fill="none" stroke="#119A8A" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr-teal)"/>
<path d="M1040,595 L1180,595" fill="none" stroke="#119A8A" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr-teal)"/>
<path d="M570,530 V460 H700 V255" fill="none" stroke="#D58A19" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arr-amber)"/>
<rect x="920" y="360" width="180" height="28" rx="14" fill="#FFF4DF" stroke="#FFF4DF" stroke-width="1"/>
<text x="1010.0" y="379" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#D58A19" text-anchor="middle" style="">Heartbeat / reports</text>
<text x="920" y="400" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#5E7086" text-anchor="start"><tspan x="920" dy="0">Master detects failures;</tspan><tspan x="920" dy="19">re-replicates missing chunks.</tspan></text>
<rect x="75" y="740" width="1280" height="90" rx="14" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="75" y="740" width="7" height="90" rx="4" fill="#D58A19"/>
<text x="93" y="769" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#23364D" text-anchor="start" style="">Mutation ordering</text>
<text x="93" y="793" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5E7086" text-anchor="start"><tspan x="93" dy="0">Master grants a lease to a primary replica; the primary chooses mutation order and secondaries apply it. Failure triggers lease/recovery logic.</tspan></text>
<text x="720" y="870" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#5E7086" text-anchor="middle" style="">Historical GFS paper used 64 MiB chunks; do not assume this is a parameter of modern Google storage products.</text>
<path d="M54,852 L1386,852" fill="none" stroke="#CAD5E2" stroke-width="1" stroke-linecap="round"/>
<text x="54" y="877" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5E7086" text-anchor="start" style="">Conceptual architecture • labels and scale are illustrative</text>
<text x="1386" y="877" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#5E7086" text-anchor="end" style="">google-file-system-architecture.svg</text>
</svg>