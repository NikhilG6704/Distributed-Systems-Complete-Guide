<text x="720" y="850" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#5E7086" text-anchor="middle" style="">TiDB nodes can scale separately from TiKV storage nodes; TiFlash adds an analytical representation for HTAP-style workloads.</text>
