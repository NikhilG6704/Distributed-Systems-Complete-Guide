<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">TiDB architecture</title><desc id="desc">TiDB provides the SQL layer; PD coordinates cluster metadata; TiKV stores transactional Regions and TiFlash serves analytical replicas.</desc>
