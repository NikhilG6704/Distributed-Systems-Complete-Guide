<text x="998" y="443" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5E7086" text-anchor="start"><tspan x="998" dy="0">Key span [k100, k200)</tspan><tspan x="998" dy="19.88">MVCC versions • Raft log</tspan></text>
<path d="M510,240 V310 H260 V390" fill="none" stroke="#119A8A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/>
<path d="M945,240 V310 H710 V390" fill="none" stroke="#2F6FED" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
