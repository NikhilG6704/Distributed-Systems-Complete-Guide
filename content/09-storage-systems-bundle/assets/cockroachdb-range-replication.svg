<text x="548" y="443" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5E7086" text-anchor="start"><tspan x="548" dy="0">Key span [k100, k200)</tspan><tspan x="548" dy="19.88">MVCC versions • Raft log</tspan></text>
