<text x="54" y="91" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5E7086" text-anchor="start" style="">A key range is replicated using Raft; a leaseholder coordinates serving operations while replicas maintain consensus state.</text>
