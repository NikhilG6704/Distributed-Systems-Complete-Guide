<path d="M440,460 H530" fill="none" stroke="#2F6FED" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<path d="M890,460 H980" fill="none" stroke="#7656C8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-gray)"/>
<rect x="500" y="570" width="430" height="28" rx="14" fill="#EAF1FF" stroke="#EAF1FF" stroke-width="1"/>
<text x="715.0" y="589" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#2F6FED" text-anchor="middle" style="">Raft replication • quorum commit</text>
<text x="500" y="615" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#5E7086" text-anchor="start"><tspan x="500" dy="0">Leaseholder proposes log entry; followers replicate it.</tspan><tspan x="500" dy="20">Commit requires a Raft majority, not every replica.</tspan></text>
<rect x="80" y="720" width="520" height="90" rx="14" fill="#FFF4DF" stroke="#D58A19" stroke-width="1.5"/>
<rect x="80" y="720" width="7" height="90" rx="4" fill="#D58A19"/>
<text x="98" y="749" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#23364D" text-anchor="start" style="">Range split</text>
<text x="98" y="773" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5E7086" text-anchor="start"><tspan x="98" dy="0">Large / hot range divides into smaller key spans</tspan></text>
<rect x="820" y="720" width="520" height="90" rx="14" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="820" y="720" width="7" height="90" rx="4" fill="#119A8A"/>
<text x="838" y="749" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#23364D" text-anchor="start" style="">Rebalance</text>
<text x="838" y="773" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5E7086" text-anchor="start"><tspan x="838" dy="0">Replicas move to improve load and failure-domain placement</tspan></text>
<path d="M710,535 V670 H340 V720" fill="none" stroke="#D58A19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-amber)"/>
<path d="M1160,535 V670 H1080 V720" fill="none" stroke="#119A8A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/>
<text x="720" y="860" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#5E7086" text-anchor="middle" style="">Leaseholder and Raft leader are related but distinct concepts in CockroachDB; do not conflate request-serving leases with consensus.</text>
<path d="M54,852 L1386,852" fill="none" stroke="#CAD5E2" stroke-width="1" stroke-linecap="round"/>
