<text x="175.0" y="229" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#2F6FED" text-anchor="middle" style="">Page-oriented update</text>
<rect x="775" y="210" width="180" height="28" rx="14" fill="#E6F6F3" stroke="#E6F6F3" stroke-width="1"/>
<text x="865.0" y="229" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#119A8A" text-anchor="middle" style="">Append + merge</text>
<rect x="100" y="290" width="185" height="90" rx="14" fill="#EAF1FF" stroke="#2F6FED" stroke-width="1.5"/>
<rect x="100" y="290" width="7" height="90" rx="4" fill="#2F6FED"/>
<text x="118" y="319" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#23364D" text-anchor="start" style="">Client update</text>
<text x="118" y="343" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5E7086" text-anchor="start"><tspan x="118" dy="0">key → new value</tspan></text>
<rect x="360" y="290" width="250" height="90" rx="14" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="1.5"/>
<rect x="360" y="290" width="7" height="90" rx="4" fill="#2F6FED"/>
<text x="378" y="319" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#23364D" text-anchor="start" style="">Buffer pool page</text>
<text x="378" y="343" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5E7086" text-anchor="start"><tspan x="378" dy="0">Locate leaf; latch / modify</tspan></text>
