iddle" style="">Implementation</text><text x="523.0" y="339" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="523.0" dy="0">Protocol + data</tspan><tspan x="523.0" dy="15">paths</tspan></text><line x1="420" y1="346.0" x2="437" y2="346.0" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="631" y="290" width="158" height="112" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="710.0" y="317" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Test layers</text><text x="710.0" y="339" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="710.0" dy="0">Unit • model</tspan><tspan x="710.0" dy="15">Jepsen • chaos</tspan></text><line x1="607" y1="346.0" x2="624" y2="346.0" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><rect x="818" y="290" width="158" height="112" rx="14" fill="#FBF2E4" stroke="#D28B2C" stroke-width="1.5" filter="url(#shadow)"/><text x="897.0" y="317" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Release</text><text x="897.0" y="339" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="897.0" dy="0">Canary • gates</tspan><tspan x="897.0" dy="15">rollback</tspan></text><line x1="794" y1="346.0" x2="811" y2="346.0" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1005" y="290" width="158" height="112" rx="14" fill="#FFFFFF" stroke="#B8C8D5" stroke-width="1.5" filter="url(#shadow)"/><text x="1084.0" y="317" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Production</text><text x="1084.0" y="339" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="1084.0" dy="0">Telemetry • traces</tspan><tspan x="1084.0" dy="15">incidents</tspan></text><line x1="981" y1="346.0" x2="998" y2="346.0" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><path d="M1080 435 V520 H126 V435" fill="none" stroke="#218C86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="600" y="548" fill="#218C86" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" text-anchor="middle" style="">Evidence feeds the next specification and regression cycle</text><rect x="440" y="570" width="150" height="28" rx="14" fill="#F9EBEB" stroke="#C45454" stroke-width="1"/><text x="515.0" y="589" fill="#C45454" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" text-anchor="middle" style="">Counterexample → fix</text><rect x="610" y="570" width="150" height="28" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1"/><text x="685.0" y="589" fill="#218C86" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" text-anchor="middle" style="">Regression → gate</text><line x1="52" y1="654" x2="1148" y2="654" stroke="#E4EBF0" stroke-width="1" stroke-linecap="round"/><text x="52" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="start" style="">DISTRIBUTED SYSTEMS  /  VERIFICATION &amp; TESTING</text><text x="1148" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="end" style="">DIAGRAM 18-01</text></svg>