<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title>Generator and shrinking process</title><desc id="desc">Reduce a failing operation sequence while keeping the same property violation reproducible.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3778A8"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#218C86"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#C45454"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324D" flood-opacity="0.09"/></filter>
</defs>
<rect width="1200" height="700" fill="#FFFFFF"/>
<rect x="0" y="0" width="1200" height="9" fill="#218C86"/>
<text x="52" y="58" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" style="">Generator and shrinking process</text><text x="52" y="88" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" style="">Reduce a failing operation sequence while keeping the same property violation reproducible.</text><line x1="52" y1="108" x2="1148" y2="108" stroke="#DCE5EC" stroke-width="1.2" stroke-linecap="round"/><rect x="70" y="250" width="280" height="150" rx="14" fill="#F9EBEB" stroke="#C45454" stroke-width="1.5" filter="url(#shadow)"/><text x="210.0" y="277" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">Original failing trace</text><text x="210.0" y="299" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle"><tspan x="210.0" dy="0">12 nodes • 30 operations</tspan><tspan x="210.0" dy="18">multiple retries + partitions</tspan></text><rect x="460" y="250" width="280" height="150" rx="14" fill="#FBF2E4" stroke="#D28B2C" stroke-width="1.5" filter="url(#shadow)"/><text x="600.0" y="277" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">Candidate reductions</text><text x="600.0" y="299" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle"><tspan x="600.0" dy="0">remove operations</tspan><tspan x="600.0" dy="18">shorten values / delays</tspan></text><rect x="850" y="250" width="280" height="150" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="990.0" y="277" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">Minimal counterexample</text><text x="990.0" y="299" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle"><tspan x="990.0" dy="0">3 operations • 2 nodes</tspan><tspan x="990.0" dy="18">same violation persists</tspan></text><line x1="350" y1="325" x2="455" y2="325" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="740" y1="325" x2="845" y2="325" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><text x="405" y="300" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" text-anchor="middle" style="">shrink</text><text x="795" y="300" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" text-anchor="middle" style="">preserve failure</text><rect x="220" y="470" width="220" height="28" rx="14" fill="#F0EDF7" stroke="#7963A8" stroke-width="1"/><text x="330.0" y="489" fill="#7963A8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" text-anchor="middle" style="">Keep preconditions valid</text><rect x="500" y="470" width="220" height="28" rx="14" fill="#F9EBEB" stroke="#C45454" stroke-width="1"/><text x="610.0" y="489" fill="#C45454" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" text-anchor="middle" style="">Keep failing property</text><rect x="780" y="470" width="220" height="28" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1"/><text x="890.0" y="489" fill="#218C86" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" text-anchor="middle" style="">Persist seed + trace</text><text x="600" y="570" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" style="">A smaller trace makes the causal interleaving easier to understand and turn into a regression.</text><line x1="52" y1="654" x2="1148" y2="654" stroke="#E4EBF0" stroke-width="1" stroke-linecap="round"/><text x="52" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="start" style="">DISTRIBUTED SYSTEMS  /  VERIFICATION &amp; TESTING</text><text x="1148" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="end" style="">DIAGRAM 18-24</text></svg>