<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title>Safety versus liveness</title><desc id="desc">Safety excludes bad finite prefixes; liveness requires eventual progress under stated assumptions.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3778A8"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#218C86"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#C45454"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324D" flood-opacity="0.09"/></filter>
</defs>
<rect width="1200" height="700" fill="#FFFFFF"/>
<rect x="0" y="0" width="1200" height="9" fill="#218C86"/>
<text x="52" y="58" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" style="">Safety versus liveness</text><text x="52" y="88" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" style="">Safety excludes bad finite prefixes; liveness requires eventual progress under stated assumptions.</text><line x1="52" y1="108" x2="1148" y2="108" stroke="#DCE5EC" stroke-width="1.2" stroke-linecap="round"/><rect x="105" y="190" width="430" height="90" rx="14" fill="#F9EBEB" stroke="#C45454" stroke-width="1.5" filter="url(#shadow)"/><text x="320.0" y="217" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" style="">SAFETY</text><text x="320.0" y="239" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle"><tspan x="320.0" dy="0">“Bad never happens”</tspan></text><rect x="665" y="190" width="430" height="90" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="880.0" y="217" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" style="">LIVENESS</text><text x="880.0" y="239" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle"><tspan x="880.0" dy="0">“Good eventually happens”</tspan></text><text x="320" y="330" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle" style="">Execution prefix</text><text x="880" y="330" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle" style="">Execution over time</text><line x1="120" y1="405" x2="220" y2="390" stroke="#218C86" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="220" y1="390" x2=