<text x="52" y="58" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" style="">Stateful model-based testing</text><text x="52" y="88" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" style="">The same generated command stream drives a reference model and the implementation under test.</text><line x1="52" y1="108" x2="1148" y2="108" stroke="#DCE5EC" stroke-width="1.2" stroke-linecap="round"/><rect x="70" y="170" width="260" height="80" rx="14" fill="#F0EDF7" stroke="#7963A8" stroke-width="1.5" filter="url(#shadow)"/><text x="200.0" y="197" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Command generator</text><text x="200.0" y="219" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="200.0" dy="0">valid operations + preconditions</tspan></text><rect x="420" y="155" width="300" height="115" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="570.0" y="182" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">Reference model</text><text x="570.0" y="204" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="570.0" dy="0">expected abstract state</tspan><tspan x="570.0" dy="16">deterministic transition</tspan></text><rect x="830" y="155" width="300" height="115" rx="14" fill="#E8F1F8" stroke="#3778A8" stroke-width="1.5" filter="url(#shadow)"/><text x="980.0" y="182" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">Implementation / SUT</text><text x="980.0" y="204" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="980.0" dy="0">real API • database • cluster</tspan></text><line x1="330" y1="210" x2="415" y2="210" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="330" y1="220" x2="825" y2="220" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="420" y="390" width="300" height="90" rx="14" fill="#FBF2E4" stroke="#D28B2C" stroke-width="1.5" filter="url(#shadow)"/><text x="570.0" y="417" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Model oracle</text><text x="570.0" y="439" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="570.0" dy="0">expected response + invariants</tspan></text><rect x="830" y="390" width="300" height="90" rx="14" fill="#FFFFFF" stroke="#B8C8D5" stroke-width="1.5" filter="url(#shadow)"/><text x="980.0" y="417" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Observed response</text><text x="980.0" y="439" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="980.0" dy="0">actual output + state</tspan></text><line x1="570" y1="270" x2="570" y2="385" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="980" y1="270" x2="980" y2="385" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="720" y1="435" x2="825" y2="435" stroke="#D28B2C" stroke-width="2" stroke-linecap="round"/><text x="770" y="420" fill="#D28B2C" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" text-anchor="middle" style="">compare</text><text x="600" y="555" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" style="">On mismatch: shrink command sequence, inspect the first divergent state, and save a regression.</text><line x1="52" y1="654" x2="1148" y2="654" stroke="#E4EBF0" stroke-width="1" stroke-linecap="round"/><text x="52" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="start" style="">DISTRIBUTED SYSTEMS  /  VERIFICATION &amp; TESTING</text><text x="1148" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="end" style="">DIAGRAM 18-25</text></svg>