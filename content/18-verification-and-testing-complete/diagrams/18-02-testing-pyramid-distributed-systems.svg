<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title>Testing pyramid for distributed systems</title><desc id="desc">Fast, local checks are frequent; broad system experiments are expensive. Formal methods complement every layer.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3778A8"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#218C86"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#C45454"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324D" flood-opacity="0.09"/></filter>
</defs>
<rect width="1200" height="700" fill="#FFFFFF"/>
<rect x="0" y="0" width="1200" height="9" fill="#218C86"/>
<text x="52" y="58" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" style="">Testing pyramid for distributed systems</text><text x="52" y="88" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" style="">Fast, local checks are frequent; broad system experiments are expensive. Formal methods complement every layer.</text><line x1="52" y1="108" x2="1148" y2="108" stroke="#DCE5EC" stroke-width="1.2" stroke-linecap="round"/><path d="M190 590 L390 190 L590 590 Z" fill="#F7FAFC" stroke="#17324D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M295.0 575 L390 480 L485.0 575 Z" fill="#E7F4F2" stroke="#218C86" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="390" y="542" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" text-anchor="middle" style="">UNIT</text><text x="390" y="560" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" text-anchor="middle" style="">fast • isolated</text><path d="M262.5 481 L390 414 L517.5 481 Z" fill="#E8F1F8" stroke="#3778A8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="390" y="448" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" text-anchor="middle" style="">COMPONENT</text><text x="390" y="466" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" text-anchor="middle" style="">contracts • state</text><path d="M230.0 414 L390 340 L550.0 414 Z" fill="#F0EDF7" stroke="#7963A8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="390" y="381" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" text-anchor="middle" style="">INTEGRATION</text><text x="390" y="399" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" text-anchor="middle" style="">multi-service</text><path d="M197.5 340 L390 255 L582.5 340 Z" fill="#FBF2E4" stroke="#D28B2C" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="390" y="307" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" text-anchor="middle" style="">SYSTEM / CHAOS</text><text x="390" y="325" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" text-anchor="middle" style="">cluster • faults</text><text x="160" y="620" fill="#218C86" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="start" style="">More frequent • lower cost</text><text x="616" y="190" fill="#D28B2C" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" text-anchor="start" style="">Broader scope</text><rect x="700" y="245" width="390" height="115" rx="14" fill="#F0EDF7" stroke="#7963A8" stroke-width="1.5" filter="url(#shadow)"/><text x="895.0" y="272" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">Formal / model-based verification</text><text x="895.0" y="294" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle"><tspan x="895.0" dy="0">Cross-cutting assurance, not simply</tspan><tspan x="895.0" dy="18">another pyramid tier</tspan></text><rect x="700" y="420" width="390" height="112" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="895.0" y="447" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">Production evidence</text><text x="895.0" y="469" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle"><tspan x="895.0" dy="0">Canary • telemetry • incident replay</tspan></text><line x1="895" y1="362" x2="895" y2="414" stroke="#7963A8" stroke-width="2" stroke-linecap="round"/><text x="895" y="600" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" style="">Higher breadth and cost usually mean slower feedback</text><line x1="52" y1="654" x2="1148" y2="654" stroke="#E4EBF0" stroke-width="1" stroke-linecap="round"/><text x="52" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="start" style="">DISTRIBUTED SYSTEMS  /  VERIFICATION &amp; TESTING</text><text x="1148" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="end" style="">DIAGRAM 18-02</text></svg>