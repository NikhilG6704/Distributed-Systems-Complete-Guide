<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title>Raft election under partition</title><desc id="desc">With five voters, a three-node majority can elect; the two-node minority cannot commit a new entry.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3778A8"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#218C86"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#C45454"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324D" flood-opacity="0.09"/></filter>
</defs>
<rect width="1200" height="700" fill="#FFFFFF"/>
<rect x="0" y="0" width="1200" height="9" fill="#218C86"/>
<text x="52" y="58" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" style="">Raft election under partition</text><text x="52" y="88" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" style="">With five voters, a three-node majority can elect; the two-node minority cannot commit a new entry.</text><line x1="52" y1="108" x2="1148" y2="108" stroke="#DCE5EC" stroke-width="1.2" stroke-linecap="round"/><rect x="80" y="170" width="620" height="350" rx="20" fill="#E7F4F2" stroke="#218C86" stroke-width="2"/><rect x="780" y="170" width="340" height="350" rx="20" fill="#FBF2E4" stroke="#D28B2C" stroke-width="2"/><text x="390" y="205" fill="#218C86" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" text-anchor="middle" style="">MAJORITY PARTITION</text><text x="950" y="205" fill="#D28B2C" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" text-anchor="middle" style="">MINORITY PARTITION</text><rect x="158" y="262" width="124" height="76" rx="14" fill="#E8F1F8" stroke="#3778A8" stroke-width="1.5" filter="url(#shadow)"/><text x="220.0" y="289" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">N1</text><text x="220.0" y="311" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="220.0" dy="0">term 6</tspan></text><rect x="418" y="262" width="124" height="76" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="480.0" y="289" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">N2</text><text x="480.0" y="311" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="480.0" dy="0">term 6</tspan></text><rect x="288" y="392" width="124" height="76" rx="14" fill="#E8F1F8" stroke="#3778A8" stroke-width="1.5" filter="url(#shadow)"/><text x="350.0" y="419" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">N3</text><text x="350.0" y="441" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="350.0" dy="0">term 6</tspan></text><rect x="808" y="262" width="124" height="76" rx="14" fill="#FBF2E4" stroke="#D28B2C" stroke-width="1.5" filter="url(#shadow)"/><text x="870.0" y="289" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">N4</text><text x="870.0" y="311" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="870.0" dy="0">term 5</tspan></text><rect x="968" y="392" width="124" height="76" rx="14" fill="#FBF2E4" stroke="#D28B2C" stroke-width="1.5" filter="url(#shadow)"/><text x="1030.0" y="419" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">N5</text><text x="1030.0" y="441" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="1030.0" dy="0">term 5</tspan></text><line x1="282" y1="300" x2="418" y2="300" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="250" y1="338" x2="312" y2="392" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="450" y1="338" x2="388" y2="392" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="932" y1="300" x2="968" y2="392" stroke="#D28B2C" stroke-width="2" stroke-linecap="round"/><line x1="720" y1="230" x2="760" y2="490" stroke="#C45454" stroke-width="4" stroke-linecap="round"/><line x1="742" y1="230" x2="782" y2="490" stroke="#C45454" stroke-width="4" stroke-linecap="round"/><rect x="250" y="555" width="280" height="28" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1"/><text x="390.0" y="574" fill="#218C86" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" text-anchor="middle" style="">N2 elected with 3 votes</text><rect x="680" y="555" width="320" height="28" rx="14" fill="#F9EBEB" stroke="#C45454" stroke-width="1"/><text x="840.0" y="574" fill="#C45454" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" text-anchor="middle" style="">2-node side cannot commit</text><text x="600" y="615" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" style="">Minority may retain an old leader view, but cannot safely commit without quorum.</text><line x1="52" y1="654" x2="1148" y2="654" stroke="#E4EBF0" stroke-width="1" stroke-linecap="round"/><text x="52" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="start" style="">DISTRIBUTED SYSTEMS  /  VERIFICATION &amp; TESTING</text><text x="1148" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="end" style="">DIAGRAM 18-34</text></svg>