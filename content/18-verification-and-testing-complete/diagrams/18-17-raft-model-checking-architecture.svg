<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title>Network partition experiment</title><desc id="desc">A partition divides communication paths; a quorum system should preserve progress only where a quorum exists.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3778A8"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#218C86"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#C45454"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324D" flood-opacity="0.09"/></filter>
</defs>
<rect width="1200" height="700" fill="#FFFFFF"/>
<rect x="0" y="0" width="1200" height="9" fill="#218C86"/>
<text x="52" y="58" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" style="">Network partition experiment</text><text x="52" y="88" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" style="">A partition divides communication paths; a quorum system should preserve progress only where a quorum exists.</text><line x1="52" y1="108" x2="1148" y2="108" stroke="#DCE5EC" stroke-width="1.2" stroke-linecap="round"/><rect x="100" y="180" width="440" height="330" rx="22" fill="#E7F4F2" stroke="#218C86" stroke-width="2"/><rect x="660" y="180" width="440" height="330" rx="22" fill="#FBF2E4" stroke="#D28B2C" stroke-width="2"/><text x="320" y="215" fill="#218C86" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" text-anchor="middle" style="">MAJORITY SIDE • 3 / 5</text><text x="880" y="215" fill="#D28B2C" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" text-anchor="middle" style="">MINORITY SIDE • 2 / 5</text><rect x="160" y="268" width="100" height="64" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="210.0" y="295" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">N1</text><rect x="370" y="268" width="100" height="64" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="420.0" y="295" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">N2</text><rect x="265" y="388" width="100" height="64" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="315.0" y="415" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">N3</text><rect x="720" y="268" width="100" height="64" rx="14" fill="#FBF2E4" stroke="#D28B2C" stroke-width="1.5" filter="url(#shadow)"/><text x="770.0" y="295" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">N4</text><rect x="900" y="388" width="100" height="64" rx="14" fill="#FBF2E4" stroke="#D28B2C" stroke-width="1.5" filter="url(#shadow)"/><text x="950.0" y="415" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">N5</text><line x1="260" y1="300" x2="370" y2="300" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="235" y1="332" x2="285" y2="388" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="395" y1="332" x2="345" y2="388" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="820" y1="300" x2="900" y2="395" stroke="#D28B2C" stroke-width="2" stroke-linecap="round"/><path d="M560 240 L620 450" fill="none" stroke="#C45454" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M580 240 L640 450" fill="none" stroke="#C45454" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="195" fill="#C45454" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="750" text-anchor="middle" style="">PARTITION / LINK CUT</text><text x="320" y="555" fill="#218C86" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle" style="">Can form quorum and commit</text><text x="880" y="555" fill="#C45454" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" text-anchor="middle" style="">Cannot form quorum alone</text><text x="600" y="610" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" style="">A five-voter Raft cluster requires three votes for election and commitment.</text><line x1="52" y1="654" x2="1148" y2="654" stroke="#E4EBF0" stroke-width="1" stroke-linecap="round"/><text x="52" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="start" style="">DISTRIBUTED SYSTEMS  /  VERIFICATION &amp; TESTING</text><text x="1148" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="end" style="">DIAGRAM 18-32</text></svg>