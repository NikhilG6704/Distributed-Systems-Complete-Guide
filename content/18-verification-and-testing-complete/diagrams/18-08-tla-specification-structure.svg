<text x="52" y="58" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" style="">TLA+ specification structure</text><text x="52" y="88" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" style="">Variables define state; Init and Next define behavior; Spec adds fairness; properties constrain all behaviors.</text><line x1="52" y1="108" x2="1148" y2="108" stroke="#DCE5EC" stroke-width="1.2" stroke-linecap="round"/><rect x="80" y="175" width="260" height="78" rx="14" fill="#FFFFFF" stroke="#B8C8D5" stroke-width="1.5" filter="url(#shadow)"/><text x="210.0" y="202" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">CONSTANTS</text><text x="210.0" y="224" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="210.0" dy="0">Nodes • values • bounds</tspan></text><rect x="80" y="300" width="260" height="78" rx="14" fill="#E8F1F8" stroke="#3778A8" stroke-width="1.5" filter="url(#shadow)"/><text x="210.0" y="327" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">VARIABLES</text><text x="210.0" y="349" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="210.0" dy="0">Current system state</tspan></text><rect x="420" y="175" width="300" height="78" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="570.0" y="202" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">Init</text><text x="570.0" y="224" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="570.0" dy="0">Predicate over initial state</tspan></text><rect x="420" y="300" width="300" height="78" rx="14" fill="#F0EDF7" stroke="#7963A8" stroke-width="1.5" filter="url(#shadow)"/><text x="570.0" y="327" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">Actions / Next</text><text x="570.0" y="349" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="570.0" dy="0">State relation; primed variables</tspan></text><rect x="800" y="235" width="300" height="92" rx="14" fill="#17324D" stroke="#17324D" stroke-width="1.5" filter="url(#shadow)"/><text x="950.0" y="262" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" style="">Spec</text><text x="950.0" y="284" fill="#E2EDF5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="950.0" dy="0">Init ∧ □[Next]vars</tspan><tspan x="950.0" dy="16">∧ fairness (when needed)</tspan></text><rect x="800" y="405" width="300" height="92" rx="14" fill="#FBF2E4" stroke="#D28B2C" stroke-width="1.5" filter="url(#shadow)"/><text x="950.0" y="432" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">Properties</text><text x="950.0" y="454" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="950.0" dy="0">TypeOK • invariants</tspan><tspan x="950.0" dy="16">temporal guarantees</tspan></text><line x1="340" y1="214" x2="420" y2="214" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="340" y1="339" x2="420" y2="339" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="720" y1="214" x2="800" y2="270" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="720" y1="339" x2="800" y2="292" stroke="#7963A8" stroke-width="2" stroke-linecap="round"/><line x1="950" y1="327" x2="950" y2="405" stroke="#D28B2C" stroke-width="2" stroke-linecap="round"/><text x="600" y="560" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" style="">State predicate: describes one state   •   Action predicate: relates s to s′   •   Temporal formula: constrains behaviors</text><line x1="52" y1="654" x2="1148" y2="654" stroke="#E4EBF0" stroke-width="1" stroke-linecap="round"/><text x="52" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="start" style="">DISTRIBUTED SYSTEMS  /  VERIFICATION &amp; TESTING</text><text x="1148" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="end" style="">DIAGRAM 18-08</text></svg>