<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title>Security and Byzantine fault testing</title><desc id="desc">Adversarial replicas may equivocate or send invalid messages; authentication and quorum validation must reject them.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3778A8"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#218C86"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#C45454"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324D" flood-opacity="0.09"/></filter>
</defs>
<rect width="1200" height="700" fill="#FFFFFF"/>
<rect x="0" y="0" width="1200" height="9" fill="#218C86"/>
<text x="52" y="58" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" style="">Security and Byzantine fault testing</text><text x="52" y="88" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" style="">Adversarial replicas may equivocate or send invalid messages; authentication and quorum validation must reject them.</text><line x1="52" y1="108" x2="1148" y2="108" stroke="#DCE5EC" stroke-width="1.2" stroke-linecap="round"/><rect x="65" y="235" width="210" height="96" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="170.0" y="262" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Replica A</text><text x="170.0" y="284" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="170.0" dy="0">valid signed vote</tspan></text><rect x="65" y="405" width="210" height="96" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="170.0" y="432" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Replica B</text><text x="170.0" y="454" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="170.0" dy="0">valid signed vote</tspan></text><rect x="365" y="300" width="230" height="120" rx="14" fill="#F9EBEB" stroke="#C45454" stroke-width="1.5" filter="url(#shadow)"/><text x="480.0" y="327" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">Byzantine replica</text><text x="480.0" y="349" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="480.0" dy="0">equivocation • replay</tspan><tspan x="480.0" dy="16">conflicting signatures</tspan></text><rect x="720" y="235" width="220" height="96" rx="14" fill="#E8F1F8" stroke="#3778A8" stroke-width="1.5" filter="url(#shadow)"/><text x="830.0" y="262" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Authenticator</text><text x="830.0" y="284" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="830.0" dy="0">identity + signature</tspan></text><rect x="720" y="405" width="220" height="96" rx="14" fill="#F0EDF7" stroke="#7963A8" stroke-width="1.5" filter="url(#shadow)"/><text x="830.0" y="432" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Quorum verifier</text><text x="830.0" y="454" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="830.0" dy="0">membership + threshold</tspan></text><rect x="1000" y="300" width="150" height="120" rx="14" fill="#17324D" stroke="#17324D" stroke-width="1.5" filter="url(#shadow)"/><text x="1075.0" y="327" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Decision</text><text x="1075.0" y="349" fill="#E2EDF5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="1075.0" dy="0">accept only</tspan><tspan x="1075.0" dy="16">valid quorum</tspan></text><line x1="275" y1="280" x2="715" y2="280" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="275" y1="450" x2="715" y2="450" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="595" y1="340" x2="715" y2="280" stroke="#C45454" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-red)"/><line x1="595" y1="380" x2="715" y2="450" stroke="#C45454" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-red)"/><line x1="940" y1="280" x2="995" y2="340" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="940" y1="450" x2="995" y2="390" stroke="#7963A8" stroke-width="2" stroke-linecap="round"/><rect x="390" y="535" width="180" height="28" rx="14" fill="#F9EBEB" stroke="#C45454" stroke-width="1"/><text x="480.0" y="554" fill="#C45454" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" text-anchor="middle" style="">Reject invalid / replay</text><text x="600" y="605" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" style="">Crash faults stop; Byzantine faults may send arbitrary, inconsistent, or malicious messages.</text><line x1="52" y1="654" x2="1148" y2="654" stroke="#E4EBF0" stroke-width="1" stroke-linecap="round"/><text x="52" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="start" style="">DISTRIBUTED SYSTEMS  /  VERIFICATION &amp; TESTING</text><text x="1148" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="end" style="">DIAGRAM 18-38</text></svg>