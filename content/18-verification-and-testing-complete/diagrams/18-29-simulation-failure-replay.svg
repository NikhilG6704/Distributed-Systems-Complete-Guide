<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title>Virtual clock and event queue</title><desc id="desc">Advance virtual time to the earliest event; deterministic tie-breaking makes event order replayable.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3778A8"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#218C86"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#C45454"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324D" flood-opacity="0.09"/></filter>
</defs>
<rect width="1200" height="700" fill="#FFFFFF"/>
<rect x="0" y="0" width="1200" height="9" fill="#218C86"/>
<text x="52" y="58" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" style="">Virtual clock and event queue</text><text x="52" y="88" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" style="">Advance virtual time to the earliest event; deterministic tie-breaking makes event order replayable.</text><line x1="52" y1="108" x2="1148" y2="108" stroke="#DCE5EC" stroke-width="1.2" stroke-linecap="round"/><rect x="90" y="290" width="210" height="110" rx="14" fill="#17324D" stroke="#17324D" stroke-width="1.5" filter="url(#shadow)"/><text x="195.0" y="317" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">Virtual clock</text><text x="195.0" y="339" fill="#E2EDF5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle"><tspan x="195.0" dy="0">now = 12.4 s</tspan></text><rect x="410" y="180" width="390" height="300" rx="14" fill="#F0EDF7" stroke="#7963A8" stroke-width="1.5" filter="url(#shadow)"/><text x="605.0" y="207" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" style="">Priority queue</text><text x="605.0" y="229" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle"><tspan x="605.0" dy="0">12.5  deliver(msg 7)</tspan><tspan x="605.0" dy="18">12.7  expire(lease)</tspan><tspan x="605.0" dy="18">13.0  heartbeat</tspan><tspan x="605.0" dy="18">13.0  retry(timer)</tspan></text><rect x="900" y="290" width="220" height="110" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="1010.0" y="317" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">Event handler</text><text x="1010.0" y="339" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="1010.0" dy="0">advance • execute</tspan><tspan x="1010.0" dy="16">schedule successors</tspan></text><line x1="300" y1="345" x2="405" y2="345" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="800" y1="345" x2="895" y2="345" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><path d="M1010 405 V535 H190 V405" fill="none" stroke="#D28B2C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="555" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle" style="">Pop earliest event → advance virtual time → execute → enqueue new events</text><rect x="450" y="590" width="300" height="28" rx="14" fill="#E8F1F8" stroke="#3778A8" stroke-width="1"/><text x="600.0" y="609" fill="#3778A8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" text-anchor="middle" style="">Tie-break by stable event ID</text><line x1="52" y1="654" x2="1148" y2="654" stroke="#E4EBF0" stroke-width="1" stroke-linecap="round"/><text x="52" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="start" style="">DISTRIBUTED SYSTEMS  /  VERIFICATION &amp; TESTING</text><text x="1148" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="end" style="">DIAGRAM 18-27</text></svg>