rect x="720" y="160" width="220" height="90" rx="14" fill="#F0EDF7" stroke="#7963A8" stroke-width="1.5" filter="url(#shadow)"/><text x="830.0" y="187" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Replica C</text><text x="830.0" y="209" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="830.0" dy="0">read / write quorum</tspan></text><rect x="980" y="285" width="180" height="100" rx="14" fill="#FBF2E4" stroke="#D28B2C" stroke-width="1.5" filter="url(#shadow)"/><text x="1070.0" y="312" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" style="">History checker</text><text x="1070.0" y="334" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="1070.0" dy="0">stale read?</tspan><tspan x="1070.0" dy="16">linearizable?</tspan></text><line x1="275" y1="310" x2="370" y2="205" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="275" y1="330" x2="370" y2="405" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="595" y1="205" x2="715" y2="205" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="595" y1="405" x2="715" y2="250" stroke="#7963A8" stroke-width="2" stroke-linecap="round"/><line x1="940" y1="205" x2="975" y2="315" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="940" y1="405" x2="975" y2="355" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M480 255 V320" fill="none" stroke="#C45454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#arrow-red)"/><text x="510" y="295" fill="#C45454" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="start" style="">partition / stale replica</text><rect x="360" y="525" width="500" height="74" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="610.0" y="552" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Heal + anti-entropy</text><text x="610.0" y="574" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="610.0" dy="0">compare versions • repair divergence • verify convergence</tspan></text><line x1="52" y1="654" x2="1148" y2="654" stroke="#E4EBF0" stroke-width="1" stroke-linecap="round"/><text x="52" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="start" style="">DISTRIBUTED SYSTEMS  /  VERIFICATION &amp; TESTING</text><text x="1148" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="end" style="">DIAGRAM 18-35</text></svg>