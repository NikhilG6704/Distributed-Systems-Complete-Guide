<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title>Concurrent operation history</title><desc id="desc">Invocation and completion intervals constrain which sequential histories can explain observed results.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3778A8"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#218C86"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#C45454"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324D" flood-opacity="0.09"/></filter>
</defs>
<rect width="1200" height="700" fill="#FFFFFF"/>
<rect x="0" y="0" width="1200" height="9" fill="#218C86"/>
<text x="52" y="58" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" style="">Concurrent operation history</text><text x="52" y="88" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" style="">Invocation and completion intervals constrain which sequential histories can explain observed results.</text><line x1="52" y1="108" x2="1148" y2="108" stroke="#DCE5EC" stroke-width="1.2" stroke-linecap="round"/><text x="90" y="235" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" style="">Client A</text><line x1="180" y1="230" x2="1090" y2="230" stroke="#C9D5DE" stroke-width="1.5" stroke-linecap="round"/><text x="90" y="370" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" style="">Client B</text><line x1="180" y1="365" x2="1090" y2="365" stroke="#C9D5DE" stroke-width="1.5" stroke-linecap="round"/><text x="90" y="505" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" style="">Client C</text><line x1="180" y1="500" x2="1090" y2="500" stroke="#C9D5DE" stroke-width="1.5" stroke-linecap="round"/><line x1="260" y1="230" x2="500" y2="230" stroke="#3778A8" stroke-width="8" stroke-linecap="round"/><circle cx="260" cy="230" r="7" fill="#3778A8" stroke="#3778A8" stroke-width="1.5"/><circle cx="500" cy="230" r="7" fill="#3778A8" stroke="#3778A8" stroke-width="1.5"/><text x="380.0" y="214" fill="#3778A8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" text-anchor="middle" style="">write(x=1)</text><line x1="350" y1="365" x2="690" y2="365" stroke="#218C86" stroke-width="8" stroke-linecap="round"/><circle cx="350" cy="365" r="7" fill="#218C86" stroke="#218C86" stroke-width="1.5"/><circle cx="690" cy="365" r="7" fill="#218C86" stroke="#218C86" stroke-width="1.5"/><text x="520.0" y="349" fill="#218C86" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" text-anchor="middle" style="">read(x)</text><line x1="560" y1="500" x2="890" y2="500" stroke="#7963A8" stroke-width="8" stroke-linecap="round"/><circle cx="560" cy="500" r="7" fill="#7963A8" stroke="#7963A8" stroke-width="1.5"/><circle cx="890" cy="500" r="7" fill="#7963A8" stroke="#7963A8" stroke-width="1.5"/><text x="725.0" y="484" fill="#7963A8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" text-anchor="middle" style="">write(x=2)</text><line x1="250" y1="205" x2="250" y2="560" stroke="#5E7184" stroke-width="1" stroke-linecap="round" stroke-dasharray="5 5"/><line x1="900" y1="205" x2="900" y2="560" stroke="#5E7184" stroke-width="1" stroke-linecap="round" stroke-dasharray="5 5"/><text x="250" y="185" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle" style="">invoke</text><text x="900" y="185" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle" style="">response / pending</text><path d="M480 290 C520 300 540 325 570 345" fill="none" stroke="#D28B2C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="640" y="610" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" style="">Overlapping intervals may be reordered; non-overlapping operations must preserve real-time order.</text><line x1="52" y1="654" x2="1148" y2="654" stroke="#E4EBF0" stroke-width="1" stroke-linecap="round"/><text x="52" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="start" style="">DISTRIBUTED SYSTEMS  /  VERIFICATION &amp; TESTING</text><text x="1148" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="end" style="">DIAGRAM 18-21</text></svg>