<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title>Distributed lock with lease and fencing</title><desc id="desc">A lease can expire while a former holder is paused; the resource must reject stale fencing tokens.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3778A8"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#218C86"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#C45454"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324D" flood-opacity="0.09"/></filter>
</defs>
<rect width="1200" height="700" fill="#FFFFFF"/>
<rect x="0" y="0" width="1200" height="9" fill="#218C86"/>
<text x="52" y="58" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" style="">Distributed lock with lease and fencing</text><text x="52" y="88" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" style="">A lease can expire while a former holder is paused; the resource must reject stale fencing tokens.</text><line x1="52" y1="108" x2="1148" y2="108" stroke="#DCE5EC" stroke-width="1.2" stroke-linecap="round"/><rect x="80" y="200" width="190" height="78" rx="14" fill="#E8F1F8" stroke="#3778A8" stroke-width="1.5" filter="url(#shadow)"/><text x="175.0" y="227" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Client A</text><text x="175.0" y="249" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="175.0" dy="0">acquire → token 41</tspan></text><rect x="80" y="450" width="190" height="78" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="175.0" y="477" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Client B</text><text x="175.0" y="499" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="175.0" dy="0">acquire → token 42</tspan></text><rect x="455" y="300" width="250" height="118" rx="14" fill="#F0EDF7" stroke="#7963A8" stroke-width="1.5" filter="url(#shadow)"/><text x="580.0" y="327" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">Lock service</text><text x="580.0" y="349" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="580.0" dy="0">lease owner + expiry</tspan><tspan x="580.0" dy="16">monotonic token counter</tspan></text><rect x="875" y="300" width="250" height="118" rx="14" fill="#17324D" stroke="#17324D" stroke-width="1.5" filter="url(#shadow)"/><text x="1000.0" y="327" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">Protected resource</text><text x="1000.0" y="349" fill="#E2EDF5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="1000.0" dy="0">accept token &gt; last seen</tspan><tspan x="1000.0" dy="16">reject stale token</tspan></text><line x1="270" y1="240" x2="450" y2="330" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="270" y1="490" x2="450" y2="390" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="705" y1="360" x2="870" y2="360" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><text x="790" y="340" fill="#218C86" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" style="">fencing token</text><path d="M170 280 C300 360 310 425 455 410" fill="none" stroke="#C45454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/><text x="300" y="420" fill="#C45454" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" text-anchor="middle" style="">delayed write: token 41</text><rect x="875" y="455" width="250" height="28" rx="14" fill="#F9EBEB" stroke="#C45454" stroke-width="1"/><text x="1000.0" y="474" fill="#C45454" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" text-anchor="middle" style="">reject token 41 after 42</text><text x="600" y="585" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" style="">Lease expiry alone does not stop a paused former holder from sending a delayed request.</text><line x1="52" y1="654" x2="1148" y2="654" stroke="#E4EBF0" stroke-width="1" stroke-linecap="round"/><text x="52" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="start" style="">DISTRIBUTED SYSTEMS  /  VERIFICATION &amp; TESTING</text><text x="1148" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="end" style="">DIAGRAM 18-16</text></svg>