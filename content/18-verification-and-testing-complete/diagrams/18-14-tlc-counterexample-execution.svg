<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title>Reading a TLC counterexample</title><desc id="desc">Follow the trace from Init and identify the first transition that violates the checked invariant.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3778A8"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#218C86"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#C45454"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324D" flood-opacity="0.09"/></filter>
</defs>
<rect width="1200" height="700" fill="#FFFFFF"/>
<rect x="0" y="0" width="1200" height="9" fill="#218C86"/>
<text x="52" y="58" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" style="">Reading a TLC counterexample</text><text x="52" y="88" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" style="">Follow the trace from Init and identify the first transition that violates the checked invariant.</text><line x1="52" y1="108" x2="1148" y2="108" stroke="#DCE5EC" stroke-width="1.2" stroke-linecap="round"/><rect x="48" y="290" width="184" height="104" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="140.0" y="317" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" style="">S0</text><text x="140.0" y="339" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="140.0" dy="0">Init: valid</tspan></text><rect x="333" y="290" width="184" height="104" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="425.0" y="317" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" style="">S1</text><text x="425.0" y="339" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="425.0" dy="0">one owner</tspan></text><line x1="235" y1="342" x2="327" y2="342" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="618" y="290" width="184" height="104" rx="14" fill="#FBF2E4" stroke="#D28B2C" stroke-width="1.5" filter="url(#shadow)"/><text x="710.0" y="317" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" style="">S2</text><text x="710.0" y="339" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="710.0" dy="0">stale lease</tspan></text><line x1="520" y1="342" x2="612" y2="342" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="903" y="290" width="184" height="104" rx="14" fill="#F9EBEB" stroke="#C45454" stroke-width="1.5" filter="url(#shadow)"/><text x="995.0" y="317" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" style="">S3</text><text x="995.0" y="339" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="995.0" dy="0">two owners</tspan></text><line x1="805" y1="342" x2="897" y2="342" stroke="#C45454" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-red)"/><text x="282" y="270" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle" style="">acquire</text><text x="567" y="270" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle" style="">pause / expiry</text><text x="852" y="270" fill="#C45454" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle" style="">stale write accepted</text><rect x="905" y="430" width="180" height="28" rx="14" fill="#F9EBEB" stroke="#C45454" stroke-width="1"/><text x="995.0" y="449" fill="#C45454" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" text-anchor="middle" style="">Invariant violated</text><text x="600" y="520" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="middle" style="">Debug from the first changed variable and transition; later states may only be consequences.</text><line x1="52" y1="654" x2="1148" y2="654" stroke="#E4EBF0" stroke-width="1" stroke-linecap="round"/><text x="52" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="start" style="">DISTRIBUTED SYSTEMS  /  VERIFICATION &amp; TESTING</text><text x="1148" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="end" style="">DIAGRAM 18-14</text></svg>