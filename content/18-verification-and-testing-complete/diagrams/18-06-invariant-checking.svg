<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title>Invariant checking</title><desc id="desc">Prove initialization and inductive preservation; a failed obligation produces a counterexample trace.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3778A8"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#218C86"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#C45454"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324D" flood-opacity="0.09"/></filter>
</defs>
<rect width="1200" height="700" fill="#FFFFFF"/>
<rect x="0" y="0" width="1200" height="9" fill="#218C86"/>
<text x="52" y="58" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" style="">Invariant checking</text><text x="52" y="88" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" style="">Prove initialization and inductive preservation; a failed obligation produces a counterexample trace.</text><line x1="52" y1="108" x2="1148" y2="108" stroke="#DCE5EC" stroke-width="1.2" stroke-linecap="round"/><rect x="70" y="300" width="205" height="126" rx="14" fill="#E8F1F8" stroke="#3778A8" stroke-width="1.5" filter="url(#shadow)"/><text x="172.5" y="327" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">1. Initialize</text><text x="172.5" y="349" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="172.5" dy="0">Init ⇒ invariant</tspan></text><rect x="330" y="300" width="205" height="126" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="432.5" y="327" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">2. Transition</text><text x="432.5" y="349" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="432.5" dy="0">Next-state relation</tspan></text><line x1="280" y1="363.0" x2="323" y2="363.0" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><rect x="590" y="300" width="205" height="126" rx="14" fill="#F0EDF7" stroke="#7963A8" stroke-width="1.5" filter="url(#shadow)"/><text x="692.5" y="327" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">3. Preserve</text><text x="692.5" y="349" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="692.5" dy="0">Inv(s) ∧ Next</tspan><tspan x="692.5" dy="15">⇒ Inv(s′)</tspan></text><line x1="540" y1="363.0" x2="583" y2="363.0" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="850" y="300" width="205" height="126" rx="14" fill="#FBF2E4" stroke="#D28B2C" stroke-width="1.5" filter="url(#shadow)"/><text x="952.5" y="327" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">4. Check</text><text x="952.5" y="349" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle"><tspan x="952.5" dy="0">TLC / assertions</tspan></text><line x1="800" y1="363.0" x2="843" y2="363.0" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><path d="M930 430 V500 H600" fill="none" stroke="#C45454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><rect x="390" y="500" width="420" height="86" rx="14" fill="#F9EBEB" stroke="#C45454" stroke-width="1.5" filter="url(#shadow)"/><text x="600.0" y="527" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">Counterexample trace</text><text x="600.0" y="549" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="600.0" dy="0">First state or transition that violates the property</tspan></text><text x="600" y="600" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" style="">Inductive invariant: true initially and preserved by every allowed transition</text><line x1="52" y1="654" x2="1148" y2="654" stroke="#E4EBF0" stroke-width="1" stroke-linecap="round"/><text x="52" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="start" style="">DISTRIBUTED SYSTEMS  /  VERIFICATION &amp; TESTING</text><text x="1148" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="end" style="">DIAGRAM 18-06</text></svg>