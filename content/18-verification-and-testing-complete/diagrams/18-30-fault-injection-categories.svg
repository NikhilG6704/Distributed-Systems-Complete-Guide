<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title>Deterministic simulation execution</title><desc id="desc">A fixed seed and complete control of scheduling, time, delivery, and randomness produce repeatable traces.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3778A8"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#218C86"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#C45454"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324D" flood-opacity="0.09"/></filter>
</defs>
<rect width="1200" height="700" fill="#FFFFFF"/>
<rect x="0" y="0" width="1200" height="9" fill="#218C86"/>
<text x="52" y="58" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" style="">Deterministic simulation execution</text><text x="52" y="88" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" style="">A fixed seed and complete control of scheduling, time, delivery, and randomness produce repeatable traces.</text><line x1="52" y1="108" x2="1148" y2="108" stroke="#DCE5EC" stroke-width="1.2" stroke-linecap="round"/><rect x="90" y="225" width="200" height="110" rx="14" fill="#F0EDF7" stroke="#7963A8" stroke-width="1.5" filter="url(#shadow)"/><text x="190.0" y="252" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">Seed + config</text><text x="190.0" y="274" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle"><tspan x="190.0" dy="0">seed = 0x51A7</tspan><tspan x="190.0" dy="18">fault schedule</tspan></text><rect x="385" y="225" width="210" height="110" rx="14" fill="#E8F1F8" stroke="#3778A8" stroke-width="1.5" filter="url(#shadow)"/><text x="490.0" y="252" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">Scheduler</text><text x="490.0" y="274" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle"><tspan x="490.0" dy="0">deterministic order</tspan><tspan x="490.0" dy="18">virtual time</tspan></text><rect x="690" y="165" width="220" height="90" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="800.0" y="192" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Nodes + protocol</text><text x="800.0" y="214" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="800.0" dy="0">same inputs</tspan></text><rect x="690" y="300" width="220" height="90" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="800.0" y="327" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Network + storage</text><text x="800.0" y="349" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="800.0" dy="0">controlled delivery</tspan></text><rect x="980" y="225" width="170" height="110" rx="14" fill="#FBF2E4" stroke="#D28B2C" stroke-width="1.5" filter="url(#shadow)"/><text x="1065.0" y="252" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Trace + checks</text><text x="1065.0" y="274" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="1065.0" dy="0">repeatable</tspan><tspan x="1065.0" dy="16">result</tspan></text><line x1="290" y1="280" x2="380" y2="280" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="595" y1="270" x2="685" y2="210" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="595" y1="290" x2="685" y2="345" stroke="#218C86" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="910" y1="210" x2="975" y2="270" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="910" y1="345" x2="975" y2="300" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="380" y="470" width="440" height="88" rx="14" fill="#FFFFFF" stroke="#B8C8D5" stroke-width="1.5" filter="url(#shadow)"/><text x="600.0" y="497" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">Same seed + same configuration</text><text x="600.0" y="519" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle"><tspan x="600.0" dy="0">same event ordering and failure point</tspan></text><text x="600" y="600" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" style="">Completeness matters: control randomness, scheduling, timers, network delivery, and external inputs.</text><line x1="52" y1="654" x2="1148" y2="654" stroke="#E4EBF0" stroke-width="1" stroke-linecap="round"/><text x="52" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="start" style="">DISTRIBUTED SYSTEMS  /  VERIFICATION &amp; TESTING</text><text x="1148" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="end" style="">DIAGRAM 18-28</text></svg>