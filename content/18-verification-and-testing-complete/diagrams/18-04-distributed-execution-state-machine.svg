<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title>Distributed execution state machine</title><desc id="desc">Independent local transitions and message delivery create many valid event interleavings.</desc>
