<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title>Jepsen nemesis and fault injection</title><desc id="desc">The nemesis perturbs the live system and records when faults begin and end; healing is a separate phase.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3778A8"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#218C86"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#C45454"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17324D" flood-opacity="0.09"/></filter>
</defs>
<rect width="1200" height="700" fill="#FFFFFF"/>
<rect x="0" y="0" width="1200" height="9" fill="#218C86"/>
<text x="52" y="58" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" style="">Jepsen nemesis and fault injection</text><text x="52" y="88" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" style="">The nemesis perturbs the live system and records when faults begin and end; healing is a separate phase.</text><line x1="52" y1="108" x2="1148" y2="108" stroke="#DCE5EC" stroke-width="1.2" stroke-linecap="round"/><rect x="70" y="280" width="210" height="95" rx="14" fill="#F9EBEB" stroke="#C45454" stroke-width="1.5" filter="url(#shadow)"/><text x="175.0" y="307" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" style="">Nemesis controller</text><text x="175.0" y="329" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="175.0" dy="0">schedule fault + heal</tspan></text><rect x="470" y="155" width="250" height="82" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="595.0" y="182" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Node A</text><text x="595.0" y="204" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="595.0" dy="0">running</tspan></text><rect x="470" y="310" width="250" height="82" rx="14" fill="#F9EBEB" stroke="#C45454" stroke-width="1.5" filter="url(#shadow)"/><text x="595.0" y="337" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Node B</text><text x="595.0" y="359" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="595.0" dy="0">paused / killed</tspan></text><rect x="470" y="465" width="250" height="82" rx="14" fill="#E7F4F2" stroke="#218C86" stroke-width="1.5" filter="url(#shadow)"/><text x="595.0" y="492" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Node C</text><text x="595.0" y="514" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="595.0" dy="0">reachable</tspan></text><rect x="900" y="280" width="230" height="95" rx="14" fill="#F0EDF7" stroke="#7963A8" stroke-width="1.5" filter="url(#shadow)"/><text x="1015.0" y="307" fill="#17324D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" style="">Event recorder</text><text x="1015.0" y="329" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="1015.0" dy="0">fault start / end</tspan><tspan x="1015.0" dy="16">target + duration</tspan></text><line x1="280" y1="325" x2="465" y2="195" stroke="#C45454" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-red)"/><line x1="280" y1="328" x2="465" y2="350" stroke="#C45454" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-red)"/><line x1="280" y1="335" x2="465" y2="505" stroke="#C45454" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-red)"/><line x1="720" y1="195" x2="895" y2="310" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="720" y1="350" x2="895" y2="325" stroke="#C45454" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-red)"/><line x1="720" y1="505" x2="895" y2="350" stroke="#3778A8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M570 260 H640" fill="none" stroke="#C45454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="605" y="250" fill="#C45454" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" text-anchor="middle" style="">blocked</text><text x="600" y="595" fill="#5E7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="middle" style="">Fault injection is an input. The checker must separately establish whether behavior stayed correct.</text><line x1="52" y1="654" x2="1148" y2="654" stroke="#E4EBF0" stroke-width="1" stroke-linecap="round"/><text x="52" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="start" style="">DISTRIBUTED SYSTEMS  /  VERIFICATION &amp; TESTING</text><text x="1148" y="678" fill="#8192A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="end" style="">DIAGRAM 18-20</text></svg>