<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Single-leader replication">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2F6FED"/></marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0F9D8A"/></marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D88A18"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D84B4B"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7957C8"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#27845B"/></marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7A8CA5"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1B3555" flood-opacity="0.10"/></filter>
  </defs>
<rect x="0" y="0" width="1600" height="900" rx="18" fill="#F4F7FB"/>
<text x="64" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#172B4D" text-anchor="start">Single-leader replication</text>
<text x="66" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5E718B" text-anchor="start">One write authority emits an ordered log; followers may lag by different amounts</text>
<line x1="64" y1="137" x2="1536" y2="137" stroke="#CCD6E3" stroke-width="2" stroke-linecap="round" opacity="1"/>
<rect x="600" y="185" width="400" height="150" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="600" y="185" width="9" height="150" rx="5" fill="#2F6FED"/>
<text x="628" y="223" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">LEADER · epoch 12</text>
<text x="628" y="253" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="628" dy="0">Accepts and orders writes</tspan>
<tspan x="628" dy="22">WAL: e101 → e102 → e103</tspan>
</text>
<rect x="823" y="199" width="163" height="29" rx="14" fill="#EAF1FF"/>
<text x="904.5" y="219" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#2F6FED" text-anchor="middle">WRITE AUTHORITY</text>
<rect x="180" y="500" width="430" height="150" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="180" y="500" width="9" height="150" rx="5" fill="#0F9D8A"/>
<text x="208" y="538" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">FOLLOWER A</text>
<text x="208" y="568" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="208" dy="0">Received through e103</tspan>
<tspan x="208" dy="22">Applied through e103</tspan>
</text>
<rect x="487" y="514" width="109" height="29" rx="14" fill="#E5F6F2"/>
<text x="541.5" y="534" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0F9D8A" text-anchor="middle">CAUGHT UP</text>
<rect x="990" y="500" width="430" height="150" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="990" y="500" width="9" height="150" rx="5" fill="#D88A18"/>
<text x="1018" y="538" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">FOLLOWER B</text>
<text x="1018" y="568" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="1018" dy="0">Received through e102</tspan>
<tspan x="1018" dy="22">Applied through e101</tspan>
</text>
<rect x="1315" y="514" width="91" height="29" rx="14" fill="#FFF4DE"/>
<text x="1360.5" y="534" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#D88A18" text-anchor="middle">LAGGING</text>
<line x1="730" y1="340" x2="425" y2="495" stroke="#2F6FED" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="10 8" marker-end="url(#arrow-blue)"/>
<text x="577.5" y="409.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2F6FED" text-anchor="middle">ordered log stream</text>
<line x1="870" y1="340" x2="1190" y2="495" stroke="#2F6FED" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="10 8" marker-end="url(#arrow-blue)"/>
<text x="1030.0" y="409.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2F6FED" text-anchor="middle">ordered log stream</text>
<rect x="70" y="200" width="300" height="125" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="70" y="200" width="9" height="125" rx="5" fill="#2F6FED"/>
<text x="98" y="238" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Client writes</text>
<text x="98" y="268" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="98" dy="0">All writes route to leader</tspan>
</text>
<line x1="370" y1="260" x2="590" y2="260" stroke="#2F6FED" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow-blue)"/>
<text x="480.0" y="246.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2F6FED" text-anchor="middle">write request</text>
<rect x="1230" y="205" width="300" height="125" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="1230" y="205" width="9" height="125" rx="5" fill="#7A8CA5"/>
<text x="1258" y="243" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Client reads</text>
<text x="1258" y="273" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="1258" dy="0">Leader = current state</tspan>
<tspan x="1258" dy="22">Follower = possibly stale</tspan>
</text>
<line x1="1225" y1="275" x2="1000" y2="275" stroke="#7A8CA5" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow-slate)"/>
<text x="1112.5" y="261.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7A8CA5" text-anchor="middle">leader read</text>
<line x1="1235" y1="325" x2="1210" y2="500" stroke="#D88A18" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="8 7" marker-end="url(#arrow-amber)"/>
<text x="1222.5" y="404.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#D88A18" text-anchor="middle">follower read</text>
<rect x="550" y="700" width="500" height="34" rx="17" fill="#FDECEC"/>
<text x="800.0" y="723" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#D84B4B" text-anchor="middle">Promotion requires election / fencing</text>
<line x1="64" y1="850" x2="1536" y2="850" stroke="#CCD6E3" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="66" y="878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E718B" text-anchor="start">A follower is not safe to promote merely because it is reachable; leadership must be exclusive and history selection must be defined.</text>
</svg>