<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Replication lag timeline">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2F6FED"/></marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0F9D8A"/></marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D88A18"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D84B4B"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7957C8"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#27845B"/></marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7A8CA5"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1B3555" flood-opacity="0.10"/></filter>
  </defs>
<rect x="0" y="0" width="1600" height="900" rx="18" fill="#F4F7FB"/>
<text x="64" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#172B4D" text-anchor="start">Replication lag timeline</text>
<text x="66" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5E718B" text-anchor="start">Leader commits progress faster than a follower can receive, flush, and apply the log</text>
<line x1="64" y1="137" x2="1536" y2="137" stroke="#CCD6E3" stroke-width="2" stroke-linecap="round" opacity="1"/>
<rect x="75" y="180" width="1450" height="600" rx="20" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5"/>
<text x="99" y="218" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#2F6FED" text-anchor="start">LOG POSITION OVER TIME</text>
<text x="145" y="260" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#2F6FED" text-anchor="start">Leader committed</text>
<text x="145" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0F9D8A" text-anchor="start">Follower received</text>
<text x="145" y="580" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#D88A18" text-anchor="start">Follower applied</text>
<line x1="300" y1="305" x2="1370" y2="305" stroke="blue" stroke-width="18" stroke-linecap="round" opacity="0.75"/>
<circle cx="1370" cy="305" r="12" fill="blue"/>
<text x="1395" y="311" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="blue" text-anchor="start">LSN 1200</text>
<line x1="300" y1="465" x2="1050" y2="465" stroke="teal" stroke-width="18" stroke-linecap="round" opacity="0.75"/>
<circle cx="1050" cy="465" r="12" fill="teal"/>
<text x="1075" y="471" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="teal" text-anchor="start">LSN 1120</text>
<line x1="300" y1="625" x2="860" y2="625" stroke="amber" stroke-width="18" stroke-linecap="round" opacity="0.75"/>
<circle cx="860" cy="625" r="12" fill="amber"/>
<text x="885" y="631" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="amber" text-anchor="start">LSN 1080</text>
<line x1="1050" y1="335" x2="1050" y2="445" stroke="#D84B4B" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 6"/>
<text x="1070" y="395" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#D84B4B" text-anchor="start">Receive lag</text>
<line x1="860" y1="495" x2="860" y2="605" stroke="#D84B4B" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 6"/>
<text x="880" y="555" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#D84B4B" text-anchor="start">Apply lag</text>
<rect x="1080" y="675" width="350" height="75" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="1080" y="675" width="9" height="75" rx="5" fill="#7957C8"/>
<text x="1108" y="713" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Lag is multi-stage</text>
<text x="1108" y="743" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="1108" dy="0">network + flush + apply backlog</tspan>
</text>
<line x1="64" y1="850" x2="1536" y2="850" stroke="#CCD6E3" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="66" y="878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E718B" text-anchor="start">Compare positions within the same log / timeline; time-based lag is sensitive to clock skew and commit timestamp semantics.</text>
</svg>