<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Split-brain during a network partition">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2F6FED"/></marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0F9D8A"/></marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D88A18"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D84B4B"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7957C8"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#27845B"/></marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7A8CA5"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1B3555" flood-opacity="0.10"/></filter>
  </defs>
<rect x="0" y="0" width="1600" height="900" rx="18" fill="#F4F7FB"/>
<text x="64" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#172B4D" text-anchor="start">Split-brain during a network partition</text>
<text x="66" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5E718B" text-anchor="start">If both sides can accept writes, two independent primaries create divergent histories</text>
<line x1="64" y1="137" x2="1536" y2="137" stroke="#CCD6E3" stroke-width="2" stroke-linecap="round" opacity="1"/>
<rect x="70" y="180" width="1460" height="570" rx="20" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5"/>
<text x="94" y="218" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#D84B4B" text-anchor="start">Network partition divides a three-node group</text>
<rect x="170" y="300" width="330" height="145" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="170" y="300" width="9" height="145" rx="5" fill="#D84B4B"/>
<text x="198" y="338" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Node A</text>
<text x="198" y="368" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="198" dy="0">Believes it is PRIMARY</tspan>
<tspan x="198" dy="22">Accepts write x = 10</tspan>
</text>
<rect x="341" y="314" width="145" height="29" rx="14" fill="#FDECEC"/>
<text x="413.5" y="334" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#D84B4B" text-anchor="middle">UNSAFE LEADER</text>
<rect x="170" y="560" width="330" height="125" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="170" y="560" width="9" height="125" rx="5" fill="#2F6FED"/>
<text x="198" y="598" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Node B</text>
<text x="198" y="628" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="198" dy="0">Follows A / same partition</tspan>
</text>
<rect x="1070" y="420" width="330" height="145" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="1070" y="420" width="9" height="145" rx="5" fill="#D84B4B"/>
<text x="1098" y="458" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Node C</text>
<text x="1098" y="488" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="1098" dy="0">Mistakenly promoted</tspan>
<tspan x="1098" dy="22">Accepts write x = 20</tspan>
</text>
<rect x="1241" y="434" width="145" height="29" rx="14" fill="#FDECEC"/>
<text x="1313.5" y="454" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#D84B4B" text-anchor="middle">UNSAFE LEADER</text>
<path d="M 530 245 V 700" fill="none" stroke="#D84B4B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 10"/>
<text x="555" y="275" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="750" fill="#D84B4B" text-anchor="start">NETWORK PARTITION</text>
<line x1="500" y1="370" x2="770" y2="420" stroke="#D84B4B" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="9 8"/>
<line x1="810" y1="428" x2="1060" y2="470" stroke="#D84B4B" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="9 8"/>
<line x1="500" y1="615" x2="770" y2="540" stroke="#D84B4B" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="9 8"/>
<line x1="810" y1="532" x2="1060" y2="510" stroke="#D84B4B" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="9 8"/>
<text x="790" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800" fill="#D84B4B" text-anchor="middle">×</text>
<text x="790" y="548" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800" fill="#D84B4B" text-anchor="middle">×</text>
<rect x="630" y="705" width="360" height="34" rx="17" fill="#FDECEC"/>
<text x="810.0" y="728" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#D84B4B" text-anchor="middle">Two leaders · divergent histories</text>
<line x1="64" y1="850" x2="1536" y2="850" stroke="#CCD6E3" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="66" y="878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E718B" text-anchor="start">A safe majority-based protocol refuses promotion without quorum; single-node reachability is not evidence of exclusive leadership.</text>
</svg>