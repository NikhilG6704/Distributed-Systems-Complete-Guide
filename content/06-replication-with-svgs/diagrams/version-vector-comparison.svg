<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Version-vector comparison">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2F6FED"/></marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0F9D8A"/></marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D88A18"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D84B4B"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7957C8"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#27845B"/></marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7A8CA5"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1B3555" flood-opacity="0.10"/></filter>
  </defs>
<rect x="0" y="0" width="1600" height="900" rx="18" fill="#F4F7FB"/>
<text x="64" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#172B4D" text-anchor="start">Version-vector comparison</text>
<text x="66" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5E718B" text-anchor="start">Component-wise comparison distinguishes happens-before from concurrent histories</text>
<line x1="64" y1="137" x2="1536" y2="137" stroke="#CCD6E3" stroke-width="2" stroke-linecap="round" opacity="1"/>
<rect x="80" y="180" width="1440" height="570" rx="20" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5"/>
<text x="104" y="218" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#7957C8" text-anchor="start">Three components · replicas A, B, C</text>
<rect x="150" y="260" width="420" height="100" rx="16" fill="#EAF1FF"/>
<text x="360" y="303" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="750" fill="#2F6FED" text-anchor="middle">v1 = [2,1,0]</text>
<text x="360" y="334" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="middle">A has two events; B has one</text>
<text x="800" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#D84B4B" text-anchor="middle">↕</text>
<text x="1030" y="318" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#D84B4B" text-anchor="middle">Neither dominates</text>
<rect x="150" y="405" width="420" height="100" rx="16" fill="#E5F6F2"/>
<text x="360" y="448" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="750" fill="#0F9D8A" text-anchor="middle">v2 = [1,2,0]</text>
<text x="360" y="479" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="middle">B has two events; A has one</text>
<text x="800" y="465" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#D84B4B" text-anchor="middle">↕</text>
<text x="1030" y="463" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#D84B4B" text-anchor="middle">Neither dominates</text>
<rect x="150" y="550" width="420" height="100" rx="16" fill="#E8F5ED"/>
<text x="360" y="593" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="750" fill="#27845B" text-anchor="middle">merged = [2,2,0]</text>
<text x="360" y="624" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="middle">Component-wise maximum</text>
<text x="1030" y="608" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#27845B" text-anchor="middle">Join / merge</text>
<text x="800" y="700" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="750" fill="#7957C8" text-anchor="middle">v1 ∥ v2  →  concurrent</text>
<line x1="64" y1="850" x2="1536" y2="850" stroke="#CCD6E3" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="66" y="878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E718B" text-anchor="start">x ≤ y iff every component of x is ≤ the corresponding component of y; strict inequality in at least one component means causal precedence.</text>
</svg>