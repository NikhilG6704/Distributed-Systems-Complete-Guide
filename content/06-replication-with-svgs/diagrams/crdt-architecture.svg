<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="CRDT replication architecture">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2F6FED"/></marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0F9D8A"/></marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D88A18"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D84B4B"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7957C8"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#27845B"/></marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7A8CA5"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1B3555" flood-opacity="0.10"/></filter>
  </defs>
<rect x="0" y="0" width="1600" height="900" rx="18" fill="#F4F7FB"/>
<text x="64" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#172B4D" text-anchor="start">CRDT replication architecture</text>
<text x="66" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5E718B" text-anchor="start">Replicas merge state or exchange operations under CRDT-specific delivery and algebraic assumptions</text>
<line x1="64" y1="137" x2="1536" y2="137" stroke="#CCD6E3" stroke-width="2" stroke-linecap="round" opacity="1"/>
<rect x="80" y="360" width="300" height="150" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="80" y="360" width="9" height="150" rx="5" fill="#2F6FED"/>
<text x="108" y="398" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Client operations</text>
<text x="108" y="428" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="108" dy="0">Increment / add / remove</tspan>
<tspan x="108" dy="22">Local low-latency update</tspan>
</text>
<rect x="520" y="205" width="350" height="170" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="520" y="205" width="9" height="170" rx="5" fill="#0F9D8A"/>
<text x="548" y="243" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Replica A</text>
<text x="548" y="273" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="548" dy="0">CRDT state + causal metadata</tspan>
<tspan x="548" dy="22">Local operations</tspan>
</text>
<rect x="520" y="535" width="350" height="170" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="520" y="535" width="9" height="170" rx="5" fill="#7957C8"/>
<text x="548" y="573" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Replica B</text>
<text x="548" y="603" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="548" dy="0">CRDT state + causal metadata</tspan>
<tspan x="548" dy="22">Local operations</tspan>
</text>
<rect x="1120" y="360" width="380" height="150" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="1120" y="360" width="9" height="150" rx="5" fill="#27845B"/>
<text x="1148" y="398" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Converged logical value</text>
<text x="1148" y="428" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="1148" dy="0">State merge (CvRDT)</tspan>
<tspan x="1148" dy="22">or operation delivery (CmRDT)</tspan>
</text>
<line x1="380" y1="420" x2="510" y2="300" stroke="#2F6FED" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow-blue)"/>
<text x="445.0" y="348.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2F6FED" text-anchor="middle">local op</text>
<line x1="380" y1="450" x2="510" y2="600" stroke="#2F6FED" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow-blue)"/>
<text x="445.0" y="513.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2F6FED" text-anchor="middle">local op</text>
<line x1="875" y1="290" x2="1110" y2="405" stroke="#0F9D8A" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="9 7" marker-end="url(#arrow-teal)"/>
<text x="992.5" y="335.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F9D8A" text-anchor="middle">state / op exchange</text>
<line x1="875" y1="620" x2="1110" y2="475" stroke="#7957C8" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="9 7" marker-end="url(#arrow-purple)"/>
<text x="992.5" y="535.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7957C8" text-anchor="middle">state / op exchange</text>
<rect x="535" y="755" width="540" height="34" rx="17" fill="#E8F5ED"/>
<text x="805.0" y="778" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#27845B" text-anchor="middle">Merge: associative · commutative · idempotent*</text>
<line x1="64" y1="850" x2="1536" y2="850" stroke="#CCD6E3" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="66" y="878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E718B" text-anchor="start">*For state-based join CRDTs; operation-based CRDTs rely on their operation commutativity and delivery assumptions.</text>
</svg>