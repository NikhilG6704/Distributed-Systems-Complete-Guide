<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Hinted handoff workflow">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2F6FED"/></marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0F9D8A"/></marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D88A18"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D84B4B"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7957C8"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#27845B"/></marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7A8CA5"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1B3555" flood-opacity="0.10"/></filter>
  </defs>
<rect x="0" y="0" width="1600" height="900" rx="18" fill="#F4F7FB"/>
<text x="64" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#172B4D" text-anchor="start">Hinted handoff workflow</text>
<text x="66" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5E718B" text-anchor="start">A reachable node temporarily accepts a write intended for an unavailable replica</text>
<line x1="64" y1="137" x2="1536" y2="137" stroke="#CCD6E3" stroke-width="2" stroke-linecap="round" opacity="1"/>
<rect x="85" y="190" width="420" height="210" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.4" filter="url(#shadow)"/>
<circle cx="140" cy="245" r="26" fill="#2F6FED"/>
<text x="140" y="253" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="185" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Write targets A</text>
<text x="125" y="305" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="125" dy="0">Coordinator selects replica A</tspan>
</text>
<line x1="505" y1="295" x2="570" y2="295" stroke="#7A8CA5" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow-slate)"/>
<rect x="585" y="190" width="420" height="210" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.4" filter="url(#shadow)"/>
<circle cx="640" cy="245" r="26" fill="#D84B4B"/>
<text x="640" y="253" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="685" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">A is unavailable</text>
<text x="625" y="305" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="625" dy="0">No direct acknowledgment</tspan>
</text>
<line x1="1005" y1="295" x2="1070" y2="295" stroke="#7A8CA5" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow-slate)"/>
<rect x="1085" y="190" width="420" height="210" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.4" filter="url(#shadow)"/>
<circle cx="1140" cy="245" r="26" fill="#D88A18"/>
<text x="1140" y="253" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1185" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">D stores hint</text>
<text x="1125" y="305" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="1125" dy="0">Record key, payload, target A</tspan>
</text>
<rect x="85" y="475" width="420" height="210" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.4" filter="url(#shadow)"/>
<circle cx="140" cy="530" r="26" fill="#2F6FED"/>
<text x="140" y="538" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="185" y="535" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">A recovers</text>
<text x="125" y="590" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="125" dy="0">Reachability / health restored</tspan>
</text>
<line x1="505" y1="580" x2="570" y2="580" stroke="#7A8CA5" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow-slate)"/>
<rect x="585" y="475" width="420" height="210" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.4" filter="url(#shadow)"/>
<circle cx="640" cy="530" r="26" fill="#2F6FED"/>
<text x="640" y="538" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="685" y="535" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Deliver hint</text>
<text x="625" y="590" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="625" dy="0">D retries update to A</tspan>
</text>
<line x1="1005" y1="580" x2="1070" y2="580" stroke="#7A8CA5" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow-slate)"/>
<rect x="1085" y="475" width="420" height="210" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.4" filter="url(#shadow)"/>
<circle cx="1140" cy="530" r="26" fill="#2F6FED"/>
<text x="1140" y="538" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="1185" y="535" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">A catches up</text>
<text x="1125" y="590" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="1125" dy="0">A applies and acknowledges</tspan>
</text>
<line x1="64" y1="850" x2="1536" y2="850" stroke="#CCD6E3" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="66" y="878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E718B" text-anchor="start">Hints are temporary repair aids, not a substitute for anti-entropy; expiration and failed handoff can leave divergence.</text>
</svg>