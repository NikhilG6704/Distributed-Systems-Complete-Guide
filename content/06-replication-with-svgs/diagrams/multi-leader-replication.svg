<tspan x="613" dy="0">Concurrent versions may require LWW, vectors, or app logic</tspan>
</text>
<line x1="330" y1="510" x2="800" y2="635" stroke="#2F6FED" stroke-width="2" stroke-linecap="round" opacity="0.85" stroke-dasharray="6 6"/>
