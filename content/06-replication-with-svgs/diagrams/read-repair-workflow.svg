<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Read repair workflow">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2F6FED"/></marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0F9D8A"/></marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D88A18"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D84B4B"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7957C8"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#27845B"/></marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7A8CA5"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1B3555" flood-opacity="0.10"/></filter>
  </defs>
<rect x="0" y="0" width="1600" height="900" rx="18" fill="#F4F7FB"/>
<text x="64" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#172B4D" text-anchor="start">Read repair workflow</text>
<text x="66" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5E718B" text-anchor="start">A coordinator compares multiple replica responses and repairs stale copies opportunistically</text>
<line x1="64" y1="137" x2="1536" y2="137" stroke="#CCD6E3" stroke-width="2" stroke-linecap="round" opacity="1"/>
<rect x="90" y="380" width="260" height="130" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="90" y="380" width="9" height="130" rx="5" fill="#2F6FED"/>
<text x="118" y="418" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Client</text>
<text x="118" y="448" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="118" dy="0">GET customer/42</tspan>
</text>
<rect x="500" y="355" width="360" height="175" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="500" y="355" width="9" height="175" rx="5" fill="#7957C8"/>
<text x="528" y="393" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Coordinator</text>
<text x="528" y="423" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="528" dy="0">Fan out read</tspan>
<tspan x="528" dy="22">Compare versions</tspan>
<tspan x="528" dy="22">Choose according to merge policy</tspan>
</text>
<rect x="1130" y="190" width="350" height="125" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="1130" y="190" width="9" height="125" rx="5" fill="#0F9D8A"/>
<text x="1158" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Replica A</text>
<text x="1158" y="258" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="1158" dy="0">Response: v12</tspan>
<tspan x="1158" dy="22">Stored version</tspan>
</text>
<line x1="870" y1="440" x2="1120" y2="252" stroke="#0F9D8A" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="7 6" marker-end="url(#arrow-teal)"/>
<text x="995.0" y="336.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F9D8A" text-anchor="middle">read response</text>
<rect x="1130" y="415" width="350" height="125" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="1130" y="415" width="9" height="125" rx="5" fill="#D88A18"/>
<text x="1158" y="453" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Replica B</text>
<text x="1158" y="483" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="1158" dy="0">Response: v10</tspan>
<tspan x="1158" dy="22">Stored version</tspan>
</text>
<line x1="870" y1="440" x2="1120" y2="477" stroke="#D88A18" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="7 6" marker-end="url(#arrow-amber)"/>
<text x="995.0" y="448.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#D88A18" text-anchor="middle">read response</text>
<rect x="1130" y="640" width="350" height="125" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="1130" y="640" width="9" height="125" rx="5" fill="#0F9D8A"/>
<text x="1158" y="678" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Replica C</text>
<text x="1158" y="708" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="1158" dy="0">Response: v12</tspan>
<tspan x="1158" dy="22">Stored version</tspan>
</text>
<line x1="870" y1="440" x2="1120" y2="702" stroke="#0F9D8A" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="7 6" marker-end="url(#arrow-teal)"/>
<text x="995.0" y="561.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F9D8A" text-anchor="middle">read response</text>
<line x1="350" y1="440" x2="490" y2="440" stroke="#2F6FED" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow-blue)"/>
<text x="420.0" y="428.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2F6FED" text-anchor="middle">request</text>
<line x1="865" y1="555" x2="1120" y2="500" stroke="#0F9D8A" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="8 7" marker-end="url(#arrow-teal)"/>
<text x="992.5" y="513.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F9D8A" text-anchor="middle">repair B → v12</text>
<rect x="555" y="690" width="410" height="34" rx="17" fill="#E8F5ED"/>
<text x="760.0" y="713" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#27845B" text-anchor="middle">Future reads may now agree</text>
<line x1="64" y1="850" x2="1536" y2="850" stroke="#CCD6E3" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="66" y="878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E718B" text-anchor="start">Read repair is query-driven; it does not guarantee every key or every offline replica is repaired.</text>
</svg>