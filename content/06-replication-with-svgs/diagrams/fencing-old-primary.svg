<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Fencing prevents an old primary from writing">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2F6FED"/></marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0F9D8A"/></marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D88A18"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D84B4B"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7957C8"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#27845B"/></marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7A8CA5"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1B3555" flood-opacity="0.10"/></filter>
  </defs>
<rect x="0" y="0" width="1600" height="900" rx="18" fill="#F4F7FB"/>
<text x="64" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#172B4D" text-anchor="start">Fencing prevents an old primary from writing</text>
<text x="66" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5E718B" text-anchor="start">A monotonically increasing fencing token lets the storage system reject operations from stale leaders</text>
<line x1="64" y1="137" x2="1536" y2="137" stroke="#CCD6E3" stroke-width="2" stroke-linecap="round" opacity="1"/>
<rect x="110" y="260" width="420" height="180" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="110" y="260" width="9" height="180" rx="5" fill="#D84B4B"/>
<text x="138" y="298" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Old primary</text>
<text x="138" y="328" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="138" dy="0">Lease expired</tspan>
<tspan x="138" dy="22">Token = 41</tspan>
<tspan x="138" dy="22">Late write arrives</tspan>
</text>
<rect x="440" y="274" width="76" height="29" rx="14" fill="#FDECEC"/>
<text x="478.0" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#D84B4B" text-anchor="middle">STALE</text>
<rect x="1080" y="260" width="420" height="180" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="1080" y="260" width="9" height="180" rx="5" fill="#0F9D8A"/>
<text x="1108" y="298" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">New primary</text>
<text x="1108" y="328" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="1108" dy="0">Elected in epoch 42</tspan>
<tspan x="1108" dy="22">Token = 42</tspan>
<tspan x="1108" dy="22">Current write</tspan>
</text>
<rect x="1395" y="274" width="91" height="29" rx="14" fill="#E5F6F2"/>
<text x="1440.5" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0F9D8A" text-anchor="middle">CURRENT</text>
<rect x="560" y="535" width="480" height="170" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="560" y="535" width="9" height="170" rx="5" fill="#27845B"/>
<text x="588" y="573" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Protected storage</text>
<text x="588" y="603" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="588" dy="0">Highest token accepted = 42</tspan>
<tspan x="588" dy="22">Reject any request with token &lt; 42</tspan>
<tspan x="588" dy="22">Accept token 42</tspan>
</text>
<line x1="530" y1="370" x2="550" y2="590" stroke="#D84B4B" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="9 7" marker-end="url(#arrow-red)"/>
<text x="540.0" y="464.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#D84B4B" text-anchor="middle">token 41 → REJECT</text>
<line x1="1080" y1="370" x2="1045" y2="590" stroke="#0F9D8A" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="9 7" marker-end="url(#arrow-teal)"/>
<text x="1062.5" y="464.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F9D8A" text-anchor="middle">token 42 → ACCEPT</text>
<rect x="565" y="745" width="470" height="34" rx="17" fill="#E8F5ED"/>
<text x="800.0" y="768" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#27845B" text-anchor="middle">Enforcement occurs at the resource</text>
<line x1="64" y1="850" x2="1536" y2="850" stroke="#CCD6E3" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="66" y="878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E718B" text-anchor="start">A lease alone is insufficient if an expired holder can still reach an unguarded resource; fencing must be checked by the write target.</text>
</svg>