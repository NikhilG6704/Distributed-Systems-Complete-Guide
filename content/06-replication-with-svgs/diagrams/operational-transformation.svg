<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Operational Transformation example">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2F6FED"/></marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0F9D8A"/></marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D88A18"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D84B4B"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7957C8"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#27845B"/></marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7A8CA5"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1B3555" flood-opacity="0.10"/></filter>
  </defs>
<rect x="0" y="0" width="1600" height="900" rx="18" fill="#F4F7FB"/>
<text x="64" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#172B4D" text-anchor="start">Operational Transformation example</text>
<text x="66" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5E718B" text-anchor="start">Concurrent inserts are transformed against one another so both clients converge on the same document</text>
<line x1="64" y1="137" x2="1536" y2="137" stroke="#CCD6E3" stroke-width="2" stroke-linecap="round" opacity="1"/>
<rect x="70" y="175" width="1460" height="590" rx="20" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5"/>
<text x="94" y="213" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#7957C8" text-anchor="start">Initial document: H E L L O</text>
<text x="160" y="265" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#5E718B" text-anchor="start">Positions</text>
<rect x="250" y="290" width="75" height="75" rx="10" fill="#EEF2F7" stroke="#CCD6E3" stroke-width="1"/>
<text x="287" y="340" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="750" fill="#172B4D" text-anchor="middle">H</text>
<text x="287" y="380" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#5E718B" text-anchor="middle">0</text>
<rect x="345" y="290" width="75" height="75" rx="10" fill="#EEF2F7" stroke="#CCD6E3" stroke-width="1"/>
<text x="382" y="340" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="750" fill="#172B4D" text-anchor="middle">E</text>
<text x="382" y="380" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#5E718B" text-anchor="middle">1</text>
<rect x="440" y="290" width="75" height="75" rx="10" fill="#EEF2F7" stroke="#CCD6E3" stroke-width="1"/>
<text x="477" y="340" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="750" fill="#172B4D" text-anchor="middle">L</text>
<text x="477" y="380" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#5E718B" text-anchor="middle">2</text>
<rect x="535" y="290" width="75" height="75" rx="10" fill="#EEF2F7" stroke="#CCD6E3" stroke-width="1"/>
<text x="572" y="340" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="750" fill="#172B4D" text-anchor="middle">L</text>
<text x="572" y="380" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#5E718B" text-anchor="middle">3</text>
<rect x="630" y="290" width="75" height="75" rx="10" fill="#EEF2F7" stroke="#CCD6E3" stroke-width="1"/>
<text x="667" y="340" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="750" fill="#172B4D" text-anchor="middle">O</text>
<text x="667" y="380" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#5E718B" text-anchor="middle">4</text>
<rect x="130" y="450" width="470" height="125" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="130" y="450" width="9" height="125" rx="5" fill="#2F6FED"/>
<text x="158" y="488" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">User A operation</text>
<text x="158" y="518" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="158" dy="0">Insert(1, “X”)</tspan>
</text>
<rect x="1000" y="450" width="470" height="125" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="1000" y="450" width="9" height="125" rx="5" fill="#0F9D8A"/>
<text x="1028" y="488" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">User B operation</text>
<text x="1028" y="518" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="1028" dy="0">Insert(3, “Y”)</tspan>
</text>
<line x1="600" y1="510" x2="990" y2="510" stroke="#7957C8" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="8 7" marker-end="url(#arrow-purple)"/>
<text x="795.0" y="494.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7957C8" text-anchor="middle">transform against concurrent op</text>
<rect x="575" y="625" width="450" height="100" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="575" y="625" width="9" height="100" rx="5" fill="#27845B"/>
<text x="603" y="663" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Converged document</text>
<text x="603" y="693" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="603" dy="0">H X E L Y L O</tspan>
</text>
<rect x="884" y="639" width="127" height="29" rx="14" fill="#E8F5ED"/>
<text x="947.5" y="659" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#27845B" text-anchor="middle">SAME RESULT</text>
<line x1="64" y1="850" x2="1536" y2="850" stroke="#CCD6E3" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="66" y="878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E718B" text-anchor="start">Exact transformed positions depend on OT convention, operation priority, and whether positions are before / after the insertion index.</text>
</svg>