<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Chain replication failure recovery">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2F6FED"/></marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0F9D8A"/></marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D88A18"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D84B4B"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7957C8"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#27845B"/></marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7A8CA5"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1B3555" flood-opacity="0.10"/></filter>
  </defs>
<rect x="0" y="0" width="1600" height="900" rx="18" fill="#F4F7FB"/>
<text x="64" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#172B4D" text-anchor="start">Chain replication failure recovery</text>
<text x="66" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5E718B" text-anchor="start">A failed middle replica is removed only after safe reconfiguration; the surviving ordered chain resumes</text>
<line x1="64" y1="137" x2="1536" y2="137" stroke="#CCD6E3" stroke-width="2" stroke-linecap="round" opacity="1"/>
<rect x="70" y="180" width="1460" height="580" rx="20" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5"/>
<text x="94" y="218" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#D88A18" text-anchor="start">Before failure → reconfigured chain</text>
<text x="150" y="265" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#5E718B" text-anchor="start">BEFORE</text>
<rect x="130" y="310" width="280" height="110" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="130" y="310" width="9" height="110" rx="5" fill="#2F6FED"/>
<text x="158" y="348" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Head H</text>
<text x="158" y="378" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="158" dy="0">Active</tspan>
</text>
<rect x="650" y="310" width="280" height="110" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="650" y="310" width="9" height="110" rx="5" fill="#D84B4B"/>
<text x="678" y="348" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Middle M</text>
<text x="678" y="378" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="678" dy="0">FAILED</tspan>
</text>
<rect x="1170" y="310" width="280" height="110" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="1170" y="310" width="9" height="110" rx="5" fill="#27845B"/>
<text x="1198" y="348" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Tail T</text>
<text x="1198" y="378" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="1198" dy="0">Active</tspan>
</text>
<line x1="410" y1="365" x2="640" y2="365" stroke="#2F6FED" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow-blue)"/>
<text x="525.0" y="351.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2F6FED" text-anchor="middle">link</text>
<line x1="930" y1="365" x2="1160" y2="365" stroke="#D84B4B" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/>
<text x="1045.0" y="351.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#D84B4B" text-anchor="middle">broken link</text>
<line x1="790" y1="430" x2="790" y2="485" stroke="#D84B4B" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="7 7"/>
<text x="790" y="465" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#D84B4B" text-anchor="middle">detect + fence M</text>
<text x="150" y="540" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#5E718B" text-anchor="start">AFTER CONTROLLED RECONFIGURATION</text>
<rect x="250" y="595" width="360" height="105" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="250" y="595" width="9" height="105" rx="5" fill="#2F6FED"/>
<text x="278" y="633" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Head H</text>
<text x="278" y="663" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="278" dy="0">New successor = Tail T</tspan>
</text>
<rect x="990" y="595" width="360" height="105" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="990" y="595" width="9" height="105" rx="5" fill="#27845B"/>
<text x="1018" y="633" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Tail T</text>
<text x="1018" y="663" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="1018" dy="0">Receives safe prefix</tspan>
</text>
<line x1="620" y1="650" x2="980" y2="650" stroke="#0F9D8A" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow-teal)"/>
<text x="800.0" y="636.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F9D8A" text-anchor="middle">new chain link</text>
<rect x="570" y="720" width="460" height="34" rx="17" fill="#FFF4DE"/>
<text x="800.0" y="743" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#D88A18" text-anchor="middle">Rejoin M only after catch-up / validation</text>
<line x1="64" y1="850" x2="1536" y2="850" stroke="#CCD6E3" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="66" y="878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E718B" text-anchor="start">A coordinator or protocol must know which entries are committed and which chain configuration is authoritative; do not simply reconnect nodes ad hoc.</text>
</svg>