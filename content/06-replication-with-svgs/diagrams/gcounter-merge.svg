<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="G-Counter CRDT merge">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2F6FED"/></marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0F9D8A"/></marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D88A18"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D84B4B"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7957C8"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#27845B"/></marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7A8CA5"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1B3555" flood-opacity="0.10"/></filter>
  </defs>
<rect x="0" y="0" width="1600" height="900" rx="18" fill="#F4F7FB"/>
<text x="64" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#172B4D" text-anchor="start">G-Counter CRDT merge</text>
<text x="66" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5E718B" text-anchor="start">Each replica increments only its own component; merge takes the component-wise maximum</text>
<line x1="64" y1="137" x2="1536" y2="137" stroke="#CCD6E3" stroke-width="2" stroke-linecap="round" opacity="1"/>
<rect x="90" y="240" width="390" height="170" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="90" y="240" width="9" height="170" rx="5" fill="#2F6FED"/>
<text x="118" y="278" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Replica A state</text>
<text x="118" y="308" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="118" dy="0">A: 3 · B: 0</tspan>
<tspan x="118" dy="22">Value = 3</tspan>
</text>
<rect x="1120" y="240" width="390" height="170" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="1120" y="240" width="9" height="170" rx="5" fill="#0F9D8A"/>
<text x="1148" y="278" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Replica B state</text>
<text x="1148" y="308" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="1148" dy="0">A: 0 · B: 4</tspan>
<tspan x="1148" dy="22">Value = 4</tspan>
</text>
<line x1="480" y1="330" x2="1110" y2="330" stroke="#7957C8" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="9 7" marker-end="url(#arrow-purple)"/>
<text x="795.0" y="314.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7957C8" text-anchor="middle">exchange state</text>
<rect x="575" y="520" width="450" height="175" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="575" y="520" width="9" height="175" rx="5" fill="#27845B"/>
<text x="603" y="558" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Merged state</text>
<text x="603" y="588" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="603" dy="0">A: max(3,0) = 3</tspan>
<tspan x="603" dy="22">B: max(0,4) = 4</tspan>
<tspan x="603" dy="22">Total = 3 + 4 = 7</tspan>
</text>
<rect x="935" y="534" width="76" height="29" rx="14" fill="#E8F5ED"/>
<text x="973.0" y="554" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#27845B" text-anchor="middle">JOIN</text>
<line x1="280" y1="410" x2="660" y2="510" stroke="#2F6FED" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 6"/>
<line x1="1315" y1="410" x2="940" y2="510" stroke="#0F9D8A" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 6"/>
<rect x="565" y="745" width="470" height="34" rx="17" fill="#E8F5ED"/>
<text x="800.0" y="768" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#27845B" text-anchor="middle">Associative · commutative · idempotent</text>
<line x1="64" y1="850" x2="1536" y2="850" stroke="#CCD6E3" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="66" y="878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E718B" text-anchor="start">Illustrative state; replicas must use stable unique component identities and merge the whole per-replica vector.</text>
</svg>