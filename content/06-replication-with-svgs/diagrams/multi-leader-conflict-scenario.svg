<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Multi-leader conflict scenario">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2F6FED"/></marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0F9D8A"/></marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D88A18"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D84B4B"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7957C8"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#27845B"/></marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7A8CA5"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1B3555" flood-opacity="0.10"/></filter>
  </defs>
<rect x="0" y="0" width="1600" height="900" rx="18" fill="#F4F7FB"/>
<text x="64" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#172B4D" text-anchor="start">Multi-leader conflict scenario</text>
<text x="66" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5E718B" text-anchor="start">Concurrent edits at two regions produce incomparable versions until a conflict policy resolves them</text>
<line x1="64" y1="137" x2="1536" y2="137" stroke="#CCD6E3" stroke-width="2" stroke-linecap="round" opacity="1"/>
<rect x="70" y="175" width="1460" height="570" rx="20" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5"/>
<text x="94" y="213" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#D88A18" text-anchor="start">Same customer record · two regions partitioned</text>
<text x="170" y="260" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#5E718B" text-anchor="start">TIME →</text>
<line x1="220" y1="285" x2="1370" y2="285" stroke="#CCD6E3" stroke-width="2" stroke-linecap="round" opacity="1" marker-end="url(#arrow-slate)"/>
<rect x="115" y="325" width="400" height="130" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="115" y="325" width="9" height="130" rx="5" fill="#2F6FED"/>
<text x="143" y="363" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">India · Leader A</text>
<text x="143" y="393" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="143" dy="0">customer.address = “Chennai”</tspan>
<tspan x="143" dy="22">Version A: {A: 5, B: 2}</tspan>
</text>
<rect x="1085" y="325" width="400" height="130" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="1085" y="325" width="9" height="130" rx="5" fill="#0F9D8A"/>
<text x="1113" y="363" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Europe · Leader B</text>
<text x="1113" y="393" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="1113" dy="0">customer.address = “Berlin”</tspan>
<tspan x="1113" dy="22">Version B: {A: 4, B: 3}</tspan>
</text>
<line x1="515" y1="390" x2="1075" y2="390" stroke="#D84B4B" stroke-width="3" stroke-linecap="round" opacity="1" stroke-dasharray="9 8" marker-end="url(#arrow-red)"/>
<text x="795.0" y="372.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#D84B4B" text-anchor="middle">partition: updates cannot cross</text>
<rect x="595" y="510" width="410" height="120" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="595" y="510" width="9" height="120" rx="5" fill="#D88A18"/>
<text x="623" y="548" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Concurrent versions</text>
<text x="623" y="578" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="623" dy="0">Neither vector dominates the other</tspan>
</text>
<rect x="891" y="524" width="100" height="29" rx="14" fill="#FFF4DE"/>
<text x="941.0" y="544" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#D88A18" text-anchor="middle">CONFLICT</text>
<line x1="315" y1="455" x2="690" y2="510" stroke="#2F6FED" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 6"/>
<line x1="1285" y1="455" x2="910" y2="510" stroke="#0F9D8A" stroke-width="2" stroke-linecap="round" opacity="1" stroke-dasharray="6 6"/>
<rect x="170" y="660" width="350" height="70" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="170" y="660" width="9" height="70" rx="5" fill="#D84B4B"/>
<text x="198" y="698" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">LWW policy</text>
<text x="198" y="728" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="198" dy="0">One timestamp wins; may lose intent</tspan>
</text>
<rect x="625" y="660" width="350" height="70" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="625" y="660" width="9" height="70" rx="5" fill="#7957C8"/>
<text x="653" y="698" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Version vector</text>
<text x="653" y="728" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="653" dy="0">Detect concurrency; preserve both</tspan>
</text>
<rect x="1080" y="660" width="350" height="70" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="1080" y="660" width="9" height="70" rx="5" fill="#27845B"/>
<text x="1108" y="698" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172B4D" text-anchor="start">Application merge</text>
<text x="1108" y="728" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="1108" dy="0">Domain-specific resolution</tspan>
</text>
<line x1="64" y1="850" x2="1536" y2="850" stroke="#CCD6E3" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="66" y="878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E718B" text-anchor="start">Vector values are illustrative; concurrent means neither version is causally after the other.</text>
</svg>