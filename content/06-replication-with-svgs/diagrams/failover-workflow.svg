<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Failover workflow">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2F6FED"/></marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0F9D8A"/></marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D88A18"/></marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D84B4B"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7957C8"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#27845B"/></marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7A8CA5"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1B3555" flood-opacity="0.10"/></filter>
  </defs>
<rect x="0" y="0" width="1600" height="900" rx="18" fill="#F4F7FB"/>
<text x="64" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#172B4D" text-anchor="start">Failover workflow</text>
<text x="66" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5E718B" text-anchor="start">A safe promotion requires failure detection, leader selection, fencing, client redirection, and old-primary rejoin</text>
<line x1="64" y1="137" x2="1536" y2="137" stroke="#CCD6E3" stroke-width="2" stroke-linecap="round" opacity="1"/>
<rect x="90" y="190" width="420" height="205" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.3" filter="url(#shadow)"/>
<circle cx="142" cy="242" r="25" fill="#D84B4B"/>
<text x="142" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="750" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="182" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#172B4D" text-anchor="start">Primary heartbeat lost</text>
<text x="125" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="125" dy="0">Suspect failure; do not infer permanent</tspan>
<tspan x="125" dy="23">death</tspan>
</text>
<line x1="510" y1="293" x2="575" y2="293" stroke="#7A8CA5" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow-slate)"/>
<rect x="590" y="190" width="420" height="205" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.3" filter="url(#shadow)"/>
<circle cx="642" cy="242" r="25" fill="#2F6FED"/>
<text x="642" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="750" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="682" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#172B4D" text-anchor="start">Quorum / controller decides</text>
<text x="625" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="625" dy="0">Choose eligible, sufficiently current</tspan>
<tspan x="625" dy="23">candidate</tspan>
</text>
<line x1="1010" y1="293" x2="1075" y2="293" stroke="#7A8CA5" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow-slate)"/>
<rect x="1090" y="190" width="420" height="205" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.3" filter="url(#shadow)"/>
<circle cx="1142" cy="242" r="25" fill="#D84B4B"/>
<text x="1142" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="750" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1182" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#172B4D" text-anchor="start">Fence old primary</text>
<text x="1125" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="1125" dy="0">Epoch / lease / storage token prevents</tspan>
<tspan x="1125" dy="23">stale writes</tspan>
</text>
<path d="M 1300 395 V 435 H 300 V 470" fill="none" stroke="#7A8CA5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-slate)"/>
<rect x="90" y="470" width="420" height="205" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.3" filter="url(#shadow)"/>
<circle cx="142" cy="522" r="25" fill="#2F6FED"/>
<text x="142" y="530" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="750" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="182" y="528" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#172B4D" text-anchor="start">Promote candidate</text>
<text x="125" y="582" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="125" dy="0">New leader epoch becomes authoritative</tspan>
</text>
<line x1="510" y1="573" x2="575" y2="573" stroke="#7A8CA5" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow-slate)"/>
<rect x="590" y="470" width="420" height="205" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.3" filter="url(#shadow)"/>
<circle cx="642" cy="522" r="25" fill="#2F6FED"/>
<text x="642" y="530" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="750" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="682" y="528" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#172B4D" text-anchor="start">Redirect clients</text>
<text x="625" y="582" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="625" dy="0">Discover new primary and retry safely</tspan>
</text>
<line x1="1010" y1="573" x2="1075" y2="573" stroke="#7A8CA5" stroke-width="3" stroke-linecap="round" opacity="1" marker-end="url(#arrow-slate)"/>
<rect x="1090" y="470" width="420" height="205" rx="18" fill="#FFFFFF" stroke="#CCD6E3" stroke-width="1.3" filter="url(#shadow)"/>
<circle cx="1142" cy="522" r="25" fill="#2F6FED"/>
<text x="1142" y="530" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="750" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="1182" y="528" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#172B4D" text-anchor="start">Rejoin old primary</text>
<text x="1125" y="582" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E718B" text-anchor="start">
<tspan x="1125" dy="0">Rebuild or catch up before serving as</tspan>
<tspan x="1125" dy="23">follower</tspan>
</text>
<line x1="64" y1="850" x2="1536" y2="850" stroke="#CCD6E3" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="66" y="878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E718B" text-anchor="start">Promotion policy must account for acknowledged-write durability, quorum membership, term changes, and application retry idempotency.</text>
</svg>