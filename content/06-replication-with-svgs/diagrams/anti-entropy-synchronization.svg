<text x="66" y="878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E718B" text-anchor="start">Anti-entropy runs independently of reads; actual repair scope, cadence, tombstone handling and consistency differ by database.</text>
</svg>