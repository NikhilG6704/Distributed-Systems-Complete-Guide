<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<defs>
          <marker id="arr-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2864A6"/></marker>
          <marker id="arr-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#148A83"/></marker>
          <marker id="arr-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C7861A"/></marker>
          <marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C34C4C"/></marker>
          <marker id="arr-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7257A8"/></marker>
          <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#142B4A" flood-opacity=".10"/></filter>
        </defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1440" height="104" rx="0" fill="#142B4A" stroke="none" stroke-width="2"/>
<text x="48" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="start" style="">Consensus &amp; coordination: end-to-end view</text>
<text x="50" y="79" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#DCE7F2" text-anchor="start" style="">A quorum orders commands; replicas apply the same committed log deterministically.</text>
<text x="1392" y="880" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#8090A0" text-anchor="end" style="">DISTRIBUTED SYSTEMS  •  CONSENSUS &amp; COORDINATION</text>
<rect x="65" y="145" width="230" height="105" rx="16" fill="#EAF2FB" stroke="#2864A6" stroke-width="2" filter="url(#shadow)"/>
<text x="180.0" y="174" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2864A6" text-anchor="middle" style="">CLIENTS</text>
<text x="180.0" y="197.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#203247" text-anchor="middle" style="">API requests • commands</text>
<rect x="375" y="135" width="330" height="125" rx="16" fill="#E8F6F4" stroke="#148A83" stroke-width="2" filter="url(#shadow)"/>
<text x="540.0" y="164" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#148A83" text-anchor="middle" style="">CONSENSUS GROUP  |  N=5</text>
<text x="540.0" y="187.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#203247" text-anchor="middle" style="">Leader + 4 voters</text>
<text x="540.0" y="205.9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#203247" text-anchor="middle" style="">quorum = 3 • tolerates 2 unavailable</text>
<rect x="820" y="145" width="245" height="105" rx="16" fill="#F1EDFA" stroke="#7257A8" stroke-width="2" filter="url(#shadow)"/>
<text x="942.5" y="174" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#7257A8" text-anchor="middle" style="">REPLICATED LOG</text>
<text x="942.5" y="197.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#203247" text-anchor="middle" style="">ordered entries • commit</text>
<text x="942.5" y="215.9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#203247" text-anchor="middle" style="">index</text>
<rect x="1160" y="145" width="220" height="105" rx="16" fill="#EAF5EE" stroke="#2D8A57" stroke-width="2" filter="url(#shadow)"/>
<text x="1270.0" y="174" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2D8A57" text-anchor="middle" style="">STATE MACHINES</text>
<text x="1270.0" y="197.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#203247" text-anchor="middle" style="">same deterministic</text>
<text x="1270.0" y="215.9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#203247" text-anchor="middle" style="">transitions</text>
<line x1="295" y1="197" x2="375" y2="197" stroke="#2864A6" stroke-width="3" marker-end="url(#arr-blue)"/>
<text x="335" y="182" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#2864A6" text-anchor="middle" style="">propose</text>
<line x1="705" y1="197" x2="820" y2="197" stroke="#148A83" stroke-width="3" marker-end="url(#arr-teal)"/>
<text x="762" y="182" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#148A83" text-anchor="middle" style="">replicate + quorum</text>
<line x1="1065" y1="197" x2="1160" y2="197" stroke="#7257A8" stroke-width="3" marker-end="url(#arr-purple)"/>
<text x="1112" y="182" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#7257A8" text-anchor="middle" style="">apply committed</text>
<rect x="430" y="330" width="92" height="78" rx="12" fill="#E8F6F4" stroke="#148A83" stroke-width="2" filter="url(#shadow)"/>
<text x="476.0" y="359" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#148A83" text-anchor="middle" style="">V1</text>
<text x="476.0" y="382.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#203247" text-anchor="middle" style="">quorum</text>
<rect x="545" y="330" width="92" height="78" rx="12" fill="#E8F6F4" stroke="#148A83" stroke-width="2" filter="url(#shadow)"/>
<text x="591.0" y="359" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#148A83" text-anchor="middle" style="">V2</text>
<text x="591.0" y="382.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#203247" text-anchor="middle" style="">quorum</text>
<rect x="660" y="330" width="92" height="78" rx="12" fill="#E8F6F4" stroke="#148A83" stroke-width="2" filter="url(#shadow)"/>
<text x="706.0" y="359" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#148A83" text-anchor="middle" style="">V3</text>
<text x="706.0" y="382.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#203247" text-anchor="middle" style="">quorum</text>
<line x1="540" y1="260" x2="476" y2="330" stroke="#148A83" stroke-width="2" marker-end="url(#arr-teal)"/>
<line x1="540" y1="260" x2="591" y2="330" stroke="#148A83" stroke-width="2" marker-end="url(#arr-teal)"/>
<line x1="540" y1="260" x2="706" y2="330" stroke="#148A83" stroke-width="2" marker-end="url(#arr-teal)"/>
<rect x="360" y="450" width="410" height="106" rx="12" fill="#E8F6F4" stroke="#148A83" stroke-width="1.6"/>
<text x="376" y="475" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#148A83" text-anchor="start" style="">MAJORITY DECISION</text>
<text x="376" y="499.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">Three durable acknowledgments form a quorum. A</text>
<text x="376" y="516.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">minority partition may receive requests but cannot</text>
<text x="376" y="534.1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">commit a new value.</text>
<rect x="880" y="320" width="440" height="235" rx="18" fill="#FFF9F8" stroke="#C34C4C" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1100" y="352" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#C34C4C" text-anchor="middle" style="">MINORITY PARTITION</text>
<rect x="940" y="385" width="140" height="76" rx="16" fill="#FBEDED" stroke="#C34C4C" stroke-width="2" filter="url(#shadow)"/>
<text x="1010.0" y="414" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#C34C4C" text-anchor="middle" style="">V4</text>
<text x="1010.0" y="437.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="middle" style="">isolated</text>
<rect x="1120" y="385" width="140" height="76" rx="16" fill="#FBEDED" stroke="#C34C4C" stroke-width="2" filter="url(#shadow)"/>
<text x="1190.0" y="414" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#C34C4C" text-anchor="middle" style="">V5</text>
<text x="1190.0" y="437.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="middle" style="">isolated</text>
<text x="1100" y="500" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#C34C4C" text-anchor="middle" style="">2 / 5  •  cannot form quorum</text>
<rect x="65" y="625" width="570" height="125" rx="12" fill="#FBF3E5" stroke="#C7861A" stroke-width="1.6"/>
<text x="81" y="650" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#C7861A" text-anchor="start" style="">TIMEOUTS ARE SUSPICION</text>
<text x="81" y="674.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">A timeout can trigger a retry or election. It cannot prove that a</text>
<text x="81" y="691.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">remote process crashed; the process may simply be delayed.</text>
<rect x="680" y="625" width="700" height="125" rx="12" fill="#F1EDFA" stroke="#7257A8" stroke-width="1.6"/>
<text x="696" y="650" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#7257A8" text-anchor="start" style="">SEPARATE THE FLOWS</text>
<text x="696" y="674.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">Solid blue: client request/response. Teal: consensus messages and acknowledgments.</text>
<text x="696" y="691.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">Purple: ordered log replication. Green: state-machine application.</text>
<text x="65" y="820" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#142B4A" text-anchor="start" style="">Safety: no conflicting decisions.  Liveness: progress under timing and quorum assumptions.</text>
</svg>