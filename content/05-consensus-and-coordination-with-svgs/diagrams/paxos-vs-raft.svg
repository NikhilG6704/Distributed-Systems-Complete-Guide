<text x="106" y="824.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">Ballot ↔ term; quorum ↔ majority; chosen slot ↔ committed log index. The details of leader recovery, log safety, and commitment differ.</text>
