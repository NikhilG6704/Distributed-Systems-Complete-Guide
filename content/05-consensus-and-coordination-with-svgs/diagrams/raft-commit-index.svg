<text x="50" y="79" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#DCE7F2" text-anchor="start" style="">Counting replicas is sufficient to advance commitIndex only for an entry from the leader’s current term.</text>
