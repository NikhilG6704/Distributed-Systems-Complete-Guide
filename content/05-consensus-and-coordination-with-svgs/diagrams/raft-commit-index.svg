<text x="116" y="390" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#C7861A" text-anchor="start" style="">OLD-TERM ENTRY (TERM 6/7)</text>
<text x="116" y="414.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">Suppose index 6 is stored on 3/5. It is not directly committed solely</text>
<text x="116" y="431.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">by counting replicas while the leader is in term 8.</text>
<rect x="770" y="365" width="560" height="120" rx="12" fill="#F3F6FA" stroke="#2D8A57" stroke-width="1.6"/>
<text x="786" y="390" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2D8A57" text-anchor="start" style="">CURRENT-TERM ENTRY (TERM 8)</text>
<text x="786" y="414.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">When index 7 reaches 3/5, the leader may advance commitIndex to 7; the</text>
<text x="786" y="431.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">entire preceding prefix becomes committed.</text>
<path d="M 380 500 C 500 600, 850 600, 1040 500" fill="none" stroke="#2D8A57" stroke-width="4" marker-end="url(#arr-blue)"/>
<text x="710" y="610" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#2D8A57" text-anchor="middle" style="">commitIndex → 7  (commits the preceding log prefix too)</text>
<rect x="100" y="690" width="1230" height="100" rx="12" fill="#F1EDFA" stroke="#7257A8" stroke-width="1.6"/>
<text x="116" y="715" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#7257A8" text-anchor="start" style="">WHY THE RESTRICTION EXISTS</text>
<text x="116" y="739.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">A majority may contain an old-term entry without proving that it was committed under the prior leader’s quorum history. Committing a current-term entry</text>
<text x="116" y="756.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">safely commits its prefix through Leader Completeness.</text>
