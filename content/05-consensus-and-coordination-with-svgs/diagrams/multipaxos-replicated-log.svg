<text x="111" y="635" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2D8A57" text-anchor="start" style="">CONTIGUOUS APPLY PREFIX</text>
<text x="111" y="659.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">Chosen slots form the agreed log. The state machine applies the</text>
<text x="111" y="676.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">contiguous committed prefix in slot order.</text>
<rect x="735" y="610" width="610" height="115" rx="12" fill="#FBF3E5" stroke="#C7861A" stroke-width="1.6"/>
<text x="751" y="635" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#C7861A" text-anchor="start" style="">LEADER CRASH / RECOVERY</text>
<text x="751" y="659.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">A new leader obtains a higher ballot and performs Phase 1 again, recovering</text>
<text x="751" y="676.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">accepted values. Phase 1 is amortized during stable leadership, not</text>
<text x="751" y="694.1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">eliminated.</text>
