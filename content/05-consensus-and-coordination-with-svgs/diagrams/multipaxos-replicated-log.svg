<text x="366" y="295" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#7257A8" text-anchor="start" style="">PHASE 1 • PROMISE QUORUM</text>
<text x="366" y="319.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">One prepare/promise quorum establishes ballot 30 and returns highest accepted value per</text>
<text x="366" y="336.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">slot.</text>
