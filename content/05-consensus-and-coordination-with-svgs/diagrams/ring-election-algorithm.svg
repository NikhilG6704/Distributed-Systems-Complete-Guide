<line x1="445.90362144086913" y1="336.5146532025694" x2="634.0963785591309" y2="213.4853467974306" stroke="#148A83" stroke-width="3" marker-end="url(#arr-teal)"/>
<rect x="60" y="145" width="190" height="32" rx="16" fill="#FBF3E5" stroke="#C7861A" stroke-width="1.5"/>
<text x="155.0" y="167" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#C7861A" text-anchor="middle" style="">INITIATOR: P3</text>
<text x="720" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#148A83" text-anchor="middle" style="">ELECTION TOKEN: [P3, P4, P5, P1, P2]</text>
<text x="720" y="455" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#2D8A57" text-anchor="middle" style="">highest live ID = P5</text>
<rect x="65" y="750" width="620" height="75" rx="12" fill="#FBF3E5" stroke="#C7861A" stroke-width="1.6"/>
<text x="81" y="775" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#C7861A" text-anchor="start" style="">FAILURE HANDLING</text>
<text x="81" y="799.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">A repaired logical ring skips a failed successor and reconnects to the next</text>
<text x="81" y="816.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">reachable process.</text>
<rect x="735" y="750" width="630" height="75" rx="12" fill="#F1EDFA" stroke="#7257A8" stroke-width="1.6"/>
<text x="751" y="775" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#7257A8" text-anchor="start" style="">MESSAGE COST</text>
<text x="751" y="799.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">Two full traversals are typical: election IDs then coordinator announcement.</text>
<text x="751" y="816.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">O(N) assumes one complete traversal and repaired ring.</text>
</svg>