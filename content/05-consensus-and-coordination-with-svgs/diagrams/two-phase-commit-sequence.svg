<line x1="720.0" y1="832" x2="130.0" y2="832" stroke="#2D8A57" stroke-width="2.5" marker-end="url(#arr-blue)"/>
<text x="425.0" y="822" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" fill="#2D8A57" text-anchor="middle" style="">ACK</text>
<line x1="1310.0" y1="889" x2="130.0" y2="889" stroke="#2D8A57" stroke-width="2.5" marker-end="url(#arr-blue)"/>
<text x="720.0" y="879" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" fill="#2D8A57" text-anchor="middle" style="">ACK</text>
<rect x="80" y="936" width="1280" height="90" rx="12" fill="#FBF3E5" stroke="#C7861A" stroke-width="1.6"/>
<text x="96" y="961" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#C7861A" text-anchor="start" style="">PROTOCOL NOTE</text>
<text x="96" y="985.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">If either participant votes NO (or times out before becoming prepared), coordinator logs ABORT and sends ABORT to all participants.</text>
<rect x="80" y="1040" width="1280" height="120" rx="12" fill="#FBEDED" stroke="#C34C4C" stroke-width="1.6"/>
<text x="96" y="1065" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#C34C4C" text-anchor="start" style="">ALTERNATE NO-VOTE BRANCH</text>
<text x="96" y="1089.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">If either participant votes NO, the coordinator records ABORT durably and sends ABORT to both participants. This branch is an alternative to the all-YES COMMIT</text>
<text x="96" y="1106.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">path above.</text>
