<line x1="1310.0" y1="448" x2="130.0" y2="448" stroke="#148A83" stroke-width="2.5" marker-end="url(#arr-teal)"/>
<text x="720.0" y="438" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" fill="#148A83" text-anchor="middle" style="">YES</text>
<rect x="55" y="482" width="1330" height="36" rx="6" fill="#F1EDFA" stroke="none" stroke-width="0"/>
<text x="75" y="506" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7257A8" text-anchor="start" style="">PHASE 2  •  PRE-COMMIT</text>
<line x1="130.0" y1="547" x2="720.0" y2="547" stroke="#7257A8" stroke-width="2.5" marker-end="url(#arr-purple)"/>
<text x="425.0" y="537" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" fill="#7257A8" text-anchor="middle" style="">PRE_COMMIT</text>
<line x1="130.0" y1="604" x2="1310.0" y2="604" stroke="#7257A8" stroke-width="2.5" marker-end="url(#arr-purple)"/>
<text x="720.0" y="594" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" fill="#7257A8" text-anchor="middle" style="">PRE_COMMIT</text>
<line x1="720.0" y1="661" x2="130.0" y2="661" stroke="#148A83" stroke-width="2.5" marker-end="url(#arr-teal)"/>
