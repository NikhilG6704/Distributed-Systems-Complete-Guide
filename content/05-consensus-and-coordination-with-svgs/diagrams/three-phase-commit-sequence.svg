<text x="720.0" y="708" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" fill="#148A83" text-anchor="middle" style="">ACK</text>
<rect x="55" y="752" width="1330" height="36" rx="6" fill="#F3F6FA" stroke="none" stroke-width="0"/>
<text x="75" y="776" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2D8A57" text-anchor="start" style="">PHASE 3  •  DO COMMIT</text>
<line x1="130.0" y1="817" x2="720.0" y2="817" stroke="#2D8A57" stroke-width="2.5" marker-end="url(#arr-blue)"/>
<text x="425.0" y="807" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" fill="#2D8A57" text-anchor="middle" style="">DO_COMMIT</text>
<line x1="130.0" y1="874" x2="1310.0" y2="874" stroke="#2D8A57" stroke-width="2.5" marker-end="url(#arr-blue)"/>
<text x="720.0" y="864" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" fill="#2D8A57" text-anchor="middle" style="">DO_COMMIT</text>
<line x1="720.0" y1="931" x2="130.0" y2="931" stroke="#2D8A57" stroke-width="2.5" marker-end="url(#arr-blue)"/>
<text x="425.0" y="921" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" fill="#2D8A57" text-anchor="middle" style="">ACK</text>
<line x1="1310.0" y1="988" x2="130.0" y2="988" stroke="#2D8A57" stroke-width="2.5" marker-end="url(#arr-blue)"/>
<text x="720.0" y="978" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" fill="#2D8A57" text-anchor="middle" style="">ACK</text>
<rect x="80" y="1035" width="1280" height="90" rx="12" fill="#FBF3E5" stroke="#C7861A" stroke-width="1.6"/>
<text x="96" y="1060" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#C7861A" text-anchor="start" style="">PROTOCOL NOTE</text>
<text x="96" y="1084.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">A NO vote leads to ABORT. If the coordinator fails after PRE_COMMIT, a recovery coordinator queries participant states; non-blocking progress depends on</text>
<text x="96" y="1101.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">bounded-delay / bounded-processing assumptions and partition constraints.</text>
<rect x="80" y="1140" width="1280" height="100" rx="12" fill="#FBF3E5" stroke="#C7861A" stroke-width="1.6"/>
<text x="96" y="1165" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#C7861A" text-anchor="start" style="">COORDINATOR CRASH AFTER PRE-COMMIT</text>
<text x="96" y="1189.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">A recovery coordinator queries participant states and applies the textbook recovery rules. The progress argument requires bounded communication and processing</text>
<text x="96" y="1206.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">delays plus partition constraints; it does not hold in a fully asynchronous partitionable network.</text>
</svg>