<text x="386" y="500" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#148A83" text-anchor="start" style="">QUORUM: 3 OF 5</text>
<text x="386" y="524.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">A value is chosen when a majority of acceptors accepts the same proposal. Any two</text>
<text x="386" y="541.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">majorities intersect.</text>
<rect x="70" y="650" width="590" height="115" rx="12" fill="#EAF2FB" stroke="#2864A6" stroke-width="1.6"/>
<text x="86" y="675" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2864A6" text-anchor="start" style="">MESSAGE VOCABULARY</text>
<text x="86" y="699.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">PREPARE → PROMISE; ACCEPT → ACCEPTED; then learner notification. A</text>
<text x="86" y="716.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">response carries prior accepted state when one exists.</text>
<rect x="700" y="650" width="670" height="115" rx="12" fill="#F1EDFA" stroke="#7257A8" stroke-width="1.6"/>
<text x="716" y="675" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#7257A8" text-anchor="start" style="">ROLE OVERLAP</text>
<text x="716" y="699.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">Roles are logical. A process may act as proposer, acceptor and learner. A proposal</text>
<text x="716" y="716.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">is (ballot,value); “chosen” describes a value accepted by a quorum.</text>
