<text x="751" y="739.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">Consul emphasizes service catalog and health; gossip spreads membership.</text>
<text x="751" y="756.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">ZooKeeper and etcd can support discovery patterns through their primitives.</text>
