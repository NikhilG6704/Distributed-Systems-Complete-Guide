<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<defs>
          <marker id="arr-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2864A6"/></marker>
          <marker id="arr-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#148A83"/></marker>
          <marker id="arr-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C7861A"/></marker>
          <marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C34C4C"/></marker>
          <marker id="arr-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7257A8"/></marker>
          <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#142B4A" flood-opacity=".10"/></filter>
        </defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1440" height="104" rx="0" fill="#142B4A" stroke="none" stroke-width="2"/>
<text x="48" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="start" style="">Fencing tokens: reject stale owners</text>
<text x="50" y="79" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#DCE7F2" text-anchor="start" style="">Token monotonicity moves enforcement to the protected resource, which atomically compares and stores the high-water mark.</text>
<text x="1392" y="880" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#8090A0" text-anchor="end" style="">DISTRIBUTED SYSTEMS  •  CONSENSUS &amp; COORDINATION</text>
<rect x="70" y="170" width="260" height="90" rx="16" fill="#EAF2FB" stroke="#2864A6" stroke-width="2" filter="url(#shadow)"/>
<text x="200.0" y="199" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2864A6" text-anchor="middle" style="">CLIENT A</text>
<text x="200.0" y="222.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#203247" text-anchor="middle" style="">grant token 41</text>
<rect x="70" y="340" width="260" height="90" rx="16" fill="#F1EDFA" stroke="#7257A8" stroke-width="2" filter="url(#shadow)"/>
<text x="200.0" y="369" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#7257A8" text-anchor="middle" style="">CLIENT B</text>
<text x="200.0" y="392.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#203247" text-anchor="middle" style="">grant token 42</text>
<rect x="570" y="240" width="300" height="150" rx="16" fill="#E8F6F4" stroke="#148A83" stroke-width="2" filter="url(#shadow)"/>
<text x="720.0" y="269" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#148A83" text-anchor="middle" style="">RESOURCE GUARD</text>
<text x="720.0" y="292.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#203247" text-anchor="middle" style="">stored max_token = 42</text>
<text x="720.0" y="312.25" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#203247" text-anchor="middle" style="">compare incoming token</text>
<text x="720.0" y="332.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#203247" text-anchor="middle" style="">with durable high-water mark</text>
<rect x="1080" y="170" width="280" height="90" rx="16" fill="#FBEDED" stroke="#C34C4C" stroke-width="2" filter="url(#shadow)"/>
<text x="1220.0" y="199" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#C34C4C" text-anchor="middle" style="">WRITE A • token 41</text>
<text x="1220.0" y="222.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#203247" text-anchor="middle" style="">REJECT: 41 &lt; 42</text>
<rect x="1080" y="340" width="280" height="90" rx="16" fill="#EAF5EE" stroke="#2D8A57" stroke-width="2" filter="url(#shadow)"/>
<text x="1220.0" y="369" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2D8A57" text-anchor="middle" style="">WRITE B • token 42</text>
<text x="1220.0" y="392.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#203247" text-anchor="middle" style="">ACCEPT; persist 42</text>
<line x1="330" y1="215" x2="570" y2="280" stroke="#2864A6" stroke-width="3" marker-end="url(#arr-blue)"/>
<line x1="330" y1="385" x2="570" y2="350" stroke="#7257A8" stroke-width="3" marker-end="url(#arr-purple)"/>
<line x1="870" y1="280" x2="1080" y2="215" stroke="#C34C4C" stroke-width="3" marker-end="url(#arr-red)"/>
<line x1="870" y1="350" x2="1080" y2="385" stroke="#2D8A57" stroke-width="3" marker-end="url(#arr-blue)"/>
<rect x="80" y="560" width="590" height="120" rx="12" fill="#FBF3E5" stroke="#C7861A" stroke-width="1.6"/>
<text x="96" y="585" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#C7861A" text-anchor="start" style="">EVENT ORDER</text>
<text x="96" y="609.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">A pauses with token 41. Lease expires. B receives 42 and writes first. A</text>
<text x="96" y="626.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">later resumes and submits 41.</text>
<rect x="735" y="560" width="625" height="120" rx="12" fill="#E8F6F4" stroke="#148A83" stroke-width="1.6"/>
<text x="751" y="585" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#148A83" text-anchor="start" style="">ATOMIC RESOURCE CHECK</text>
<text x="751" y="609.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">Comparison, data mutation, and high-water-mark update must be atomic and</text>
<text x="751" y="626.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">durable. Otherwise an older request can race the check.</text>
<text x="720" y="750" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#142B4A" text-anchor="middle" style="">Lock service reduces contention; fencing token protects correctness at the resource.</text>
</svg>