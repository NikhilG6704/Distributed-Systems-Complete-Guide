<text x="91" y="725" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#C7861A" text-anchor="start" style="">COMPACTION</text>
<text x="91" y="749.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">Old MVCC revisions are removed. A watch requesting compacted history must</text>
<text x="91" y="766.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">recover from a fresh snapshot / current revision.</text>
<rect x="735" y="700" width="630" height="100" rx="12" fill="#E8F6F4" stroke="#148A83" stroke-width="1.6"/>
<text x="751" y="725" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#148A83" text-anchor="start" style="">CONSISTENCY</text>
<text x="751" y="749.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">Raft commits store changes. API transactions provide atomic comparisons and</text>
<text x="751" y="766.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">operations; reads can be linearizable or serializable depending on options.</text>
