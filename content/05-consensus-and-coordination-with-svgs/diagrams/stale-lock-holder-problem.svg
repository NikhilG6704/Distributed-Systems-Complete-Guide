<rect x="0" y="0" width="1440" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1440" height="104" rx="0" fill="#142B4A" stroke="none" stroke-width="2"/>
<text x="48" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="start" style="">Stale lock holder: why expiration alone is unsafe</text>
<text x="50" y="79" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#DCE7F2" text-anchor="start" style="">A paused client can resume after its lease expires. Without resource-side fencing, two clients can write sequentially as if both still own the lock.</text>
<text x="1392" y="880" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#8090A0" text-anchor="end" style="">DISTRIBUTED SYSTEMS  •  CONSENSUS &amp; COORDINATION</text>
<text x="95" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#2864A6" text-anchor="start" style="">CLIENT A</text>
<line x1="250" y1="190" x2="1350" y2="190" stroke="#CAD4DE" stroke-width="1.5"/>
<text x="95" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#148A83" text-anchor="start" style="">LOCK SERVICE</text>
<line x1="250" y1="360" x2="1350" y2="360" stroke="#CAD4DE" stroke-width="1.5"/>
<text x="95" y="530" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#7257A8" text-anchor="start" style="">CLIENT B</text>
<line x1="250" y1="530" x2="1350" y2="530" stroke="#CAD4DE" stroke-width="1.5"/>
<text x="95" y="700" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#C7861A" text-anchor="start" style="">RESOURCE</text>
<line x1="250" y1="700" x2="1350" y2="700" stroke="#CAD4DE" stroke-width="1.5"/>
<rect x="235" y="170" width="130" height="32" rx="16" fill="#EAF2FB" stroke="#2864A6" stroke-width="1.5"/>
<text x="300.0" y="192" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#2864A6" text-anchor="middle" style="">acquire lock</text>
<rect x="385" y="340" width="130" height="32" rx="16" fill="#E8F6F4" stroke="#148A83" stroke-width="1.5"/>
<text x="450.0" y="362" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#148A83" text-anchor="middle" style="">grant A</text>
<rect x="545" y="170" width="130" height="32" rx="16" fill="#FBEDED" stroke="#C34C4C" stroke-width="1.5"/>
<text x="610.0" y="192" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#C34C4C" text-anchor="middle" style="">PAUSE / GC</text>
<rect x="695" y="340" width="130" height="32" rx="16" fill="#FBEDED" stroke="#C34C4C" stroke-width="1.5"/>
<text x="760.0" y="362" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#C34C4C" text-anchor="middle" style="">expire A</text>
<rect x="835" y="510" width="130" height="32" rx="16" fill="#F1EDFA" stroke="#7257A8" stroke-width="1.5"/>
<text x="900.0" y="532" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#7257A8" text-anchor="middle" style="">grant B</text>
<rect x="985" y="510" width="130" height="32" rx="16" fill="#F1EDFA" stroke="#7257A8" stroke-width="1.5"/>
<text x="1050.0" y="532" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#7257A8" text-anchor="middle" style="">write new data</text>
<rect x="1125" y="170" width="130" height="32" rx="16" fill="#FBEDED" stroke="#C34C4C" stroke-width="1.5"/>
<text x="1190.0" y="192" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#C34C4C" text-anchor="middle" style="">A resumes</text>
<rect x="1195" y="680" width="130" height="32" rx="16" fill="#FBEDED" stroke="#C34C4C" stroke-width="1.5"/>
<text x="1260.0" y="702" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#C34C4C" text-anchor="middle" style="">stale write</text>
<path d="M 450 385 L 450 700" fill="none" stroke="#148A83" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr-teal)"/>
<path d="M 900 555 L 1050 700" fill="none" stroke="#7257A8" stroke-width="2" marker-end="url(#arr-purple)"/>
<path d="M 1190 215 L 1260 680" fill="none" stroke="#C34C4C" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arr-red)"/>
<rect x="75" y="780" width="590" height="65" rx="12" fill="#FBEDED" stroke="#C34C4C" stroke-width="1.6"/>
<text x="91" y="805" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#C34C4C" text-anchor="start" style="">UNSAFE RESOURCE</text>
<text x="91" y="829.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">Checks only “A once held the lock” → accepts stale write.</text>
<rect x="735" y="780" width="630" height="65" rx="12" fill="#F3F6FA" stroke="#2D8A57" stroke-width="1.6"/>
<text x="751" y="805" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2D8A57" text-anchor="start" style="">SAFE RESOURCE</text>
<text x="751" y="829.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">Stores max fencing token; rejects A’s older token after B has written.</text>
</svg>