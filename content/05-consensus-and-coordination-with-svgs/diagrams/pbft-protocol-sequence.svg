<text x="96" y="1429" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#7257A8" text-anchor="start" style="">PROTOCOL NOTE</text>
<text x="96" y="1453.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">For f=1: N=4 replicas = primary + 3 backups. Prepared evidence is 2f+1 matching messages including pre-prepare under the classic count; commit certificate is</text>
<text x="96" y="1470.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">2f+1; client accepts f+1 matching replies. View change carries checkpoint and prepared evidence.</text>
<rect x="80" y="1515" width="1280" height="95" rx="12" fill="#FBF3E5" stroke="#C7861A" stroke-width="1.6"/>
<text x="96" y="1540" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#C7861A" text-anchor="start" style="">VIEW CHANGE / RECOVERY</text>
<text x="96" y="1564.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">Replicas exchange VIEW-CHANGE evidence containing checkpoint and prepared certificates. The new primary proposes NEW-VIEW; lagging replicas may require state</text>
<text x="96" y="1581.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">transfer from a stable checkpoint.</text>
