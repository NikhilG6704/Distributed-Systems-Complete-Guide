<text x="50" y="79" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#DCE7F2" text-anchor="start" style="">Four replicas tolerate one Byzantine replica in the classic PBFT configuration. Messages are authenticated and digest/sequence matched.</text>
