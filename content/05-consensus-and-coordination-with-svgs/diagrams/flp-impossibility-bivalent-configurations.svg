<path d="M 270 390 C 430 500, 690 500, 855 390" fill="none" stroke="#C34C4C" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arr-red)"/>
<text x="560" y="505" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#C34C4C" text-anchor="middle" style="">adversarial schedule keeps a bivalent execution reachable</text>
<rect x="70" y="560" width="620" height="190" rx="12" fill="#EAF2FB" stroke="#2864A6" stroke-width="1.6"/>
<text x="86" y="585" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2864A6" text-anchor="start" style="">INDISTINGUISHABLE OBSERVATIONS</text>
<text x="86" y="609.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">From P’s perspective, “Q crashed” and “Q’s message is merely delayed” can</text>
<text x="86" y="626.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">look identical until a message arrives. P cannot safely infer which world it</text>
<text x="86" y="644.1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">is in.</text>
<rect x="735" y="560" width="635" height="190" rx="12" fill="#FBF3E5" stroke="#C7861A" stroke-width="1.6"/>
<text x="751" y="585" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#C7861A" text-anchor="start" style="">THEOREM BOUNDARY</text>
<text x="751" y="609.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">Deterministic protocol • asynchronous message passing • one possible crash.</text>
<text x="751" y="626.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">Safety can hold, but termination is not guaranteed in every execution. FLP does</text>
<text x="751" y="644.1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">not say practical consensus never works.</text>
