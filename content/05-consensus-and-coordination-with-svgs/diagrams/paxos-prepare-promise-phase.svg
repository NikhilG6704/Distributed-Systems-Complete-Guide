<text x="96" y="943.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">The first three PROMISE responses form a quorum. The proposer must select the value from the highest-numbered accepted proposal reported by that quorum, if any.</text>
