<text x="280.0" y="254" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#2864A6" text-anchor="middle" style="">GENERAL A</text>
<text x="280.0" y="277.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#203247" text-anchor="middle" style="">honest</text>
