<text x="720.0" y="517.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#203247" text-anchor="middle" style="">honest</text>
<line x1="395" y1="280" x2="605" y2="220" stroke="#2864A6" stroke-width="3" marker-end="url(#arr-blue)"/>
<text x="495" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2864A6" text-anchor="middle" style="">ATTACK</text>
<line x1="835" y1="220" x2="1045" y2="280" stroke="#C34C4C" stroke-width="3" marker-end="url(#arr-red)"/>
<text x="940" y="225" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#C34C4C" text-anchor="middle" style="">RETREAT</text>
<line x1="720" y1="245" x2="720" y2="465" stroke="#C34C4C" stroke-width="3" marker-end="url(#arr-red)"/>
<text x="745" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#C34C4C" text-anchor="start" style="">conflicting claim</text>
<line x1="395" y1="340" x2="605" y2="520" stroke="#148A83" stroke-width="3" marker-end="url(#arr-teal)"/>
<line x1="835" y1="520" x2="1045" y2="340" stroke="#148A83" stroke-width="3" marker-end="url(#arr-teal)"/>
<line x1="280" y1="390" x2="720" y2="575" stroke="#148A83" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr-teal)"/>
<line x1="1160" y1="390" x2="720" y2="575" stroke="#148A83" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr-teal)"/>
<rect x="80" y="685" width="590" height="115" rx="12" fill="#FBEDED" stroke="#C34C4C" stroke-width="1.6"/>
<text x="96" y="710" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#C34C4C" text-anchor="start" style="">BYZANTINE BEHAVIOR</text>
<text x="96" y="734.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">A faulty node may send inconsistent statements, omit messages, or</text>
<text x="96" y="751.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">coordinate malicious behavior. Crash-only protocols do not handle this</text>
<text x="96" y="769.1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">model.</text>
<rect x="710" y="685" width="650" height="115" rx="12" fill="#F1EDFA" stroke="#7257A8" stroke-width="1.6"/>
<text x="726" y="710" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#7257A8" text-anchor="start" style="">STANDARD BOUND</text>
<text x="726" y="734.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">For f=1, N ≥ 3f+1 = 4 replicas. Quorum intersection must leave enough honest</text>
<text x="726" y="751.55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">overlap; authentication identifies senders but does not make their claims true.</text>
</svg>