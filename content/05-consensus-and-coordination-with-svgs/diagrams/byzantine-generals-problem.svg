<text x="720.0" y="187.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#203247" text-anchor="middle" style="">Byzantine</text>
<rect x="1045" y="225" width="230" height="110" rx="16" fill="#EAF2FB" stroke="#2864A6" stroke-width="2" filter="url(#shadow)"/>
<text x="1160.0" y="254" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#2864A6" text-anchor="middle" style="">GENERAL C</text>
<text x="1160.0" y="277.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#203247" text-anchor="middle" style="">honest</text>
<rect x="605" y="465" width="230" height="110" rx="16" fill="#EAF2FB" stroke="#2864A6" stroke-width="2" filter="url(#shadow)"/>
