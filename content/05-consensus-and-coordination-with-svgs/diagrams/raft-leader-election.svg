<text x="710" y="695" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#2D8A57" text-anchor="middle" style="">HEARTBEATS / AppendEntries establish leadership</text>
<rect x="75" y="755" width="1290" height="70" rx="12" fill="#FBF3E5" stroke="#C7861A" stroke-width="1.6"/>
<text x="91" y="780" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#C7861A" text-anchor="start" style="">SPLIT VOTE</text>
<text x="91" y="804.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">If votes split, no candidate has a majority. Candidates wait for independently randomized election timeouts and retry in a later term.</text>
