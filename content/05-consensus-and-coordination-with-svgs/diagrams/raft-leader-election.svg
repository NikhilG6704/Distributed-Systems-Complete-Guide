<rect x="300" y="490" width="550" height="95" rx="12" fill="#F3F6FA" stroke="#2D8A57" stroke-width="1.6"/>
<text x="316" y="515" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2D8A57" text-anchor="start" style="">QUORUM ACHIEVED</text>
<text x="316" y="539.0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#203247" text-anchor="start" style="">B + C + D = 3 of 5. B becomes leader for term 11.</text>
<line x1="445" y1="585" x2="180" y2="670" stroke="#2D8A57" stroke-width="3" marker-end="url(#arr-blue)"/>
<line x1="445" y1="585" x2="710" y2="670" stroke="#2D8A57" stroke-width="3" marker-end="url(#arr-blue)"/>
