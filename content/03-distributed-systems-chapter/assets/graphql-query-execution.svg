<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
<title id="title">GraphQL query execution and resolver batching</title><desc id="desc">A single GraphQL endpoint may fan out into many resolver calls; DataLoader batches compatible key lookups.</desc>
