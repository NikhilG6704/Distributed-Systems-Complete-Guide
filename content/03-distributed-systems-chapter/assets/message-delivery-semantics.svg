<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="1050" viewBox="0 0 1550 1050" role="img" aria-labelledby="title desc">
<title id="title">Message delivery semantics and transactional effects</title><desc id="desc">At-most-once can lose work; at-least-once can redeliver; an atomic inbox transaction can make repeated delivery a no-op.</desc>
<defs>
          <marker id="arr-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FED"/></marker>
          <marker id="arr-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#138A83"/></marker>
          <marker id="arr-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
          <marker id="arr-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7655C7"/></marker>
          <marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C74747"/></marker>
          <marker id="arr-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52647A"/></marker>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#213047" flood-opacity=".08"/></filter>
        </defs>
<rect width="1550" height="1050" fill="#F7F9FC"/>
<text x="775.0" y="42" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Message delivery semantics and transactional effects</text>
<text x="775.0" y="72" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#52647A" text-anchor="middle" opacity="1">At-most-once can lose work; at-least-once can redeliver; an atomic inbox transaction can make repeated delivery a no-op.</text>
<rect x="50" y="140" width="1450" height="245" rx="14" fill="#FFFFFF" stroke="#E7EDF4" stroke-width="1"/>
<text x="80" y="175" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F6FED" text-anchor="start" opacity="1">AT-MOST-ONCE</text>
<text x="260" y="216" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52647A" text-anchor="middle" opacity="1">Send</text>
<line x1="260" y1="230" x2="260" y2="350" stroke="#E7EDF4" stroke-width="1.2" fill="none" stroke-dasharray="4 5"/>
<text x="470" y="216" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52647A" text-anchor="middle" opacity="1">Persist</text>
<line x1="470" y1="230" x2="470" y2="350" stroke="#E7EDF4" stroke-width="1.2" fill="none" stroke-dasharray="4 5"/>
<text x="680" y="216" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52647A" text-anchor="middle" opacity="1">Receive</text>
<line x1="680" y1="230" x2="680" y2="350" stroke="#E7EDF4" stroke-width="1.2" fill="none" stroke-dasharray="4 5"/>
<text x="890" y="216" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52647A" text-anchor="middle" opacity="1">DB effect</text>
<line x1="890" y1="230" x2="890" y2="350" stroke="#E7EDF4" stroke-width="1.2" fill="none" stroke-dasharray="4 5"/>
<text x="1100" y="216" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52647A" text-anchor="middle" opacity="1">ACK / offset</text>
<line x1="1100" y1="230" x2="1100" y2="350" stroke="#E7EDF4" stroke-width="1.2" fill="none" stroke-dasharray="4 5"/>
<text x="1320" y="216" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52647A" text-anchor="middle" opacity="1">Failure / retry</text>
<line x1="1320" y1="230" x2="1320" y2="350" stroke="#E7EDF4" stroke-width="1.2" fill="none" stroke-dasharray="4 5"/>
<line x1="260" y1="265" x2="470" y2="265" stroke="#2F6FED" stroke-width="2.3" fill="none" marker-end="url(#arr-blue)"/>
<line x1="470" y1="265" x2="680" y2="265" stroke="#2F6FED" stroke-width="2.3" fill="none" marker-end="url(#arr-blue)"/>
<line x1="680" y1="265" x2="890" y2="265" stroke="#2F6FED" stroke-width="2.3" fill="none" marker-end="url(#arr-blue)"/>
<line x1="890" y1="265" x2="1100" y2="265" stroke="#2F6FED" stroke-width="2.3" fill="none" marker-end="url(#arr-blue)"/>
<line x1="1100" y1="265" x2="1320" y2="265" stroke="#2F6FED" stroke-width="2.3" fill="none" marker-end="url(#arr-blue)"/>
<rect x="430" y="285" width="320" height="65" rx="10" fill="#FCECEC" stroke="#C74747" stroke-width="1.5"/>
<text x="590.0" y="309" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="590.0" dy="0">ACK before effect; crash can</tspan>
<tspan x="590.0" dy="16.25">leave the business effect lost.</tspan>
</text>
<rect x="1040" y="285" width="260" height="27" rx="13" fill="#F0F3F7" stroke="#F0F3F7" stroke-width="0"/>
<text x="1170.0" y="303" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52647A" text-anchor="middle" opacity="1">No automatic redelivery</text>
<rect x="50" y="425" width="1450" height="245" rx="14" fill="#FFFFFF" stroke="#E7EDF4" stroke-width="1"/>
<text x="80" y="460" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D97706" text-anchor="start" opacity="1">AT-LEAST-ONCE</text>
<text x="260" y="501" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52647A" text-anchor="middle" opacity="1">Send</text>
<line x1="260" y1="515" x2="260" y2="635" stroke="#E7EDF4" stroke-width="1.2" fill="none" stroke-dasharray="4 5"/>
<text x="470" y="501" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52647A" text-anchor="middle" opacity="1">Persist</text>
<line x1="470" y1="515" x2="470" y2="635" stroke="#E7EDF4" stroke-width="1.2" fill="none" stroke-dasharray="4 5"/>
<text x="680" y="501" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52647A" text-anchor="middle" opacity="1">Receive</text>
<line x1="680" y1="515" x2="680" y2="635" stroke="#E7EDF4" stroke-width="1.2" fill="none" stroke-dasharray="4 5"/>
<text x="890" y="501" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52647A" text-anchor="middle" opacity="1">DB effect</text>
<line x1="890" y1="515" x2="890" y2="635" stroke="#E7EDF4" stroke-width="1.2" fill="none" stroke-dasharray="4 5"/>
<text x="1100" y="501" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52647A" text-anchor="middle" opacity="1">ACK / offset</text>
<line x1="1100" y1="515" x2="1100" y2="635" stroke="#E7EDF4" stroke-width="1.2" fill="none" stroke-dasharray="4 5"/>
<text x="1320" y="501" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52647A" text-anchor="middle" opacity="1">Failure / retry</text>
<line x1="1320" y1="515" x2="1320" y2="635" stroke="#E7EDF4" stroke-width="1.2" fill="none" stroke-dasharray="4 5"/>
<line x1="260" y1="550" x2="470" y2="550" stroke="#D97706" stroke-width="2.3" fill="none" marker-end="url(#arr-orange)"/>
<line x1="470" y1="550" x2="680" y2="550" stroke="#D97706" stroke-width="2.3" fill="none" marker-end="url(#arr-orange)"/>
<line x1="680" y1="550" x2="890" y2="550" stroke="#D97706" stroke-width="2.3" fill="none" marker-end="url(#arr-orange)"/>
<line x1="890" y1="550" x2="1100" y2="550" stroke="#D97706" stroke-width="2.3" fill="none" marker-end="url(#arr-orange)"/>
<line x1="1100" y1="550" x2="1320" y2="550" stroke="#D97706" stroke-width="2.3" fill="none" marker-end="url(#arr-orange)"/>
<rect x="700" y="570" width="315" height="65" rx="10" fill="#FFF3E2" stroke="#D97706" stroke-width="1.5"/>
<text x="857.5" y="594" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="857.5" dy="0">DB commits; ACK is lost;</tspan>
<tspan x="857.5" dy="16.25">broker sends the same event again.</tspan>
</text>
<rect x="1100" y="570" width="280" height="27" rx="13" fill="#FCECEC" stroke="#FCECEC" stroke-width="0"/>
<text x="1240.0" y="588" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#C74747" text-anchor="middle" opacity="1">Duplicate delivery possible</text>
<rect x="50" y="710" width="1450" height="245" rx="14" fill="#FFFFFF" stroke="#E7EDF4" stroke-width="1"/>
<text x="80" y="745" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#138A83" text-anchor="start" opacity="1">EXACTLY-ONCE EFFECT (INBOX)</text>
<text x="260" y="786" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52647A" text-anchor="middle" opacity="1">Send</text>
<line x1="260" y1="800" x2="260" y2="920" stroke="#E7EDF4" stroke-width="1.2" fill="none" stroke-dasharray="4 5"/>
<text x="470" y="786" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52647A" text-anchor="middle" opacity="1">Persist</text>
<line x1="470" y1="800" x2="470" y2="920" stroke="#E7EDF4" stroke-width="1.2" fill="none" stroke-dasharray="4 5"/>
<text x="680" y="786" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52647A" text-anchor="middle" opacity="1">Receive</text>
<line x1="680" y1="800" x2="680" y2="920" stroke="#E7EDF4" stroke-width="1.2" fill="none" stroke-dasharray="4 5"/>
<text x="890" y="786" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52647A" text-anchor="middle" opacity="1">DB effect</text>
<line x1="890" y1="800" x2="890" y2="920" stroke="#E7EDF4" stroke-width="1.2" fill="none" stroke-dasharray="4 5"/>
<text x="1100" y="786" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52647A" text-anchor="middle" opacity="1">ACK / offset</text>
<line x1="1100" y1="800" x2="1100" y2="920" stroke="#E7EDF4" stroke-width="1.2" fill="none" stroke-dasharray="4 5"/>
<text x="1320" y="786" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#52647A" text-anchor="middle" opacity="1">Failure / retry</text>
<line x1="1320" y1="800" x2="1320" y2="920" stroke="#E7EDF4" stroke-width="1.2" fill="none" stroke-dasharray="4 5"/>
<line x1="260" y1="835" x2="470" y2="835" stroke="#138A83" stroke-width="2.3" fill="none" marker-end="url(#arr-teal)"/>
<line x1="470" y1="835" x2="680" y2="835" stroke="#138A83" stroke-width="2.3" fill="none" marker-end="url(#arr-teal)"/>
<line x1="680" y1="835" x2="890" y2="835" stroke="#138A83" stroke-width="2.3" fill="none" marker-end="url(#arr-teal)"/>
<line x1="890" y1="835" x2="1100" y2="835" stroke="#138A83" stroke-width="2.3" fill="none" marker-end="url(#arr-teal)"/>
<line x1="1100" y1="835" x2="1320" y2="835" stroke="#138A83" stroke-width="2.3" fill="none" marker-end="url(#arr-teal)"/>
<rect x="650" y="855" width="420" height="65" rx="10" fill="#E7F6F3" stroke="#138A83" stroke-width="1.5"/>
<text x="860.0" y="879" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="860.0" dy="0">Unique event ID + business mutation</tspan>
<tspan x="860.0" dy="16.25">commit in one DB transaction.</tspan>
</text>
<rect x="1090" y="855" width="300" height="27" rx="13" fill="#E8F6EE" stroke="#E8F6EE" stroke-width="0"/>
<text x="1240.0" y="873" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#23865B" text-anchor="middle" opacity="1">Duplicate → no-op</text>
<text x="775" y="1015" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52647A" text-anchor="middle" opacity="1">“Exactly once” is scoped: an atomic inbox can guarantee one database effect, not universal one-time delivery across arbitrary external systems.</text>
</svg>