<text x="1290" y="570" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#138A83" text-anchor="middle" opacity="1">Decode side: schema resolution + compatibility checks</text>
<rect x="130" y="650" width="1290" height="100" rx="10" fill="#FFF3E2" stroke="#D97706" stroke-width="1.5"/>
<text x="775.0" y="674" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="775.0" dy="0">Compatibility is a protocol concern: producer and consumer may run different software versions.</tspan>
<tspan x="775.0" dy="16.25">A schema ID alone does not make an incompatible change safe; the reader/writer rules must permit it.</tspan>
</text>
