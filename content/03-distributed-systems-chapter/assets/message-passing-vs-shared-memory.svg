<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="850" viewBox="0 0 1450 850" role="img" aria-labelledby="title desc">
<title id="title">Message passing versus shared memory</title><desc id="desc">Message passing transfers owned messages through explicit channels; shared memory exposes common bytes requiring synchronization.</desc>
<defs>
          <marker id="arr-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FED"/></marker>
          <marker id="arr-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#138A83"/></marker>
          <marker id="arr-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
          <marker id="arr-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7655C7"/></marker>
          <marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C74747"/></marker>
          <marker id="arr-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52647A"/></marker>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#213047" flood-opacity=".08"/></filter>
        </defs>
<rect width="1450" height="850" fill="#F7F9FC"/>
<text x="725.0" y="42" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Message passing versus shared memory</text>
<text x="725.0" y="72" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#52647A" text-anchor="middle" opacity="1">Message passing transfers owned messages through explicit channels; shared memory exposes common bytes requiring synchronization.</text>
<rect x="55" y="125" width="650" height="610" rx="18" fill="#FFFFFF" stroke="#2F6FED" stroke-width="2" filter="url(#shadow)"/>
<rect x="745" y="125" width="650" height="610" rx="18" fill="#FFFFFF" stroke="#138A83" stroke-width="2" filter="url(#shadow)"/>
<text x="380" y="170" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2F6FED" text-anchor="middle" opacity="1">MESSAGE PASSING</text>
<text x="1070" y="170" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold" fill="#138A83" text-anchor="middle" opacity="1">SHARED MEMORY</text>
<rect x="100" y="270" width="190" height="110" rx="14" fill="#EAF1FF" stroke="#2F6FED" stroke-width="2" filter="url(#shadow)"/>
<rect x="100" y="270" width="7" height="110" rx="4" fill="blue" stroke="blue" stroke-width="0"/>
<text x="195.0" y="298" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Process A</text>
<text x="195.0" y="323" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52647A" text-anchor="middle">
<tspan x="195.0" dy="0">serialize object</tspan>
</text>
<rect x="330" y="270" width="180" height="110" rx="14" fill="#F1ECFF" stroke="#7655C7" stroke-width="2" filter="url(#shadow)"/>
<rect x="330" y="270" width="7" height="110" rx="4" fill="purple" stroke="purple" stroke-width="0"/>
<text x="420.0" y="298" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Queue / Socket</text>
<text x="420.0" y="323" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52647A" text-anchor="middle">
<tspan x="420.0" dy="0">buffered bytes</tspan>
<tspan x="420.0" dy="16.64">message boundary</tspan>
</text>
<rect x="550" y="270" width="110" height="110" rx="14" fill="#E7F6F3" stroke="#138A83" stroke-width="2" filter="url(#shadow)"/>
<rect x="550" y="270" width="7" height="110" rx="4" fill="teal" stroke="teal" stroke-width="0"/>
<text x="605.0" y="298" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Process B</text>
<text x="605.0" y="323" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52647A" text-anchor="middle">
<tspan x="605.0" dy="0">deserialize</tspan>
</text>
<line x1="290" y1="325" x2="330" y2="325" stroke="#2F6FED" stroke-width="2.5" fill="none" marker-end="url(#arr-blue)"/>
<line x1="510" y1="325" x2="550" y2="325" stroke="#2F6FED" stroke-width="2.5" fill="none" marker-end="url(#arr-blue)"/>
<rect x="100" y="460" width="560" height="150" rx="10" fill="#EAF1FF" stroke="#2F6FED" stroke-width="1.5"/>
<text x="380.0" y="484" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="380.0" dy="0">Message ownership is explicit</tspan>
<tspan x="380.0" dy="16.25">• Sender serializes and sends</tspan>
<tspan x="380.0" dy="16.25">• Receiver owns its decoded copy</tspan>
<tspan x="380.0" dy="16.25">• Contract defines schema, ACK and retry</tspan>
<tspan x="380.0" dy="16.25">• Can cross hosts through a network</tspan>
</text>
<rect x="800" y="270" width="190" height="110" rx="14" fill="#E7F6F3" stroke="#138A83" stroke-width="2" filter="url(#shadow)"/>
<rect x="800" y="270" width="7" height="110" rx="4" fill="teal" stroke="teal" stroke-width="0"/>
<text x="895.0" y="298" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Process A</text>
<text x="895.0" y="323" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52647A" text-anchor="middle">
<tspan x="895.0" dy="0">maps shared region</tspan>
</text>
<rect x="1100" y="270" width="190" height="110" rx="14" fill="#E7F6F3" stroke="#138A83" stroke-width="2" filter="url(#shadow)"/>
<rect x="1100" y="270" width="7" height="110" rx="4" fill="teal" stroke="teal" stroke-width="0"/>
<text x="1195.0" y="298" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Process B</text>
<text x="1195.0" y="323" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52647A" text-anchor="middle">
<tspan x="1195.0" dy="0">maps same region</tspan>
</text>
<rect x="990" y="460" width="220" height="100" rx="14" fill="#F1ECFF" stroke="#7655C7" stroke-width="2"/>
<text x="1100" y="495" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#7655C7" text-anchor="middle" opacity="1">Shared bytes</text>
<text x="1100" y="525" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52647A" text-anchor="middle" opacity="1">same memory region</text>
<line x1="895" y1="380" x2="1030" y2="460" stroke="#138A83" stroke-width="2.4" fill="none" marker-end="url(#arr-teal)"/>
<line x1="1195" y1="380" x2="1170" y2="460" stroke="#138A83" stroke-width="2.4" fill="none" marker-end="url(#arr-teal)"/>
<rect x="815" y="600" width="195" height="75" rx="14" fill="#FFF3E2" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<rect x="815" y="600" width="7" height="75" rx="4" fill="orange" stroke="orange" stroke-width="0"/>
<text x="912.5" y="628" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Mutex / atomics</text>
<text x="912.5" y="653" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52647A" text-anchor="middle">
<tspan x="912.5" dy="0">visibility + ordering</tspan>
</text>
<rect x="1115" y="600" width="195" height="75" rx="14" fill="#FCECEC" stroke="#C74747" stroke-width="2" filter="url(#shadow)"/>
<rect x="1115" y="600" width="7" height="75" rx="4" fill="red" stroke="red" stroke-width="0"/>
<text x="1212.5" y="628" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Race risk</text>
<text x="1212.5" y="653" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52647A" text-anchor="middle">
<tspan x="1212.5" dy="0">unsynchronized access</tspan>
</text>
<text x="1070" y="710" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52647A" text-anchor="middle" opacity="1">Usually host-local; distributed shared memory adds coherence and failure complexity.</text>
<rect x="90" y="665" width="560" height="48" rx="10" fill="#FFFFFF" stroke="#91A2B7" stroke-width="1.5"/>
<text x="370.0" y="689" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="370.0" dy="0">Network boundary: explicit message passing is the common distributed default.</tspan>
</text>
</svg>