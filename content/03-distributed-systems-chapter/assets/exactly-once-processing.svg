<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="970" viewBox="0 0 1500 970" role="img" aria-labelledby="title desc">
<title id="title">Kafka transactional consume-process-produce boundary</title><desc id="desc">Kafka transactions can atomically commit output records and consumed offsets; external side effects remain outside that transaction.</desc>
<defs>
          <marker id="arr-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FED"/></marker>
          <marker id="arr-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#138A83"/></marker>
          <marker id="arr-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
          <marker id="arr-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7655C7"/></marker>
          <marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C74747"/></marker>
          <marker id="arr-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52647A"/></marker>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#213047" flood-opacity=".08"/></filter>
        </defs>
<rect width="1500" height="970" fill="#F7F9FC"/>
<text x="750.0" y="42" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Kafka transactional consume-process-produce boundary</text>
<text x="750.0" y="72" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#52647A" text-anchor="middle" opacity="1">Kafka transactions can atomically commit output records and consumed offsets; external side effects remain outside that transaction.</text>
<rect x="70" y="125" width="1030" height="650" rx="18" fill="#EAF1FF" stroke="#2F6FED" stroke-width="2"/>
<text x="585" y="165" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="19" font-weight="bold" fill="#2F6FED" text-anchor="middle" opacity="1">KAFKA TRANSACTIONAL BOUNDARY</text>
<rect x="115" y="245" width="210" height="115" rx="14" fill="#FFFFFF" stroke="#2F6FED" stroke-width="2" filter="url(#shadow)"/>
<rect x="115" y="245" width="7" height="115" rx="4" fill="blue" stroke="blue" stroke-width="0"/>
<text x="220.0" y="273" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Input Topic</text>
<text x="220.0" y="298" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52647A" text-anchor="middle">
<tspan x="220.0" dy="0">records + offsets</tspan>
</text>
<rect x="420" y="245" width="210" height="115" rx="14" fill="#FFFFFF" stroke="#138A83" stroke-width="2" filter="url(#shadow)"/>
<rect x="420" y="245" width="7" height="115" rx="4" fill="teal" stroke="teal" stroke-width="0"/>
<text x="525.0" y="273" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Consumer App</text>
<text x="525.0" y="298" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52647A" text-anchor="middle">
<tspan x="525.0" dy="0">read + process</tspan>
</text>
<rect x="730" y="245" width="210" height="115" rx="14" fill="#FFFFFF" stroke="#7655C7" stroke-width="2" filter="url(#shadow)"/>
<rect x="730" y="245" width="7" height="115" rx="4" fill="purple" stroke="purple" stroke-width="0"/>
<text x="835.0" y="273" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Transactional Producer</text>
<text x="835.0" y="298" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52647A" text-anchor="middle">
<tspan x="835.0" dy="0">output records</tspan>
</text>
<rect x="420" y="505" width="210" height="100" rx="14" fill="#FFF3E2" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<rect x="420" y="505" width="7" height="100" rx="4" fill="orange" stroke="orange" stroke-width="0"/>
<text x="525.0" y="533" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Transaction Coordinator</text>
<text x="525.0" y="558" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52647A" text-anchor="middle">
<tspan x="525.0" dy="0">commit / abort</tspan>
</text>
<rect x="730" y="505" width="210" height="100" rx="14" fill="#E8F6EE" stroke="#23865B" stroke-width="2" filter="url(#shadow)"/>
<rect x="730" y="505" width="7" height="100" rx="4" fill="green" stroke="green" stroke-width="0"/>
<text x="835.0" y="533" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Output Topic</text>
<text x="835.0" y="558" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52647A" text-anchor="middle">
<tspan x="835.0" dy="0">committed records</tspan>
</text>
<line x1="325" y1="300" x2="420" y2="300" stroke="#2F6FED" stroke-width="2.5" fill="none" marker-end="url(#arr-blue)"/>
<rect x="304.5" y="258" width="136" height="25" rx="6" fill="#F7F9FC" stroke="#F7F9FC" stroke-width="0"/>
<text x="372.5" y="275" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2F6FED" text-anchor="middle" opacity="1">poll</text>
<line x1="630" y1="300" x2="730" y2="300" stroke="#138A83" stroke-width="2.5" fill="none" marker-end="url(#arr-teal)"/>
<rect x="612.0" y="258" width="136" height="25" rx="6" fill="#F7F9FC" stroke="#F7F9FC" stroke-width="0"/>
<text x="680.0" y="275" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#138A83" text-anchor="middle" opacity="1">write outputs</text>
<line x1="835" y1="360" x2="835" y2="505" stroke="#7655C7" stroke-width="2.5" fill="none" marker-end="url(#arr-purple)"/>
<rect x="832" y="418" width="136" height="25" rx="6" fill="#F7F9FC" stroke="#F7F9FC" stroke-width="0"/>
<text x="900" y="435" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#7655C7" text-anchor="middle" opacity="1">transaction</text>
<line x1="525" y1="360" x2="525" y2="505" stroke="#D97706" stroke-width="2.5" fill="none" marker-end="url(#arr-orange)"/>
<rect x="532" y="418" width="136" height="25" rx="6" fill="#F7F9FC" stroke="#F7F9FC" stroke-width="0"/>
<text x="600" y="435" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#D97706" text-anchor="middle" opacity="1">offsets sent to txn</text>
<line x1="630" y1="555" x2="730" y2="555" stroke="#23865B" stroke-width="2.5" fill="none" marker-end="url(#arr-gray)"/>
<rect x="612.0" y="513" width="136" height="25" rx="6" fill="#F7F9FC" stroke="#F7F9FC" stroke-width="0"/>
<text x="680.0" y="530" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#23865B" text-anchor="middle" opacity="1">commit</text>
<path d="M525 605 L525 680 L230 680 L230 360" fill="none" stroke="#C74747" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arr-red)"/>
<text x="355" y="665" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#C74747" text-anchor="middle" opacity="1">ABORT: output + offsets not committed</text>
<rect x="1170" y="235" width="270" height="145" rx="14" fill="#FCECEC" stroke="#C74747" stroke-width="2" filter="url(#shadow)"/>
<rect x="1170" y="235" width="7" height="145" rx="4" fill="red" stroke="red" stroke-width="0"/>
<text x="1305.0" y="263" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">External systems</text>
<text x="1305.0" y="288" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52647A" text-anchor="middle">
<tspan x="1305.0" dy="0">SQL database</tspan>
<tspan x="1305.0" dy="16.64">Payment API / email</tspan>
</text>
<path d="M940 300 L1090 300 L1090 300 L1170 300" fill="none" stroke="#C74747" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arr-red)"/>
<rect x="1150" y="455" width="310" height="175" rx="10" fill="#FFF3E2" stroke="#D97706" stroke-width="1.5"/>
<text x="1305.0" y="479" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="1305.0" dy="0">Outside Kafka transaction</tspan>
<tspan x="1305.0" dy="16.25">Kafka cannot atomically include</tspan>
<tspan x="1305.0" dy="16.25">an arbitrary external DB or API.</tspan>
<tspan x="1305.0" dy="16.25">Use outbox/inbox, idempotency,</tspan>
<tspan x="1305.0" dy="16.25">or distributed transaction design.</tspan>
</text>
<rect x="1150" y="680" width="310" height="100" rx="10" fill="#E7F6F3" stroke="#138A83" stroke-width="1.5"/>
<text x="1305.0" y="704" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="1305.0" dy="0">read_committed consumers</tspan>
<tspan x="1305.0" dy="16.25">do not see aborted transactional</tspan>
<tspan x="1305.0" dy="16.25">output records.</tspan>
</text>
<text x="580" y="850" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#52647A" text-anchor="middle" opacity="1">Exactly-once scope = Kafka input offsets + Kafka output records under supported transactional configuration.</text>
</svg>