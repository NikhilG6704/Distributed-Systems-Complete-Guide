<text x="750.0" y="42" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">gRPC over HTTP/2 connection architecture</text>
<text x="750.0" y="72" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#52647A" text-anchor="middle" opacity="1">One TCP+TLS connection can carry multiple interleaved HTTP/2 streams; a gRPC message may span DATA frames.</text>
