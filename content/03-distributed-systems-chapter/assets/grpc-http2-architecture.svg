<text x="1335.0" y="188" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52647A" text-anchor="middle">
<tspan x="1335.0" dy="0">Runtime + service</tspan>
