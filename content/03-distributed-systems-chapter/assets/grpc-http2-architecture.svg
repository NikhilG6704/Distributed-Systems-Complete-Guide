<rect x="55" y="770" width="430" height="120" rx="10" fill="#EAF1FF" stroke="#2F6FED" stroke-width="1.5"/>
<text x="270.0" y="794" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="270.0" dy="0">gRPC message framing</tspan>
<tspan x="270.0" dy="16.25">5-byte prefix + serialized message bytes.</tspan>
<tspan x="270.0" dy="16.25">A message can be fragmented across DATA frames.</tspan>
</text>
<rect x="535" y="770" width="430" height="120" rx="10" fill="#E7F6F3" stroke="#138A83" stroke-width="1.5"/>
<text x="750.0" y="794" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="750.0" dy="0">Flow control</tspan>
<tspan x="750.0" dy="16.25">Stream-level and connection-level windows</tspan>
<tspan x="750.0" dy="16.25">bound in-flight DATA bytes.</tspan>
</text>
<rect x="1015" y="770" width="430" height="120" rx="10" fill="#FCECEC" stroke="#C74747" stroke-width="1.5"/>
<text x="1230.0" y="794" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="1230.0" dy="0">TCP head-of-line blocking</tspan>
<tspan x="1230.0" dy="16.25">Packet loss can stall later bytes on this</tspan>
<tspan x="1230.0" dy="16.25">shared TCP connection, even across streams.</tspan>
</text>
<text x="750" y="940" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52647A" text-anchor="middle" opacity="1">HEADERS / DATA / TRAILERS are HTTP/2 frames; they are not identical to application-level gRPC messages.</text>
