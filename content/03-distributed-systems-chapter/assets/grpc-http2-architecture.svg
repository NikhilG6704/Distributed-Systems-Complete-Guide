<text x="750" y="174" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52647A" text-anchor="middle" opacity="1">HPACK-compressed headers • binary frames • persistent connection</text>
