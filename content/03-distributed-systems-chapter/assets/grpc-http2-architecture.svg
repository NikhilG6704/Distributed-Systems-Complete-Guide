<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
<title id="title">gRPC over HTTP/2 connection architecture</title><desc id="desc">One TCP+TLS connection can carry multiple interleaved HTTP/2 streams; a gRPC message may span DATA frames.</desc>
