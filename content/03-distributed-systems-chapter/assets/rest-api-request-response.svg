<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="900" viewBox="0 0 1450 900" role="img" aria-labelledby="title desc">
<title id="title">REST API request-response and conditional caching</title><desc id="desc">A resource representation is requested over HTTP; ETags enable conditional validation and 304 responses.</desc>
<defs>
          <marker id="arr-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FED"/></marker>
          <marker id="arr-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#138A83"/></marker>
          <marker id="arr-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
          <marker id="arr-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7655C7"/></marker>
          <marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C74747"/></marker>
          <marker id="arr-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52647A"/></marker>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#213047" flood-opacity=".08"/></filter>
        </defs>
<rect width="1450" height="900" fill="#F7F9FC"/>
<text x="725.0" y="42" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">REST API request-response and conditional caching</text>
<text x="725.0" y="72" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#52647A" text-anchor="middle" opacity="1">A resource representation is requested over HTTP; ETags enable conditional validation and 304 responses.</text>
<rect x="70" y="135" width="220" height="100" rx="14" fill="#EAF1FF" stroke="#2F6FED" stroke-width="2" filter="url(#shadow)"/>
<rect x="70" y="135" width="7" height="100" rx="4" fill="blue" stroke="blue" stroke-width="0"/>
<text x="180.0" y="163" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Client</text>
<text x="180.0" y="188" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52647A" text-anchor="middle">
<tspan x="180.0" dy="0">Browser / mobile / SDK</tspan>
</text>
<rect x="610" y="135" width="230" height="100" rx="14" fill="#F1ECFF" stroke="#7655C7" stroke-width="2" filter="url(#shadow)"/>
<rect x="610" y="135" width="7" height="100" rx="4" fill="purple" stroke="purple" stroke-width="0"/>
<text x="725.0" y="163" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">API Gateway</text>
<text x="725.0" y="188" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52647A" text-anchor="middle">
<tspan x="725.0" dy="0">Routing • auth • limits</tspan>
</text>
<rect x="1120" y="135" width="230" height="100" rx="14" fill="#E7F6F3" stroke="#138A83" stroke-width="2" filter="url(#shadow)"/>
<rect x="1120" y="135" width="7" height="100" rx="4" fill="teal" stroke="teal" stroke-width="0"/>
<text x="1235.0" y="163" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Product Service</text>
<text x="1235.0" y="188" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52647A" text-anchor="middle">
<tspan x="1235.0" dy="0">Resource handler</tspan>
</text>
<line x1="290" y1="185" x2="610" y2="185" stroke="#2F6FED" stroke-width="3" fill="none" marker-end="url(#arr-blue)"/>
<rect x="382.0" y="140" width="136" height="25" rx="6" fill="#F7F9FC" stroke="#F7F9FC" stroke-width="0"/>
<text x="450.0" y="157" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2F6FED" text-anchor="middle" opacity="1">GET /v1/products/SKU-100</text>
<line x1="840" y1="185" x2="1120" y2="185" stroke="#2F6FED" stroke-width="3" fill="none" marker-end="url(#arr-blue)"/>
<rect x="912.0" y="140" width="136" height="25" rx="6" fill="#F7F9FC" stroke="#F7F9FC" stroke-width="0"/>
<text x="980.0" y="157" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2F6FED" text-anchor="middle" opacity="1">forward request</text>
<line x1="1120" y1="230" x2="840" y2="230" stroke="#138A83" stroke-width="2.6" fill="none" marker-end="url(#arr-teal)"/>
<rect x="912.0" y="238" width="136" height="25" rx="6" fill="#F7F9FC" stroke="#F7F9FC" stroke-width="0"/>
<text x="980.0" y="255" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#138A83" text-anchor="middle" opacity="1">200 JSON + ETag</text>
<line x1="610" y1="230" x2="290" y2="230" stroke="#138A83" stroke-width="2.6" fill="none" marker-end="url(#arr-teal)"/>
<rect x="382.0" y="238" width="136" height="25" rx="6" fill="#F7F9FC" stroke="#F7F9FC" stroke-width="0"/>
<text x="450.0" y="255" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#138A83" text-anchor="middle" opacity="1">200 OK + representation</text>
<rect x="65" y="315" width="650" height="225" rx="14" fill="#FFFFFF" stroke="#E7EDF4" stroke-width="1.5"/>
<text x="90" y="350" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2F6FED" text-anchor="start" opacity="1">REQUEST</text>
<text x="95" y="385" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="16" font-weight="normal" fill="#16243A" text-anchor="start">
<tspan x="95" dy="0">GET /v1/products/SKU-100 HTTP/1.1</tspan>
<tspan x="95" dy="24.8">Accept: application/json</tspan>
<tspan x="95" dy="24.8">Authorization: Bearer &lt;token&gt;</tspan>
<tspan x="95" dy="24.8">(GET usually has no request body)</tspan>
</text>
<rect x="755" y="315" width="630" height="225" rx="14" fill="#FFFFFF" stroke="#E7EDF4" stroke-width="1.5"/>
<text x="780" y="350" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#138A83" text-anchor="start" opacity="1">RESPONSE</text>
<text x="785" y="385" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#16243A" text-anchor="start">
<tspan x="785" dy="0">HTTP/1.1 200 OK</tspan>
<tspan x="785" dy="21.75">Content-Type: application/json</tspan>
<tspan x="785" dy="21.75">Cache-Control: private, max-age=60</tspan>
<tspan x="785" dy="21.75">ETag: &quot;p-100-v7&quot;</tspan>
<tspan x="785" dy="21.75">{ &quot;sku&quot;: &quot;SKU-100&quot;, &quot;price&quot;: 49.99 }</tspan>
</text>
<path d="M180 560 L180 630 L1260 630 L1260 560" fill="none" stroke="#7655C7" stroke-width="2.5" marker-end="url(#arr-purple)"/>
<text x="720" y="610" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#7655C7" text-anchor="middle" opacity="1">Later: GET with If-None-Match: &quot;p-100-v7&quot;</text>
<path d="M1260 630 L1260 690 L180 690 L180 630" fill="none" stroke="#138A83" stroke-width="2.5" marker-end="url(#arr-teal)"/>
<rect x="440" y="715" width="580" height="85" rx="10" fill="#E7F6F3" stroke="#138A83" stroke-width="1.5"/>
<text x="730.0" y="739" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="730.0" dy="0">HTTP/1.1 304 Not Modified</tspan>
<tspan x="730.0" dy="16.25">No representation body; client reuses its cached copy.</tspan>
</text>
<rect x="70" y="820" width="1310" height="50" rx="10" fill="#FFFFFF" stroke="#91A2B7" stroke-width="1.5"/>
<text x="725.0" y="844" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="725.0" dy="0">HTTP semantics: method + target + headers + optional body; response = status + headers + optional representation.</tspan>
</text>
</svg>