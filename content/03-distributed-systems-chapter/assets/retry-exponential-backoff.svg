<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="850" viewBox="0 0 1700 850" role="img" aria-labelledby="title desc">
<title id="title">Exponential backoff with cap and request deadline</title><desc id="desc">Retry intervals grow geometrically, stop at a cap, and must fit within the end-to-end deadline.</desc>
