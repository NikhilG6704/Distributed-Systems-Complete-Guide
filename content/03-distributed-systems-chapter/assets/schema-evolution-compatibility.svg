<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="1000" viewBox="0 0 1550 1000" role="img" aria-labelledby="title desc">
<title id="title">Safe schema evolution during rolling deployments</title><desc id="desc">Expand, deploy tolerant readers, enable additive writer fields, observe, then contract only after old versions retire.</desc>
