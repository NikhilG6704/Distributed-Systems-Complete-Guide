<text x="775" y="130" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">DEPLOYMENT TIMELINE</text>
