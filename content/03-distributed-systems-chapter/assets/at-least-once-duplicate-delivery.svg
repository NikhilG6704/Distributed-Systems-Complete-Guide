<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="900" viewBox="0 0 1450 900" role="img" aria-labelledby="title desc">
<title id="title">At-least-once redelivery after lost acknowledgment</title><desc id="desc">The broker sees no ACK and cannot know the consumer already committed the business transaction.</desc>
<defs>
          <marker id="arr-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FED"/></marker>
          <marker id="arr-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#138A83"/></marker>
          <marker id="arr-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
          <marker id="arr-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7655C7"/></marker>
          <marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C74747"/></marker>
          <marker id="arr-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52647A"/></marker>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#213047" flood-opacity=".08"/></filter>
        </defs>
<rect width="1450" height="900" fill="#F7F9FC"/>
<text x="725.0" y="42" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">At-least-once redelivery after lost acknowledgment</text>
<text x="725.0" y="72" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#52647A" text-anchor="middle" opacity="1">The broker sees no ACK and cannot know the consumer already committed the business transaction.</text>
<rect x="60" y="130" width="620" height="650" rx="12" fill="#FFFFFF" stroke="#E7EDF4" stroke-width="1"/>
<rect x="60" y="130" width="620" height="38" rx="12" fill="#2F6FED" stroke="#2F6FED" stroke-width="0"/>
<rect x="60" y="155" width="620" height="13" rx="0" fill="#2F6FED" stroke="#2F6FED" stroke-width="0"/>
<text x="370.0" y="155" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" opacity="1">BROKER</text>
<rect x="770" y="130" width="620" height="650" rx="12" fill="#FFFFFF" stroke="#E7EDF4" stroke-width="1"/>
<rect x="770" y="130" width="620" height="38" rx="12" fill="#138A83" stroke="#138A83" stroke-width="0"/>
<rect x="770" y="155" width="620" height="13" rx="0" fill="#138A83" stroke="#138A83" stroke-width="0"/>
<text x="1080.0" y="155" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" opacity="1">CONSUMER</text>
<line x1="210" y1="205" x2="210" y2="705" stroke="#91A2B7" stroke-width="1.5" fill="none" stroke-dasharray="5 7"/>
<line x1="500" y1="205" x2="500" y2="705" stroke="#91A2B7" stroke-width="1.5" fill="none" stroke-dasharray="5 7"/>
<line x1="920" y1="205" x2="920" y2="705" stroke="#91A2B7" stroke-width="1.5" fill="none" stroke-dasharray="5 7"/>
<line x1="1220" y1="205" x2="1220" y2="705" stroke="#91A2B7" stroke-width="1.5" fill="none" stroke-dasharray="5 7"/>
<text x="210" y="190" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Message log</text>
<text x="500" y="190" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Visibility / offset</text>
<text x="920" y="190" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Handler</text>
<text x="1220" y="190" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Database</text>
<line x1="210" y1="280" x2="920" y2="280" stroke="#2F6FED" stroke-width="2.3" fill="none" marker-end="url(#arr-blue)"/>
<rect x="197.0" y="255.0" width="136" height="25" rx="6" fill="#F7F9FC" stroke="#F7F9FC" stroke-width="0"/>
<text x="265.0" y="272.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2F6FED" text-anchor="middle" opacity="1">565.0</text>
<line x1="920" y1="360" x2="1220" y2="360" stroke="#138A83" stroke-width="2.3" fill="none" marker-end="url(#arr-teal)"/>
<rect x="277.0" y="335.0" width="136" height="25" rx="6" fill="#F7F9FC" stroke="#F7F9FC" stroke-width="0"/>
<text x="345.0" y="352.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#138A83" text-anchor="middle" opacity="1">1070.0</text>
<line x1="1220" y1="420" x2="920" y2="420" stroke="#D97706" stroke-width="2.3" fill="none" marker-end="url(#arr-orange)"/>
<rect x="337.0" y="395.0" width="136" height="25" rx="6" fill="#F7F9FC" stroke="#F7F9FC" stroke-width="0"/>
<text x="405.0" y="412.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#D97706" text-anchor="middle" opacity="1">1070.0</text>
<rect x="820" y="465" width="500" height="70" rx="10" fill="#FCECEC" stroke="#C74747" stroke-width="1.5"/>
<text x="1070.0" y="489" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="1070.0" dy="0">Consumer crashes before sending ACK</tspan>
<tspan x="1070.0" dy="16.25">(the database commit already happened).</tspan>
</text>
<line x1="500" y1="545" x2="500" y2="605" stroke="#C74747" stroke-width="2.5" fill="none" marker-end="url(#arr-red)"/>
<rect x="517" y="543" width="136" height="25" rx="6" fill="#F7F9FC" stroke="#F7F9FC" stroke-width="0"/>
<text x="585" y="560" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#C74747" text-anchor="middle" opacity="1">visibility timeout / offset uncommitted</text>
<line x1="210" y1="655" x2="920" y2="655" stroke="#D97706" stroke-width="2.3" fill="none" marker-end="url(#arr-orange)"/>
<rect x="572.0" y="630.0" width="136" height="25" rx="6" fill="#F7F9FC" stroke="#F7F9FC" stroke-width="0"/>
<text x="640.0" y="647.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#D97706" text-anchor="middle" opacity="1">565.0</text>
<rect x="805" y="690" width="520" height="65" rx="10" fill="#E8F6EE" stroke="#23865B" stroke-width="1.5"/>
<text x="1065.0" y="714" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="1065.0" dy="0">Idempotent inbox checks evt-123: already processed → no-op.</tspan>
</text>
<rect x="75" y="815" width="1300" height="55" rx="10" fill="#FFF3E2" stroke="#D97706" stroke-width="1.5"/>
<text x="725.0" y="839" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="725.0" dy="0">Missing ACK is ambiguous: it may mean “not processed” or “processed but ACK lost.”</tspan>
</text>
</svg>