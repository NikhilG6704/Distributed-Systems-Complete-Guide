<rect x="682.0" y="358" width="136" height="25" rx="6" fill="#F7F9FC" stroke="#F7F9FC" stroke-width="0"/>
<text x="750.0" y="375" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#23865B" text-anchor="middle" opacity="1">left subtree hash matches</text>
<path d="M540 400 L610 500 L960 500" fill="none" stroke="#C74747" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arr-red)"/>
<text x="750" y="525" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#C74747" text-anchor="middle" opacity="1">Traverse mismatching right branch</text>
<rect x="150" y="680" width="1200" height="120" rx="10" fill="#FFF3E2" stroke="#D97706" stroke-width="1.5"/>
<text x="750.0" y="704" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="750.0" dy="0">Compare hashes top-down: equal hash → skip descendants; unequal hash → recurse into child hashes.</tspan>
<tspan x="750.0" dy="16.25">At the differing leaf/key range, transfer missing or divergent records, merge by the database’s version/conflict rules, then recompute hashes.</tspan>
<tspan x="750.0" dy="16.25">Assumes canonical serialization and a collision-resistant hash; a Merkle tree identifies differences, it does not define conflict resolution.</tspan>
</text>
