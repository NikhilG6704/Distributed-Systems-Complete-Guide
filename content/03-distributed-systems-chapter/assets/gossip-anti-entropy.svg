<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
<title id="title">Merkle-tree anti-entropy between replicas</title><desc id="desc">Matching hashes prune equal subtrees; only the mismatching key range needs detailed comparison and transfer.</desc>
