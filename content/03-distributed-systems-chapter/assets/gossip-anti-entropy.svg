<path d="M390 250 C600 180 900 180 1110 250" fill="none" stroke="#7655C7" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr-purple)"/>
<text x="750" y="190" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#7655C7" text-anchor="middle" opacity="1">Root hashes differ</text>
