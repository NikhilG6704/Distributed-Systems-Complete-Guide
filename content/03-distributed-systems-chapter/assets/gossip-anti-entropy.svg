<circle cx="1260" cy="400" r="27" fill="#FCECEC" stroke="#C74747" stroke-width="2"/>
<text x="1260" y="405" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">H2</text>
