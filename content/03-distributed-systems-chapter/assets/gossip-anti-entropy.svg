<text x="390" y="150" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F6FED" text-anchor="middle" opacity="1">REPLICA A</text>
