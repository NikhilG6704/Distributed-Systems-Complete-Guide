<circle cx="1030" cy="550" r="27" fill="#FFFFFF" stroke="#138A83" stroke-width="2"/>
<text x="1030" y="555" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">K2</text>
