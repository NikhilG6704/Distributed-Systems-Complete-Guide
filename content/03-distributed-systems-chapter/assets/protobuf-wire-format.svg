<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="850" viewBox="0 0 1450 850" role="img" aria-labelledby="title desc">
<title id="title">Protocol Buffers wire-format field example</title><desc id="desc">A field tag combines field number and wire type; the field payload follows according to that wire type.</desc>
<defs>
          <marker id="arr-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FED"/></marker>
          <marker id="arr-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#138A83"/></marker>
          <marker id="arr-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
          <marker id="arr-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7655C7"/></marker>
          <marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C74747"/></marker>
          <marker id="arr-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52647A"/></marker>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#213047" flood-opacity=".08"/></filter>
        </defs>
<rect width="1450" height="850" fill="#F7F9FC"/>
<text x="725.0" y="42" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Protocol Buffers wire-format field example</text>
<text x="725.0" y="72" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="normal" fill="#52647A" text-anchor="middle" opacity="1">A field tag combines field number and wire type; the field payload follows according to that wire type.</text>
<rect x="100" y="115" width="1250" height="88" rx="10" fill="#EAF1FF" stroke="#2F6FED" stroke-width="1.5"/>
<text x="725.0" y="139" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="725.0" dy="0">tag = (field_number &lt;&lt; 3) | wire_type</tspan>
<tspan x="725.0" dy="16.25">Example: field 1, length-delimited string → (1 &lt;&lt; 3) | 2 = 10 = 0x0A</tspan>
</text>
<text x="725" y="270" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="19" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Encoded bytes for message: field 1 = &quot;abc&quot;</text>
<rect x="220" y="330" width="170" height="155" rx="12" fill="#EAF1FF" stroke="#2F6FED" stroke-width="2"/>
<text x="305.0" y="390" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">0A</text>
<text x="305.0" y="430" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2F6FED" text-anchor="middle" opacity="1">TAG</text>
<text x="305.0" y="458" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52647A" text-anchor="middle" opacity="1">field 1 • wire type 2</text>
<rect x="418" y="330" width="120" height="155" rx="12" fill="#FFF3E2" stroke="#D97706" stroke-width="2"/>
<text x="478.0" y="390" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">03</text>
<text x="478.0" y="430" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#D97706" text-anchor="middle" opacity="1">LENGTH</text>
<text x="478.0" y="458" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52647A" text-anchor="middle" opacity="1">3 payload bytes</text>
<rect x="566" y="330" width="310" height="155" rx="12" fill="#E7F6F3" stroke="#138A83" stroke-width="2"/>
<text x="721.0" y="390" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="27" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">61 62 63</text>
<text x="721.0" y="430" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#138A83" text-anchor="middle" opacity="1">UTF-8 BYTES</text>
<text x="721.0" y="458" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52647A" text-anchor="middle" opacity="1">a  b  c</text>
<text x="725" y="555" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Wire types</text>
<rect x="110" y="590" width="590" height="70" rx="10" fill="#FFFFFF" stroke="#2F6FED" stroke-width="1.5"/>
<rect x="124" y="610" width="45" height="27" rx="13" fill="#2F6FED" stroke="#2F6FED" stroke-width="0"/>
<text x="146.5" y="628" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" opacity="1">0</text>
<text x="190" y="619" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#16243A" text-anchor="start" opacity="1">Varint</text>
<text x="190" y="641" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52647A" text-anchor="start" opacity="1">integers / booleans</text>
<rect x="745" y="590" width="590" height="70" rx="10" fill="#FFFFFF" stroke="#7655C7" stroke-width="1.5"/>
<rect x="759" y="610" width="45" height="27" rx="13" fill="#7655C7" stroke="#7655C7" stroke-width="0"/>
<text x="781.5" y="628" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" opacity="1">1</text>
<text x="825" y="619" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#16243A" text-anchor="start" opacity="1">64-bit</text>
<text x="825" y="641" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52647A" text-anchor="start" opacity="1">fixed64 / double</text>
<rect x="110" y="685" width="590" height="70" rx="10" fill="#FFFFFF" stroke="#138A83" stroke-width="1.5"/>
<rect x="124" y="705" width="45" height="27" rx="13" fill="#138A83" stroke="#138A83" stroke-width="0"/>
<text x="146.5" y="723" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" opacity="1">2</text>
<text x="190" y="714" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#16243A" text-anchor="start" opacity="1">Length-delimited</text>
<text x="190" y="736" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52647A" text-anchor="start" opacity="1">string / bytes / embedded message</text>
<rect x="745" y="685" width="590" height="70" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<rect x="759" y="705" width="45" height="27" rx="13" fill="#D97706" stroke="#D97706" stroke-width="0"/>
<text x="781.5" y="723" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" opacity="1">5</text>
<text x="825" y="714" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#16243A" text-anchor="start" opacity="1">32-bit</text>
<text x="825" y="736" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52647A" text-anchor="start" opacity="1">fixed32 / float</text>
<rect x="170" y="800" width="1110" height="40" rx="10" fill="#FCECEC" stroke="#C74747" stroke-width="1.5"/>
<text x="725.0" y="824" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="725.0" dy="0">Field numbers are stable wire identities: never reuse a deleted field number.</tspan>
</text>
</svg>