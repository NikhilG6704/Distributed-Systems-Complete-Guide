<tspan x="1195.0" dy="0">request handling</tspan>
</text>
<path d="M380 227 L460 377" fill="none" stroke="#2F6FED" stroke-width="3" marker-end="url(#arr-blue)"/>
<text x="420.0" y="288.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#C74747" text-anchor="middle" opacity="1">×3 retry</text>
<path d="M690 377 L770 527" fill="none" stroke="#2F6FED" stroke-width="3" marker-end="url(#arr-blue)"/>
<text x="730.0" y="438.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#C74747" text-anchor="middle" opacity="1">×3 retry</text>
<path d="M1000 527 L1080 677" fill="none" stroke="#2F6FED" stroke-width="3" marker-end="url(#arr-blue)"/>
<text x="1040.0" y="588.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#C74747" text-anchor="middle" opacity="1">×3 retry</text>
<path d="M1190 630 C1370 580 1360 470 1195 520" fill="none" stroke="#C74747" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arr-red)"/>
<path d="M880 480 C1060 420 1040 325 690 375" fill="none" stroke="#C74747" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arr-red)"/>
<path d="M570 330 C800 250 740 170 370 225" fill="none" stroke="#C74747" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arr-red)"/>
<rect x="65" y="730" width="560" height="165" rx="10" fill="#FCECEC" stroke="#C74747" stroke-width="1.5"/>
<text x="345.0" y="754" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="345.0" dy="0">Failure loop</tspan>
<tspan x="345.0" dy="16.25">1. DB latency rises.</tspan>
<tspan x="345.0" dy="16.25">2. Payment calls time out and retry.</tspan>
<tspan x="345.0" dy="16.25">3. Order retries Payment; Gateway retries Order.</tspan>
<tspan x="345.0" dy="16.25">4. More load increases latency further.</tspan>
</text>
<rect x="680" y="730" width="750" height="165" rx="10" fill="#E7F6F3" stroke="#138A83" stroke-width="1.5"/>
<text x="1055.0" y="754" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#16243A" text-anchor="middle">
<tspan x="1055.0" dy="0">Controls</tspan>
<tspan x="1055.0" dy="16.25">• Propagate one end-to-end deadline</tspan>
<tspan x="1055.0" dy="16.25">• Retry budget + bounded attempts</tspan>
<tspan x="1055.0" dy="16.25">• Circuit breaker + bulkheads</tspan>
<tspan x="1055.0" dy="16.25">• Bounded queues and backpressure</tspan>
<tspan x="1055.0" dy="16.25">• Load shedding; monitor retry rate</tspan>
</text>
<text x="750" y="950" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#C74747" text-anchor="middle" opacity="1">Illustrative policy: 3 × 3 × 3 = up to 27 deepest-layer attempts from one original request.</text>
</svg>