<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
<title id="title">Retry amplification and cascading failure</title><desc id="desc">Retries at multiple service layers multiply load; deadlines, budgets, breakers and bounded queues contain amplification.</desc>
<defs>
          <marker id="arr-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FED"/></marker>
