<text x="575.0" y="358" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#16243A" text-anchor="middle" opacity="1">Order Service</text>
<text x="575.0" y="383" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52647A" text-anchor="middle">
<tspan x="575.0" dy="0">request handling</tspan>
</text>
