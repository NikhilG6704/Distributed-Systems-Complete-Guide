<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">Gossip dissemination: push, pull and push-pull</title><desc id="desc">Nodes exchange versioned state with selected peers; convergence is asynchronous and probabilistic.</desc>
