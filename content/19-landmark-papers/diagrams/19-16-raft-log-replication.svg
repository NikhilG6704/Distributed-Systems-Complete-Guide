<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Raft log replication and commit"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b74343"/></marker><marker id="arr-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23845a"/></marker><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#23344d" flood-opacity=".08"/></filter></defs><rect x="0" y="0" width="1440" height="900" fill="#f7f9fc"/><rect x="0" y="0" width="1440" height="12" fill="#3267a8"/><text x="58" y="62.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" fill="#17243a"><tspan x="58" dy="0.0">Raft log replication and commit</tspan></text><text x="58" y="105.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6b82"><tspan x="58" dy="0.0">The leader replicates entries with AppendEntries; committed entries are applied in index order.</tspan></text><line x1="58" y1="132" x2="1382" y2="132" stroke="#d8e0eb" stroke-width="2"/><path d="M198.0,317.0 C198.0,354.0 198.0,368.0 198.0,405.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="151.0" y="334.0" width="94.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="198.0" y="351.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#64748b"><tspan x="198.0" dy="0.0">replicate</tspan></text><path d="M198.0,405.0 C342.9,405.0 398.1,317.0 543.0,317.0" fill="none" stroke="#b74343" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arr-red)"/><rect x="299.5" y="334.0" width="142.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="370.5" y="351.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#b74343"><tspan x="370.5" dy="0.0">reject conflict</tspan></text><path d="M543.0,317.0 C543.0,354.0 543.0,368.0 543.0,405.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="496.0" y="334.0" width="94.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="543.0" y="351.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#64748b"><tspan x="543.0" dy="0.0">backtrack</tspan></text><path d="M400.0,476.0 C375.2,476.0 365.8,476.0 341.0,476.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="335.5" y="449.0" width="70.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="370.5" y="466.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#64748b"><tspan x="370.5" dy="0.0">retry</tspan></text><path d="M341.0,476.0 C510.7,476.0 575.3,246.0 745.0,246.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="504.0" y="334.0" width="78.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="543.0" y="351.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#64748b"><tspan x="543.0" dy="0.0">success</tspan></text><path d="M888.0,317.0 C888.0,354.0 888.0,368.0 888.0,405.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="853.0" y="334.0" width="70.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="888.0" y="351.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#64748b"><tspan x="888.0" dy="0.0">quorum</tspan></text><path d="M1031.0,476.0 C1055.8,476.0 1065.2,476.0 1090.0,476.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="1025.5" y="449.0" width="70.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="1060.5" y="466.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#64748b"><tspan x="1060.5" dy="0.0">apply</tspan></text><rect x="55" y="175" width="286" height="142" rx="17" fill="#dceafe" stroke="#3267a8" stroke-width="2" filter="url(#soft)"/><text x="198.0" y="206.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="198.0" dy="0.0">Leader log</tspan></text><text x="198.0" y="243.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="198.0" dy="0.0">1:t1 · 2:t1 · 3:t2</tspan></text><rect x="400" y="175" width="286" height="142" rx="17" fill="#e9eef5" stroke="#64748b" stroke-width="2" filter="url(#soft)"/><text x="543.0" y="206.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="543.0" dy="0.0">Follower B</tspan></text><text x="543.0" y="243.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="543.0" dy="0.0">1:t1 · 2:t1 · 3:?</tspan></text><rect x="745" y="175" width="286" height="142" rx="17" fill="#dcf4e8" stroke="#23845a" stroke-width="2" filter="url(#soft)"/><text x="888.0" y="206.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="888.0" dy="0.0">Follower C</tspan></text><text x="888.0" y="243.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="888.0" dy="0.0">1:t1 · 2:t1 · 3:t2</tspan></text><rect x="55" y="405" width="286" height="142" rx="17" fill="#eee5ff" stroke="#7045a5" stroke-width="2" filter="url(#soft)"/><text x="198.0" y="436.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="198.0" dy="0.0">AppendEntries</tspan></text><text x="198.0" y="473.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="198.0" dy="0.0">prevLogIndex / prevLogTerm</tspan></text><rect x="400" y="405" width="286" height="142" rx="17" fill="#fff0cc" stroke="#a86a08" stroke-width="2" filter="url(#soft)"/><text x="543.0" y="436.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="543.0" dy="0.0">Conflict repair</tspan></text><text x="543.0" y="473.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="543.0" dy="0.0">decrement nextIndex;</tspan><tspan x="543.0" dy="19.0">overwrite suffix</tspan></text><rect x="745" y="405" width="286" height="142" rx="17" fill="#dcf4e8" stroke="#23845a" stroke-width="2" filter="url(#soft)"/><text x="888.0" y="436.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="888.0" dy="0.0">Majority replicated</tspan></text><text x="888.0" y="473.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="888.0" dy="0.0">advance commitIndex safely</tspan></text><rect x="1090" y="405" width="286" height="142" rx="17" fill="#e9eef5" stroke="#64748b" stroke-width="2" filter="url(#soft)"/><text x="1233.0" y="436.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="1233.0" dy="0.0">State machine</tspan></text><text x="1233.0" y="473.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="1233.0" dy="0.0">apply committed entries</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="837.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">A leader does not commit an arbitrary old-term entry merely by counting replicas; Raft’s current-term commitment rule is essential to safety.</tspan></text></svg>