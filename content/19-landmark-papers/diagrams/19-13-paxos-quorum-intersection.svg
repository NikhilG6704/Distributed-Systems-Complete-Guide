<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Paxos quorum intersection with five acceptors"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b74343"/></marker><marker id="arr-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23845a"/></marker><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#23344d" flood-opacity=".08"/></filter></defs><rect x="0" y="0" width="1440" height="900" fill="#f7f9fc"/><rect x="0" y="0" width="1440" height="12" fill="#3267a8"/><text x="58" y="62.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" fill="#17243a"><tspan x="58" dy="0.0">Paxos quorum intersection with five acceptors</tspan></text><text x="58" y="105.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6b82"><tspan x="58" dy="0.0">Any two majorities intersect; the shared acceptor carries information needed to preserve the chosen value.</tspan></text><line x1="58" y1="132" x2="1382" y2="132" stroke="#d8e0eb" stroke-width="2"/><text x="345" y="185.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17243a"><tspan x="345" dy="0.0">Quorum intersection: five acceptors</tspan></text><circle cx="180" cy="350" r="55" fill="#dceafe" stroke="#3267a8" stroke-width="3"/><text x="180" y="355.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" fill="#17243a"><tspan x="180" dy="0.0">A1</tspan></text><circle cx="335" cy="270" r="55" fill="#dceafe" stroke="#3267a8" stroke-width="3"/><text x="335" y="275.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" fill="#17243a"><tspan x="335" dy="0.0">A2</tspan></text><circle cx="490" cy="350" r="55" fill="#eee5ff" stroke="#7045a5" stroke-width="3"/><text x="490" y="355.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" fill="#17243a"><tspan x="490" dy="0.0">A3</tspan></text><circle cx="335" cy="500" r="55" fill="#dcf4e8" stroke="#23845a" stroke-width="3"/><text x="335" y="505.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" fill="#17243a"><tspan x="335" dy="0.0">A4</tspan></text><circle cx="180" cy="500" r="55" fill="#dcf4e8" stroke="#23845a" stroke-width="3"/><text x="180" y="505.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" fill="#17243a"><tspan x="180" dy="0.0">A5</tspan></text><path d="M180 350 L335 270 L490 350" stroke="#3267a8" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M490 350 L335 500 L180 500" stroke="#23845a" stroke-width="7" fill="none" stroke-linecap="round"/><text x="345" y="590.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#3267a8"><tspan x="345" dy="0.0">Q1 = {A1, A2, A3}</tspan></text><text x="345" y="625.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#23845a"><tspan x="345" dy="0.0">Q2 = {A3, A4, A5}</tspan></text><text x="345" y="675.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#7045a5"><tspan x="345" dy="0.0">Shared member: A3</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="837.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">Q1 = {A1,A2,A3}; Q2 = {A3,A4,A5}; A3 is the intersection. A later proposer must respect accepted-value reports from its Phase 1 quorum.</tspan></text></svg>