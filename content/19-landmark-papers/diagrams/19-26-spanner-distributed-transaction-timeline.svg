<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Spanner commit wait and external transaction ordering"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b74343"/></marker><marker id="arr-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23845a"/></marker><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#23344d" flood-opacity=".08"/></filter></defs><rect x="0" y="0" width="1440" height="900" fill="#f7f9fc"/><rect x="0" y="0" width="1440" height="12" fill="#3267a8"/><text x="58" y="62.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" fill="#17243a"><tspan x="58" dy="0.0">Spanner commit wait and external transaction ordering</tspan></text><text x="58" y="105.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6b82"><tspan x="58" dy="0.0">A transaction waits until its commit timestamp is definitely in the past before reporting completion.</tspan></text><line x1="58" y1="132" x2="1382" y2="132" stroke="#d8e0eb" stroke-width="2"/><rect x="58.0" y="155" width="184" height="52" rx="13" fill="#dceafe" stroke="#3267a8" stroke-width="2"/><text x="150.0" y="187.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243a"><tspan x="150.0" dy="0.0">Transaction T1</tspan></text><line x1="150.0" y1="210" x2="150.0" y2="745" stroke="#aab6c7" stroke-width="2" stroke-dasharray="7 7"/><rect x="438.0" y="155" width="184" height="52" rx="13" fill="#dceafe" stroke="#3267a8" stroke-width="2"/><text x="530.0" y="187.0" 