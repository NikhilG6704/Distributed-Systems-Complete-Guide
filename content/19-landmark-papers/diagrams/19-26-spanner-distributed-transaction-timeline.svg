ke-width="3"/><text x="1272.0" y="460.0" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#5b6b82"><tspan x="1272.0" dy="0.0">uncertainty interval</tspan></text><circle cx="530.0" cy="550.0" r="11" fill="#23845a" stroke="white" stroke-width="3"/><text x="548.0" y="527.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#5b6b82"><tspan x="548.0" dy="0.0">commit wait until earliest</tspan><tspan x="548.0" dy="16.0">&gt; s</tspan></text><circle cx="150.0" cy="625.0" r="11" fill="#23845a" stroke="white" stroke-width="3"/><text x="168.0" y="610.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#5b6b82"><tspan x="168.0" dy="0.0">T1 returns success</tspan></text><circle cx="150.0" cy="700.0" r="11" fill="#23845a" stroke="white" stroke-width="3"/><text x="168.0" y="685.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#5b6b82"><tspan x="168.0" dy="0.0">T2 begins after T1</tspan></text><path d="M150.0,250.0 Q340.0,261.5 530.0,325.0" fill="none" stroke="#3267a8" stroke-width="3" marker-end="url(#arr)"/><rect x="273.0" y="234.5" width="134" height="24" rx="11" fill="#f7f9fc" stroke="#d6dfeb"/><text x="340.0" y="251.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#3267a8"><tspan x="340.0" dy="0.0">begin</tspan></text><path d="M530.0,325.0 Q720.0,336.5 910.0,400.0" fill="none" stroke="#3267a8" stroke-width="3" marker-end="url(#arr)"/><rect x="653.0" y="309.5" width="134" height="24" rx="11" fill="#f7f9fc" stroke="#d6dfeb"/><text x="720.0" y="326.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#3267a8"><tspan x="720.0" dy="0.0">prepare / commit</tspan></text><path d="M530.0,550.0 Q910.0,524.0 1290.0,550.0" fill="none" stroke="#3267a8" stroke-width="3" marker-end="url(#arr)"/><rect x="843.0" y="497.0" width="134" height="24" rx="11" fill="#f7f9fc" stroke="#d6dfeb"/><text x="910.0" y="514.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#3267a8"><tspan x="910.0" dy="0.0">TT.now interval</tspan></text><path d="M530.0,625.0 Q340.0,599.0 150.0,625.0" fill="none" stroke="#3267a8" stroke-width="3" marker-end="url(#arr)"/><rect x="273.0" y="572.0" width="134" height="24" rx="11" fill="#f7f9fc" stroke="#d6dfeb"/><text x="340.0" y="589.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#3267a8"><tspan x="340.0" dy="0.0">success</tspan></text><path d="M150.0,700.0 Q340.0,674.0 530.0,700.0" fill="none" stroke="#3267a8" stroke-width="3" marker-end="url(#arr)"/><rect x="273.0" y="647.0" width="134" height="24" rx="11" fill="#f7f9fc" stroke="#d6dfeb"/><text x="340.0" y="664.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#3267a8"><tspan x="340.0" dy="0.0">next transaction</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="837.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">The guarantee is external consistency (strict serializability), not merely a timestamp ordering heuristic.</tspan></text></svg>