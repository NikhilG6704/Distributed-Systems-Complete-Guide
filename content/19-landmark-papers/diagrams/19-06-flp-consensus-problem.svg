<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="FLP: a crash and a slow process can look identical"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b74343"/></marker><marker id="arr-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23845a"/></marker><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#23344d" flood-opacity=".08"/></filter></defs><rect x="0" y="0" width="1440" height="900" fill="#f7f9fc"/><rect x="0" y="0" width="1440" height="12" fill="#3267a8"/><text x="58" y="62.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" fill="#17243a"><tspan x="58" dy="0.0">FLP: a crash and a slow process can look identical</tspan></text><text x="58" y="105.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6b82"><tspan x="58" dy="0.0">In a fully asynchronous model, silence cannot distinguish a crashed process from a delayed message.</tspan></text><line x1="58" y1="132" x2="1382" y2="132" stroke="#d8e0eb" stroke-width="2"/><path d="M198.0,317.0 C342.9,317.0 398.1,405.0 543.0,405.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="299.5" y="334.0" width="142.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="370.5" y="351.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#64748b"><tspan x="370.5" dy="0.0">same local view</tspan></text><path d="M888.0,317.0 C743.1,317.0 687.9,405.0 543.0,405.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="644.5" y="334.0" width="142.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="715.5" y="351.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#64748b"><tspan x="715.5" dy="0.0">same local view</tspan></text><path d="M543.0,547.0 C398.1,547.0 342.9,625.0 198.0,625.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="307.5" y="559.0" width="126.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="370.5" y="576.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#64748b"><tspan x="370.5" dy="0.0">decision risk</tspan></text><path d="M543.0,547.0 C687.9,547.0 743.1,625.0 888.0,625.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="640.5" y="559.0" width="150.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="715.5" y="576.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#64748b"><tspan x="715.5" dy="0.0">termination risk</tspan></text><rect x="55" y="175" width="286" height="142" rx="17" fill="#ffe1e1" stroke="#b74343" stroke-width="2" filter="url(#soft)"/><text x="198.0" y="206.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="198.0" dy="0.0">Execution A</tspan></text><text x="198.0" y="243.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="198.0" dy="0.0">Sender has crashed; no</tspan><tspan x="198.0" dy="19.0">message arrives</tspan></text><rect x="745" y="175" width="286" height="142" rx="17" fill="#fff0cc" stroke="#a86a08" stroke-width="2" filter="url(#soft)"/><text x="888.0" y="206.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="888.0" dy="0.0">Execution B</tspan></text><text x="888.0" y="243.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="888.0" dy="0.0">Sender is correct but message</tspan><tspan x="888.0" dy="19.0">is delayed</tspan></text><rect x="400" y="405" width="286" height="142" rx="17" fill="#eee5ff" stroke="#7045a5" stroke-width="2" filter="url(#soft)"/><text x="543.0" y="436.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="543.0" dy="0.0">Receiver view</tspan></text><text x="543.0" y="473.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="543.0" dy="0.0">No message observed in either</tspan><tspan x="543.0" dy="19.0">execution</tspan></text><rect x="55" y="625" width="286" height="142" rx="17" fill="#ffe1e1" stroke="#b74343" stroke-width="2" filter="url(#soft)"/><text x="198.0" y="656.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="198.0" dy="0.0">Decide now</tspan></text><text x="198.0" y="693.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="198.0" dy="0.0">Could violate agreement in</tspan><tspan x="198.0" dy="19.0">the other execution</tspan></text><rect x="745" y="625" width="286" height="142" rx="17" fill="#fff0cc" stroke="#a86a08" stroke-width="2" filter="url(#soft)"/><text x="888.0" y="656.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="888.0" dy="0.0">Wait forever</tspan></text><text x="888.0" y="693.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="888.0" dy="0.0">Could violate termination if</tspan><tspan x="888.0" dy="19.0">crash occurred</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="837.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">FLP does not prohibit practical progress; it rules out guaranteed termination in every admissible asynchronous execution under the stated model.</tspan></text></svg>