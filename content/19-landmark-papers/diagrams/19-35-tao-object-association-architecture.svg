 UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#3267a8"><tspan x="707.5" dy="0.0">FRIEND</tspan></text><path d="M700.0,335.0 C700.0,410.6 720.0,439.4 720.0,515.0" fill="none" stroke="#a86a08" stroke-width="3" marker-end="url(#arr)"/><rect x="659.0" y="398.0" width="102.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="710.0" y="415.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#a86a08"><tspan x="710.0" dy="0.0">CREATED_BY</tspan></text><path d="M1035.0,445.0 C936.3,445.0 898.7,570.0 800.0,570.0" fill="none" stroke="#7045a5" stroke-width="3" marker-end="url(#arr)"/><rect x="878.5" y="480.5" width="78.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="917.5" y="497.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#7045a5"><tspan x="917.5" dy="0.0">FOLLOWS</tspan></text><text x="720" y="730.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#5b6b82"><tspan x="720" dy="0.0">Directed, typed associations connect objects; fixed graph operations optimize common social queries.</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="827.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">Illustrative graph: User →LIKES→ Photo; User →FRIEND→ User. Associations are typed and directed; architecture is optimized for known social-graph</tspan><tspan x="78" dy="19.0">access patterns.</tspan></text></svg>