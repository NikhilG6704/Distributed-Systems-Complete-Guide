<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="CAP is a partition-time trade-off, not “pick any two forever”"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b74343"/></marker><marker id="arr-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23845a"/></marker><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#23344d" flood-opacity=".08"/></filter></defs><rect x="0" y="0" width="1440" height="900" fill="#f7f9fc"/><rect x="0" y="0" width="1440" height="12" fill="#3267a8"/><text x="58" y="62.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" fill="#17243a"><tspan x="58" dy="0.0">CAP is a partition-time trade-off, not “pick any two forever”</tspan></text><text x="58" y="105.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6b82"><tspan x="58" dy="0.0">C = linearizability, A = formal availability, P = a network partition in the model.</tspan></text><line x1="58" y1="132" x2="1382" y2="132" stroke="#d8e0eb" stroke-width="2"/><rect x="65" y="175" width="220" height="54" fill="#3267a8" stroke="white" stroke-width="2"/><text x="175.0" y="208.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff"><tspan x="175.0" dy="0.0">Operating condition</tspan></text><rect x="285" y="175" width="270" height="54" fill="#3267a8" stroke="white" stroke-width="2"/><text x="420.0" y="208.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff"><tspan x="420.0" dy="0.0">Consistency (C)</tspan></text><rect x="555" y="175" width="270" height="54" fill="#3267a8" stroke="white" stroke-width="2"/><text x="690.0" y="208.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff"><tspan x="690.0" dy="0.0">Availability (A)</tspan></text><rect x="825" y="175" width="210" height="54" fill="#3267a8" stroke="white" stroke-width="2"/><text x="930.0" y="208.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff"><tspan x="930.0" dy="0.0">Partition (P)</tspan></text><rect x="1035" y="175" width="310" height="54" fill="#3267a8" stroke="white" stroke-width="2"/><text x="1190.0" y="208.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff"><tspan x="1190.0" dy="0.0">Interpretation</tspan></text><rect x="65" y="229" width="220" height="78" fill="#ffffff" stroke="#d5deea"/><text x="175.0" y="268.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="175.0" dy="0.0">Normal communication</tspan></text><rect x="285" y="229" width="270" height="78" fill="#ffffff" stroke="#d5deea"/><text x="420.0" y="268.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="420.0" dy="0.0">Can be provided</tspan></text><rect x="555" y="229" width="270" height="78" fill="#ffffff" stroke="#d5deea"/><text x="690.0" y="268.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="690.0" dy="0.0">Can be provided</tspan></text><rect x="825" y="229" width="210" height="78" fill="#ffffff" stroke="#d5deea"/><text x="930.0" y="268.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="930.0" dy="0.0">No</tspan></text><rect x="1035" y="229" width="310" height="78" fill="#ffffff" stroke="#d5deea"/><text x="1190.0" y="268.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="1190.0" dy="0.0">No CAP conflict is forced</tspan></text><rect x="65" y="307" width="220" height="78" fill="#eef3f8" stroke="#d5deea"/><text x="175.0" y="346.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="175.0" dy="0.0">During partition</tspan></text><rect x="285" y="307" width="270" height="78" fill="#eef3f8" stroke="#d5deea"/><text x="420.0" y="346.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="420.0" dy="0.0">Preserve C by coordination</tspan></text><rect x="555" y="307" width="270" height="78" fill="#eef3f8" stroke="#d5deea"/><text x="690.0" y="346.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="690.0" dy="0.0">Preserve A by responding</tspan></text><rect x="825" y="307" width="210" height="78" fill="#eef3f8" stroke="#d5deea"/><text x="930.0" y="346.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="930.0" dy="0.0">Yes</tspan></text><rect x="1035" y="307" width="310" height="78" fill="#eef3f8" stroke="#d5deea"/><text x="1190.0" y="346.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="1190.0" dy="0.0">Cannot guarantee both C and A</tspan></text><rect x="65" y="385" width="220" height="78" fill="#ffffff" stroke="#d5deea"/><text x="175.0" y="424.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="175.0" dy="0.0">After recovery</tspan></text><rect x="285" y="385" width="270" height="78" fill="#ffffff" stroke="#d5deea"/><text x="420.0" y="424.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="420.0" dy="0.0">Reconcile / resume</tspan></text><rect x="555" y="385" width="270" height="78" fill="#ffffff" stroke="#d5deea"/><text x="690.0" y="424.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="690.0" dy="0.0">Restore service</tspan></text><rect x="825" y="385" width="210" height="78" fill="#ffffff" stroke="#d5deea"/><text x="930.0" y="424.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="930.0" dy="0.0">No</tspan></text><rect x="1035" y="385" width="310" height="78" fill="#ffffff" stroke="#d5deea"/><text x="1190.0" y="424.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="1190.0" dy="0.0">Behavior depends on chosen design</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="837.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">CAP uses formal definitions. Real systems may vary behavior by operation, replica, and failure condition.</tspan></text></svg>