<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Formal guarantees and their production costs"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b74343"/></marker><marker id="arr-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23845a"/></marker><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#23344d" flood-opacity=".08"/></filter></defs><rect x="0" y="0" width="1440" height="900" fill="#f7f9fc"/><rect x="0" y="0" width="1440" height="12" fill="#3267a8"/><text x="58" y="62.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" fill="#17243a"><tspan x="58" dy="0.0">Formal guarantees and their production costs</tspan></text><text x="58" y="105.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6b82"><tspan x="58" dy="0.0">A correctness guarantee constrains implementation choices and introduces coordination, latency, or availability costs.</tspan></text><line x1="58" y1="132" x2="1382" y2="132" stroke="#d8e0eb" stroke-width="2"/><rect x="65" y="175" width="340" height="54" fill="#3267a8" stroke="white" stroke-width="2"/><text x="235.0" y="208.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff"><tspan x="235.0" dy="0.0">Guarantee / mechanism</tspan></text><rect x="405" y="175" width="500" height="54" fill="#3267a8" stroke="white" stroke-width="2"/><text x="655.0" y="208.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff"><tspan x="655.0" dy="0.0">What it protects</tspan></text><rect x="905" y="175" width="440" height="54" fill="#3267a8" stroke="white" stroke-width="2"/><text x="1125.0" y="208.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff"><tspan x="1125.0" dy="0.0">Production cost / caveat</tspan></text><rect x="65" y="229.0" width="340" height="63.333333333333336" fill="#ffffff" stroke="#d5deea"/><text x="235.0" y="260.7" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="235.0" dy="0.0">Safety</tspan></text><rect x="405" y="229.0" width="500" height="63.333333333333336" fill="#ffffff" stroke="#d5deea"/><text x="655.0" y="260.7" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="655.0" dy="0.0">No forbidden outcome</tspan></text><rect x="905" y="229.0" width="440" height="63.333333333333336" fill="#ffffff" stroke="#d5deea"/><text x="1125.0" y="260.7" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="1125.0" dy="0.0">May block progress during uncertainty</tspan></text><rect x="65" y="292.3333333333333" width="340" height="63.333333333333336" fill="#eef3f8" stroke="#d5deea"/><text x="235.0" y="324.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="235.0" dy="0.0">Liveness</tspan></text><rect x="405" y="292.3333333333333" width="500" height="63.333333333333336" fill="#eef3f8" stroke="#d5deea"/><text x="655.0" y="324.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="655.0" dy="0.0">Eventual progress</tspan></text><rect x="905" y="292.3333333333333" width="440" height="63.333333333333336" fill="#eef3f8" stroke="#d5deea"/><text x="1125.0" y="324.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="1125.0" dy="0.0">Needs timing / failure assumptions</tspan></text><rect x="65" y="355.6666666666667" width="340" height="63.333333333333336" fill="#ffffff" stroke="#d5deea"/><text x="235.0" y="387.3" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="235.0" dy="0.0">CAP consistency</tspan></text><rect x="405" y="355.6666666666667" width="500" height="63.333333333333336" fill="#ffffff" stroke="#d5deea"/><text x="655.0" y="387.3" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="655.0" dy="0.0">Linearizable reads/writes</tspan></text><rect x="905" y="355.6666666666667" width="440" height="63.333333333333336" fill="#ffffff" stroke="#d5deea"/><text x="1125.0" y="387.3" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="1125.0" dy="0.0">Coordination may reduce partition availability</tspan></text><rect x="65" y="419.0" width="340" height="63.333333333333336" fill="#eef3f8" stroke="#d5deea"/><text x="235.0" y="450.7" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="235.0" dy="0.0">Quorum intersection</tspan></text><rect x="405" y="419.0" width="500" height="63.333333333333336" fill="#eef3f8" stroke="#d5deea"/><text x="655.0" y="450.7" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="655.0" dy="0.0">Preserve chosen/replicated state</tspan></text><rect x="905" y="419.0" width="440" height="63.333333333333336" fill="#eef3f8" stroke="#d5deea"/><text x="1125.0" y="450.7" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="1125.0" dy="0.0">Quorum unavailable if too many nodes fail</tspan></text><rect x="65" y="482.33333333333337" width="340" height="63.333333333333336" fill="#ffffff" stroke="#d5deea"/><text x="235.0" y="514.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="235.0" dy="0.0">Synchronous replication</tspan></text><rect x="405" y="482.33333333333337" width="500" height="63.333333333333336" fill="#ffffff" stroke="#d5deea"/><text x="655.0" y="514.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="655.0" dy="0.0">Acknowledged replica durability</tspan></text><rect x="905" y="482.33333333333337" width="440" height="63.333333333333336" fill="#ffffff" stroke="#d5deea"/><text x="1125.0" y="514.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="1125.0" dy="0.0">Write latency tracks remote replicas</tspan></text><rect x="65" y="545.6666666666667" width="340" height="63.333333333333336" fill="#eef3f8" stroke="#d5deea"/><text x="235.0" y="577.3" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="235.0" dy="0.0">Clock uncertainty</tspan></text><rect x="405" y="545.6666666666667" width="500" height="63.333333333333336" fill="#eef3f8" stroke="#d5deea"/><text x="655.0" y="577.3" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="655.0" dy="0.0">Real-time transaction order</tspan></text><rect x="905" y="545.6666666666667" width="440" height="63.333333333333336" fill="#eef3f8" stroke="#d5deea"/><text x="1125.0" y="577.3" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="1125.0" dy="0.0">Commit wait adds bounded delay</tspan></text><rect x="65" y="609.0" width="340" height="63.333333333333336" fill="#ffffff" stroke="#d5deea"/><text x="235.0" y="640.7" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="235.0" dy="0.0">Fencing token</tspan></text><rect x="405" y="609.0" width="500" height="63.333333333333336" fill="#ffffff" stroke="#d5deea"/><text x="655.0" y="640.7" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="655.0" dy="0.0">Reject stale lock holder</tspan></text><rect x="905" y="609.0" width="440" height="63.333333333333336" fill="#ffffff" stroke="#d5deea"/><text x="1125.0" y="640.7" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="1125.0" dy="0.0">Resource must enforce token monotonicity</tspan></text><rect x="65" y="672.3333333333334" width="340" height="63.333333333333336" fill="#eef3f8" stroke="#d5deea"/><text x="235.0" y="704.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="235.0" dy="0.0">Partition ordering</tspan></text><rect x="405" y="672.3333333333334" width="500" height="63.333333333333336" fill="#eef3f8" stroke="#d5deea"/><text x="655.0" y="704.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="655.0" dy="0.0">Per-partition event order</tspan></text><rect x="905" y="672.3333333333334" width="440" height="63.333333333333336" fill="#eef3f8" stroke="#d5deea"/><text x="1125.0" y="704.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="1125.0" dy="0.0">No total order across independent partitions</tspan></text><rect x="65" y="735.6666666666667" width="340" height="63.333333333333336" fill="#ffffff" stroke="#d5deea"/><text x="235.0" y="767.3" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="235.0" dy="0.0">Tail-latency control</tspan></text><rect x="405" y="735.6666666666667" width="500" height="63.333333333333336" fill="#ffffff" stroke="#d5deea"/><text x="655.0" y="767.3" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="655.0" dy="0.0">Bound fan-out completion</tspan></text><rect x="905" y="735.6666666666667" width="440" height="63.333333333333336" fill="#ffffff" stroke="#d5deea"/><text x="1125.0" y="767.3" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="1125.0" dy="0.0">Hedging/redundancy consumes capacity</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="837.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">Do not treat measured performance as a proof of safety, or a protocol guarantee as a promise of fixed latency.</tspan></text></svg>