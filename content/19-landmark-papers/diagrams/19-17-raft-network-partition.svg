<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Raft under a 3/2 network partition"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b74343"/></marker><marker id="arr-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23845a"/></marker><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#23344d" flood-opacity=".08"/></filter></defs><rect x="0" y="0" width="1440" height="900" fill="#f7f9fc"/><rect x="0" y="0" width="1440" height="12" fill="#3267a8"/><text x="58" y="62.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" fill="#17243a"><tspan x="58" dy="0.0">Raft under a 3/2 network partition</tspan></text><text x="58" y="105.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6b82"><tspan x="58" dy="0.0">Only the side with a majority can commit new entries; the minority cannot form a quorum.</tspan></text><line x1="58" y1="132" x2="1382" y2="132" stroke="#d8e0eb" stroke-width="2"/><rect x="85" y="180" width="760" height="500" rx="24" fill="#eef8f2" stroke="#23845a" stroke-width="3"/><rect x="900" y="180" width="455" height="500" rx="24" fill="#fff3f0" stroke="#b74343" stroke-width="3"/><text x="465" y="220.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" fill="#23845a"><tspan x="465" dy="0.0">Majority partition · 3 nodes</tspan></text><text x="1125" y="220.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" fill="#b74343"><tspan x="1125" dy="0.0">Minority partition · 2 nodes</tspan></text><circle cx="255" cy="360" r="65" fill="#dcf4e8" stroke="#23845a" stroke-width="3"/><text x="255" y="360.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243a"><tspan x="255" dy="0.0">N1 · leader</tspan></text><circle cx="465" cy="360" r="65" fill="#dcf4e8" stroke="#23845a" stroke-width="3"/><text x="465" y="360.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243a"><tspan x="465" dy="0.0">N2</tspan></text><circle cx="675" cy="360" r="65" fill="#dcf4e8" stroke="#23845a" stroke-width="3"/><text x="675" y="360.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243a"><tspan x="675" dy="0.0">N3</tspan></text><circle cx="1025" cy="360" r="65" fill="#ffe1e1" stroke="#b74343" stroke-width="3"/><text x="1025" y="360.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243a"><tspan x="1025" dy="0.0">N4</tspan></text><circle cx="1230" cy="360" r="65" fill="#ffe1e1" stroke="#b74343" stroke-width="3"/><text x="1230" y="360.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243a"><tspan x="1230" dy="0.0">N5</tspan></text><path d="M845 260 L900 600" stroke="#b74343" stroke-width="7" stroke-dasharray="12 10"/><text x="465" y="520.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750" fill="#23845a"><tspan x="465" dy="0.0">Can form quorum (3/5)</tspan></text><text x="465" y="565.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#17243a"><tspan x="465" dy="0.0">May commit new entries</tspan></text><text x="1125" y="520.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750" fill="#b74343"><tspan x="1125" dy="0.0">No majority quorum</tspan></text><text x="1125" y="565.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#17243a"><tspan x="1125" dy="0.0">Cannot commit independently</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="827.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">Five-node group: 3-node majority can elect/retain a leader and commit; 2-node minority cannot commit independently. Reconciliation uses term and</tspan><tspan x="78" dy="19.0">log-matching rules.</tspan></text></svg>