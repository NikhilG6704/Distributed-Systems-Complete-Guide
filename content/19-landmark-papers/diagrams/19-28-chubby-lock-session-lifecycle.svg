<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Chubby lock session expiry and fencing"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b74343"/></marker><marker id="arr-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23845a"/></marker><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#23344d" flood-opacity=".08"/></filter></defs><rect x="0" y="0" width="1440" height="900" fill="#f7f9fc"/><rect x="0" y="0" width="1440" height="12" fill="#3267a8"/><text x="58" y="62.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" fill="#17243a"><tspan x="58" dy="0.0">Chubby lock session expiry and fencing</tspan></text><text x="58" y="105.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6b82"><tspan x="58" dy="0.0">A stale client may continue running after lease expiry; the protected resource must reject its stale generation.</tspan></text><line x1="58" y1="132" x2="1382" y2="132" stroke="#d8e0eb" stroke-width="2"/><rect x="58.0" y="155" width="184" height="52" rx="13" fill="#dceafe" stroke="#3267a8" stroke-width="2"/><text x="150.0" y="187.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243a"><tspan x="150.0" dy="0.0">Client A</tspan></text><line x1="150.0" y1="210" x2="150.0" y2="745" stroke="#aab6c7" stroke-width="2" stroke-dasharray="7 7"/><rect x="438.0" y="155" width="184" height="52" rx="13" fill="#dceafe" stroke="#3267a8" stroke-width="2"/><text x="530.0" y="187.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243a"><tspan x="530.0" dy="0.0">Chubby</tspan></text><line x1="530.0" y1="210" x2="530.0" y2="745" stroke="#aab6c7" stroke-width="2" stroke-dasharray="7 7"/><rect x="818.0" y="155" width="184" height="52" rx="13" fill="#dceafe" stroke="#3267a8" stroke-width="2"/><text x="910.0" y="187.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243a"><tspan x="910.0" dy="0.0">Client B</tspan></text><line x1="910.0" y1="210" x2="910.0" y2="745" stroke="#aab6c7" stroke-width="2" stroke-dasharray="7 7"/><rect x="1198.0" y="155" width="184" height="52" rx="13" fill="#dceafe" stroke="#3267a8" stroke-width="2"/><text x="1290.0" y="187.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243a"><tspan x="1290.0" dy="0.0">Protected resource</tspan></text><line x1="1290.0" y1="210" x2="1290.0" y2="745" stroke="#aab6c7" stroke-width="2" stroke-dasharray="7 7"/><circle cx="150.0" cy="250.0" r="11" fill="#23845a" stroke="white" stroke-width="3"/><text x="168.0" y="235.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#5b6b82"><tspan x="168.0" dy="0.0">acquire lock · seq 41</tspan></text><circle cx="530.0" cy="325.0" r="11" fill="#23845a" stroke="white" stroke-width="3"/><text x="548.0" y="310.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#5b6b82"><tspan x="548.0" dy="0.0">session expires</tspan></text><circle cx="910.0" cy="400.0" r="11" fill="#23845a" stroke="white" stroke-width="3"/><text x="928.0" y="385.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#5b6b82"><tspan x="928.0" dy="0.0">acquire lock · seq 42</tspan></text><circle cx="150.0" cy="475.0" r="11" fill="#23845a" stroke="white" stroke-width="3"/><text x="168.0" y="460.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#5b6b82"><tspan x="168.0" dy="0.0">delayed write with 41</tspan></text><circle cx="1290.0" cy="550.0" r="11" fill="#23845a" stroke="white" stroke-width="3"/><text x="1272.0" y="535.0" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#5b6b82"><tspan x="1272.0" dy="0.0">reject stale 41</tspan></text><circle cx="910.0" cy="625.0" r="11" fill="#23845a" stroke="white" stroke-width="3"/><text x="928.0" y="610.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#5b6b82"><tspan x="928.0" dy="0.0">write with 42 accepted</tspan></text><path d="M150.0,250.0 Q340.0,261.5 530.0,325.0" fill="none" stroke="#3267a8" stroke-width="3" marker-end="url(#arr)"/><rect x="273.0" y="234.5" width="134" height="24" rx="11" fill="#f7f9fc" stroke="#d6dfeb"/><text x="340.0" y="251.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#3267a8"><tspan x="340.0" dy="0.0">Acquire</tspan></text><path d="M530.0,325.0 Q720.0,336.5 910.0,400.0" fill="none" stroke="#3267a8" stroke-width="3" marker-end="url(#arr)"/><rect x="653.0" y="309.5" width="134" height="24" rx="11" fill="#f7f9fc" stroke="#d6dfeb"/><text x="720.0" y="326.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#3267a8"><tspan x="720.0" dy="0.0">expiry event</tspan></text><path d="M910.0,400.0 Q720.0,411.5 530.0,475.0" fill="none" stroke="#3267a8" stroke-width="3" marker-end="url(#arr)"/><rect x="653.0" y="384.5" width="134" height="24" rx="11" fill="#f7f9fc" stroke="#d6dfeb"/><text x="720.0" y="401.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#3267a8"><tspan x="720.0" dy="0.0">Acquire</tspan></text><path d="M150.0,475.0 Q720.0,486.5 1290.0,550.0" fill="none" stroke="#3267a8" stroke-width="3" marker-end="url(#arr)"/><rect x="653.0" y="459.5" width="134" height="24" rx="11" fill="#f7f9fc" stroke="#d6dfeb"/><text x="720.0" y="476.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#3267a8"><tspan x="720.0" dy="0.0">operation + 41</tspan></text><path d="M910.0,625.0 Q1100.0,599.0 1290.0,625.0" fill="none" stroke="#3267a8" stroke-width="3" marker-end="url(#arr)"/><rect x="1033.0" y="572.0" width="134" height="24" rx="11" fill="#f7f9fc" stroke="#d6dfeb"/><text x="1100.0" y="589.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#3267a8"><tspan x="1100.0" dy="0.0">operation + 42</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="837.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">Fencing works only when the resource validates the monotonically increasing generation; a lock service alone cannot stop an old process from sending.</tspan></text></svg>