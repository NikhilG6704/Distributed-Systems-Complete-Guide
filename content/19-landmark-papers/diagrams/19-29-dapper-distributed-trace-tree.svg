="102.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="720.0" y="305.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#23845a"><tspan x="720.0" dy="0.0">child span</tspan></text><path d="M720.0,255.0 C896.4,255.0 963.6,375.0 1140.0,375.0" fill="none" stroke="#7045a5" stroke-width="3" marker-end="url(#arr)"/><rect x="879.0" y="288.0" width="102.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="930.0" y="305.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#7045a5"><tspan x="930.0" dy="0.0">child span</tspan></text><rect x="565" y="155" width="310" height="100" rx="17" fill="#dceafe" stroke="#3267a8" stroke-width="2" filter="url(#soft)"/><text x="720.0" y="186.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="720.0" dy="0.0">API request · root span</tspan></text><text x="720.0" y="223.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="720.0" dy="0.0">trace_id = T-7F2A · span_id =</tspan><tspan x="720.0" dy="19.0">S0</tspan></text><rect x="145" y="375" width="310" height="115" rx="17" fill="#dcf4e8" stroke="#23845a" stroke-width="2" filter="url(#soft)"/><text x="300.0" y="406.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="300.0" dy="0.0">Frontend RPC</tspan></text><text x="300.0" y="443.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="300.0" dy="0.0">span_id = S1 · parent = S0</tspan></text><rect x="565" y="375" width="310" height="115" rx="17" fill="#eee5ff" stroke="#7045a5" stroke-width="2" filter="url(#soft)"/><text x="720.0" y="406.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="720.0" dy="0.0">User service RPC</tspan></text><text x="720.0" y="443.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="720.0" dy="0.0">span_id = S2 · parent = S0</tspan></text><rect x="985" y="375" width="310" height="115" rx="17" fill="#fff0cc" stroke="#a86a08" stroke-width="2" filter="url(#soft)"/><text x="1140.0" y="406.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="1140.0" dy="0.0">Storage RPC</tspan></text><text x="1140.0" y="443.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="1140.0" dy="0.0">span_id = S3 · parent = S0</tspan></text><path d="M300.0,490.0 C300.0,536.2 300.0,553.8 300.0,600.0" fill="none" stroke="#23845a" stroke-width="3" marker-end="url(#arr-green)"/><rect x="245.0" y="518.0" width="110.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="300.0" y="535.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#23845a"><tspan x="300.0" dy="0.0">nested call</tspan></text><path d="M720.0,490.0 C720.0,536.2 720.0,553.8 720.0,600.0" fill="none" stroke="#7045a5" stroke-width="3" marker-end="url(#arr)"/><rect x="665.0" y="518.0" width="110.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="720.0" y="535.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#7045a5"><tspan x="720.0" dy="0.0">nested call</tspan></text><rect x="145" y="600" width="310" height="100" rx="17" fill="#e9eef5" stroke="#64748b" stroke-width="2" filter="url(#soft)"/><text x="300.0" y="631.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="300.0" dy="0.0">Profile database</tspan></text><text x="300.0" y="668.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="300.0" dy="0.0">span_id = S1.1 · timing +</tspan><tspan x="300.0" dy="19.0">tags</tspan></text><rect x="565" y="600" width="310" height="100" rx="17" fill="#e9eef5" stroke="#64748b" stroke-width="2" filter="url(#soft)"/><text x="720.0" y="631.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="720.0" dy="0.0">Cache lookup</tspan></text><text x="720.0" y="668.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="720.0" dy="0.0">span_id = S2.1 · annotations</tspan></text><rect x="985" y="600" width="310" height="100" rx="17" fill="#e9eef5" stroke="#64748b" stroke-width="2" filter="url(#soft)"/><text x="1140.0" y="631.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="1140.0" dy="0.0">Trace collector</tspan></text><text x="1140.0" y="668.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="1140.0" dy="0.0">sampling · aggregation</tspan></text><path d="M1140.0,490.0 C1140.0,536.2 1140.0,553.8 1140.0,600.0" fill="none" stroke="#a86a08" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arr)"/><rect x="1081.0" y="518.0" width="118.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="1140.0" y="535.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#a86a08"><tspan x="1140.0" dy="0.0">export spans</tspan></text><text x="720" y="755.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#5b6b82"><tspan x="720" dy="0.0">Propagate trace context across RPC and messaging boundaries; span timing reveals fan-out and critical paths.</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="827.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">Trace context propagates across synchronous RPCs and asynchronous boundaries; sampling and low-overhead instrumentation make fleet-wide tracing</tspan><tspan x="78" dy="19.0">practical.</tspan></text></svg>