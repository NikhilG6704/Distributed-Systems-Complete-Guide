ont-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="543.0" dy="0.0">Prepare(n), choose value</tspan></text><rect x="745" y="175" width="286" height="142" rx="17" fill="#fff0cc" stroke="#a86a08" stroke-width="2" filter="url(#soft)"/><text x="888.0" y="206.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="888.0" dy="0.0">Acceptors A1–A5</tspan></text><text x="888.0" y="243.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="888.0" dy="0.0">Promise / accept</tspan></text><rect x="1090" y="175" width="286" height="142" rx="17" fill="#dcf4e8" stroke="#23845a" stroke-width="2" filter="url(#soft)"/><text x="1233.0" y="206.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="1233.0" dy="0.0">Learners</tspan></text><text x="1233.0" y="243.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="1233.0" dy="0.0">Learn chosen value</tspan></text><rect x="1090" y="405" width="286" height="142" rx="17" fill="#e9eef5" stroke="#64748b" stroke-width="2" filter="url(#soft)"/><text x="1233.0" y="436.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="1233.0" dy="0.0">State machine</tspan></text><text x="1233.0" y="473.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="1233.0" dy="0.0">Apply agreed value</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="837.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">Roles are logical; one machine may play multiple roles. Quorum rules, not a single machine, preserve safety.</tspan></text></svg>