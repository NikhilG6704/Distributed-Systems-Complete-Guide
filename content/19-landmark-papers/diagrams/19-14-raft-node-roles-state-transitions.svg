 state; accepts</tspan><tspan x="543.0" dy="19.0">AppendEntries</tspan></text><rect x="55" y="405" width="286" height="142" rx="17" fill="#fff0cc" stroke="#a86a08" stroke-width="2" filter="url(#soft)"/><text x="198.0" y="436.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="198.0" dy="0.0">Candidate</tspan></text><text x="198.0" y="473.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="198.0" dy="0.0">Election timeout; increments</tspan><tspan x="198.0" dy="19.0">term</tspan></text><rect x="745" y="405" width="286" height="142" rx="17" fill="#dcf4e8" stroke="#23845a" stroke-width="2" filter="url(#soft)"/><text x="888.0" y="436.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="888.0" dy="0.0">Leader</tspan></text><text x="888.0" y="473.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="888.0" dy="0.0">Wins majority; sends</tspan><tspan x="888.0" dy="19.0">heartbeats</tspan></text><rect x="400" y="625" width="286" height="142" rx="17" fill="#ffe1e1" stroke="#b74343" stroke-width="2" filter="url(#soft)"/><text x="543.0" y="656.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="543.0" dy="0.0">Higher term observed</tspan></text><text x="543.0" y="693.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="543.0" dy="0.0">Step down to follower</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="837.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">Election timeouts are