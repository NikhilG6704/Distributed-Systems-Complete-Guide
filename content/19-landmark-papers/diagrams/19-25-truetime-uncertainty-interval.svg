<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="TrueTime: bounded uncertainty interval"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b74343"/></marker><marker id="arr-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23845a"/></marker><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#23344d" flood-opacity=".08"/></filter></defs><rect x="0" y="0" width="1440" height="900" fill="#f7f9fc"/><rect x="0" y="0" width="1440" height="12" fill="#3267a8"/><text x="58" y="62.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" fill="#17243a"><tspan x="58" dy="0.0">TrueTime: bounded uncertainty interval</tspan></text><text x="58" y="105.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6b82"><tspan x="58" dy="0.0">TrueTime returns an interval containing the actual time; commit wait ensures real-time ordering.</tspan></text><line x1="58" y1="132" x2="1382" y2="132" stroke="#d8e0eb" stroke-width="2"/><line x1="130" y1="465" x2="1300" y2="465" stroke="#64748b" stroke-width="4" marker-end="url(#arr)"/><rect x="520" y="390" width="390" height="150" rx="16" fill="#eee5ff" stroke="#7045a5" stroke-width="3"/><text x="715" y="430.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="715" dy="0.0">TT.now() = [earliest, latest]</tspan></text><text x="715" y="475.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#5b6b82"><tspan x="715" dy="0.0">actual time is inside interval</tspan></text><text x="715" y="510.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#7045a5"><tspan x="715" dy="0.0">uncertainty bounded by ε</tspan></text><line x1="520" y1="350" x2="520" y2="580" stroke="#23845a" stroke-width="3" stroke-dasharray="8 5"/><text x="520" y="330.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#23845a"><tspan x="520" dy="0.0">earliest</tspan></text><line x1="910" y1="350" x2="910" y2="580" stroke="#b74343" stroke-width="3" stroke-dasharray="8 5"/><text x="910" y="330.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#b74343"><tspan x="910" dy="0.0">latest</tspan></text><line x1="715" y1="350" x2="715" y2="580" stroke="#7045a5" stroke-width="3" stroke-dasharray="8 5"/><text x="715" y="330.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#7045a5"><tspan x="715" dy="0.0">actual time</tspan></text><line x1="1000" y1="465" x2="1290" y2="465" stroke="#23845a" stroke-width="8" stroke-linecap="round"/><text x="1145" y="420.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#23845a"><tspan x="1145" dy="0.0">commit wait until earliest &gt; s</tspan></text><text x="715" y="690.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="550" fill="#5b6b82"><tspan x="715" dy="0.0">Timestamp s is definitely in the past only after the lower bound passes s.</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="837.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">TT.now() = [earliest, latest]. If commit timestamp s is assigned, wait until TT.after(s) is true—i.e., earliest &gt; s. Epsilon bounds uncertainty.</tspan></text></svg>