><tspan x="720" dy="0.0">Proof intuition: schedule extensions and message delays preserve a reachable bivalent state.</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="837.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">Conceptual proof sketch only—not a complete formal FLP derivation.</tspan></text></svg>