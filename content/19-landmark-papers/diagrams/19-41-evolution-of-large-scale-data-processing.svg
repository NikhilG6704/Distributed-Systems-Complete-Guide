<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="From batch jobs to unbounded stream processing"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b74343"/></marker><marker id="arr-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23845a"/></marker><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#23344d" flood-opacity=".08"/></filter></defs><rect x="0" y="0" width="1440" height="900" fill="#f7f9fc"/><rect x="0" y="0" width="1440" height="12" fill="#3267a8"/><text x="58" y="62.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" fill="#17243a"><tspan x="58" dy="0.0">From batch jobs to unbounded stream processing</tspan></text><text x="58" y="105.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6b82"><tspan x="58" dy="0.0">Systems evolved from file-oriented batch stages toward durable logs, stateful streaming, event time, and unified dataflow.</tspan></text><line x1="58" y1="132" x2="1382" y2="132" stroke="#d8e0eb" stroke-width="2"/><rect x="80" y="250" width="1280" height="225" rx="20" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="120" y="287.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750" fill="#17243a"><tspan x="120" dy="0.0">Batch lane</tspan></text><rect x="225.0" y="330" width="210" height="110" rx="15" fill="#dceafe" stroke="#3267a8" stroke-width="2"/><text x="330.0" y="368.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#17243a"><tspan x="330.0" dy="0.0">GFS</tspan></text><text x="330.0" y="405.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#5b6b82"><tspan x="330.0" dy="0.0">distributed files</tspan></text><path d="M425.0,385.0 L725.0,385.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="715.0" y="330" width="210" height="110" rx="15" fill="#dcf4e8" stroke="#23845a" stroke-width="2"/><text x="820.0" y="368.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#17243a"><tspan x="820.0" dy="0.0">MapReduce</tspan></text><text x="820.0" y="405.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#5b6b82"><tspan x="820.0" dy="0.0">batch map / reduce</tspan></text><path d="M915.0,385.0 L1215.0,385.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="1205.0" y="330" width="210" height="110" rx="15" fill="#fff0cc" stroke="#a86a08" stroke-width="2"/><text x="1310.0" y="368.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#17243a"><tspan x="1310.0" dy="0.0">Spark</tspan></text><text x="1310.0" y="405.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#5b6b82"><tspan x="1310.0" dy="0.0">DAG / in-memory</tspan></text><rect x="80" y="550" width="1280" height="225" rx="20" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="120" y="587.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750" fill="#17243a"><tspan x="120" dy="0.0">Streaming lane</tspan></text><rect x="225.0" y="630" width="210" height="110" rx="15" fill="#dceafe" stroke="#3267a8" stroke-width="2"/><text x="330.0" y="668.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#17243a"><tspan x="330.0" dy="0.0">Kafka</tspan></text><text x="330.0" y="705.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#5b6b82"><tspan x="330.0" dy="0.0">durable partition log</tspan></text><path d="M425.0,685.0 L725.0,685.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="715.0" y="630" width="210" height="110" rx="15" fill="#dcf4e8" stroke="#23845a" stroke-width="2"/><text x="820.0" y="668.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#17243a"><tspan x="820.0" dy="0.0">MillWheel</tspan></text><text x="820.0" y="705.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#5b6b82"><tspan x="820.0" dy="0.0">persistent stream state</tspan></text><path d="M915.0,685.0 L1215.0,685.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="1205.0" y="630" width="210" height="110" rx="15" fill="#fff0cc" stroke="#a86a08" stroke-width="2"/><text x="1310.0" y="668.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#17243a"><tspan x="1310.0" dy="0.0">Dataflow</tspan></text><text x="1310.0" y="705.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#5b6b82"><tspan x="1310.0" dy="0.0">event time / windows</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="837.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">The diagram separates batch and unbounded-stream models; modern engines can combine ideas from both lanes.</tspan></text></svg>