<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Kafka topics, partitions, brokers, and consumer groups"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b74343"/></marker><marker id="arr-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23845a"/></marker><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#23344d" flood-opacity=".08"/></filter></defs><rect x="0" y="0" width="1440" height="900" fill="#f7f9fc"/><rect x="0" y="0" width="1440" height="12" fill="#3267a8"/><text x="58" y="62.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" fill="#17243a"><tspan x="58" dy="0.0">Kafka topics, partitions, brokers, and consumer groups</tspan></text><text x="58" y="105.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6b82"><tspan x="58" dy="0.0">A topic is divided into ordered partition logs distributed across brokers; consumers divide partitions by group.</tspan></text><line x1="58" y1="132" x2="1382" y2="132" stroke="#d8e0eb" stroke-width="2"/><path d="M341.0,246.0 C365.8,246.0 375.2,246.0 400.0,246.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="323.5" y="219.0" width="94.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="370.5" y="236.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#64748b"><tspan x="370.5" dy="0.0">partition</tspan></text><path d="M341.0,246.0 C510.7,246.0 575.3,246.0 745.0,246.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="496.0" y="219.0" width="94.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="543.0" y="236.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#64748b"><tspan x="543.0" dy="0.0">partition</tspan></text><path d="M341.0,246.0 C655.6,246.0 775.4,246.0 1090.0,246.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="668.5" y="219.0" width="94.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="715.5" y="236.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#64748b"><tspan x="715.5" dy="0.0">partition</tspan></text><path d="M543.0,317.0 C543.0,354.0 543.0,368.0 543.0,405.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="492.0" y="334.0" width="102.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="543.0" y="351.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#64748b"><tspan x="543.0" dy="0.0">assignment</tspan></text><path d="M888.0,317.0 C888.0,354.0 888.0,368.0 888.0,405.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="837.0" y="334.0" width="102.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="888.0" y="351.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#64748b"><tspan x="888.0" dy="0.0">assignment</tspan></text><path d="M1233.0,317.0 C1088.1,317.0 1032.9,405.0 888.0,405.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="1009.5" y="334.0" width="102.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="1060.5" y="351.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#64748b"><tspan x="1060.5" dy="0.0">assignment</tspan></text><rect x="55" y="175" width="286" height="142" rx="17" fill="#dceafe" stroke="#3267a8" stroke-width="2" filter="url(#soft)"/><text x="198.0" y="206.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="198.0" dy="0.0">Topic: orders</tspan></text><text x="198.0" y="243.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="198.0" dy="0.0">Partition 0</tspan></text><rect x="400" y="175" width="286" height="142" rx="17" fill="#dcf4e8" stroke="#23845a" stroke-width="2" filter="url(#soft)"/><text x="543.0" y="206.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="543.0" dy="0.0">Broker 1</tspan></text><text x="543.0" y="243.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="543.0" dy="0.0">P0 leader / replicas</tspan></text><rect x="745" y="175" width="286" height="142" rx="17" fill="#dcf4e8" stroke="#23845a" stroke-width="2" filter="url(#soft)"/><text x="888.0" y="206.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="888.0" dy="0.0">Broker 2</tspan></text><text x="888.0" y="243.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="888.0" dy="0.0">P1 leader / replicas</tspan></text><rect x="1090" y="175" width="286" height="142" rx="17" fill="#dcf4e8" stroke="#23845a" stroke-width="2" filter="url(#soft)"/><text x="1233.0" y="206.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="1233.0" dy="0.0">Broker 3</tspan></text><text x="1233.0" y="243.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="1233.0" dy="0.0">P2 leader / replicas</tspan></text><rect x="400" y="405" width="286" height="142" rx="17" fill="#eee5ff" stroke="#7045a5" stroke-width="2" filter="url(#soft)"/><text x="543.0" y="436.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="543.0" dy="0.0">Consumer group</tspan></text><text x="543.0" y="473.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="543.0" dy="0.0">member A → P0</tspan></text><rect x="745" y="405" width="286" height="142" rx="17" fill="#eee5ff" stroke="#7045a5" stroke-width="2" filter="url(#soft)"/><text x="888.0" y="436.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="888.0" dy="0.0">Consumer group</tspan></text><text x="888.0" y="473.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="888.0" dy="0.0">member B → P1,P2</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="827.5" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">Ordering is per partition, not global across all partitions. Replica leadership and metadata management are version-dependent; KRaft is later than the</tspan><tspan x="78" dy="19.0">original paper.</tspan></text></svg>