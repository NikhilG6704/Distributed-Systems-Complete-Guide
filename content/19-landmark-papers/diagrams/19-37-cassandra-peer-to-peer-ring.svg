<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Cassandra peer-to-peer token ring"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b74343"/></marker><marker id="arr-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23845a"/></marker><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#23344d" flood-opacity=".08"/></filter></defs><rect x="0" y="0" width="1440" height="900" fill="#f7f9fc"/><rect x="0" y="0" width="1440" height="12" fill="#3267a8"/><text x="58" y="62.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" fill="#17243a"><tspan x="58" dy="0.0">Cassandra peer-to-peer token ring</tspan></text><text x="58" y="105.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6b82"><tspan x="58" dy="0.0">Each node owns token ranges; gossip spreads membership and replication spans configured failure domains.</tspan></text><line x1="58" y1="132" x2="1382" y2="132" stroke="#d8e0eb" stroke-width="2"/><circle cx="720" cy="465" r="245" fill="none" stroke="#9aabc0" stroke-width="5" stroke-dasharray="12 8"/><circle cx="720.0" cy="220.0" r="56" fill="#dceafe" stroke="#3267a8" stroke-width="3" filter="url(#soft)"/><text x="720.0" y="216.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243a"><tspan x="720.0" dy="0.0">Node A</tspan></text><text x="720.0" y="240.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#5b6b82"><tspan x="720.0" dy="0.0">token range</tspan></text><circle cx="932.2" cy="342.5" r="56" fill="#dcf4e8" stroke="#23845a" stroke-width="3" filter="url(#soft)"/><text x="932.1762239271875" y="338.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243a"><tspan x="932.1762239271875" dy="0.0">Node B</tspan></text><text x="932.1762239271875" y="362.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#5b6b82"><tspan x="932.1762239271875" dy="0.0">token range</tspan></text><circle cx="932.2" cy="587.5" r="56" fill="#fff0cc" stroke="#a86a08" stroke-width="3" filter="url(#soft)"/><text x="932.1762239271875" y="583.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243a"><tspan x="932.1762239271875" dy="0.0">Node C</tspan></text><text x="932.1762239271875" y="607.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#5b6b82"><tspan x="932.1762239271875" dy="0.0">token range</tspan></text><circle cx="720.0" cy="710.0" r="56" fill="#eee5ff" stroke="#7045a5" stroke-width="3" filter="url(#soft)"/><text x="720.0" y="706.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243a"><tspan x="720.0" dy="0.0">Node D</tspan></text><text x="720.0" y="730.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#5b6b82"><tspan x="720.0" dy="0.0">token range</tspan></text><circle cx="507.8" cy="587.5" r="56" fill="#dceafe" stroke="#3267a8" stroke-width="3" filter="url(#soft)"/><text x="507.8237760728125" y="583.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243a"><tspan x="507.8237760728125" dy="0.0">Node E</tspan></text><text x="507.8237760728125" y="607.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#5b6b82"><tspan x="507.8237760728125" dy="0.0">token range</tspan></text><circle cx="507.8" cy="342.5" r="56" fill="#dcf4e8" stroke="#23845a" stroke-width="3" filter="url(#soft)"/><text x="507.8237760728125" y="338.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243a"><tspan x="507.8237760728125" dy="0.0">Node F</tspan></text><text x="507.8237760728125" y="362.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#5b6b82"><tspan x="507.8237760728125" dy="0.0">token range</tspan></text><rect x="530" y="390" width="380" height="150" rx="18" fill="white" stroke="#b6c4d5" stroke-width="2"/><text x="720" y="430.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#17243a"><tspan x="720" dy="0.0">Key → hash(token)</tspan></text><text x="720" y="470.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#3267a8"><tspan x="720" dy="0.0">Clockwise owner</tspan></text><text x="720" y="505.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#5b6b82"><tspan x="720" dy="0.0">Preference list: R1, R2, R3</tspan></text><text x="720" y="755.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="720" dy="0.0">Virtual nodes distribute ranges; replica placement should span failure domains.</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="837.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">A partition key hashes to a token. Replica placement depends on replication strategy and data-center/rack topology; no single master owns the ring.</tspan></text></svg>