<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Bigtable tablet placement and storage stack"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b74343"/></marker><marker id="arr-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23845a"/></marker><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#23344d" flood-opacity=".08"/></filter></defs><rect x="0" y="0" width="1440" height="900" fill="#f7f9fc"/><rect x="0" y="0" width="1440" height="12" fill="#3267a8"/><text x="58" y="62.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" fill="#17243a"><tspan x="58" dy="0.0">Bigtable tablet placement and storage stack</tspan></text><text x="58" y="105.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6b82"><tspan x="58" dy="0.0">The master assigns row-range tablets to tablet servers; each server uses an LSM-like storage stack.</tspan></text><line x1="58" y1="132" x2="1382" y2="132" stroke="#d8e0eb" stroke-width="2"/><path d="M341.0,246.0 C365.8,246.0 375.2,246.0 400.0,246.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="335.5" y="219.0" width="70.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="370.5" y="236.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#64748b"><tspan x="370.5" dy="0.0">lookup</tspan></text><path d="M686.0,246.0 C710.8,246.0 720.2,246.0 745.0,246.0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="680.5" y="