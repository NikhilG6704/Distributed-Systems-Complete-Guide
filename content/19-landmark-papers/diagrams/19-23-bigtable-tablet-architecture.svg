idth="3" marker-end="url(#arr)"/><rect x="1025.5" y="449.0" width="70.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="1060.5" y="466.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#64748b"><tspan x="1060.5" dy="0.0">merge</tspan></text><rect x="55" y="175" width="286" height="142" rx="17" fill="#dceafe" stroke="#3267a8" stroke-width="2" filter="url(#soft)"/><text x="198.0" y="206.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="198.0" dy="0.0">Client</tspan></text><text x="198.0" y="243.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="198.0" dy="0.0">row-key request</tspan></text><rect x="400" y="175" width="286" height="142" rx="17" fill="#eee5ff" stroke="#7045a5" stroke-width="2" filter="url(#soft)"/><text x="543.0" y="206.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="543.0" dy="0.0">Bigtable Master</tspan></text><text x="543.0" y="243.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="543.0" dy="0.0">tablet metadata / assignment</tspan></text><rect x="745" y="175" width="286" height="142" rx="17" fill="#dcf4e8" stroke="#23845a" stroke-width="2" filter="url(#soft)"/><text x="888.0" y="206.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="888.0" dy="0.0">Tablet Server A</tspan></text><text x="888.0" y="243.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="888.0" dy="0.0">tablet range A–F</tspan></text><rect x="1090" y="175" width="286" height="142" rx="17" fill="#dcf4e8" stroke="#23845a" stroke-width="2" filter="url(#soft)"/><text x="1233.0" y="206.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="1233.0" dy="0.0">Tablet Server B</tspan></text><text x="1233.0" y="243.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="1233.0" dy="0.0">tablet range G–Z</tspan></text><rect x="55" y="405" width="286" height="142" rx="17" fill="#fff0cc" stroke="#a86a08" stroke-width="2" filter="url(#soft)"/><text x="198.0" y="436.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="198.0" dy="0.0">Commit log</tspan></text><text x="198.0" y="473.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="198.0" dy="0.0">durable write-ahead record</tspan></text><rect x="400" y="405" width="286" height="142" rx="17" fill="#dceafe" stroke="#3267a8" stroke-width="2" filter="url(#soft)"/><text x="543.0" y="436.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="543.0" dy="0.0">Memtable</tspan></text><text x="543.0" y="473.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="543.0" dy="0.0">in-memory sorted buffer</tspan></text><rect x="745" y="405" width="286" height="142" rx="17" fill="#e9eef5" stroke="#64748b" stroke-width="2" filter="url(#soft)"/><text x="888.0" y="436.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="888.0" dy="0.0">SSTables</tspan></text><text x="888.0" y="473.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="888.0" dy="0.0">immutable sorted files</tspan></text><rect x="1090" y="405" width="286" height="142" rx="17" fill="#eee5ff" stroke="#7045a5" stroke-width="2" filter="url(#soft)"/><text x="1233.0" y="436.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="1233.0" dy="0.0">Compaction</tspan></text><text x="1233.0" y="473.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="1233.0" dy="0.0">merge / reclaim obsolete</tspan><tspan x="1233.0" dy="19.0">versions</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="837.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">The original design uses Chubby for coordination and GFS for persistent file storage; storage details are simplified in this layered view.</tspan></text></svg>