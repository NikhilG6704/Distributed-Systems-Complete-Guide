<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Lamport happened-before relation"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b74343"/></marker><marker id="arr-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23845a"/></marker><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#23344d" flood-opacity=".08"/></filter></defs><rect x="0" y="0" width="1440" height="900" fill="#f7f9fc"/><rect x="0" y="0" width="1440" height="12" fill="#3267a8"/><text x="58" y="62.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" fill="#17243a"><tspan x="58" dy="0.0">Lamport happened-before relation</tspan></text><text x="58" y="105.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6b82"><tspan x="58" dy="0.0">Causality is a partial order: local order and message delivery create edges; unrelated events may be concurrent.</tspan></text><line x1="58" y1="132" x2="1382" y2="132" stroke="#d8e0eb" stroke-width="2"/><rect x="58.0" y="155" width="184" height="52" rx="13" fill="#dceafe" stroke="#3267a8" stroke-width="2"/><text x="150.0" y="187.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243a"><tspan x="150.0" dy="0.0">P1</tspan></text><line x1="150.0" y1="210" x2="150.0" y2="745" stroke="#aab6c7" stroke-width="2" stroke-dasharray="7 7"/><rect x="628.0" y="155" width="184" height="52" rx="13" fill="#dceafe" stroke="#3267a8" stroke-width="2"/><text x="720.0" y="187.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243a"><tspan x="720.0" dy="0.0">P2</tspan></text><line x1="720.0" y1="210" x2="720.0" y2="745" stroke="#aab6c7" stroke-width="2" stroke-dasharray="7 7"/><rect x="1198.0" y="155" width="184" height="52" rx="13" fill="#dceafe" stroke="#3267a8" stroke-width="2"/><text x="1290.0" y="187.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#17243a"><tspan x="1290.0" dy="0.0">P3</tspan></text><line x1="1290.0" y1="210" x2="1290.0" y2="745" stroke="#aab6c7" stroke-width="2" stroke-dasharray="7 7"/><circle cx="150.0" cy="250.0" r="11" fill="#23845a" stroke="white" stroke-width="3"/><text x="168.0" y="235.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#5b6b82"><tspan x="168.0" dy="0.0">a: send m1</tspan></text><circle cx="150.0" cy="325.0" r="11" fill="#23845a" stroke="white" stroke-width="3"/><text x="168.0" y="310.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#5b6b82"><tspan x="168.0" dy="0.0">b: local</tspan></text><circle cx="720.0" cy="400.0" r="11" fill="#23845a" stroke="white" stroke-width="3"/><text x="738.0" y="385.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#5b6b82"><tspan x="738.0" dy="0.0">c: receive m1</tspan></text><circle cx="720.0" cy="475.0" r="11" fill="#23845a" stroke="white" stroke-width="3"/><text x="738.0" y="460.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#5b6b82"><tspan x="738.0" dy="0.0">d: send m2</tspan></text><circle cx="1290.0" cy="550.0" r="11" fill="#23845a" stroke="white" stroke-width="3"/><text x="1272.0" y="535.0" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#5b6b82"><tspan x="1272.0" dy="0.0">e: independent</tspan></text><circle cx="1290.0" cy="625.0" r="11" fill="#23845a" stroke="white" stroke-width="3"/><text x="1272.0" y="610.0" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="550" fill="#5b6b82"><tspan x="1272.0" dy="0.0">f: receive m2</tspan></text><path d="M150.0,250.0 Q435.0,299.0 720.0,400.0" fill="none" stroke="#3267a8" stroke-width="3" marker-end="url(#arr)"/><rect x="368.0" y="272.0" width="134" height="24" rx="11" fill="#f7f9fc" stroke="#d6dfeb"/><text x="435.0" y="289.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#3267a8"><tspan x="435.0" dy="0.0">m1</tspan></text><path d="M720.0,475.0 Q1005.0,524.0 1290.0,625.0" fill="none" stroke="#3267a8" stroke-width="3" marker-end="url(#arr)"/><rect x="938.0" y="497.0" width="134" height="24" rx="11" fill="#f7f9fc" stroke="#d6dfeb"/><text x="1005.0" y="514.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#3267a8"><tspan x="1005.0" dy="0.0">m2</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="837.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">Solid causal path means a → b. Event e is concurrent with unrelated events: neither e → d nor d → e.</tspan></text></svg>