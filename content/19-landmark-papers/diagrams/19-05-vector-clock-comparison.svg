<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Vector clocks: causality and concurrency"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b74343"/></marker><marker id="arr-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23845a"/></marker><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#23344d" flood-opacity=".08"/></filter></defs><rect x="0" y="0" width="1440" height="900" fill="#f7f9fc"/><rect x="0" y="0" width="1440" height="12" fill="#3267a8"/><text x="58" y="62.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" fill="#17243a"><tspan x="58" dy="0.0">Vector clocks: causality and concurrency</tspan></text><text x="58" y="105.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6b82"><tspan x="58" dy="0.0">Compare vectors component-wise; incomparable vectors represent concurrent events.</tspan></text><line x1="58" y1="132" x2="1382" y2="132" stroke="#d8e0eb" stroke-width="2"/><rect x="80" y="185" width="580" height="142" rx="17" fill="#dceafe" stroke="#3267a8" stroke-width="2" filter="url(#soft)"/><text x="370.0" y="216.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="370.0" dy="0.0">P1 event</tspan></text><text x="370.0" y="253.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="370.0" dy="0.0">[1,0,0]</tspan></text><text x="370" y="297.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750" fill="#17243a"><tspan x="370" dy="0.0">[1,0,0]</tspan></text><rect x="740" y="185" width="580" height="142" rx="17" fill="#dcf4e8" stroke="#23845a" stroke-width="2" filter="url(#soft)"/><text x="1030.0" y="216.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="1030.0" dy="0.0">P2 receives P1</tspan></text><text x="1030.0" y="253.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="1030.0" dy="0.0">[1,1,0]</tspan></text><text x="1030" y="297.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750" fill="#17243a"><tspan x="1030" dy="0.0">[1,1,0]</tspan></text><rect x="80" y="445" width="580" height="142" rx="17" fill="#fff0cc" stroke="#a86a08" stroke-width="2" filter="url(#soft)"/><text x="370.0" y="476.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="370.0" dy="0.0">independent P3</tspan></text><text x="370.0" y="513.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="370.0" dy="0.0">[0,0,1]</tspan></text><text x="370" y="557.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750" fill="#17243a"><tspan x="370" dy="0.0">[0,0,1]</tspan></text><rect x="740" y="445" width="580" height="142" rx="17" fill="#eee5ff" stroke="#7045a5" stroke-width="2" filter="url(#soft)"/><text x="1030.0" y="476.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#17243a"><tspan x="1030.0" dy="0.0">later P3 event</tspan></text><text x="1030.0" y="513.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="450" fill="#5b6b82"><tspan x="1030.0" dy="0.0">[1,1,2]</tspan></text><text x="1030" y="557.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750" fill="#17243a"><tspan x="1030" dy="0.0">[1,1,2]</tspan></text><path d="M660.0,255.0 C710.4,255.0 729.6,255.0 780.0,255.0" fill="none" stroke="#23845a" stroke-width="3" marker-end="url(#arr-green)"/><rect x="645.0" y="228.0" width="150.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="720.0" y="245.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#23845a"><tspan x="720.0" dy="0.0">component-wise ≤</tspan></text><path d="M370.0,470.0 C370.0,520.4 370.0,539.6 370.0,590.0" fill="none" stroke="#b74343" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arr-red)"/><rect x="311.0" y="503.0" width="118.0" height="25" rx="12" fill="#f7f9fc" stroke="#d8e0eb"/><text x="370.0" y="520.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#b74343"><tspan x="370.0" dy="0.0">incomparable</tspan></text><text x="720" y="710.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#23845a"><tspan x="720" dy="0.0">Dominance = causal order</tspan></text><text x="720" y="750.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#b74343"><tspan x="720" dy="0.0">Incomparable vectors = concurrent events</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="837.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">X &lt; Y when every component of X is ≤ the corresponding component of Y and at least one is strictly smaller.</tspan></text></svg>