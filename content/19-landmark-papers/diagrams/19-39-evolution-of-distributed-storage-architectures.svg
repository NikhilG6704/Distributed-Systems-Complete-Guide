groups + global placement</tspan></text><rect x="1005" y="541" width="340" height="78" fill="#ffffff" stroke="#d5deea"/><text x="1175.0" y="571.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="1175.0" dy="0.0">External consistency with</tspan><tspan x="1175.0" dy="17.0">coordination</tspan></text><rect x="65" y="619" width="260" height="78" fill="#eef3f8" stroke="#d5deea"/><text x="195.0" y="658.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="195.0" dy="0.0">TAO</tspan></text><rect x="325" y="619" width="330" height="78" fill="#eef3f8" stroke="#d5deea"/><text x="490.0" y="658.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="490.0" dy="0.0">Objects + associations</tspan></text><rect x="655" y="619" width="350" height="78" fill="#eef3f8" stroke="#d5deea"/><text x="830.0" y="658.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="830.0" dy="0.0">Regional caches + MySQL</tspan></text><rect x="1005" y="619" width="340" height="78" fill="#eef3f8" stroke="#d5deea"/><text x="1175.0" y="658.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="1175.0" dy="0.0">Read-heavy graph operations</tspan></text><rect x="58" y="806" width="1324" height="62" rx="13" fill="#eef3f8" stroke="#d8e0eb"/><text x="78" y="837.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#5b6b82"><tspan x="78" dy="0.0">Family resemblance is not implementation equivalence: compare data model, metadata, replication, and consistency guarantees separately.</tspan></text></svg>