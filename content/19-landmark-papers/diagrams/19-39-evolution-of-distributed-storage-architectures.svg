<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Evolution of distributed storage architectures"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b74343"/></marker><marker id="arr-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23845a"/></marker><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#23344d" flood-opacity=".08"/></filter></defs><rect x="0" y="0" width="1440" height="900" fill="#f7f9fc"/><rect x="0" y="0" width="1440" height="12" fill="#3267a8"/><text x="58" y="62.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" fill="#17243a"><tspan x="58" dy="0.0">Evolution of distributed storage architectures</tspan></text><text x="58" y="95.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6b82"><tspan x="58" dy="0.0">These systems solve different workload and consistency problems; the arrows indicate conceptual resemblance, not direct</tspan><tspan x="58" dy="20.0">equivalence.</tspan></text><line x1="58" y1="132" x2="1382" y2="132" stroke="#d8e0eb" stroke-width="2"/><rect x="65" y="175" width="260" height="54" fill="#3267a8" stroke="white" stroke-width="2"/><text x="195.0" y="208.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff"><tspan x="195.0" dy="0.0">System</tspan></text><rect x="325" y="175" width="330" height="54" fill="#3267a8" stroke="white" stroke-width="2"/><text x="490.0" y="208.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff"><tspan x="490.0" dy="0.0">Primary abstraction</tspan></text><rect x="655" y="175" width="350" height="54" fill="#3267a8" stroke="white" stroke-width="2"/><text x="830.0" y="208.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff"><tspan x="830.0" dy="0.0">Placement / replication</tspan></text><rect x="1005" y="175" width="340" height="54" fill="#3267a8" stroke="white" stroke-width="2"/><text x="1175.0" y="208.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff"><tspan x="1175.0" dy="0.0">Typical trade-off</tspan></text><rect x="65" y="229" width="260" height="78" fill="#ffffff" stroke="#d5deea"/><text x="195.0" y="268.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="195.0" dy="0.0">GFS</tspan></text><rect x="325" y="229" width="330" height="78" fill="#ffffff" stroke="#d5deea"/><text x="490.0" y="268.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="490.0" dy="0.0">Large files / chunks</tspan></text><rect x="655" y="229" width="350" height="78" fill="#ffffff" stroke="#d5deea"/><text x="830.0" y="268.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="830.0" dy="0.0">Master metadata + chunk replicas</tspan></text><rect x="1005" y="229" width="340" height="78" fill="#ffffff" stroke="#d5deea"/><text x="1175.0" y="268.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="1175.0" dy="0.0">High-throughput streaming I/O</tspan></text><rect x="65" y="307" width="260" height="78" fill="#eef3f8" stroke="#d5deea"/><text x="195.0" y="346.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="195.0" dy="0.0">Bigtable</tspan></text><rect x="325" y="307" width="330" height="78" fill="#eef3f8" stroke="#d5deea"/><text x="490.0" y="346.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="490.0" dy="0.0">Sorted sparse map</tspan></text><rect x="655" y="307" width="350" height="78" fill="#eef3f8" stroke="#d5deea"/><text x="830.0" y="346.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="830.0" dy="0.0">Tablet ranges + server assignment</tspan></text><rect x="1005" y="307" width="340" height="78" fill="#eef3f8" stroke="#d5deea"/><text x="1175.0" y="346.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="1175.0" dy="0.0">Ordered range access</tspan></text><rect x="65" y="385" width="260" height="78" fill="#ffffff" stroke="#d5deea"/><text x="195.0" y="424.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="195.0" dy="0.0">Dynamo</tspan></text><rect x="325" y="385" width="330" height="78" fill="#ffffff" stroke="#d5deea"/><text x="490.0" y="424.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="490.0" dy="0.0">Key-value items</tspan></text><rect x="655" y="385" width="350" height="78" fill="#ffffff" stroke="#d5deea"/><text x="830.0" y="424.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x="830.0" dy="0.0">Hash ring + replicas / versions</tspan></text><rect x="1005" y="385" width="340" height="78" fill="#ffffff" stroke="#d5deea"/><text x="1175.0" y="424.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#17243a"><tspan x=