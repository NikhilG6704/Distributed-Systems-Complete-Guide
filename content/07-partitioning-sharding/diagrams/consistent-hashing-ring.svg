<text x="915.0" y="710" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="650" fill="#11998E" text-anchor="middle" opacity="1" style="">Other keys keep ownership</text>
<text x="1063" y="748" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#63788D" text-anchor="middle" opacity="1" style="">Only the interval newly claimed by N5 changes owner.</text>
<text x="56" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">Consistent hashing limits remapping; it does not eliminate data movement or guarantee perfectly even load.</text>
