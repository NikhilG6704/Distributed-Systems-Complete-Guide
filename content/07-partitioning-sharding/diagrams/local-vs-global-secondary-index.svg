<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Local vs. global secondary indexes">
<title>Local vs. global secondary indexes</title><desc>Local indexes live with each shard; a global index offers cross-shard lookup by alternate key but adds a distributed maintenance path.</desc>
<defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#63788D"/></marker>
          <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3977B8"/></marker>
          <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#11998E"/></marker>
          <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#E79A35"/></marker>
          <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#D95F59"/></marker>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#19344D" flood-opacity="0.08"/></filter>
        </defs>
<rect width="1440" height="900" fill="#F4F7FB"/>
<text x="56" y="54" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">Local vs. global secondary indexes</text>
<text x="56" y="86" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">Local indexes live with each shard; a global index offers cross-shard lookup by alternate key but adds a distributed maintenance path.</text>
<line x1="56" y1="108" x2="1384" y2="108" stroke="#D7E1EA" stroke-width="2" stroke-linecap="round"/>
<rect x="56" y="140" width="642" height="650" rx="18" fill="#FFFFFF" stroke="#D7E1EA" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="56" y="140" width="7" height="650" rx="3" fill="#3977B8" stroke="none" stroke-width="1.5"/>
<text x="80" y="176" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">Local secondary indexes</text>
<text x="80" y="201" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">Index scope follows each base shard.</text>
<rect x="742" y="140" width="642" height="650" rx="18" fill="#FFFFFF" stroke="#D7E1EA" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="742" y="140" width="7" height="650" rx="3" fill="#11998E" stroke="none" stroke-width="1.5"/>
<text x="766" y="176" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">Global secondary index</text>
<text x="766" y="201" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">A separate index maps an alternate key to records across shards.</text>
<rect x="95" y="260" width="160" height="135" rx="12" fill="#FBFCFE" stroke="#3977B8" stroke-width="1.4"/>
<text x="175" y="285" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Shard 1</text>
<rect x="115" y="305" width="120" height="34" rx="7" fill="#E8F1FA" stroke="#3977B8" stroke-width="1.5"/>
<text x="175" y="327" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#17324D" text-anchor="middle" opacity="1" style="">Base rows</text>
<rect x="115" y="350" width="120" height="30" rx="7" fill="#FFFFFF" stroke="#3977B8" stroke-width="1.5"/>
<text x="175" y="370" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="650" fill="#3977B8" text-anchor="middle" opacity="1" style="">Local index</text>
<rect x="285" y="260" width="160" height="135" rx="12" fill="#FBFCFE" stroke="#11998E" stroke-width="1.4"/>
<text x="365" y="285" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Shard 2</text>
<rect x="305" y="305" width="120" height="34" rx="7" fill="#E4F5F2" stroke="#11998E" stroke-width="1.5"/>
<text x="365" y="327" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#17324D" text-anchor="middle" opacity="1" style="">Base rows</text>
<rect x="305" y="350" width="120" height="30" rx="7" fill="#FFFFFF" stroke="#11998E" stroke-width="1.5"/>
<text x="365" y="370" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="650" fill="#11998E" text-anchor="middle" opacity="1" style="">Local index</text>
<rect x="475" y="260" width="160" height="135" rx="12" fill="#FBFCFE" stroke="#8064B4" stroke-width="1.4"/>
<text x="555" y="285" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Shard 3</text>
<rect x="495" y="305" width="120" height="34" rx="7" fill="#F0EBF8" stroke="#8064B4" stroke-width="1.5"/>
<text x="555" y="327" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#17324D" text-anchor="middle" opacity="1" style="">Base rows</text>
<rect x="495" y="350" width="120" height="30" rx="7" fill="#FFFFFF" stroke="#8064B4" stroke-width="1.5"/>
<text x="555" y="370" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="650" fill="#8064B4" text-anchor="middle" opacity="1" style="">Local index</text>
<rect x="190" y="450" width="280" height="72" rx="12" fill="#E8F1FA" stroke="#3977B8" stroke-width="1.5"/>
<text x="330.0" y="477" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Query by customer_id</text>
<text x="330.0" y="499" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="330.0" dy="0">target one shard</tspan></text>
<line x1="330" y1="450" x2="175" y2="400" stroke="#3977B8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
<rect x="110" y="560" width="430" height="30" rx="15" fill="#FFF3E2" stroke="none" stroke-width="1.5"/>
<text x="325.0" y="580" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="650" fill="#E79A35" text-anchor="middle" opacity="1" style="">Query by date alone → fan out to 3 indexes</text>
<text x="110" y="640" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#63788D" text-anchor="start"><tspan x="110" dy="0">Local index maintenance stays close to the base row.</tspan><tspan x="110" dy="24">A query missing the shard key may still need scatter-gather.</tspan></text>
<rect x="790" y="585" width="130" height="85" rx="10" fill="#FBFCFE" stroke="#3977B8" stroke-width="1.3"/>
<text x="855" y="612" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Shard 1</text>
<text x="855" y="642" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#63788D" text-anchor="middle" opacity="1" style="">Base rows</text>
<rect x="940" y="585" width="130" height="85" rx="10" fill="#FBFCFE" stroke="#11998E" stroke-width="1.3"/>
<text x="1005" y="612" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Shard 2</text>
<text x="1005" y="642" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#63788D" text-anchor="middle" opacity="1" style="">Base rows</text>
<rect x="1090" y="585" width="130" height="85" rx="10" fill="#FBFCFE" stroke="#8064B4" stroke-width="1.3"/>
<text x="1155" y="612" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Shard 3</text>
<text x="1155" y="642" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#63788D" text-anchor="middle" opacity="1" style="">Base rows</text>
<rect x="880" y="260" width="350" height="110" rx="12" fill="#E4F5F2" stroke="#11998E" stroke-width="1.5"/>
<text x="1055.0" y="287" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Global index · category</text>
<text x="1055.0" y="309" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="1055.0" dy="0">category → (shard, primary key)</tspan></text>
<line x1="1055" y1="370" x2="920" y2="580" stroke="#11998E" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
<line x1="1055" y1="370" x2="1070" y2="580" stroke="#11998E" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
<line x1="1055" y1="370" x2="1220" y2="580" stroke="#11998E" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
<rect x="885" y="430" width="340" height="88" rx="12" fill="#F0EBF8" stroke="#8064B4" stroke-width="1.5"/>
<text x="1055.0" y="457" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Search: category = &quot;shoes&quot;</text>
<text x="1055.0" y="479" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="1055.0" dy="0">index returns pointers to many shards</tspan></text>
<line x1="1055" y1="370" x2="1055" y2="425" stroke="#11998E" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
<text x="1060" y="720" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#63788D" text-anchor="middle" opacity="1" style="">Insert / update / delete must maintain index entries.</text>
<text x="1060" y="742" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#D95F59" text-anchor="middle" opacity="1" style="">Atomicity, lag, stale pointers, and index hotspots matter.</text>
<text x="56" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">Index semantics differ by product: local/global labels are architectural concepts, not interchangeable vendor feature names.</text>
</svg>