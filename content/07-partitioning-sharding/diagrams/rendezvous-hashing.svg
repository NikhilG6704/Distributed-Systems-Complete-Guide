<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Rendezvous hashing (highest random weight)">
<title>Rendezvous hashing (highest random weight)</title><desc>Each key is scored against every candidate node; the highest deterministic score wins. A new node only takes keys for which it scores highest.</desc>
<defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#63788D"/></marker>
