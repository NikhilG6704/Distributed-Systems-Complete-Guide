<rect x="1142" y="365" width="72" height="31" rx="7" fill="#F0EBF8" stroke="#8064B4" stroke-width="1" />
<text x="1178" y="386" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#17324D" text-anchor="middle" opacity="1" style="">Primary</text>
<rect x="1142" y="408" width="72" height="31" rx="7" fill="#F0EBF8" stroke="#8064B4" stroke-width="1" />
<text x="1178" y="429" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#17324D" text-anchor="middle" opacity="1" style="">Replica</text>
<rect x="1142" y="451" width="72" height="31" rx="7" fill="#F0EBF8" stroke="#8064B4" stroke-width="1" />
<text x="1178" y="472" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#17324D" text-anchor="middle" opacity="1" style="">Replica</text>
<rect x="1244" y="260" width="112" height="250" rx="12" fill="#FBFCFE" stroke="#E79A35" stroke-width="1.6" />
<text x="1300" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Shard 3</text>
<rect x="1258" y="308" width="84" height="30" rx="15" fill="#FFF3E2" stroke="none" stroke-width="1.5" />
<text x="1300.0" y="328" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="650" fill="#E79A35" text-anchor="middle" opacity="1" style="">S–Z</text>
<rect x="1264" y="365" width="72" height="31" rx="7" fill="#FFF3E2" stroke="#E79A35" stroke-width="1" />
<text x="1300" y="386" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#17324D" text-anchor="middle" opacity="1" style="">Primary</text>
<rect x="1264" y="408" width="72" height="31" rx="7" fill="#FFF3E2" stroke="#E79A35" stroke-width="1" />
<text x="1300" y="429" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#17324D" text-anchor="middle" opacity="1" style="">Replica</text>
<rect x="1264" y="451" width="72" height="31" rx="7" fill="#FFF3E2" stroke="#E79A35" stroke-width="1" />
<text x="1300" y="472" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#17324D" text-anchor="middle" opacity="1" style="">Replica</text>
<text x="1179" y="570" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="1179" dy="0">Each shard owns a different subset;</tspan><tspan x="1179" dy="22">that subset is copied within its</tspan><tspan x="1179" dy="22">own replica group.</tspan></text>
<rect x="1065" y="665" width="230" height="30" rx="15" fill="#E4F5F2" stroke="none" stroke-width="1.5" />
<text x="1180.0" y="685" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="650" fill="#11998E" text-anchor="middle" opacity="1" style="">Different subsets + copies</text>
<text x="56" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">Key distinction: partitioning changes data ownership; replication adds copies of an owned partition.</text>
<rect x="540" y="225" width="360" height="390" rx="8" fill="#FFFFFF" stroke="none" /><rect x="650" y="245" width="140" height="95" rx="12" fill="#E8F1FA" stroke="#3977B8" stroke-width="1.5" /><text x="720" y="272" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle">Primary</text><text x="720" y="295" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle">Complete dataset A–Z</text><line x1="686" y1="340" x2="625" y2="410" stroke="#3977B8" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrowBlue)" /><line x1="754" y1="340" x2="815" y2="410" stroke="#3977B8" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrowBlue)" /><rect x="555" y="410" width="140" height="95" rx="12" fill="#E8F1FA" stroke="#3977B8" stroke-width="1.5" /><text x="625" y="438" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#17324D" text-anchor="middle">Replica 2</text><text x="625" y="462" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle">Complete dataset A–Z</text><rect x="755" y="410" width="140" height="95" rx="12" fill="#E8F1FA" stroke="#3977B8" stroke-width="1.5" /><text x="825" y="438" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#17324D" text-anchor="middle">Replica 3</text><text x="825" y="462" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle">Complete dataset A–Z</text><text x="720" y="555" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#63788D" text-anchor="middle">One logical dataset copied to each replica.</text></svg>