<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Partitioning vs. replication">
<title>Partitioning vs. replication</title><desc>Partitioning divides a dataset into distinct subsets; replication copies the same subset for availability and read scale.</desc>
<defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#63788D" /></marker>
          <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3977B8" /></marker>
          <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#11998E" /></marker>
          <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#E79A35" /></marker>
          <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#D95F59" /></marker>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#19344D" flood-opacity="0.08" /></filter>
        </defs>
<rect width="1440" height="900" fill="#F4F7FB" />
<text x="56" y="54" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">Partitioning vs. replication</text>
<text x="56" y="86" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">Partitioning divides a dataset into distinct subsets; replication copies the same subset for availability and read scale.</text>
<line x1="56" y1="108" x2="1384" y2="108" stroke="#D7E1EA" stroke-width="2" stroke-linecap="round" />
<rect x="56" y="140" width="410" height="660" rx="18" fill="#FFFFFF" stroke="#D7E1EA" stroke-width="1.3" filter="url(#shadow)" />
<rect x="56" y="140" width="7" height="660" rx="3" fill="#8EA1B3" stroke="none" stroke-width="1.5" />
<text x="80" y="176" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">A  Single database</text>
<rect x="515" y="140" width="410" height="660" rx="18" fill="#FFFFFF" stroke="#D7E1EA" stroke-width="1.3" filter="url(#shadow)" />
<rect x="515" y="140" width="7" height="660" rx="3" fill="#3977B8" stroke="none" stroke-width="1.5" />
<text x="539" y="176" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">B  Replicated database</text>
<rect x="974" y="140" width="410" height="660" rx="18" fill="#FFFFFF" stroke="#D7E1EA" stroke-width="1.3" filter="url(#shadow)" />
<rect x="974" y="140" width="7" height="660" rx="3" fill="#11998E" stroke="none" stroke-width="1.5" />
<text x="998" y="176" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">C  Sharded + replicated</text>
<rect x="156" y="290" width="210" height="105" rx="12" fill="#EEF2F6" stroke="#8EA1B3" stroke-width="1.5" />
<text x="261.0" y="317" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Database</text>
<text x="261.0" y="339" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="261.0" dy="0">Complete dataset A–Z</tspan></text>
<text x="261" y="447" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="750" fill="#17324D" text-anchor="middle" opacity="1" style="">A–Z</text>
<text x="261" y="490" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="261" dy="0">All records live together.</tspan><tspan x="261" dy="25">One storage/write domain.</tspan></text>
<rect x="150" y="615" width="220" height="30" rx="15" fill="#FFF3E2" stroke="none" stroke-width="1.5" />
<text x="260.0" y="635" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="650" fill="#E79A35" text-anchor="middle" opacity="1" style="">No partitioning</text>
<rect x="570" y="255" width="140" height="105" rx="12" fill="#E8F1FA" stroke="#3977B8" stroke-width="1.5" />
<text x="640.0" y="282" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Replica 1</text>
<text x="640.0" y="304" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="640.0" dy="0">Complete A–Z</tspan></text>
<rect x="730" y="255" width="140" height="105" rx="12" fill="#E8F1FA" stroke="#3977B8" stroke-width="1.5" />
<text x="800.0" y="282" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Replica 2</text>
<text x="800.0" y="304" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="800.0" dy="0">Complete A–Z</tspan></text>
<rect x="650" y="425" width="140" height="105" rx="12" fill="#E8F1FA" stroke="#3977B8" stroke-width="1.5" />
<text x="720.0" y="452" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Replica 3</text>
<text x="720.0" y="474" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="720.0" dy="0">Complete A–Z</tspan></text>
<line x1="640" y1="362" x2="700" y2="425" stroke="#3977B8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowBlue)" />
<line x1="800" y1="362" x2="740" y2="425" stroke="#3977B8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowBlue)" />
<text x="720" y="580" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="720" dy="0">Each replica stores the same</tspan><tspan x="720" dy="24">logical dataset A–Z.</tspan></text>
<rect x="610" y="650" width="220" height="30" rx="15" fill="#E8F1FA" stroke="none" stroke-width="1.5" />
<text x="720.0" y="670" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="650" fill="#3977B8" text-anchor="middle" opacity="1" style="">Same data copied</text>
<rect x="1000" y="260" width="112" height="250" rx="12" fill="#FBFCFE" stroke="#11998E" stroke-width="1.6" />
<text x="1056" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Shard 1</text>
<rect x="1014" y="308" width="84" height="30" rx="15" fill="#E4F5F2" stroke="none" stroke-width="1.5" />
<text x="1056.0" y="328" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="650" fill="#11998E" text-anchor="middle" opacity="1" style="">A–I</text>
<rect x="1020" y="365" width="72" height="31" rx="7" fill="#E4F5F2" stroke="#11998E" stroke-width="1" />
<text x="1056" y="386" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#17324D" text-anchor="middle" opacity="1" style="">Primary</text>
<rect x="1020" y="408" width="72" height="31" rx="7" fill="#E4F5F2" stroke="#11998E" stroke-width="1" />
<text x="1056" y="429" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#17324D" text-anchor="middle" opacity="1" style="">Replica</text>
<rect x="1020" y="451" width="72" height="31" rx="7" fill="#E4F5F2" stroke="#11998E" stroke-width="1" />
<text x="1056" y="472" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#17324D" text-anchor="middle" opacity="1" style="">Replica</text>
<rect x="1122" y="260" width="112" height="250" rx="12" fill="#FBFCFE" stroke="#8064B4" stroke-width="1.6" />
<text x="1178" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Shard 2</text>
<rect x="1136" y="308" width="84" height="30" rx="15" fill="#F0EBF8" stroke="none" stroke-width="1.5" />
