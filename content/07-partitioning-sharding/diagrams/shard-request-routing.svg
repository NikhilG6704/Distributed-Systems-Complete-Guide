<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Shard request routing">
<title>Shard request routing</title><desc>Routing combines logical key ownership with live endpoint discovery and replica-role selection; these are separate control-plane concerns.</desc>
