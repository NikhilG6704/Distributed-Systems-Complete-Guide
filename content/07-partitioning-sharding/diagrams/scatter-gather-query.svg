<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Scatter-gather query">
<title>Scatter-gather query</title><desc>The coordinator fans out work, each shard reduces locally, and the coordinator merges compact results; tail latency and partial failure remain important.</desc>
<defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#63788D"/></marker>
          <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3977B8"/></marker>
          <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#11998E"/></marker>
          <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#E79A35"/></marker>
          <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#D95F59"/></marker>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#19344D" flood-opacity="0.08"/></filter>
        </defs>
<rect width="1440" height="900" fill="#F4F7FB"/>
<text x="56" y="54" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">Scatter-gather query</text>
<text x="56" y="86" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">The coordinator fans out work, each shard reduces locally, and the coordinator merges compact results; tail latency and partial failure remain important.</text>
<line x1="56" y1="108" x2="1384" y2="108" stroke="#D7E1EA" stroke-width="2" stroke-linecap="round"/>
<rect x="56" y="140" width="1328" height="430" rx="18" fill="#FFFFFF" stroke="#D7E1EA" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="56" y="140" width="7" height="430" rx="3" fill="#8064B4" stroke="none" stroke-width="1.5"/>
<text x="80" y="176" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">Distributed top-K query: local reduction then global merge</text>
<text x="80" y="201" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">Example: find the 100 most popular products across four regional shards.</text>
<rect x="90" y="285" width="190" height="100" rx="12" fill="#F0EBF8" stroke="#8064B4" stroke-width="1.5"/>
<text x="185.0" y="312" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Coordinator</text>
<text x="185.0" y="334" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="185.0" dy="0">query planner</tspan></text>
<line x1="280" y1="335" x2="430" y2="335" stroke="#8064B4" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="360" y="275" width="160" height="120" rx="12" fill="#E8F1FA" stroke="#3977B8" stroke-width="1.5"/>
<text x="440.0" y="302" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Shard 1</text>
<text x="440.0" y="324" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="440.0" dy="0">filter + local top-K</tspan></text>
<line x1="440" y1="395" x2="750" y2="470" stroke="#3977B8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="280" y1="335" x2="650" y2="335" stroke="#8064B4" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="580" y="275" width="160" height="120" rx="12" fill="#E4F5F2" stroke="#11998E" stroke-width="1.5"/>
<text x="660.0" y="302" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Shard 2</text>
<text x="660.0" y="324" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="660.0" dy="0">filter + local top-K</tspan></text>
<line x1="660" y1="395" x2="750" y2="470" stroke="#11998E" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="280" y1="335" x2="870" y2="335" stroke="#8064B4" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="800" y="275" width="160" height="120" rx="12" fill="#FFF3E2" stroke="#E79A35" stroke-width="1.5"/>
<text x="880.0" y="302" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Shard 3</text>
<text x="880.0" y="324" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="880.0" dy="0">filter + local top-K</tspan></text>
<line x1="880" y1="395" x2="750" y2="470" stroke="#E79A35" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="280" y1="335" x2="1090" y2="335" stroke="#8064B4" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1020" y="275" width="160" height="120" rx="12" fill="#EAF5EC" stroke="#4C9A66" stroke-width="1.5"/>
<text x="1100.0" y="302" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Shard 4</text>
<text x="1100.0" y="324" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="1100.0" dy="0">filter + local top-K</tspan></text>
<line x1="1100" y1="395" x2="750" y2="470" stroke="#4C9A66" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="640" y="445" width="220" height="82" rx="12" fill="#F0EBF8" stroke="#8064B4" stroke-width="1.5"/>
<text x="750.0" y="472" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Global merge</text>
<text x="750.0" y="494" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="750.0" dy="0">combine sorted candidates</tspan></text>
<line x1="640" y1="486" x2="500" y2="520" stroke="#8064B4" stroke-width="1.7" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="490" y="540" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#8064B4" text-anchor="middle" opacity="1" style="">Final top 100</text>
<text x="750" y="540" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="650" fill="#17324D" text-anchor="middle" opacity="1" style="">Response</text>
<line x1="860" y1="486" x2="1015" y2="520" stroke="#8064B4" stroke-width="1.7" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="56" y="600" width="640" height="200" rx="18" fill="#FFFFFF" stroke="#D7E1EA" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="56" y="600" width="7" height="200" rx="3" fill="#D95F59" stroke="none" stroke-width="1.5"/>
<text x="80" y="636" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">Naive fan-out</text>
<text x="80" y="661" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">Transfer all matching rows from every shard.</text>
<text x="90" y="690" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#63788D" text-anchor="start"><tspan x="90" dy="0">Large network payload and coordinator memory use.</tspan><tspan x="90" dy="25">Global sort/aggregate works on a much larger set.</tspan></text>
<rect x="90" y="745" width="260" height="30" rx="15" fill="#FCEBE9" stroke="none" stroke-width="1.5"/>
<text x="220.0" y="765" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="650" fill="#D95F59" text-anchor="middle" opacity="1" style="">High network + merge cost</text>
<rect x="726" y="600" width="658" height="200" rx="18" fill="#FFFFFF" stroke="#D7E1EA" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="726" y="600" width="7" height="200" rx="3" fill="#11998E" stroke="none" stroke-width="1.5"/>
<text x="750" y="636" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">Push computation to shards</text>
<text x="750" y="661" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">Filter and compute local top-K before returning results.</text>
<text x="760" y="690" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#63788D" text-anchor="start"><tspan x="760" dy="0">Compact candidate sets reduce network traffic.</tspan><tspan x="760" dy="25">A delayed shard can still dominate all-shard P99.</tspan></text>
<rect x="760" y="745" width="280" height="30" rx="15" fill="#E4F5F2" stroke="none" stroke-width="1.5"/>
<text x="900.0" y="765" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="650" fill="#11998E" text-anchor="middle" opacity="1" style="">Lower transfer; tail remains</text>
<text x="1195" y="765" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="650" fill="#E79A35" text-anchor="middle" opacity="1" style="">Optional partial result policy</text>
<text x="1195" y="783" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="650" fill="#E79A35" text-anchor="middle" opacity="1" style="">must be explicit to callers.</text>
<text x="56" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">Scatter-gather is a query plan, not a free abstraction: fan-out, merge cost, tail latency, and partial-result semantics are design choices.</text>
<rect x="450" y="520" width="650" height="50" fill="#FFFFFF" stroke="none"/>
<rect x="640" y="445" width="220" height="82" rx="12" fill="#F0EBF8" stroke="#8064B4" stroke-width="1.5"/>
<text x="750" y="472" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle">Global merge</text>
<text x="750" y="494" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle">combine sorted candidates</text>
<line x1="750" y1="527" x2="750" y2="545" stroke="#8064B4" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="750" y="565" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="650" fill="#8064B4" text-anchor="middle">Final top 100 → client</text>
</svg>