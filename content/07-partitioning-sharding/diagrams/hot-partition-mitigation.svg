<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Hot-partition mitigation">
<title>Hot-partition mitigation</title><desc>Uniform key placement does not guarantee uniform traffic: a small number of popular keys can saturate one partition.</desc>
<defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#63788D"/></marker>
          <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3977B8"/></marker>
          <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#11998E"/></marker>
          <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#E79A35"/></marker>
          <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#D95F59"/></marker>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#19344D" flood-opacity="0.08"/></filter>
        </defs>
<rect width="1440" height="900" fill="#F4F7FB"/>
<text x="56" y="54" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">Hot-partition mitigation</text>
<text x="56" y="86" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">Uniform key placement does not guarantee uniform traffic: a small number of popular keys can saturate one partition.</text>
<line x1="56" y1="108" x2="1384" y2="108" stroke="#D7E1EA" stroke-width="2" stroke-linecap="round"/>
<rect x="56" y="140" width="440" height="650" rx="18" fill="#FFFFFF" stroke="#D7E1EA" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="56" y="140" width="7" height="650" rx="3" fill="#D95F59" stroke="none" stroke-width="1.5"/>
<text x="80" y="176" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">Before: concentrated workload</text>
<text x="80" y="201" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">A celebrity record attracts a disproportionate share of reads.</text>
<rect x="95" y="235" width="170" height="92" rx="12" fill="#E8F1FA" stroke="#3977B8" stroke-width="1.5"/>
<text x="180.0" y="262" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Application</text>
<text x="180.0" y="284" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="180.0" dy="0">millions of followers</tspan></text>
<line x1="265" y1="280" x2="350" y2="350" stroke="#D95F59" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowRed)"/>
<text x="308" y="300" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#D95F59" text-anchor="middle" opacity="1" style="">70% traffic</text>
<rect x="285" y="350" width="170" height="115" rx="12" fill="#FCEBE9" stroke="#D95F59" stroke-width="1.5"/>
<text x="370.0" y="377" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Hot shard</text>
<text x="370.0" y="399" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="370.0" dy="0">celebrity_id = 7</tspan></text>
<rect x="95" y="530" width="150" height="78" rx="12" fill="#EEF2F6" stroke="#8EA1B3" stroke-width="1.5"/>
<text x="170.0" y="557" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Shard 2</text>
<text x="170.0" y="579" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="170.0" dy="0">low traffic</tspan></text>
<rect x="285" y="530" width="150" height="78" rx="12" fill="#EEF2F6" stroke="#8EA1B3" stroke-width="1.5"/>
<text x="360.0" y="557" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Shard 3</text>
<text x="360.0" y="579" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="360.0" dy="0">low traffic</tspan></text>
<text x="275" y="665" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="650" fill="#D95F59" text-anchor="middle" opacity="1" style="">Adding nodes alone does not split</text>
<text x="275" y="686" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="650" fill="#D95F59" text-anchor="middle" opacity="1" style="">one hot key across the cluster.</text>
<rect x="526" y="140" width="858" height="650" rx="18" fill="#FFFFFF" stroke="#D7E1EA" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="526" y="140" width="7" height="650" rx="3" fill="#11998E" stroke="none" stroke-width="1.5"/>
<text x="550" y="176" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">After: distribute the work intentionally</text>
<text x="550" y="201" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">Different techniques suit different read/write patterns; each introduces a trade-off.</text>
<rect x="565" y="240" width="350" height="145" rx="16" fill="#E8F1FA" stroke="#3977B8" stroke-width="1.5"/>
<circle cx="603" cy="282" r="15" fill="#3977B8" stroke="none" stroke-width="1.5"/>
<text x="633" y="287" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">Read-through cache</text>
<text x="593" y="328" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#63788D" text-anchor="start" opacity="1" style="">Absorb repeated reads</text>
<line x1="593" y1="350" x2="885" y2="350" stroke="#D7E1EA" stroke-width="1" stroke-linecap="round"/>
<text x="593" y="373" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#3977B8" text-anchor="start" opacity="1" style="">Best for repeated, cacheable reads</text>
<rect x="965" y="240" width="350" height="145" rx="16" fill="#E4F5F2" stroke="#11998E" stroke-width="1.5"/>
<circle cx="1003" cy="282" r="15" fill="#11998E" stroke="none" stroke-width="1.5"/>
<text x="1033" y="287" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">Read replicas</text>
<text x="993" y="328" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#63788D" text-anchor="start" opacity="1" style="">Spread read serving</text>
<line x1="993" y1="350" x2="1285" y2="350" stroke="#D7E1EA" stroke-width="1" stroke-linecap="round"/>
<text x="993" y="373" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#11998E" text-anchor="start" opacity="1" style="">Read consistency/lag must be explicit</text>
<rect x="565" y="430" width="350" height="145" rx="16" fill="#F0EBF8" stroke="#8064B4" stroke-width="1.5"/>
<circle cx="603" cy="472" r="15" fill="#8064B4" stroke="none" stroke-width="1.5"/>
<text x="633" y="477" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">Key salting / buckets</text>
<text x="593" y="518" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#63788D" text-anchor="start" opacity="1" style="">Split writes across keys</text>
<line x1="593" y1="540" x2="885" y2="540" stroke="#D7E1EA" stroke-width="1" stroke-linecap="round"/>
<text x="593" y="563" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#8064B4" text-anchor="start" opacity="1" style="">Requires fan-out or merge on reads</text>
<rect x="965" y="430" width="350" height="145" rx="16" fill="#FFF3E2" stroke="#E79A35" stroke-width="1.5"/>
<circle cx="1003" cy="472" r="15" fill="#E79A35" stroke="none" stroke-width="1.5"/>
<text x="1033" y="477" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">Dedicated partition</text>
<text x="993" y="518" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" fill="#63788D" text-anchor="start" opacity="1" style="">Isolate large tenant/key</text>
<line x1="993" y1="540" x2="1285" y2="540" stroke="#D7E1EA" stroke-width="1" stroke-linecap="round"/>
<text x="993" y="563" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#E79A35" text-anchor="start" opacity="1" style="">Improves noisy-neighbor isolation</text>
<rect x="600" y="650" width="700" height="30" rx="15" fill="#EAF5EC" stroke="none" stroke-width="1.5"/>
<text x="950.0" y="670" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="650" fill="#4C9A66" text-anchor="middle" opacity="1" style="">Adaptive split + request coalescing can complement these patterns</text>
<text x="56" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">Mitigation is workload-specific: caching helps reads, salting helps write distribution, and dedicated placement helps isolation.</text>
</svg>