<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Directory-based partitioning">
<title>Directory-based partitioning</title><desc>A metadata directory maps a logical tenant or key to a physical shard; safe migrations must reject stale ownership epochs.</desc>
<defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#63788D"/></marker>
          <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3977B8"/></marker>
          <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#11998E"/></marker>
          <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#E79A35"/></marker>
          <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#D95F59"/></marker>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#19344D" flood-opacity="0.08"/></filter>
        </defs>
<rect width="1440" height="900" fill="#F4F7FB"/>
<text x="56" y="54" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">Directory-based partitioning</text>
<text x="56" y="86" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">A metadata directory maps a logical tenant or key to a physical shard; safe migrations must reject stale ownership epochs.</text>
<line x1="56" y1="108" x2="1384" y2="108" stroke="#D7E1EA" stroke-width="2" stroke-linecap="round"/>
<rect x="56" y="140" width="1328" height="295" rx="18" fill="#FFFFFF" stroke="#D7E1EA" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="56" y="140" width="7" height="295" rx="3" fill="#3977B8" stroke="none" stroke-width="1.5"/>
<text x="80" y="176" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">Normal request path — tenant C</text>
<text x="80" y="201" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">The application resolves a logical tenant ID to a current physical shard assignment.</text>
<rect x="95" y="255" width="190" height="100" rx="12" fill="#E8F1FA" stroke="#3977B8" stroke-width="1.5"/>
<text x="190.0" y="282" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Application</text>
<text x="190.0" y="304" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="190.0" dy="0">request: tenant C</tspan></text>
<line x1="285" y1="305" x2="385" y2="305" stroke="#3977B8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
<rect x="390" y="255" width="190" height="100" rx="12" fill="#E4F5F2" stroke="#11998E" stroke-width="1.5"/>
<text x="485.0" y="282" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Routing cache</text>
<text x="485.0" y="304" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="485.0" dy="0">C → Shard 2</tspan></text>
<line x1="580" y1="305" x2="680" y2="305" stroke="#3977B8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
<rect x="685" y="255" width="205" height="100" rx="12" fill="#F0EBF8" stroke="#8064B4" stroke-width="1.5"/>
<text x="787.5" y="282" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Partition directory</text>
<text x="787.5" y="304" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="787.5" dy="0">C → Shard 2 · epoch 17</tspan></text>
<line x1="890" y1="305" x2="1010" y2="305" stroke="#3977B8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
<rect x="1015" y="255" width="300" height="100" rx="12" fill="#E4F5F2" stroke="#11998E" stroke-width="1.5"/>
<text x="1165.0" y="282" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Shard 2</text>
<text x="1165.0" y="304" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="1165.0" dy="0">serves tenant C · epoch 17</tspan></text>
<rect x="455" y="380" width="365" height="30" rx="15" fill="#E8F1FA" stroke="none" stroke-width="1.5"/>
<text x="637.5" y="400" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="650" fill="#3977B8" text-anchor="middle" opacity="1" style="">Cache is a copy of versioned placement metadata</text>
<rect x="56" y="475" width="1328" height="325" rx="18" fill="#FFFFFF" stroke="#D7E1EA" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="56" y="475" width="7" height="325" rx="3" fill="#E79A35" stroke="none" stroke-width="1.5"/>
<text x="80" y="511" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#17324D" text-anchor="start" opacity="1" style="">Migration — Shard 2 → Shard 5</text>
<text x="80" y="536" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">Ownership transition is coordinated with data movement and a routing epoch change.</text>
<rect x="110" y="585" width="220" height="105" rx="12" fill="#E8F1FA" stroke="#3977B8" stroke-width="1.5"/>
<text x="220.0" y="612" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Source Shard 2</text>
<text x="220.0" y="634" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="220.0" dy="0">tenant C · epoch 17</tspan></text>
<rect x="1095" y="585" width="220" height="105" rx="12" fill="#E4F5F2" stroke="#11998E" stroke-width="1.5"/>
<text x="1205.0" y="612" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle" opacity="1" style="">Destination Shard 5</text>
<text x="1205.0" y="634" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#63788D" text-anchor="middle"><tspan x="1205.0" dy="0">tenant C · staging</tspan></text>
<path d="M330 615 C520 520 900 520 1095 615" fill="none" stroke="#E79A35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowOrange)"/>
<text x="715" y="548" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#E79A35" text-anchor="middle" opacity="1" style="">Snapshot + change stream</text>
<rect x="520" y="710" width="400" height="52" rx="12" fill="#FCEBE9" stroke="#D95F59" stroke-width="1.5"/>
<text x="720" y="731" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#D95F59" text-anchor="middle" opacity="1" style="">Old cache epoch 17 → REJECT</text>
<text x="720" y="750" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#17324D" text-anchor="middle" opacity="1" style="">Refresh map → epoch 18 → retry</text>
<line x1="720" y1="690" x2="720" y2="708" stroke="#D95F59" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowRed)"/>
<rect x="110" y="710" width="315" height="30" rx="15" fill="#EAF5EC" stroke="none" stroke-width="1.5"/>
<text x="267.5" y="730" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="650" fill="#4C9A66" text-anchor="middle" opacity="1" style="">Cutover after catch-up + validation</text>
<text x="56" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">Directory updates do not move data by themselves; epoch checks and a migration protocol prevent stale owners from writing.</text>
</svg>