<text x="90" y="780" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#63788D" text-anchor="start" opacity="1" style="">rollback requires reverse replication or a new migration—not simply flipping the route back.</text>
<text x="56" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#63788D" text-anchor="start" opacity="1" style="">Migration must preserve a single authoritative write owner, track changes, validate data, and make cutover observable.</text>
