<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Hash-based partitioning">
<title>Hash-based partitioning</title><desc>A deterministic hash spreads nearby input keys across partitions; changing a simple modulo divisor can remap many keys.</desc>
